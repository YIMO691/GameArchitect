<svg xmlns='http://www.w3.org/2000/svg' width='860' height='518' viewBox='0 0 860 518' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Rules become systems</title><rect x='0.5' y='0.5' width='859' height='517' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Rules become systems</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Certification rules are not a list of bugs. Most of them are a system the game is missing.</text><rect x='24.0' y='84.0' width='400.0' height='84.0' rx='8' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><text x='40' y='108' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>Controller disconnects: pause, ask to reconnect</text><text x='40' y='130' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>Suspend and resume: save state, restore</text><text x='40' y='152' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>User signs out or switches: back to title</text><line x1='432' y1='126.0' x2='482.0' y2='126.0' stroke='#4e79a7' stroke-width='2.5'/><polygon points='492,126.0 482.0,120.0 482.0,132.0' fill='#4e79a7'/><rect x='500.0' y='100.0' width='336.0' height='52.0' rx='8' fill='#eaf1fb' stroke='#4e79a7' stroke-width='1.5' opacity='1'/><text x='516' y='122.0' font-size='14' fill='#1f2328' font-weight='700' text-anchor='start'>Platform layer</text><text x='516' y='141.0' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>one place, below every screen</text><rect x='24.0' y='182.0' width='400.0' height='84.0' rx='8' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><text x='40' y='206' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>Save: atomic writes, indicator shown, no hammering</text><text x='40' y='228' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>Network lost: message, not a hang</text><text x='40' y='250' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>Long load: activity shown within a few seconds</text><line x1='432' y1='224.0' x2='482.0' y2='224.0' stroke='#b07aa1' stroke-width='2.5'/><polygon points='492,224.0 482.0,218.0 482.0,230.0' fill='#b07aa1'/><rect x='500.0' y='198.0' width='336.0' height='52.0' rx='8' fill='#f6eef4' stroke='#b07aa1' stroke-width='1.5' opacity='1'/><text x='516' y='220.0' font-size='14' fill='#1f2328' font-weight='700' text-anchor='start'>Shared services</text><text x='516' y='239.0' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>save, network, loading</text><rect x='24.0' y='280.0' width='400.0' height='62.0' rx='8' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><text x='40' y='304' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>Button names and glyphs for this controller</text><text x='40' y='326' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>Platform words (trophies, achievements...)</text><line x1='432' y1='311.0' x2='482.0' y2='311.0' stroke='#59a14f' stroke-width='2.5'/><polygon points='492,311.0 482.0,305.0 482.0,317.0' fill='#59a14f'/><rect x='500.0' y='285.0' width='336.0' height='52.0' rx='8' fill='#e9f5e6' stroke='#59a14f' stroke-width='1.5' opacity='1'/><text x='516' y='307.0' font-size='14' fill='#1f2328' font-weight='700' text-anchor='start'>Platform terms table</text><text x='516' y='326.0' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>data per platform and language</text><rect x='24.0' y='356.0' width='400.0' height='62.0' rx='8' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><text x='40' y='380' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>Screenshots of every screen in every language</text><text x='40' y='402' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>The platform checklist, run by your own QA</text><line x1='432' y1='387.0' x2='482.0' y2='387.0' stroke='#f28e2b' stroke-width='2.5'/><polygon points='492,387.0 482.0,381.0 482.0,393.0' fill='#f28e2b'/><rect x='500.0' y='361.0' width='336.0' height='52.0' rx='8' fill='#fdf0e2' stroke='#f28e2b' stroke-width='1.5' opacity='1'/><text x='516' y='383.0' font-size='14' fill='#1f2328' font-weight='700' text-anchor='start'>Pre-cert in CI</text><text x='516' y='402.0' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>checks before you submit</text><text x='24' y='440' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>Each box on the left is a group of checks, the kind every console and store has in some form. The real wording is confidential per platform.</text><rect x='24.0' y='454.0' width='812.0' height='44.0' rx='8' fill='#fff8e6' stroke='#d4a72c' stroke-width='1.5' opacity='1'/><text x='40' y='481' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>Fix a rule once, in the system that owns it, and every screen passes, including the ones not built yet.</text></svg>