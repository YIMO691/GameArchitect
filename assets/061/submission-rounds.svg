<svg xmlns='http://www.w3.org/2000/svg' width='860' height='404' viewBox='0 0 860 404' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Rounds to pass certification</title><rect x='0.5' y='0.5' width='859' height='403' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Rounds to pass certification</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Days from code freeze to a passed build. One submission round: 14 days. One in-house pre-cert round: 5 days.</text><line x1='470.6' y1='80' x2='470.6' y2='320' stroke='#d4a72c' stroke-width='2' stroke-dasharray='5 4'/><text x='470.6' y='78' font-size='12' fill='#9a6700' font-weight='700' text-anchor='middle'>launch: day 21</text><text x='24' y='114' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>Each screen on its own</text><text x='24' y='131' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>20 hand patches</text><rect x='290.0' y='100.0' width='117.4' height='28.0' rx='4' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='348.7' y='119' font-size='11.5' fill='#ffffff' font-weight='700' text-anchor='middle'>13 failed</text><rect x='410.4' y='100.0' width='117.4' height='28.0' rx='4' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='469.09999999999997' y='119' font-size='11.5' fill='#ffffff' font-weight='700' text-anchor='middle'>6 failed</text><rect x='530.8' y='100.0' width='117.4' height='28.0' rx='4' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='589.5' y='119' font-size='11.5' fill='#ffffff' font-weight='700' text-anchor='middle'>1</text><rect x='651.2' y='100.0' width='117.4' height='28.0' rx='4' fill='#1a7f37' stroke='none' stroke-width='1' opacity='1'/><text x='709.9' y='119' font-size='11.5' fill='#ffffff' font-weight='700' text-anchor='middle'>pass</text><text x='777.5999999999999' y='119' font-size='12.5' fill='#cf222e' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>56 days</text><text x='24' y='170' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>Platform layer + services + terms</text><text x='24' y='187' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>1 hand patch</text><rect x='290.0' y='156.0' width='117.4' height='28.0' rx='4' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='348.7' y='175' font-size='11.5' fill='#ffffff' font-weight='700' text-anchor='middle'>1 failed</text><rect x='410.4' y='156.0' width='117.4' height='28.0' rx='4' fill='#1a7f37' stroke='none' stroke-width='1' opacity='1'/><text x='469.09999999999997' y='175' font-size='11.5' fill='#ffffff' font-weight='700' text-anchor='middle'>pass</text><text x='536.8' y='175' font-size='12.5' fill='#cf222e' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>28 days</text><text x='24' y='226' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>Pre-cert alone</text><text x='24' y='243' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>20 hand patches</text><rect x='290.0' y='212.0' width='40.0' height='28.0' rx='4' fill='#f28e2b' stroke='none' stroke-width='1' opacity='1'/><text x='310.0' y='231' font-size='11.5' fill='#ffffff' font-weight='700' text-anchor='middle'>13</text><rect x='333.0' y='212.0' width='40.0' height='28.0' rx='4' fill='#f28e2b' stroke='none' stroke-width='1' opacity='1'/><text x='353.0' y='231' font-size='11.5' fill='#ffffff' font-weight='700' text-anchor='middle'>6</text><rect x='376.0' y='212.0' width='40.0' height='28.0' rx='4' fill='#f28e2b' stroke='none' stroke-width='1' opacity='1'/><text x='396.0' y='231' font-size='11.5' fill='#ffffff' font-weight='700' text-anchor='middle'>1</text><rect x='419.0' y='212.0' width='117.4' height='28.0' rx='4' fill='#1a7f37' stroke='none' stroke-width='1' opacity='1'/><text x='477.7' y='231' font-size='11.5' fill='#ffffff' font-weight='700' text-anchor='middle'>pass</text><text x='545.4' y='231' font-size='12.5' fill='#cf222e' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>29 days</text><text x='24' y='282' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>Architecture + pre-cert</text><text x='24' y='299' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>1 hand patch</text><rect x='290.0' y='268.0' width='40.0' height='28.0' rx='4' fill='#f28e2b' stroke='none' stroke-width='1' opacity='1'/><text x='310.0' y='287' font-size='11.5' fill='#ffffff' font-weight='700' text-anchor='middle'>1</text><rect x='333.0' y='268.0' width='117.4' height='28.0' rx='4' fill='#1a7f37' stroke='none' stroke-width='1' opacity='1'/><text x='391.7' y='287' font-size='11.5' fill='#ffffff' font-weight='700' text-anchor='middle'>pass</text><text x='459.4' y='287' font-size='12.5' fill='#1a7f37' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>19 days</text><text x='290' y='324' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>red: submission that failed  ·  orange: in-house pre-cert round  ·  green: the submission that passed</text><rect x='24.0' y='340.0' width='812.0' height='44.0' rx='8' fill='#fff8e6' stroke='#d4a72c' stroke-width='1.5' opacity='1'/><text x='40' y='367' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>Architecture cuts what fails. Pre-certification moves the finding in-house, where a round is 5 days, not 14.</text></svg>