<path d='M196 200 L208 200' stroke='#9aa0a6' stroke-width='2'/><path d='M204 195 L212 200 L204 205 z' fill='#9aa0a6'/>
<text x='24' y='292' font-size='12' fill='#57606a'>hunger of 6 gulls · purple = hungry enough to steal</text>
<text x='24' y='318' font-size='13' fill='#1f2328' font-weight='700' font-family='Consolas, Menlo, monospace'>local hunger = {}</text>
<text x='24' y='340' font-size='13' fill='#1f2328'>runs again on reload → every gull at 0</text>
<text x='24' y='362' font-size='13' fill='#cf222e' font-weight='600'>0.6 ÷ 0.012 per second = 50 s until a steal</text>
<text x='444' y='116' font-size='13' fill='#1f2328' font-weight='600'>Events.on("GullThink", rule) runs on every load</text>
<rect x='444' y='132' width='260' height='30' rx='6' fill='#ffebe9' stroke='#ffcecb'/>
<text x='456' y='152' font-size='13' fill='#cf222e' font-weight='700' font-family='Consolas, Menlo, monospace'>v1 · steal if hunger > 0.60</text>
<text x='716' y='152' font-size='12' fill='#57606a'>first load · still on</text>
<rect x='444' y='170' width='260' height='30' rx='6' fill='#ffebe9' stroke='#ffcecb'/>
<text x='456' y='190' font-size='13' fill='#cf222e' font-weight='700' font-family='Consolas, Menlo, monospace'>v2 · steal if hunger > 0.65</text>
<text x='716' y='190' font-size='12' fill='#57606a'>save 1 · still on</text>
<rect x='444' y='208' width='260' height='30' rx='6' fill='#ffebe9' stroke='#ffcecb'/>
<text x='456' y='228' font-size='13' fill='#cf222e' font-weight='700' font-family='Consolas, Menlo, monospace'>v3 · steal if hunger > 0.70</text>
<text x='716' y='228' font-size='12' fill='#57606a'>save 2 · still on</text>
<rect x='444' y='246' width='260' height='30' rx='6' fill='#dafbe1' stroke='#aceebb'/>
<text x='456' y='266' font-size='13' fill='#1a7f37' font-weight='700' font-family='Consolas, Menlo, monospace'>v4 · steal if hunger > 0.75</text>
<text x='716' y='266' font-size='12' fill='#57606a'>save 3 · newest</text>
<text x='444' y='308' font-size='13' fill='#1f2328'>each think, 4 rules run: 4× the cost</text>
<text x='444' y='330' font-size='13' fill='#cf222e' font-weight='600'>a gull at 0.62 still steals (v1 says yes)</text>
<text x='444' y='352' font-size='13' fill='#cf222e' font-weight='600'>after 40 saves: 41 rules running</text>
<rect x='24' y='384' width='812' height='66' rx='8' fill='#dafbe1' stroke='#aceebb'/>
<text x='40' y='410' font-size='14' fill='#1a7f37' font-weight='700'>✅ Fix: hunger lives in the Gull component (C#), so a reload can’t touch it.</text>
<text x='40' y='434' font-size='13' fill='#1f2328'>The engine keeps rules by name: rules["gull_steal"] = new version. A reload replaces; it never adds.</text>
