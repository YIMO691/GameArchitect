<text x='40' y='217' font-size='14' fill='#1a7f37' font-weight='700'>🔌 Script API · 14 functions</text>
<text x='40' y='238' font-size='12' fill='#1f2328' font-family='Consolas, Menlo, monospace'>gull.hunger · gull:steal(c) · World.nearestCarrier()</text>
