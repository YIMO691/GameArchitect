<text x='40' y='294' font-size='15' fill='#1f2328' font-weight='700'>🎣 Simulation (C#) · the engine</text>
<text x='40' y='318' font-size='13' fill='#1f2328'>Gull component: hunger, position, state</text>
<text x='40' y='340' font-size='13' fill='#1f2328'>behavior tree (Lesson 016) asks the rule</text>
<rect x='24' y='372' width='400' height='40' rx='8' fill='#f1f3f5' stroke='#9aa0a6'/>
<text x='40' y='397' font-size='13' fill='#57606a' font-weight='600'>Physics · Core (Lesson 018 layers)</text>
<text x='460' y='238' font-size='1' fill='#1f2328'></text>
<text x='585' y='254' font-size='13' fill='#b07aa1' font-weight='700'>Script</text>
<text x='720' y='254' font-size='13' fill='#4e79a7' font-weight='700'>C#</text>
<path d='M460 264 L836 264' stroke='#d0d7de'/>
<text x='460' y='284' font-size='13' fill='#57606a' font-weight='600'>Who edits it</text>
<text x='585' y='284' font-size='13' fill='#1f2328'>Mia</text>
<text x='720' y='284' font-size='13' fill='#1f2328'>programmers</text>
<text x='460' y='314' font-size='13' fill='#57606a' font-weight='600'>How often</text>
<text x='585' y='314' font-size='13' fill='#1f2328'>≈ 40 times a level</text>
<text x='720' y='314' font-size='13' fill='#1f2328'>rarely</text>
<text x='460' y='344' font-size='13' fill='#57606a' font-weight='600'>See a change</text>
<text x='585' y='344' font-size='13' fill='#1f2328'>15 s, hot reload</text>
<text x='720' y='344' font-size='13' fill='#1f2328'>compile + replay</text>
<text x='460' y='374' font-size='13' fill='#57606a' font-weight='600'>Cost per gull</text>
<text x='585' y='374' font-size='13' fill='#1f2328'>≈ 2.1 µs</text>
<text x='720' y='374' font-size='13' fill='#1f2328'>≈ 0.05 µs</text>
<text x='460' y='404' font-size='13' fill='#57606a' font-weight='600'>Typos found</text>
<text x='585' y='404' font-size='13' fill='#1f2328'>when it runs</text>
<text x='720' y='404' font-size='13' fill='#1f2328'>when it compiles</text>
<text x='24' y='440' font-size='13' fill='#57606a'>Analogy: a TV remote. You can press any button on it, but you can’t open the TV and rewire it.</text>
