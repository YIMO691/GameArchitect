<svg xmlns='http://www.w3.org/2000/svg' width='860' height='460' viewBox='0 0 860 460' font-family='Segoe UI, Helvetica, Arial, sans-serif'>
<rect x='0.5' y='0.5' width='859' height='459' rx='14' fill='#ffffff' stroke='#d0d7de'/>
<text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Where the steal rule lives</text>
<text x='24' y='60' font-size='13' fill='#57606a'>Mia’s rules sit on top of the C# simulation and talk to it only through a small API, like buttons on a remote.</text>
<rect x='24' y='84' width='400' height='92' rx='8' fill='#f6eef4' stroke='#b07aa1'/>
<text x='40' y='110' font-size='15' fill='#1f2328' font-weight='700'>📜 Scripts (Lua) · Mia’s rules</text>
<text x='40' y='134' font-size='13' fill='#57606a' font-family='Consolas, Menlo, monospace'>Scripts/gull_steal.lua</text>
<text x='40' y='156' font-size='13' fill='#1f2328'>says HOW a gull decides; holds no state</text>
<path d='M430 100 L520 100' stroke='#cf222e' stroke-width='2' stroke-dasharray='5 4'/>
<text x='472' y='105' font-size='15' fill='#cf222e' font-weight='700' text-anchor='middle'>✗</text>
<text x='530' y='105' font-size='13' fill='#cf222e' font-weight='600'>files and save data</text>
<path d='M430 126 L520 126' stroke='#cf222e' stroke-width='2' stroke-dasharray='5 4'/>
<text x='472' y='131' font-size='15' fill='#cf222e' font-weight='700' text-anchor='middle'>✗</text>
<text x='530' y='131' font-size='13' fill='#cf222e' font-weight='600'>render and audio</text>
<path d='M430 152 L520 152' stroke='#cf222e' stroke-width='2' stroke-dasharray='5 4'/>
<text x='472' y='157' font-size='15' fill='#cf222e' font-weight='700' text-anchor='middle'>✗</text>
<text x='530' y='157' font-size='13' fill='#cf222e' font-weight='600'>network</text>
<text x='530' y='186' font-size='12' fill='#57606a'>the sandbox hides these</text>
