<text x='24' y='392' font-size='13' fill='#57606a'>Analogy: border control. Every crossing waits in the queue (≈ 1.2 µs), however little you carry.</text>
<text x='24' y='410' font-size='13' fill='#57606a'>One bus with all 1,000 passengers waits once.</text>
