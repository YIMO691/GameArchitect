<text stroke='#ffffff' stroke-width='4' paint-order='stroke' x='250' y='218' font-size='12' fill='#57606a'>crossing 2,000 × 1.2 µs = 2.4 ms · rule body 1.8 ms</text>
<text x='238' y='257' font-size='14' fill='#1f2328' font-weight='600' text-anchor='end'>Lua, one batched call</text>
