<svg xmlns='http://www.w3.org/2000/svg' width='860' height='334' viewBox='0 0 860 334' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Where the reason went</title><rect x='0.5' y='0.5' width='859' height='333' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Where the reason went</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>One decision, one good reason, and seven months later nobody can find it.</text><rect x='24.0' y='86.0' width='158.0' height='138.0' rx='8' fill='#ffffff' stroke='#d4a72c' stroke-width='1.6' opacity='1'/><text x='34' y='106' font-size='11.5' fill='#57606a' font-weight='700' text-anchor='start'>Month 0</text><text x='34' y='126' font-size='13' fill='#d4a72c' font-weight='700' text-anchor='start'>Chat</text><text x='34' y='152' font-size='11.5' fill='#1f2328' font-weight='400' text-anchor='start'>"docking server side,</text><text x='34' y='170' font-size='11.5' fill='#1f2328' font-weight='400' text-anchor='start'>trust me"</text><text x='34' y='212' font-size='11.5' fill='#d4a72c' font-weight='700' text-anchor='start'>reason said once</text><line x1='182' y1='155' x2='180.0' y2='155.0' stroke='#9aa0a6' stroke-width='2'/><polygon points='190,155 180.0,149.0 180.0,161.0' fill='#9aa0a6'/><rect x='190.0' y='86.0' width='158.0' height='138.0' rx='8' fill='#ffffff' stroke='#1a7f37' stroke-width='1.6' opacity='1'/><text x='200' y='106' font-size='11.5' fill='#57606a' font-weight='700' text-anchor='start'>Month 1</text><text x='200' y='126' font-size='13' fill='#1a7f37' font-weight='700' text-anchor='start'>Design doc v1</text><text x='200' y='152' font-size='11.5' fill='#1f2328' font-weight='400' text-anchor='start'>"two clients can claim</text><text x='200' y='170' font-size='11.5' fill='#1f2328' font-weight='400' text-anchor='start'>one berth: server decides"</text><text x='200' y='212' font-size='11.5' fill='#1a7f37' font-weight='700' text-anchor='start'>reason written</text><line x1='348' y1='155' x2='346.0' y2='155.0' stroke='#9aa0a6' stroke-width='2'/><polygon points='356,155 346.0,149.0 346.0,161.0' fill='#9aa0a6'/><rect x='356.0' y='86.0' width='158.0' height='138.0' rx='8' fill='#ffffff' stroke='#cf222e' stroke-width='1.6' opacity='1'/><text x='366' y='106' font-size='11.5' fill='#57606a' font-weight='700' text-anchor='start'>Month 3</text><text x='366' y='126' font-size='13' fill='#cf222e' font-weight='700' text-anchor='start'>Online lead leaves</text><text x='366' y='152' font-size='11.5' fill='#1f2328' font-weight='400' text-anchor='start'>the person who</text><text x='366' y='170' font-size='11.5' fill='#1f2328' font-weight='400' text-anchor='start'>remembers is gone</text><text x='366' y='212' font-size='11.5' fill='#cf222e' font-weight='700' text-anchor='start'>reason in one head</text><line x1='514' y1='155' x2='512.0' y2='155.0' stroke='#9aa0a6' stroke-width='2'/><polygon points='522,155 512.0,149.0 512.0,161.0' fill='#9aa0a6'/><rect x='522.0' y='86.0' width='158.0' height='138.0' rx='8' fill='#ffffff' stroke='#f28e2b' stroke-width='1.6' opacity='1'/><text x='532' y='106' font-size='11.5' fill='#57606a' font-weight='700' text-anchor='start'>Month 5</text><text x='532' y='126' font-size='13' fill='#f28e2b' font-weight='700' text-anchor='start'>Design doc v2</text><text x='532' y='152' font-size='11.5' fill='#1f2328' font-weight='400' text-anchor='start'>"Docking: handled</text><text x='532' y='170' font-size='11.5' fill='#1f2328' font-weight='400' text-anchor='start'>by the server."</text><text x='532' y='212' font-size='11.5' fill='#f28e2b' font-weight='700' text-anchor='start'>reason trimmed</text><line x1='680' y1='155' x2='678.0' y2='155.0' stroke='#9aa0a6' stroke-width='2'/><polygon points='688,155 678.0,149.0 678.0,161.0' fill='#9aa0a6'/><rect x='688.0' y='86.0' width='158.0' height='138.0' rx='8' fill='#ffffff' stroke='#cf222e' stroke-width='1.6' opacity='1'/><text x='698' y='106' font-size='11.5' fill='#57606a' font-weight='700' text-anchor='start'>Month 7</text><text x='698' y='126' font-size='13' fill='#cf222e' font-weight='700' text-anchor='start'>Kai asks why</text><text x='698' y='152' font-size='11.5' fill='#1f2328' font-weight='400' text-anchor='start'>"client would feel</text><text x='698' y='170' font-size='11.5' fill='#1f2328' font-weight='400' text-anchor='start'>faster, let’s move it"</text><text x='698' y='212' font-size='11.5' fill='#cf222e' font-weight='700' text-anchor='start'>nobody can answer</text><line x1='450' y1='228' x2='450.0' y2='242.0' stroke='#cf222e' stroke-width='2.5'/><polygon points='450,252 456.0,242.0 444.0,242.0' fill='#cf222e'/><rect x='200.0' y='256.0' width='500.0' height='56.0' rx='8' fill='#fff1f0' stroke='#cf222e' stroke-width='1.6' opacity='1'/><text x='450' y='279' font-size='14' fill='#cf222e' font-weight='700' text-anchor='middle'>Month 8: docking moved to the client</text><text x='450' y='299' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='middle'>two players dock in one berth: an incident, 30 hours to undo</text></svg>