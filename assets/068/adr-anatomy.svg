<svg xmlns='http://www.w3.org/2000/svg' width='860' height='340' viewBox='0 0 860 340' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>A decision record, and how it changes</title><rect x='0.5' y='0.5' width='859' height='339' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>A decision record, and how it changes</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>One short file per decision, in the repo, never edited once accepted. A change is a new record.</text><rect x='24.0' y='82.0' width='470.0' height='214.0' rx='8' fill='#ffffff' stroke='#d0d7de' stroke-width='1.4' opacity='1'/><text x='38' y='108' font-size='12' fill='#1f2328' font-weight='700' text-anchor='start'>Title</text><text x='140' y='108' font-size='12' fill='#1f2328' font-weight='400' text-anchor='start'>ADR-0012 · Docking is decided on the server</text><text x='38' y='136' font-size='12' fill='#1a7f37' font-weight='700' text-anchor='start'>Status</text><text x='140' y='136' font-size='12' fill='#1f2328' font-weight='400' text-anchor='start'>accepted · owner: online lead</text><text x='38' y='164' font-size='12' fill='#4e79a7' font-weight='700' text-anchor='start'>Context</text><text x='140' y='164' font-size='12' fill='#1f2328' font-weight='400' text-anchor='start'>two clients can claim one berth in one round trip;</text><text x='140' y='192' font-size='12' fill='#1f2328' font-weight='400' text-anchor='start'>1 in 200 players runs a modified app</text><text x='38' y='220' font-size='12' fill='#b07aa1' font-weight='700' text-anchor='start'>Decision</text><text x='140' y='220' font-size='12' fill='#1f2328' font-weight='400' text-anchor='start'>the client asks; the server assigns berths</text><text x='38' y='248' font-size='12' fill='#f28e2b' font-weight='700' text-anchor='start'>Consequences</text><text x='140' y='248' font-size='12' fill='#1f2328' font-weight='400' text-anchor='start'>docking waits one round trip (up to 180 ms);</text><text x='140' y='276' font-size='12' fill='#1f2328' font-weight='400' text-anchor='start'>hidden by the mooring animation; no instant docking</text><text x='24' y='318' font-size='12' fill='#57606a' font-weight='600' text-anchor='start'>Half a page. Written in about 1 hour. Read in 2 minutes.</text><text x='520' y='100' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>When a decision changes</text><rect x='520.0' y='112.0' width='316.0' height='72.0' rx='8' fill='#f6f8fa' stroke='#9aa0a6' stroke-width='1.4' opacity='1'/><text x='532' y='134' font-size='12.5' fill='#57606a' font-weight='700' text-anchor='start'>ADR-0015 · 40 boats on screen</text><text x='532' y='154' font-size='12' fill='#cf222e' font-weight='600' text-anchor='start'>Status: superseded by ADR-0021</text><text x='532' y='172' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>context still there: why 40 once fit</text><line x1='678' y1='186' x2='678.0' y2='200.0' stroke='#9aa0a6' stroke-width='2.5'/><polygon points='678,210 684.0,200.0 672.0,200.0' fill='#9aa0a6'/><rect x='520.0' y='212.0' width='316.0' height='72.0' rx='8' fill='#ffffff' stroke='#1a7f37' stroke-width='1.6' opacity='1'/><text x='532' y='234' font-size='12' fill='#1f2328' font-weight='700' text-anchor='start'>ADR-0021 · 24 boats on handheld, 40 on PC</text><text x='532' y='254' font-size='12' fill='#1a7f37' font-weight='600' text-anchor='start'>Status: accepted · supersedes ADR-0015</text><text x='532' y='272' font-size='11.5' fill='#1f2328' font-weight='400' text-anchor='start'>context: handheld frame budget 0.4 ms</text><text x='520' y='318' font-size='12' fill='#57606a' font-weight='600' text-anchor='start'>Editing ADR-0015 instead would erase both reasons.</text></svg>