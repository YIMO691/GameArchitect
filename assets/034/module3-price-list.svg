<svg xmlns='http://www.w3.org/2000/svg' width='860' height='520' viewBox='0 0 860 520' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Module 3 price list</title><rect x='0.5' y='0.5' width='859' height='519' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Module 3 price list</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>One rule and one price per lesson. Multiply the price by what you see in the capture.</text><text x='24' y='86' font-size='12' fill='#57606a' font-weight='700' text-anchor='start'>Lesson</text><text x='96' y='86' font-size='12' fill='#57606a' font-weight='700' text-anchor='start'>Rule</text><text x='486' y='86' font-size='12' fill='#57606a' font-weight='700' text-anchor='start'>Price on the mid-range phone</text><rect x='16.0' y='98.0' width='828.0' height='34.0' rx='6' fill='#f6f8fa' stroke='none' stroke-width='1' opacity='1'/><rect x='24.0' y='105.0' width='52.0' height='20.0' rx='4' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><text x='50' y='120' font-size='12.5' fill='#ffffff' font-weight='700' text-anchor='middle'>023</text><text x='96' y='120' font-size='13.5' fill='#1f2328' font-weight='600' text-anchor='start'>The busiest station sets the pace</text><text x='486' y='120' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>other stations: 0 ms</text><rect x='24.0' y='139.0' width='52.0' height='20.0' rx='4' fill='#59a14f' stroke='none' stroke-width='1' opacity='1'/><text x='50' y='154' font-size='12.5' fill='#ffffff' font-weight='700' text-anchor='middle'>024</text><text x='96' y='154' font-size='13.5' fill='#1f2328' font-weight='600' text-anchor='start'>Draw calls cost render-thread time</text><text x='486' y='154' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>≈ 10 µs a draw, 20 µs a switch</text><rect x='16.0' y='166.0' width='828.0' height='34.0' rx='6' fill='#f6f8fa' stroke='none' stroke-width='1' opacity='1'/><rect x='24.0' y='173.0' width='52.0' height='20.0' rx='4' fill='#b07aa1' stroke='none' stroke-width='1' opacity='1'/><text x='50' y='188' font-size='12.5' fill='#ffffff' font-weight='700' text-anchor='middle'>025</text><text x='96' y='188' font-size='13.5' fill='#1f2328' font-weight='600' text-anchor='start'>See-through pixels can’t be skipped</text><text x='486' y='188' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>1 screen ≈ 1 ms pixel + 4 ms memory</text><rect x='24.0' y='207.0' width='52.0' height='20.0' rx='4' fill='#b07aa1' stroke='none' stroke-width='1' opacity='1'/><text x='50' y='222' font-size='12.5' fill='#ffffff' font-weight='700' text-anchor='middle'>026</text><text x='96' y='222' font-size='13.5' fill='#1f2328' font-weight='600' text-anchor='start'>Every instruction, every pixel</text><text x='486' y='222' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>+15 cycles = +9 ms · 2ⁿ variants</text><rect x='16.0' y='234.0' width='828.0' height='34.0' rx='6' fill='#f6f8fa' stroke='none' stroke-width='1' opacity='1'/><rect x='24.0' y='241.0' width='52.0' height='20.0' rx='4' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><text x='50' y='256' font-size='12.5' fill='#ffffff' font-weight='700' text-anchor='middle'>027</text><text x='96' y='256' font-size='13.5' fill='#1f2328' font-weight='600' text-anchor='start'>Cull before the vertex shader</text><text x='486' y='256' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>3,120 unseen = 23.1 ms vertex</text><rect x='24.0' y='275.0' width='52.0' height='20.0' rx='4' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><text x='50' y='290' font-size='12.5' fill='#ffffff' font-weight='700' text-anchor='middle'>028</text><text x='96' y='290' font-size='13.5' fill='#1f2328' font-weight='600' text-anchor='start'>A vertex budget per pixel</text><text x='486' y='290' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>2,400 verts at 55 px: LOD 15 → 5.04 ms</text><rect x='16.0' y='302.0' width='828.0' height='34.0' rx='6' fill='#f6f8fa' stroke='none' stroke-width='1' opacity='1'/><rect x='24.0' y='309.0' width='52.0' height='20.0' rx='4' fill='#f28e2b' stroke='none' stroke-width='1' opacity='1'/><text x='50' y='324' font-size='12.5' fill='#ffffff' font-weight='700' text-anchor='middle'>029</text><text x='96' y='324' font-size='13.5' fill='#1f2328' font-weight='600' text-anchor='start'>w × h × bytes × 4/3</text><text x='486' y='324' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>RGBA32 → ASTC 4×4: 4× smaller</text><rect x='24.0' y='343.0' width='52.0' height='20.0' rx='4' fill='#b07aa1' stroke='none' stroke-width='1' opacity='1'/><text x='50' y='358' font-size='12.5' fill='#ffffff' font-weight='700' text-anchor='middle'>030</text><text x='96' y='358' font-size='13.5' fill='#1f2328' font-weight='600' text-anchor='start'>Which lights touch each pixel?</text><text x='486' y='358' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>Forward+ 0.48 ms CPU · bake static</text><rect x='16.0' y='370.0' width='828.0' height='34.0' rx='6' fill='#f6f8fa' stroke='none' stroke-width='1' opacity='1'/><rect x='24.0' y='377.0' width='52.0' height='20.0' rx='4' fill='#b07aa1' stroke='none' stroke-width='1' opacity='1'/><text x='50' y='392' font-size='12.5' fill='#ffffff' font-weight='700' text-anchor='middle'>031</text><text x='96' y='392' font-size='13.5' fill='#1f2328' font-weight='600' text-anchor='start'>A full-screen pass has a floor</text><text x='486' y='392' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>≈ 0.9 ms before any math</text><rect x='24.0' y='411.0' width='52.0' height='20.0' rx='4' fill='#f28e2b' stroke='none' stroke-width='1' opacity='1'/><text x='50' y='426' font-size='12.5' fill='#ffffff' font-weight='700' text-anchor='middle'>032</text><text x='96' y='426' font-size='13.5' fill='#1f2328' font-weight='600' text-anchor='start'>Bytes leave the chip only on load/store</text><text x='486' y='426' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>4.39 MB a buffer · 180 MB a frame</text><rect x='16.0' y='438.0' width='828.0' height='34.0' rx='6' fill='#f6f8fa' stroke='none' stroke-width='1' opacity='1'/><rect x='24.0' y='445.0' width='52.0' height='20.0' rx='4' fill='#d4a72c' stroke='none' stroke-width='1' opacity='1'/><text x='50' y='460' font-size='12.5' fill='#ffffff' font-weight='700' text-anchor='middle'>033</text><text x='96' y='460' font-size='13.5' fill='#1f2328' font-weight='600' text-anchor='start'>Timing → per pass → counters → debugger</text><text x='486' y='460' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>per-draw ms on tiles: not reliable</text><rect x='24.0' y='487.0' width='14.0' height='14.0' rx='3' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><text x='44' y='498' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>Model</text><rect x='99.0' y='487.0' width='14.0' height='14.0' rx='3' fill='#59a14f' stroke='none' stroke-width='1' opacity='1'/><text x='119' y='498' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>CPU side</text><rect x='195.0' y='487.0' width='14.0' height='14.0' rx='3' fill='#b07aa1' stroke='none' stroke-width='1' opacity='1'/><text x='215' y='498' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>Pixels</text><rect x='277.0' y='487.0' width='14.0' height='14.0' rx='3' fill='#f28e2b' stroke='none' stroke-width='1' opacity='1'/><text x='297' y='498' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>Bytes</text><rect x='352.0' y='487.0' width='14.0' height='14.0' rx='3' fill='#d4a72c' stroke='none' stroke-width='1' opacity='1'/><text x='372' y='498' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>Tools</text><text x='836' y='498' font-size='12' fill='#57606a' font-weight='400' text-anchor='end'>Vertices: 027, 028 in blue with the model</text></svg>