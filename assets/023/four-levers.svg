<svg xmlns='http://www.w3.org/2000/svg' width='860' height='448' viewBox='0 0 860 448' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Four levers</title><rect x='0.5' y='0.5' width='859' height='447' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' fill='#1f2328' font-weight='bold' text-anchor='start'>Four levers: each one asks one station a question</text><text x='24' y='60' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start'>Start: GPU 41 ms. Pull ONE lever, read the new GPU time, put the lever back.</text><text x='24' y='102' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='start'>Coral triangles ½</text><text x='24' y='122' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>vertex 9 → 6 ms</text><rect x='250' y='88' width='328.0' height='18' rx='3' fill='#eaeef2' stroke='none' stroke-width='1' /><text x='586.0' y='102' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>41 before</text><rect x='250' y='112' width='328.0' height='18' rx='3' fill='#9aa0a6' stroke='none' stroke-width='1' /><text x='586.0' y='126' font-size='13' fill='#57606a' font-weight='bold' text-anchor='start'>41 ms</text><text x='836' y='114' font-size='13' fill='#57606a' font-weight='bold' text-anchor='end'>no change → not vertex</text><text x='24' y='176' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='start'>Render scale 50%</text><text x='24' y='196' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>¼ pixels: raster, pixel, memory ÷ 4</text><rect x='250' y='162' width='328.0' height='18' rx='3' fill='#eaeef2' stroke='none' stroke-width='1' /><text x='586.0' y='176' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>41 before</text><rect x='250' y='186' width='100.0' height='18' rx='3' fill='#1a7f37' stroke='none' stroke-width='1' /><text x='358.0' y='200' font-size='13' fill='#1a7f37' font-weight='bold' text-anchor='start'>12.5 ms</text><text x='836' y='188' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='end'>big drop → per-pixel work</text><text x='24' y='250' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='start'>Flat test shader</text><text x='24' y='270' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>pixel 38 → 6 ms</text><rect x='250' y='236' width='328.0' height='18' rx='3' fill='#eaeef2' stroke='none' stroke-width='1' /><text x='586.0' y='250' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>41 before</text><rect x='250' y='260' width='144.0' height='18' rx='3' fill='#1a7f37' stroke='none' stroke-width='1' /><text x='402.0' y='274' font-size='13' fill='#1a7f37' font-weight='bold' text-anchor='start'>18 ms</text><text x='836' y='262' font-size='13' fill='#cf222e' font-weight='bold' text-anchor='end'>big drop → PIXEL ✓</text><text x='24' y='324' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='start'>4-byte colour format</text><text x='24' y='344' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>memory 15 → 7.5 ms</text><rect x='250' y='310' width='328.0' height='18' rx='3' fill='#eaeef2' stroke='none' stroke-width='1' /><text x='586.0' y='324' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>41 before</text><rect x='250' y='334' width='328.0' height='18' rx='3' fill='#9aa0a6' stroke='none' stroke-width='1' /><text x='586.0' y='348' font-size='13' fill='#57606a' font-weight='bold' text-anchor='start'>41 ms</text><text x='836' y='336' font-size='13' fill='#57606a' font-weight='bold' text-anchor='end'>no change → not memory</text><line x1='24' y1='384' x2='836' y2='384' stroke='#d0d7de'/><text x='24' y='408' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='start'>The 50% test says "per-pixel" but can't say which station. The shader and format levers split it.</text><text x='24' y='428' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>With the flat shader the GPU is 18 = 3 + 15: memory would be the next station in line.</text></svg>
