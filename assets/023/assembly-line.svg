<svg xmlns='http://www.w3.org/2000/svg' width='860' height='444' viewBox='0 0 860 444' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>The GPU is an assembly line</title><rect x='0.5' y='0.5' width='859' height='443' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' fill='#1f2328' font-weight='bold' text-anchor='start'>The GPU is an assembly line: the busiest station sets the pace</text><text x='24' y='60' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start'>Coral Garden on the mid-range phone. Approximate numbers from the lesson's model.</text><rect x='24' y='80' width='182' height='78' rx='10' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' /><rect x='24' y='80' width='8' height='78' rx='3' fill='#4e79a7' stroke='none' stroke-width='1' /><text x='42' y='104' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='start'>1 · Vertex</text><text x='42' y='126' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>moves each corner</text><text x='42' y='145' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>to the screen</text><line x1='208' y1='119' x2='222' y2='119' stroke='#9aa0a6' stroke-width='2'/><path d='M221 114 L229 119 L221 124 z' fill='#9aa0a6'/><rect x='230' y='80' width='182' height='78' rx='10' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' /><rect x='230' y='80' width='8' height='78' rx='3' fill='#59a14f' stroke='none' stroke-width='1' /><text x='248' y='104' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='start'>2 · Raster</text><text x='248' y='126' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>finds the pixels</text><text x='248' y='145' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>each triangle covers</text><line x1='414' y1='119' x2='428' y2='119' stroke='#9aa0a6' stroke-width='2'/><path d='M427 114 L435 119 L427 124 z' fill='#9aa0a6'/><rect x='436' y='80' width='182' height='78' rx='10' fill='#fdecea' stroke='#cf222e' stroke-width='2' /><rect x='436' y='80' width='8' height='78' rx='3' fill='#e5534b' stroke='none' stroke-width='1' /><text x='454' y='104' font-size='15' fill='#cf222e' font-weight='bold' text-anchor='start'>3 · Pixel</text><text x='454' y='126' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>colours each pixel</text><text x='454' y='145' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>(the shader)</text><line x1='620' y1='119' x2='634' y2='119' stroke='#9aa0a6' stroke-width='2'/><path d='M633 114 L641 119 L633 124 z' fill='#9aa0a6'/><rect x='642' y='80' width='182' height='78' rx='10' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' /><rect x='642' y='80' width='8' height='78' rx='3' fill='#b07aa1' stroke='none' stroke-width='1' /><text x='660' y='104' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='start'>4 · Output &amp; memory</text><text x='660' y='126' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>depth test, blend,</text><text x='660' y='145' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>write to memory</text><text x='24' y='192' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start'>Load: how long each station would need for the whole frame</text><text x='24' y='226' font-size='14' fill='#1f2328' font-weight='normal' text-anchor='start'>Vertex</text><rect x='190' y='210' width='494.0' height='24' rx='4' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' /><rect x='190' y='210' width='117.0' height='24' rx='4' fill='#4e79a7' stroke='none' stroke-width='1' /><text x='317.0' y='227' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='start'>9 ms · busy 22%</text><text x='24' y='266' font-size='14' fill='#1f2328' font-weight='normal' text-anchor='start'>Raster</text><rect x='190' y='250' width='494.0' height='24' rx='4' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' /><rect x='190' y='250' width='52.0' height='24' rx='4' fill='#59a14f' stroke='none' stroke-width='1' /><text x='252.0' y='267' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='start'>4 ms · busy 10%</text><text x='24' y='306' font-size='14' fill='#cf222e' font-weight='bold' text-anchor='start'>Pixel</text><rect x='190' y='290' width='494.0' height='24' rx='4' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' /><rect x='190' y='290' width='494.0' height='24' rx='4' fill='#e5534b' stroke='none' stroke-width='1' /><text x='674.0' y='307' font-size='13' fill='#ffffff' font-weight='bold' text-anchor='end'>38 ms · busy 93%</text><text x='696.0' y='307' font-size='14' fill='#cf222e' font-weight='bold' text-anchor='start'>◀ sets the pace</text><text x='24' y='346' font-size='14' fill='#1f2328' font-weight='normal' text-anchor='start'>Output &amp; memory</text><rect x='190' y='330' width='494.0' height='24' rx='4' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' /><rect x='190' y='330' width='195.0' height='24' rx='4' fill='#b07aa1' stroke='none' stroke-width='1' /><text x='395.0' y='347' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='start'>15 ms · busy 37%</text><line x1='24' y1='374' x2='836' y2='374' stroke='#d0d7de'/><text x='24' y='398' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start'>GPU time ≈ fixed work 3 ms (clears, UI, gaps) + the slowest station 38 ms = 41 ms  →  24.4 fps</text><text x='24' y='422' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>Halve the coral triangles: vertex 9 → 6 ms. The pixel station still needs 38 ms, so the GPU still needs 41 ms.</text></svg>
