<svg xmlns='http://www.w3.org/2000/svg' width='860' height='430' viewBox='0 0 860 430' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Six weeks, the whole course</title><rect x='0.5' y='0.5' width='859' height='429' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Six weeks, the whole course</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>48 hours, in order. Each block is a lesson you have already done.</text><rect x='24.0' y='84.0' width='812.0' height='48.0' rx='8' fill='#ffffff' stroke='#59a14f' stroke-width='1.5' opacity='1'/><rect x='24.0' y='84.0' width='96.0' height='48.0' rx='8' fill='#59a14f' stroke='none' stroke-width='1' opacity='1'/><rect x='110.0' y='84.0' width='10.0' height='48.0' rx='0' fill='#59a14f' stroke='none' stroke-width='1' opacity='1'/><text x='72' y='113' font-size='13' fill='#ffffff' font-weight='700' text-anchor='middle'>Week 1</text><text x='134' y='104' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>Design doc, two ADRs, budget, baseline</text><text x='134' y='122' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>7 h · fish budget 2.0 ms · baseline 9.0 ms</text><text x='822' y='113' font-size='12' fill='#59a14f' font-weight='700' text-anchor='end'>067 · 068 · 062 · 003</text><rect x='24.0' y='140.0' width='812.0' height='48.0' rx='8' fill='#ffffff' stroke='#4e79a7' stroke-width='1.5' opacity='1'/><rect x='24.0' y='140.0' width='96.0' height='48.0' rx='8' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><rect x='110.0' y='140.0' width='10.0' height='48.0' rx='0' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><text x='72' y='169' font-size='13' fill='#ffffff' font-weight='700' text-anchor='middle'>Weeks 1–3</text><text x='134' y='160' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>Build: data layout and the update loop</text><text x='134' y='178' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>11 h · SoA fish data, fixed step</text><text x='822' y='169' font-size='12' fill='#4e79a7' font-weight='700' text-anchor='end'>005 · 011 · 013</text><rect x='24.0' y='196.0' width='812.0' height='48.0' rx='8' fill='#ffffff' stroke='#4e79a7' stroke-width='1.5' opacity='1'/><rect x='24.0' y='196.0' width='96.0' height='48.0' rx='8' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><rect x='110.0' y='196.0' width='10.0' height='48.0' rx='0' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><text x='72' y='225' font-size='13' fill='#ffffff' font-weight='700' text-anchor='middle'>Weeks 3–4</text><text x='134' y='216' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>Build: behaviour and AI LOD</text><text x='134' y='234' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>11 h · schooling, avoidance, near/far update rates</text><text x='822' y='225' font-size='12' fill='#4e79a7' font-weight='700' text-anchor='end'>016 · 053</text><rect x='24.0' y='252.0' width='812.0' height='48.0' rx='8' fill='#ffffff' stroke='#f28e2b' stroke-width='1.5' opacity='1'/><rect x='24.0' y='252.0' width='96.0' height='48.0' rx='8' fill='#f28e2b' stroke='none' stroke-width='1' opacity='1'/><rect x='110.0' y='252.0' width='10.0' height='48.0' rx='0' fill='#f28e2b' stroke='none' stroke-width='1' opacity='1'/><text x='72' y='281' font-size='13' fill='#ffffff' font-weight='700' text-anchor='middle'>Weeks 4–5</text><text x='134' y='272' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>One measured optimization pass</text><text x='134' y='290' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>8 h · capture → hypothesis → test → grid: 9.0 → 1.2 ms</text><text x='822' y='281' font-size='12' fill='#f28e2b' font-weight='700' text-anchor='end'>035 · 036 · 037</text><rect x='24.0' y='308.0' width='812.0' height='48.0' rx='8' fill='#ffffff' stroke='#b07aa1' stroke-width='1.5' opacity='1'/><rect x='24.0' y='308.0' width='96.0' height='48.0' rx='8' fill='#b07aa1' stroke='none' stroke-width='1' opacity='1'/><rect x='110.0' y='308.0' width='10.0' height='48.0' rx='0' fill='#b07aa1' stroke='none' stroke-width='1' opacity='1'/><text x='72' y='337' font-size='13' fill='#ffffff' font-weight='700' text-anchor='middle'>Weeks 5–6</text><text x='134' y='328' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>Perf test and write-up</text><text x='134' y='346' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>5 h · fails above 2.0 ms · problem → decision → result</text><text x='822' y='337' font-size='12' fill='#b07aa1' font-weight='700' text-anchor='end'>063 · 079</text><rect x='24.0' y='364.0' width='812.0' height='48.0' rx='8' fill='#ffffff' stroke='#d4a72c' stroke-width='1.5' opacity='1'/><rect x='24.0' y='364.0' width='96.0' height='48.0' rx='8' fill='#d4a72c' stroke='none' stroke-width='1' opacity='1'/><rect x='110.0' y='364.0' width='10.0' height='48.0' rx='0' fill='#d4a72c' stroke='none' stroke-width='1' opacity='1'/><text x='72' y='393' font-size='13' fill='#ffffff' font-weight='700' text-anchor='middle'>Week 6</text><text x='134' y='384' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>Buffer</text><text x='134' y='402' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>6 h · for what you didn’t plan for</text><text x='822' y='393' font-size='12' fill='#9a7400' font-weight='700' text-anchor='end'>072</text></svg>