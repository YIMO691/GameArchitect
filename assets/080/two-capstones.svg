<svg xmlns='http://www.w3.org/2000/svg' width='880' height='324' viewBox='0 0 880 324' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Two capstones, 48 hours</title><rect x='0.5' y='0.5' width='879' height='323' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Two capstones, 48 hours</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Six weeks × 8 hours = 48 hours. One plan needs eight times that; the other fits with room to spare.</text><text x='24' y='106' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>My own engine</text><text x='24' y='124' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>ECS, renderer, net, editor</text><rect x='200.0' y='92.0' width='496.0' height='28.0' rx='4' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><text x='448.0' y='111' font-size='12' fill='#ffffff' font-weight='700' text-anchor='middle'>320 h build</text><rect x='696.0' y='92.0' width='93.0' height='28.0' rx='4' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='742.5' y='111' font-size='12' fill='#ffffff' font-weight='700' text-anchor='middle'>+60</text><text x='804.3000000000001' y='111' font-size='12.5' fill='#cf222e' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>386 h</text><text x='24' y='166' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>One system</text><text x='24' y='184' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>5,000 fish, existing engine</text><rect x='200.0' y='152.0' width='5.2' height='28.0' rx='3' fill='#59a14f' stroke='none' stroke-width='1' opacity='1'/><rect x='206.2' y='152.0' width='3.7' height='28.0' rx='3' fill='#d4a72c' stroke='none' stroke-width='1' opacity='1'/><rect x='210.8' y='152.0' width='33.1' height='28.0' rx='3' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><rect x='244.9' y='152.0' width='11.4' height='28.0' rx='3' fill='#f28e2b' stroke='none' stroke-width='1' opacity='1'/><rect x='257.3' y='152.0' width='6.8' height='28.0' rx='3' fill='#b07aa1' stroke='none' stroke-width='1' opacity='1'/><text x='280.4' y='171' font-size='12.5' fill='#1a7f37' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>42 h</text><line x1='274.4' y1='84' x2='274.4' y2='196' stroke='#cf222e' stroke-width='2.5' stroke-dasharray='5 4'/><text x='274.4' y='212' font-size='11.5' fill='#cf222e' font-weight='700' text-anchor='middle' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>48 h: end of week 6</text><text x='24' y='246' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='start'>By week 6 the engine is 12% done: a window, a triangle and half an ECS. Nothing to measure, nothing to show.</text><text x='24' y='268' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='start'>The system is finished with 6 h of buffer: a design, a measured optimization (9.0 → 1.2 ms) and a decision.</text><rect x='24.0' y='290.0' width='12.0' height='12.0' rx='2' fill='#59a14f' stroke='none' stroke-width='1' opacity='1'/><text x='41' y='301' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>design doc + ADRs 4 h</text><rect x='191.3' y='290.0' width='12.0' height='12.0' rx='2' fill='#d4a72c' stroke='none' stroke-width='1' opacity='1'/><text x='208.29999999999998' y='301' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>budget + baseline 3 h</text><rect x='358.6' y='290.0' width='12.0' height='12.0' rx='2' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><text x='375.59999999999997' y='301' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>build 22 h</text><rect x='456.6' y='290.0' width='12.0' height='12.0' rx='2' fill='#f28e2b' stroke='none' stroke-width='1' opacity='1'/><text x='473.59999999999997' y='301' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>measured pass 8 h</text><rect x='598.7' y='290.0' width='12.0' height='12.0' rx='2' fill='#b07aa1' stroke='none' stroke-width='1' opacity='1'/><text x='615.6999999999999' y='301' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>perf test + write-up 5 h</text></svg>