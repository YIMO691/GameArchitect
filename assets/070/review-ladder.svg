<svg xmlns='http://www.w3.org/2000/svg' width='860' height='376' viewBox='0 0 860 376' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Where the review time goes</title><rect x='0.5' y='0.5' width='859' height='375' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Where the review time goes</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Same change, same three reviewers. What reaches players after merge, in hours of fixes.</text><text x='24' y='96' font-size='12' fill='#57606a' font-weight='700' text-anchor='start'>Review approach</text><text x='230' y='96' font-size='12' fill='#57606a' font-weight='700' text-anchor='start'>Hours of fixes after merge</text><text x='730' y='96' font-size='12' fill='#57606a' font-weight='700' text-anchor='middle'>Found</text><text x='800' y='96' font-size='12' fill='#57606a' font-weight='700' text-anchor='middle'>Review</text><text x='24' y='130' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>One PR, line by line</text><rect x='230.0' y='114.0' width='420.0' height='24.0' rx='4' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='658.0' y='131' font-size='12.5' fill='#cf222e' font-weight='700' text-anchor='start'>184 h</text><text x='730' y='131' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='middle'>1 of 8</text><text x='800' y='131' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='middle'>4.5 h</text><text x='24' y='170' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>+ tools own style</text><rect x='230.0' y='154.0' width='401.7' height='24.0' rx='4' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='639.7391304347826' y='171' font-size='12.5' fill='#cf222e' font-weight='700' text-anchor='start'>176 h</text><text x='730' y='171' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='middle'>2 of 8</text><text x='800' y='171' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='middle'>3.0 h</text><text x='24' y='210' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>+ four PRs</text><rect x='230.0' y='194.0' width='273.9' height='24.0' rx='4' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='511.9130434782609' y='211' font-size='12.5' fill='#cf222e' font-weight='700' text-anchor='start'>120 h</text><text x='730' y='211' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='middle'>5 of 8</text><text x='800' y='211' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='middle'>2.5 h</text><text x='24' y='250' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>+ outside in</text><rect x='230.0' y='234.0' width='182.6' height='24.0' rx='4' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='420.6086956521739' y='251' font-size='12.5' fill='#cf222e' font-weight='700' text-anchor='start'>80 h</text><text x='730' y='251' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='middle'>6 of 8</text><text x='800' y='251' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='middle'>2.5 h</text><text x='24' y='290' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>+ five questions</text><text x='238.0' y='291' font-size='12.5' fill='#1a7f37' font-weight='700' text-anchor='start'>0 h</text><text x='730' y='291' font-size='12.5' fill='#1a7f37' font-weight='700' text-anchor='middle'>8 of 8</text><text x='800' y='291' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='middle'>3.0 h</text><rect x='24.0' y='316.0' width='812.0' height='40.0' rx='8' fill='#dafbe1' stroke='#1a7f37' stroke-width='1.4' opacity='1'/><text x='40' y='341' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>Less review time than the first try (3.0 vs 4.5 h), and 184 hours of later fixes avoided.</text></svg>