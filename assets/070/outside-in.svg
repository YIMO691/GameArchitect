<svg xmlns='http://www.w3.org/2000/svg' width='860' height='422' viewBox='0 0 860 422' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Reviewing from the outside in</title><rect x='0.5' y='0.5' width='859' height='421' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Reviewing from the outside in</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Five questions, from the outside of the change inwards. Details last, and tools own style.</text><rect x='24.0' y='84.0' width='812.0' height='40.0' rx='8' fill='#ffffff' stroke='#4e79a7' stroke-width='1.6' opacity='1'/><text x='36' y='109' font-size='13' fill='#4e79a7' font-weight='700' text-anchor='start'>1 · Boundaries</text><text x='186' y='109' font-size='12' fill='#1f2328' font-weight='400' text-anchor='start'>What does the interface expose?</text><text x='824' y='109' font-size='11.5' fill='#4e79a7' font-weight='600' text-anchor='end'>vendor types leak into our API</text><rect x='38.0' y='130.0' width='784.0' height='40.0' rx='8' fill='#ffffff' stroke='#4e79a7' stroke-width='1.6' opacity='1'/><text x='50' y='155' font-size='13' fill='#4e79a7' font-weight='700' text-anchor='start'>2 · Dependencies</text><text x='200' y='155' font-size='12' fill='#1f2328' font-weight='400' text-anchor='start'>What does it now depend on, and who owns it?</text><text x='810' y='155' font-size='11.5' fill='#4e79a7' font-weight='600' text-anchor='end'>every caller tied to the vendor</text><rect x='52.0' y='176.0' width='756.0' height='40.0' rx='8' fill='#ffffff' stroke='#f28e2b' stroke-width='1.6' opacity='1'/><text x='64' y='201' font-size='13' fill='#f28e2b' font-weight='700' text-anchor='start'>3 · Hot paths</text><text x='214' y='201' font-size='12' fill='#1f2328' font-weight='400' text-anchor='start'>What runs per entry, per frame, per player?</text><text x='796' y='201' font-size='11.5' fill='#f28e2b' font-weight='600' text-anchor='end'>allocates per entry; polls every frame</text><rect x='66.0' y='222.0' width='728.0' height='40.0' rx='8' fill='#ffffff' stroke='#cf222e' stroke-width='1.6' opacity='1'/><text x='78' y='247' font-size='13' fill='#cf222e' font-weight='700' text-anchor='start'>4 · Failure modes</text><text x='228' y='247' font-size='12' fill='#1f2328' font-weight='400' text-anchor='start'>What happens when a dependency is slow or down?</text><text x='782' y='247' font-size='11.5' fill='#cf222e' font-weight='600' text-anchor='end'>no timeout or fallback</text><rect x='80.0' y='268.0' width='700.0' height='40.0' rx='8' fill='#ffffff' stroke='#cf222e' stroke-width='1.6' opacity='1'/><text x='92' y='293' font-size='13' fill='#cf222e' font-weight='700' text-anchor='start'>5 · Load</text><text x='242' y='293' font-size='12' fill='#1f2328' font-weight='400' text-anchor='start'>Does it hold at the peak we know is coming?</text><text x='768' y='293' font-size='11.5' fill='#cf222e' font-weight='600' text-anchor='end'>50,000 entries in a minute</text><rect x='94.0' y='314.0' width='672.0' height='40.0' rx='8' fill='#ffffff' stroke='#b07aa1' stroke-width='1.6' opacity='1'/><text x='106' y='339' font-size='13' fill='#b07aa1' font-weight='700' text-anchor='start'>6 · Details</text><text x='256' y='339' font-size='12' fill='#1f2328' font-weight='400' text-anchor='start'>Logic, edge cases, tests: line by line</text><text x='754' y='339' font-size='11.5' fill='#b07aa1' font-weight='600' text-anchor='end'>off-by-one, double submit, time zone, null</text><rect x='94.0' y='360.0' width='672.0' height='40.0' rx='8' fill='#ffffff' stroke='#9aa0a6' stroke-width='1.6' opacity='1'/><text x='106' y='385' font-size='13' fill='#9aa0a6' font-weight='700' text-anchor='start'>Style</text><text x='256' y='385' font-size='12' fill='#1f2328' font-weight='400' text-anchor='start'>Formatter and linter in CI</text><text x='754' y='385' font-size='11.5' fill='#9aa0a6' font-weight='600' text-anchor='end'>no human comments needed</text></svg>