<svg xmlns='http://www.w3.org/2000/svg' width='860' height='500' viewBox='0 0 860 500' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Quad vs cutout vs size cap</title><rect x='0.5' y='0.5' width='859' height='499' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' fill='#1f2328' font-weight='bold' text-anchor='start'>You pay for every pixel of the shape, not of the picture</text><text x='24' y='60' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start'>One foam puff. The GPU runs the shader and blends on every pixel the shape covers, even where alpha is 0.</text><rect x='50.0' y='110.0' width='200.0' height='200.0' rx='0' fill='#fff5f5' stroke='#e5534b' stroke-width='2' /><circle cx='150' cy='210' r='70.0' fill='#4e79a7' opacity='0.18'/><circle cx='150' cy='210' r='56.0' fill='#4e79a7' opacity='0.28'/><circle cx='150' cy='210' r='42.0' fill='#4e79a7' opacity='0.40'/><circle cx='150' cy='210' r='28.0' fill='#4e79a7' opacity='0.60'/><text x='150' y='336.0' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='middle'>4 vertices, 100% of the quad paid</text><text x='150' y='356.0' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>only ~40% shows; 60% is</text><text x='150' y='372.0' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>invisible corners, still paid</text><rect x='330.0' y='110.0' width='200.0' height='200.0' rx='0' fill='none' stroke='#9aa0a6' stroke-width='1' stroke-dasharray='5 4'/><polygon points='508.0,242.3 462.3,288.0 397.7,288.0 352.0,242.3 352.0,177.7 397.7,132.0 462.3,132.0 508.0,177.7' fill='#dafbe1' stroke='#1a7f37' stroke-width='2' stroke-dasharray=''/><circle cx='430' cy='210' r='70.0' fill='#4e79a7' opacity='0.18'/><circle cx='430' cy='210' r='56.0' fill='#4e79a7' opacity='0.28'/><circle cx='430' cy='210' r='42.0' fill='#4e79a7' opacity='0.40'/><circle cx='430' cy='210' r='28.0' fill='#4e79a7' opacity='0.60'/><text x='430' y='336.0' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='middle'>8 vertices, ~50% of the quad paid</text><text x='430' y='356.0' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>same picture; the corners</text><text x='430' y='372.0' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>are never drawn</text><rect x='610.0' y='110.0' width='200.0' height='200.0' rx='0' fill='none' stroke='#9aa0a6' stroke-width='1' stroke-dasharray='5 4'/><polygon points='755.0,228.7 728.7,255.0 691.3,255.0 665.0,228.7 665.0,191.3 691.3,165.0 728.7,165.0 755.0,191.3' fill='#dafbe1' stroke='#1a7f37' stroke-width='2' stroke-dasharray=''/><circle cx='710' cy='210' r='40.4' fill='#4e79a7' opacity='0.18'/><circle cx='710' cy='210' r='32.3' fill='#4e79a7' opacity='0.28'/><circle cx='710' cy='210' r='24.2' fill='#4e79a7' opacity='0.40'/><circle cx='710' cy='210' r='16.2' fill='#4e79a7' opacity='0.60'/><text x='710' y='336.0' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='middle'>no puff over 40% of screen height</text><text x='710' y='356.0' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>the giants at the lens shrink;</text><text x='710' y='372.0' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>average area ÷ 3</text><text x='150' y='92' font-size='15' fill='#cf222e' font-weight='bold' text-anchor='middle'>1. Plain quad</text><text x='430' y='92' font-size='15' fill='#1a7f37' font-weight='bold' text-anchor='middle'>2. Cutout shape</text><text x='710' y='92' font-size='15' fill='#1a7f37' font-weight='bold' text-anchor='middle'>3. + size cap</text><path d='M268 210 L312 210' stroke='#57606a' stroke-width='2'/><path d='M312 204 L322 210 L312 216 Z' fill='#57606a'/><path d='M548 210 L592 210' stroke='#57606a' stroke-width='2'/><path d='M592 204 L602 210 L592 216 Z' fill='#57606a'/><rect x='24.0' y='392.0' width='812.0' height='58.0' rx='8' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' /><text x='150' y='416' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='middle'>average puff 207,360 px</text><text x='150' y='436' font-size='14' fill='#cf222e' font-weight='bold' text-anchor='middle'>40 puffs = 7.2 screens</text><text x='430' y='416' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='middle'>average puff 103,680 px</text><text x='430' y='436' font-size='14' fill='#1a7f37' font-weight='bold' text-anchor='middle'>40 puffs = 3.6 screens</text><text x='710' y='416' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='middle'>average puff 34,560 px</text><text x='710' y='436' font-size='14' fill='#1a7f37' font-weight='bold' text-anchor='middle'>40 puffs = 1.2 screens</text><text x='24' y='482' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>1 screen = 1600 × 720 = 1,152,000 pixels painted once. Fixed cost of the cutout: 4 more vertices per puff.</text></svg>