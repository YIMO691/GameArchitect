<svg xmlns='http://www.w3.org/2000/svg' width='860' height='470' viewBox='0 0 860 470' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Memory station step by step</title><rect x='0.5' y='0.5' width='859' height='469' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' fill='#1f2328' font-weight='bold' text-anchor='start'>The output &amp; memory station, step by step</text><text x='24' y='60' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start'>Load in ms. Each screen of see-through pixels costs 4 ms here (and 1 ms in the pixel station).</text><text x='24' y='116' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start'>Before the splash</text><text x='24' y='133' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>pixel 24 · memory 23</text><rect x='190.0' y='102.0' width='109.8' height='26.0' rx='0' fill='#9aa0a6' stroke='none' stroke-width='1' /><text x='244.91071428571428' y='120' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>15</text><rect x='299.8' y='102.0' width='58.6' height='26.0' rx='0' fill='#b07aa1' stroke='none' stroke-width='1' /><text x='329.10714285714283' y='120' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>8</text><text x='720' y='120' font-size='13' fill='#1a7f37' font-weight='bold' text-anchor='end'>memory 23</text><text x='836' y='120' font-size='14' fill='#1a7f37' font-weight='bold' text-anchor='end'>GPU 27 ms</text><text x='24' y='168' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start'>Big Catch splash</text><text x='24' y='185' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>8.0 screens</text><rect x='190.0' y='154.0' width='109.8' height='26.0' rx='0' fill='#9aa0a6' stroke='none' stroke-width='1' /><text x='244.91071428571428' y='172' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>15</text><rect x='299.8' y='154.0' width='58.6' height='26.0' rx='0' fill='#b07aa1' stroke='none' stroke-width='1' /><text x='329.10714285714283' y='172' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>8</text><rect x='358.4' y='154.0' width='234.3' height='26.0' rx='0' fill='#e5534b' stroke='none' stroke-width='1' /><text x='475.5357142857142' y='172' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>32</text><text x='720' y='172' font-size='13' fill='#cf222e' font-weight='bold' text-anchor='end'>memory 55</text><text x='836' y='172' font-size='14' fill='#cf222e' font-weight='bold' text-anchor='end'>GPU 58 ms</text><text x='24' y='220' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start'>Cutout puffs</text><text x='24' y='237' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>4.4 screens</text><rect x='190.0' y='206.0' width='109.8' height='26.0' rx='0' fill='#9aa0a6' stroke='none' stroke-width='1' /><text x='244.91071428571428' y='224' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>15</text><rect x='299.8' y='206.0' width='58.6' height='26.0' rx='0' fill='#b07aa1' stroke='none' stroke-width='1' /><text x='329.10714285714283' y='224' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>8</text><rect x='358.4' y='206.0' width='128.9' height='26.0' rx='0' fill='#e5534b' stroke='none' stroke-width='1' /><text x='422.82142857142856' y='224' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>17.6</text><text x='720' y='224' font-size='13' fill='#cf222e' font-weight='bold' text-anchor='end'>memory 40.6</text><text x='836' y='224' font-size='14' fill='#cf222e' font-weight='bold' text-anchor='end'>GPU 43.6 ms</text><text x='24' y='272' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start'>+ size cap</text><text x='24' y='289' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>2.0 screens</text><rect x='190.0' y='258.0' width='109.8' height='26.0' rx='0' fill='#9aa0a6' stroke='none' stroke-width='1' /><text x='244.91071428571428' y='276' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>15</text><rect x='299.8' y='258.0' width='58.6' height='26.0' rx='0' fill='#b07aa1' stroke='none' stroke-width='1' /><text x='329.10714285714283' y='276' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>8</text><rect x='358.4' y='258.0' width='58.6' height='26.0' rx='0' fill='#e5534b' stroke='none' stroke-width='1' /><text x='387.6785714285714' y='276' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>8</text><text x='720' y='276' font-size='13' fill='#cf222e' font-weight='bold' text-anchor='end'>memory 31</text><text x='836' y='276' font-size='14' fill='#cf222e' font-weight='bold' text-anchor='end'>GPU 34 ms</text><text x='24' y='324' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start'>+ murk faded</text><text x='24' y='341' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>limit: pixel 24</text><rect x='190.0' y='310.0' width='109.8' height='26.0' rx='0' fill='#9aa0a6' stroke='none' stroke-width='1' /><text x='244.91071428571428' y='328' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>15</text><rect x='299.8' y='310.0' width='58.6' height='26.0' rx='0' fill='#59a14f' stroke='none' stroke-width='1' /><text x='329.10714285714283' y='328' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>8</text><text x='720' y='328' font-size='13' fill='#1a7f37' font-weight='bold' text-anchor='end'>memory 23</text><text x='836' y='328' font-size='14' fill='#1a7f37' font-weight='bold' text-anchor='end'>GPU 27 ms</text><line x1='373.0' x2='373.0' y1='88' y2='356' stroke='#1a7f37' stroke-width='2.5' stroke-dasharray='6 4'/><text x='373.03571428571433' y='82' font-size='12' fill='#1a7f37' font-weight='bold' text-anchor='middle'>25 ms per station</text><rect x='24.0' y='371.0' width='14.0' height='14.0' rx='2' fill='#9aa0a6' stroke='none' stroke-width='1' /><text x='44' y='382' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>scene: 15</text><rect x='224.0' y='371.0' width='14.0' height='14.0' rx='2' fill='#b07aa1' stroke='none' stroke-width='1' /><text x='244' y='382' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>2 murk layers: 8</text><rect x='424.0' y='371.0' width='14.0' height='14.0' rx='2' fill='#59a14f' stroke='none' stroke-width='1' /><text x='444' y='382' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>splash: 4 per screen</text><text x='24' y='412' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start'>GPU = 3 ms + the slowest station. Memory is the slowest until the last row, where pixel (24 ms) takes over.</text></svg>