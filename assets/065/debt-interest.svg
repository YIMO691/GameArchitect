<svg xmlns='http://www.w3.org/2000/svg' width='860' height='356' viewBox='0 0 860 356' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Debt is paid as interest</title><rect x='0.5' y='0.5' width='859' height='355' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Debt is paid as interest</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Developer-days for one new lure. The work itself is 4 days; the rest is interest paid on the old code.</text><text x='24' y='110' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>Clean code</text><text x='24' y='128' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>after all 5 parts are replaced</text><rect x='300.0' y='96.0' width='120.0' height='26.0' rx='4' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><text x='360' y='114' font-size='11.5' fill='#ffffff' font-weight='700' text-anchor='middle'>the lure</text><text x='428.0' y='114' font-size='13' fill='#1a7f37' font-weight='700' text-anchor='start'>4 days</text><text x='24' y='168' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>Today (4-year-old code)</text><text x='24' y='186' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>debt 1.0: understanding, side effects, retesting</text><rect x='300.0' y='154.0' width='120.0' height='26.0' rx='4' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><text x='360' y='172' font-size='11.5' fill='#ffffff' font-weight='700' text-anchor='middle'>the lure</text><rect x='422.0' y='154.0' width='178.0' height='26.0' rx='4' fill='#cf222e' stroke='none' stroke-width='1' opacity='0.85'/><text x='510.0' y='172' font-size='11.5' fill='#ffffff' font-weight='700' text-anchor='middle'>interest 6 days</text><text x='608.0' y='172' font-size='13' fill='#cf222e' font-weight='700' text-anchor='start'>10 days</text><text x='24' y='226' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>Week 26, if we keep patching</text><text x='24' y='244' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>every patch made the tangle worse</text><rect x='300.0' y='212.0' width='120.0' height='26.0' rx='4' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><text x='360' y='230' font-size='11.5' fill='#ffffff' font-weight='700' text-anchor='middle'>the lure</text><rect x='422.0' y='212.0' width='358.0' height='26.0' rx='4' fill='#cf222e' stroke='none' stroke-width='1' opacity='0.85'/><text x='600.0' y='230' font-size='11.5' fill='#ffffff' font-weight='700' text-anchor='middle'>interest 12 days</text><text x='788.0' y='230' font-size='13' fill='#cf222e' font-weight='700' text-anchor='start'>16 days</text><text x='24' y='278' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>Model: days per lure = 4 × (1 + 1.5 × debt). Patching adds 0.03 debt per lure; replacing one of 5 parts removes 0.18.</text><rect x='24.0' y='292.0' width='812.0' height='44.0' rx='8' fill='#fff8e6' stroke='#d4a72c' stroke-width='1.5' opacity='1'/><text x='40' y='319' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>Technical debt is not "ugly code". It is the extra days every future change pays, and how fast that grows.</text></svg>