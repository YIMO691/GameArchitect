<svg xmlns='http://www.w3.org/2000/svg' width='860' height='474' viewBox='0 0 860 474' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Piece by piece, behind an interface</title><rect x='0.5' y='0.5' width='859' height='473' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Piece by piece, behind an interface</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Replace the fishing code one part at a time, behind one interface, while lures keep shipping.</text><rect x='24.0' y='84.0' width='812.0' height='40.0' rx='8' fill='#eaf1fb' stroke='#4e79a7' stroke-width='1.5' opacity='1'/><text x='430' y='109' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='middle'>IFishing interface: the rest of the game only talks to this</text><line x1='100.0' y1='126' x2='100.0' y2='136.0' stroke='#9aa0a6' stroke-width='2'/><polygon points='100.0,146 106.0,136.0 94.0,136.0' fill='#9aa0a6'/><rect x='24.0' y='150.0' width='152.0' height='44.0' rx='8' fill='#fde2e1' stroke='#cf222e' stroke-width='1.2' opacity='1'/><text x='100.0' y='169' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='middle'>Lure data</text><text x='100.0' y='186' font-size='11.5' fill='#cf222e' font-weight='600' text-anchor='middle'>old</text><line x1='100.0' y1='198' x2='100.0' y2='208.0' stroke='#1a7f37' stroke-width='2'/><polygon points='100.0,218 106.0,208.0 94.0,208.0' fill='#1a7f37'/><rect x='24.0' y='222.0' width='152.0' height='44.0' rx='8' fill='#dafbe1' stroke='#1a7f37' stroke-width='1.2' opacity='1'/><text x='100.0' y='241' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='middle'>Lure data</text><text x='100.0' y='258' font-size='11.5' fill='#1a7f37' font-weight='600' text-anchor='middle'>new, week 4</text><line x1='265.0' y1='126' x2='265.0' y2='136.0' stroke='#9aa0a6' stroke-width='2'/><polygon points='265.0,146 271.0,136.0 259.0,136.0' fill='#9aa0a6'/><rect x='189.0' y='150.0' width='152.0' height='44.0' rx='8' fill='#fde2e1' stroke='#cf222e' stroke-width='1.2' opacity='1'/><text x='265.0' y='169' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='middle'>Line physics</text><text x='265.0' y='186' font-size='11.5' fill='#cf222e' font-weight='600' text-anchor='middle'>old</text><line x1='265.0' y1='198' x2='265.0' y2='208.0' stroke='#1a7f37' stroke-width='2'/><polygon points='265.0,218 271.0,208.0 259.0,208.0' fill='#1a7f37'/><rect x='189.0' y='222.0' width='152.0' height='44.0' rx='8' fill='#dafbe1' stroke='#1a7f37' stroke-width='1.2' opacity='1'/><text x='265.0' y='241' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='middle'>Line physics</text><text x='265.0' y='258' font-size='11.5' fill='#1a7f37' font-weight='600' text-anchor='middle'>new, week 7</text><line x1='430.0' y1='126' x2='430.0' y2='136.0' stroke='#9aa0a6' stroke-width='2'/><polygon points='430.0,146 436.0,136.0 424.0,136.0' fill='#9aa0a6'/><rect x='354.0' y='150.0' width='152.0' height='44.0' rx='8' fill='#fde2e1' stroke='#cf222e' stroke-width='1.2' opacity='1'/><text x='430.0' y='169' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='middle'>Bite AI</text><text x='430.0' y='186' font-size='11.5' fill='#cf222e' font-weight='600' text-anchor='middle'>old</text><line x1='430.0' y1='198' x2='430.0' y2='208.0' stroke='#1a7f37' stroke-width='2'/><polygon points='430.0,218 436.0,208.0 424.0,208.0' fill='#1a7f37'/><rect x='354.0' y='222.0' width='152.0' height='44.0' rx='8' fill='#dafbe1' stroke='#1a7f37' stroke-width='1.2' opacity='1'/><text x='430.0' y='241' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='middle'>Bite AI</text><text x='430.0' y='258' font-size='11.5' fill='#1a7f37' font-weight='600' text-anchor='middle'>new, week 10</text><line x1='595.0' y1='126' x2='595.0' y2='136.0' stroke='#9aa0a6' stroke-width='2'/><polygon points='595.0,146 601.0,136.0 589.0,136.0' fill='#9aa0a6'/><rect x='519.0' y='150.0' width='152.0' height='44.0' rx='8' fill='#fde2e1' stroke='#cf222e' stroke-width='1.2' opacity='1'/><text x='595.0' y='169' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='middle'>Reel UI</text><text x='595.0' y='186' font-size='11.5' fill='#cf222e' font-weight='600' text-anchor='middle'>old</text><line x1='595.0' y1='198' x2='595.0' y2='208.0' stroke='#1a7f37' stroke-width='2'/><polygon points='595.0,218 601.0,208.0 589.0,208.0' fill='#1a7f37'/><rect x='519.0' y='222.0' width='152.0' height='44.0' rx='8' fill='#dafbe1' stroke='#1a7f37' stroke-width='1.2' opacity='1'/><text x='595.0' y='241' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='middle'>Reel UI</text><text x='595.0' y='258' font-size='11.5' fill='#1a7f37' font-weight='600' text-anchor='middle'>new, week 14</text><line x1='760.0' y1='126' x2='760.0' y2='136.0' stroke='#9aa0a6' stroke-width='2'/><polygon points='760.0,146 766.0,136.0 754.0,136.0' fill='#9aa0a6'/><rect x='684.0' y='150.0' width='152.0' height='44.0' rx='8' fill='#fde2e1' stroke='#cf222e' stroke-width='1.2' opacity='1'/><text x='760.0' y='169' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='middle'>Catch log</text><text x='760.0' y='186' font-size='11.5' fill='#cf222e' font-weight='600' text-anchor='middle'>old</text><line x1='760.0' y1='198' x2='760.0' y2='208.0' stroke='#1a7f37' stroke-width='2'/><polygon points='760.0,218 766.0,208.0 754.0,208.0' fill='#1a7f37'/><rect x='684.0' y='222.0' width='152.0' height='44.0' rx='8' fill='#dafbe1' stroke='#1a7f37' stroke-width='1.2' opacity='1'/><text x='760.0' y='241' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='middle'>Catch log</text><text x='760.0' y='258' font-size='11.5' fill='#1a7f37' font-weight='600' text-anchor='middle'>new, week 17</text><text x='24' y='290' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>For each part:</text><text x='40' y='314' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>1. Write characterization tests: pin what the old part does today, odd cases included.</text><text x='40' y='336' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>2. Route calls through the interface, so callers no longer see the old part.</text><text x='40' y='358' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>3. Build the new part behind the interface; run both and compare on the same inputs.</text><text x='40' y='380' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>4. Switch with a flag, watch telemetry, then delete the old part.</text><rect x='24.0' y='410.0' width='812.0' height='44.0' rx='8' fill='#fff8e6' stroke='#d4a72c' stroke-width='1.5' opacity='1'/><text x='40' y='437' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>30% of the team's time: all 5 parts new by week 17, lures at 4.6 days, and no week without a release.</text></svg>