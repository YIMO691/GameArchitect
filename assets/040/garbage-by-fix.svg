<svg xmlns='http://www.w3.org/2000/svg' width='860' height='326' viewBox='0 0 860 326' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Rarer is not the goal: zero is</title><rect x='0.5' y='0.5' width='859' height='325' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Rarer is not the goal: zero is</text><text x='24' y='62' font-size='12.5' fill='#57606a' font-weight='400' text-anchor='start'>Garbage a frame in the Reel-in minigame (KB) and how often the GC stops the game. 16,384 KB of free room, 14.5 ms frames.</text><text x='24' y='106' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>Start</text><rect x='190.0' y='90.0' width='288.8' height='26.0' rx='0' fill='#cf222e' stroke='#ffffff' stroke-width='1' opacity='1'/><text x='334.375' y='108' font-size='11.5' fill='#ffffff' font-weight='700' text-anchor='middle'>21</text><rect x='478.8' y='90.0' width='123.8' height='26.0' rx='0' fill='#f28e2b' stroke='#ffffff' stroke-width='1' opacity='1'/><text x='540.625' y='108' font-size='11.5' fill='#ffffff' font-weight='700' text-anchor='middle'>9</text><rect x='602.5' y='90.0' width='20.6' height='26.0' rx='0' fill='#b07aa1' stroke='#ffffff' stroke-width='1' opacity='1'/><rect x='623.1' y='90.0' width='6.9' height='26.0' rx='0' fill='#d4a72c' stroke='#ffffff' stroke-width='1' opacity='1'/><text x='640.0' y='108' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>32.0 KB</text><text x='836' y='108' font-size='14' fill='#cf222e' font-weight='700' text-anchor='end'>every 7.4 s</text><text x='24' y='154' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>Loop, not LINQ</text><rect x='190.0' y='138.0' width='123.8' height='26.0' rx='0' fill='#f28e2b' stroke='#ffffff' stroke-width='1' opacity='1'/><text x='251.875' y='156' font-size='11.5' fill='#ffffff' font-weight='700' text-anchor='middle'>9</text><rect x='313.8' y='138.0' width='20.6' height='26.0' rx='0' fill='#b07aa1' stroke='#ffffff' stroke-width='1' opacity='1'/><rect x='334.4' y='138.0' width='6.9' height='26.0' rx='0' fill='#d4a72c' stroke='#ffffff' stroke-width='1' opacity='1'/><text x='351.25' y='156' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>11.0 KB</text><text x='836' y='156' font-size='14' fill='#cf222e' font-weight='700' text-anchor='end'>every 21.6 s</text><text x='24' y='202' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>+ NonAlloc overlap</text><rect x='190.0' y='186.0' width='20.6' height='26.0' rx='0' fill='#b07aa1' stroke='#ffffff' stroke-width='1' opacity='1'/><rect x='210.6' y='186.0' width='6.9' height='26.0' rx='0' fill='#d4a72c' stroke='#ffffff' stroke-width='1' opacity='1'/><text x='227.5' y='204' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>2.0 KB</text><text x='836' y='204' font-size='14' fill='#f28e2b' font-weight='700' text-anchor='end'>every 118.8 s</text><text x='24' y='250' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>+ last 2 KB</text><text x='200' y='252' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>0 KB</text><text x='836' y='252' font-size='14' fill='#1a7f37' font-weight='700' text-anchor='end'>never</text><text x='836' y='82' font-size='12' fill='#57606a' font-weight='700' text-anchor='end'>GC hitch</text><rect x='24.0' y='291.0' width='14.0' height='14.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='44' y='302' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>LINQ + lambda (60 fish)</text><rect x='224.4' y='291.0' width='14.0' height='14.0' rx='3' fill='#f28e2b' stroke='none' stroke-width='1' opacity='1'/><text x='244.4' y='302' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>OverlapSphere arrays</text><rect x='404.4' y='291.0' width='14.0' height='14.0' rx='3' fill='#b07aa1' stroke='none' stroke-width='1' opacity='1'/><text x='424.4' y='302' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>RaycastAll</text><rect x='516.4' y='291.0' width='14.0' height='14.0' rx='3' fill='#d4a72c' stroke='none' stroke-width='1' opacity='1'/><text x='536.4' y='302' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>ForEach closure</text></svg>