<svg xmlns='http://www.w3.org/2000/svg' width='860' height='442' viewBox='0 0 860 442' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Hidden allocations in gameplay code</title><rect x='0.5' y='0.5' width='859' height='441' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Hidden allocations in gameplay code</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Common C# and Unity calls that allocate every time, and an allocation-free way to do the same job.</text><text x='24' y='96' font-size='14' fill='#cf222e' font-weight='700' text-anchor='start'>❌ Allocates every call</text><text x='450' y='96' font-size='14' fill='#1a7f37' font-weight='700' text-anchor='start'>✅ Allocation-free</text><rect x='24.0' y='108.0' width='400.0' height='34.0' rx='6' fill='#fff1f0' stroke='#f5c2c0' stroke-width='1' opacity='1'/><text x='36' y='130' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>list.Where(f =&gt; f.hooked).ToList()</text><line x1='428' y1='125' x2='436.0' y2='125.0' stroke='#57606a' stroke-width='2'/><polygon points='446,125 436.0,119.0 436.0,131.0' fill='#57606a'/><rect x='450.0' y='108.0' width='386.0' height='34.0' rx='6' fill='#dafbe1' stroke='#a6dcb3' stroke-width='1' opacity='1'/><text x='462' y='130' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>for loop into a List you keep and Clear()</text><rect x='24.0' y='150.0' width='400.0' height='34.0' rx='6' fill='#fff1f0' stroke='#f5c2c0' stroke-width='1' opacity='1'/><text x='36' y='172' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>Physics.OverlapSphere(p, r)</text><line x1='428' y1='167' x2='436.0' y2='167.0' stroke='#57606a' stroke-width='2'/><polygon points='446,167 436.0,161.0 436.0,173.0' fill='#57606a'/><rect x='450.0' y='150.0' width='386.0' height='34.0' rx='6' fill='#dafbe1' stroke='#a6dcb3' stroke-width='1' opacity='1'/><text x='462' y='172' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>Physics.OverlapSphereNonAlloc(p, r, buffer)</text><rect x='24.0' y='192.0' width='400.0' height='34.0' rx='6' fill='#fff1f0' stroke='#f5c2c0' stroke-width='1' opacity='1'/><text x='36' y='214' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>Physics.RaycastAll(ray)</text><line x1='428' y1='209' x2='436.0' y2='209.0' stroke='#57606a' stroke-width='2'/><polygon points='446,209 436.0,203.0 436.0,215.0' fill='#57606a'/><rect x='450.0' y='192.0' width='386.0' height='34.0' rx='6' fill='#dafbe1' stroke='#a6dcb3' stroke-width='1' opacity='1'/><text x='462' y='214' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>Physics.RaycastNonAlloc(ray, hits)</text><rect x='24.0' y='234.0' width='400.0' height='34.0' rx='6' fill='#fff1f0' stroke='#f5c2c0' stroke-width='1' opacity='1'/><text x='36' y='256' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>fish.ForEach(f =&gt; f.Pull(force))</text><line x1='428' y1='251' x2='436.0' y2='251.0' stroke='#57606a' stroke-width='2'/><polygon points='446,251 436.0,245.0 436.0,257.0' fill='#57606a'/><rect x='450.0' y='234.0' width='386.0' height='34.0' rx='6' fill='#dafbe1' stroke='#a6dcb3' stroke-width='1' opacity='1'/><text x='462' y='256' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>for (int i = 0; i &lt; n; i++) fish[i].Pull(force)</text><rect x='24.0' y='276.0' width='400.0' height='34.0' rx='6' fill='#fff1f0' stroke='#f5c2c0' stroke-width='1' opacity='1'/><text x='36' y='298' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>GetComponentsInChildren&lt;T&gt;()</text><line x1='428' y1='293' x2='436.0' y2='293.0' stroke='#57606a' stroke-width='2'/><polygon points='446,293 436.0,287.0 436.0,299.0' fill='#57606a'/><rect x='450.0' y='276.0' width='386.0' height='34.0' rx='6' fill='#dafbe1' stroke='#a6dcb3' stroke-width='1' opacity='1'/><text x='462' y='298' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>GetComponentsInChildren(list)</text><rect x='24.0' y='318.0' width='400.0' height='34.0' rx='6' fill='#fff1f0' stroke='#f5c2c0' stroke-width='1' opacity='1'/><text x='36' y='340' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>yield return new WaitForSeconds(0.2f)</text><line x1='428' y1='335' x2='436.0' y2='335.0' stroke='#57606a' stroke-width='2'/><polygon points='446,335 436.0,329.0 436.0,341.0' fill='#57606a'/><rect x='450.0' y='318.0' width='386.0' height='34.0' rx='6' fill='#dafbe1' stroke='#a6dcb3' stroke-width='1' opacity='1'/><text x='462' y='340' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>cache one WaitForSeconds and reuse it</text><rect x='24.0' y='360.0' width='400.0' height='34.0' rx='6' fill='#fff1f0' stroke='#f5c2c0' stroke-width='1' opacity='1'/><text x='36' y='382' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>foreach over IEnumerable&lt;T&gt;</text><line x1='428' y1='377' x2='436.0' y2='377.0' stroke='#57606a' stroke-width='2'/><polygon points='446,377 436.0,371.0 436.0,383.0' fill='#57606a'/><rect x='450.0' y='360.0' width='386.0' height='34.0' rx='6' fill='#dafbe1' stroke='#a6dcb3' stroke-width='1' opacity='1'/><text x='462' y='382' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>foreach over List&lt;T&gt; (struct enumerator)</text><text x='24' y='420' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Check with the Profiler's GC Alloc column in a development build on the device, not only in the Editor.</text></svg>