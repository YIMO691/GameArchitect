<svg xmlns='http://www.w3.org/2000/svg' width='860' height='486' viewBox='0 0 860 486' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>The spiral of death, and how cheap steps escape it</title><rect x='0.5' y='0.5' width='859' height='485' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>The spiral of death, and how cheap steps escape it</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Frames after an autosave hitch. Rest of the frame 14 ms; each block is one physics step.</text><line x1='566.6' x2='566.6' y1='84' y2='420' stroke='#1a7f37' stroke-width='2.5' stroke-dasharray='6 4'/><text x='566.625' y='436' font-size='12' fill='#1a7f37' font-weight='700' text-anchor='middle'>33.33 ms</text><text x='24' y='100' font-size='14' fill='#cf222e' font-weight='700' text-anchor='start'>Steps of 9.50 ms: never recovers</text><text x='24' y='130' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>+1</text><rect x='150.0' y='112.0' width='175.0' height='28.0' rx='3' fill='#d0d7de' stroke='none' stroke-width='1' opacity='1'/><text x='237.5' y='131' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>other 14</text><rect x='325.0' y='112.0' width='118.8' height='28.0' rx='0' fill='#f28e2b' stroke='#ffffff' stroke-width='1' opacity='1'/><rect x='443.8' y='112.0' width='118.8' height='28.0' rx='0' fill='#f5a35c' stroke='#ffffff' stroke-width='1' opacity='1'/><rect x='562.5' y='112.0' width='118.8' height='28.0' rx='0' fill='#f28e2b' stroke='#ffffff' stroke-width='1' opacity='1'/><text x='689.25' y='131' font-size='12.5' fill='#cf222e' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>3 steps · 42.50 ms</text><text x='24' y='170' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>+2</text><rect x='150.0' y='152.0' width='175.0' height='28.0' rx='3' fill='#d0d7de' stroke='none' stroke-width='1' opacity='1'/><text x='237.5' y='171' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>other 14</text><rect x='325.0' y='152.0' width='118.8' height='28.0' rx='0' fill='#f28e2b' stroke='#ffffff' stroke-width='1' opacity='1'/><rect x='443.8' y='152.0' width='118.8' height='28.0' rx='0' fill='#f5a35c' stroke='#ffffff' stroke-width='1' opacity='1'/><rect x='562.5' y='152.0' width='118.8' height='28.0' rx='0' fill='#f28e2b' stroke='#ffffff' stroke-width='1' opacity='1'/><text x='689.25' y='171' font-size='12.5' fill='#cf222e' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>3 steps · 42.50 ms</text><text x='24' y='210' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>+3</text><rect x='150.0' y='192.0' width='175.0' height='28.0' rx='3' fill='#d0d7de' stroke='none' stroke-width='1' opacity='1'/><text x='237.5' y='211' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>other 14</text><rect x='325.0' y='192.0' width='118.8' height='28.0' rx='0' fill='#f28e2b' stroke='#ffffff' stroke-width='1' opacity='1'/><rect x='443.8' y='192.0' width='118.8' height='28.0' rx='0' fill='#f5a35c' stroke='#ffffff' stroke-width='1' opacity='1'/><rect x='562.5' y='192.0' width='118.8' height='28.0' rx='0' fill='#f28e2b' stroke='#ffffff' stroke-width='1' opacity='1'/><text x='689.25' y='211' font-size='12.5' fill='#cf222e' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>3 steps · 42.50 ms</text><text x='24' y='248' font-size='14' fill='#1a7f37' font-weight='700' text-anchor='start'>Steps of 1.49 ms: recovers in one frame</text><text x='24' y='278' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>+1</text><rect x='150.0' y='260.0' width='175.0' height='28.0' rx='3' fill='#d0d7de' stroke='none' stroke-width='1' opacity='1'/><text x='237.5' y='279' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>other 14</text><rect x='325.0' y='260.0' width='18.6' height='28.0' rx='0' fill='#4e79a7' stroke='#ffffff' stroke-width='1' opacity='1'/><rect x='343.6' y='260.0' width='18.6' height='28.0' rx='0' fill='#6b93bd' stroke='#ffffff' stroke-width='1' opacity='1'/><rect x='362.3' y='260.0' width='18.6' height='28.0' rx='0' fill='#4e79a7' stroke='#ffffff' stroke-width='1' opacity='1'/><text x='388.94999999999993' y='279' font-size='12.5' fill='#1a7f37' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>3 steps · 18.48 ms</text><text x='24' y='318' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>+2</text><rect x='150.0' y='300.0' width='175.0' height='28.0' rx='3' fill='#d0d7de' stroke='none' stroke-width='1' opacity='1'/><text x='237.5' y='319' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>other 14</text><rect x='325.0' y='300.0' width='18.6' height='28.0' rx='0' fill='#4e79a7' stroke='#ffffff' stroke-width='1' opacity='1'/><rect x='343.6' y='300.0' width='18.6' height='28.0' rx='0' fill='#6b93bd' stroke='#ffffff' stroke-width='1' opacity='1'/><text x='370.29999999999995' y='319' font-size='12.5' fill='#1a7f37' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>2 steps · 16.98 ms</text><text x='24' y='358' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>+3</text><rect x='150.0' y='340.0' width='175.0' height='28.0' rx='3' fill='#d0d7de' stroke='none' stroke-width='1' opacity='1'/><text x='237.5' y='359' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>other 14</text><rect x='325.0' y='340.0' width='18.6' height='28.0' rx='0' fill='#4e79a7' stroke='#ffffff' stroke-width='1' opacity='1'/><rect x='343.6' y='340.0' width='18.6' height='28.0' rx='0' fill='#6b93bd' stroke='#ffffff' stroke-width='1' opacity='1'/><text x='370.29999999999995' y='359' font-size='12.5' fill='#1a7f37' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>2 steps · 16.98 ms</text><text x='24' y='462' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>Steps needed = last frame ÷ 16.67 ms, rounded up. A 42.50 ms frame needs 3 again; an 18.48 ms frame needs 2.</text></svg>