<svg xmlns='http://www.w3.org/2000/svg' width='880' height='470' viewBox='0 0 880 470' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Replay timeline with a snapshot every 30 s: seek to 8:46 takes 66.6 s from the start, or 2.0 s from the 8:30 snapshot</title><defs><marker id='mink' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#1f2328'/></marker><marker id='mred' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#cf222e'/></marker><marker id='mgrn' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#1a7f37'/></marker><marker id='mblue' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#4e79a7'/></marker></defs><rect x='0.5' y='0.5' width='879' height='469' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' fill='#1f2328' font-weight='bold' text-anchor='start' >Seeking a 10-minute replay to the bug at 8:46</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start' >A replay must simulate every tick (2.11 ms each in fast-forward). Snapshots let it start closer.</text><rect x='40' y='160' width='800' height='22' rx='4' fill='#eaf1fb' stroke='#4e79a7'/><rect x='37.0' y='152' width='6' height='38' rx='2' fill='#1a7f37'/><rect x='77.0' y='152' width='6' height='38' rx='2' fill='#1a7f37'/><rect x='117.0' y='152' width='6' height='38' rx='2' fill='#1a7f37'/><rect x='157.0' y='152' width='6' height='38' rx='2' fill='#1a7f37'/><rect x='197.0' y='152' width='6' height='38' rx='2' fill='#1a7f37'/><rect x='237.0' y='152' width='6' height='38' rx='2' fill='#1a7f37'/><rect x='277.0' y='152' width='6' height='38' rx='2' fill='#1a7f37'/><rect x='317.0' y='152' width='6' height='38' rx='2' fill='#1a7f37'/><rect x='357.0' y='152' width='6' height='38' rx='2' fill='#1a7f37'/><rect x='397.0' y='152' width='6' height='38' rx='2' fill='#1a7f37'/><rect x='437.0' y='152' width='6' height='38' rx='2' fill='#1a7f37'/><rect x='477.0' y='152' width='6' height='38' rx='2' fill='#1a7f37'/><rect x='517.0' y='152' width='6' height='38' rx='2' fill='#1a7f37'/><rect x='557.0' y='152' width='6' height='38' rx='2' fill='#1a7f37'/><rect x='597.0' y='152' width='6' height='38' rx='2' fill='#1a7f37'/><rect x='637.0' y='152' width='6' height='38' rx='2' fill='#1a7f37'/><rect x='677.0' y='152' width='6' height='38' rx='2' fill='#1a7f37'/><rect x='717.0' y='152' width='6' height='38' rx='2' fill='#1a7f37'/><rect x='757.0' y='152' width='6' height='38' rx='2' fill='#1a7f37'/><rect x='797.0' y='152' width='6' height='38' rx='2' fill='#1a7f37'/><text x='40.0' y='210' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle' >0:00</text><text x='120.0' y='210' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle' >1:00</text><text x='200.0' y='210' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle' >2:00</text><text x='280.0' y='210' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle' >3:00</text><text x='360.0' y='210' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle' >4:00</text><text x='440.0' y='210' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle' >5:00</text><text x='520.0' y='210' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle' >6:00</text><text x='600.0' y='210' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle' >7:00</text><text x='680.0' y='210' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle' >8:00</text><text x='760.0' y='210' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle' >9:00</text><text x='840.0' y='210' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle' >10:00</text><text x='40' y='120' font-size='13' fill='#1a7f37' font-weight='bold' text-anchor='start' >▮ = snapshot every 30 s (20 × 108.8 KB = 2.2 MB)</text><line x1='741.3' y1='146' x2='741.3' y2='196' stroke='#cf222e' stroke-width='3'/><text x='741.3' y='140' font-size='13' fill='#cf222e' font-weight='bold' text-anchor='middle' >🐦🎣 bug, 8:46</text><line x1='40' y1='250' x2='739.3' y2='250' stroke='#cf222e' stroke-width='3' marker-end='url(#mred)'/><text x='40' y='274' font-size='13.5' fill='#cf222e' font-weight='bold' text-anchor='start' >No snapshots: simulate 31,560 ticks × 2.11 ms = 66.6 s, every time you look</text><line x1='720.0' y1='320' x2='739.3' y2='320' stroke='#1a7f37' stroke-width='3' marker-end='url(#mgrn)'/><line x1='720.0' y1='190' x2='720.0' y2='320' stroke='#1a7f37' stroke-dasharray='3 3'/><text x='712.0' y='325' font-size='13' fill='#1a7f37' font-weight='bold' text-anchor='end' >load 8:30 snapshot</text><text x='712.0' y='344' font-size='13' fill='#1a7f37' font-weight='bold' text-anchor='end' >then 960 ticks × 2.11 ms = 2.0 s</text><rect x='24' y='360' width='262' height='64' rx='8' fill='#ffebe9' stroke='#cf222e'/><text x='38' y='384' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start' >Every tick's state</text><text x='38' y='410' font-size='20' fill='#cf222e' font-weight='bold' text-anchor='start' >3.9 GB</text><rect x='304' y='360' width='262' height='64' rx='8' fill='#dafbe1' stroke='#1a7f37'/><text x='318' y='384' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start' >Commands + checksums</text><text x='318' y='410' font-size='20' fill='#1a7f37' font-weight='bold' text-anchor='start' >24.1 KB</text><rect x='584' y='360' width='262' height='64' rx='8' fill='#dafbe1' stroke='#1a7f37'/><text x='598' y='384' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start' >+ 20 snapshots</text><text x='598' y='410' font-size='20' fill='#1a7f37' font-weight='bold' text-anchor='start' >+ 2.2 MB</text><text x='24' y='446' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start' >Replay file for 10 