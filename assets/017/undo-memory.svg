ont-weight='bold' text-anchor='start' >9 times over budget ❌</text><text x='430' y='96' font-size='15' fill='#1a7f37' font-weight='bold' text-anchor='start' >Commands: 0.53 MB ✅</text><rect x='430' y='110' width='30' height='30' rx='3' fill='#ffffff' stroke='#cf222e' stroke-width='0.8' stroke-dasharray='3 2'/><rect x='430' y='130.9' width='9.1' height='9.1' fill='#1a7f37'/><text x='470' y='122' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start' >All 100 commands together:</text><text x='470' y='140' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start' >9% of ONE snapshot (dashed box).</text><text x='430' y='180' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start' >Where the 532,960 bytes go</text><rect x='430.0' y='190' width='378.3' height='34' fill='#e5534b'/><rect x='808.3' y='190' width='38.1' height='34' fill='#4e79a7'/><rect x='846.5' y='190' width='3.5' height='34' fill='#b07aa1'/><rect x='430' y='190' width='420' height='34' fill='none' stroke='#1f2328' stroke-width='0.8'/><text x='438' y='212' font-size='13' fill='#ffffff' font-weight='bold' text-anchor='start' >5 Clear area: 480,080 B (90%)</text><rect x='430' y='239' width='12' height='12' fill='#e5534b'/><text x='450' y='250' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start' >5 × Clear area (2,000 objects each): 5 × 96,016 = 480,080 B</text><rect x='430' y='263' width='12' height='12' fill='#4e79a7'/><text x='450' y='274' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start' >25 × Brush (40 sea grass each): 25 × 1,936 = 48,400 B</text><rect x='430' y='287' width='12' height='12' fill='#b07aa1'/><text x='450' y='298' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start' >70 × Place rock: 70 × 64 = 4,480 B</text><text x='430' y='332' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start' >→ Cap the history by bytes, not by count.</text><text x='430' y='354' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start' >100 clears ≈ 9.6 MB; 100 rocks = 6.4 KB.</text><text x='24' y='528' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start' >Snapshots copy everything, whatever the edit. Commands remember only what they changed.</text></svg>