<svg xmlns='http://www.w3.org/2000/svg' width='868' height='482' viewBox='0 0 868 482' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>The slowest stage sets the frame</title><rect x='0.5' y='0.5' width='867' height='481' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>The slowest stage sets the frame</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Pipelined stages work on different frames at once, so the frame takes as long as the slowest one.</text><text x='24' y='118' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>As captured</text><rect x='240.0' y='84.0' width='286.0' height='16.0' rx='3' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><text x='232' y='97' font-size='11.5' fill='#57606a' font-weight='600' text-anchor='end'>Game</text><text x='532' y='97' font-size='11.5' fill='#1f2328' font-weight='700' text-anchor='start'>22</text><rect x='240.0' y='104.0' width='156.0' height='16.0' rx='3' fill='#b07aa1' stroke='none' stroke-width='1' opacity='0.45'/><text x='232' y='117' font-size='11.5' fill='#57606a' font-weight='600' text-anchor='end'>Render</text><text x='402' y='117' font-size='11.5' fill='#1f2328' font-weight='400' text-anchor='start'>12</text><rect x='240.0' y='124.0' width='182.0' height='16.0' rx='3' fill='#f28e2b' stroke='none' stroke-width='1' opacity='0.45'/><text x='232' y='137' font-size='11.5' fill='#57606a' font-weight='600' text-anchor='end'>GPU</text><text x='428' y='137' font-size='11.5' fill='#1f2328' font-weight='400' text-anchor='start'>14</text><text x='566' y='110' font-size='13.5' fill='#cf222e' font-weight='700' text-anchor='start'>22 ms · 45 fps</text><text x='566' y='128' font-size='12' fill='#57606a' font-weight='600' text-anchor='start'>game-bound</text><text x='24' y='200' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>Lower resolution</text><rect x='240.