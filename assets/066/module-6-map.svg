<svg xmlns='http://www.w3.org/2000/svg' width='860' height='464' viewBox='0 0 860 464' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Module 6 on one page</title><rect x='0.5' y='0.5' width='859' height='463' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Module 6 on one page</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Nine lessons on devices, platforms and the team. Each one has a rule and a number to remember.</text><text x='24' y='100' font-size='13' fill='#4e79a7' font-weight='700' text-anchor='start'>Device limits</text><rect x='170.0' y='84.0' width='218.0' height='64.0' rx='8' fill='#ffffff' stroke='#4e79a7' stroke-width='1.6' opacity='1'/><text x='180' y='104' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start'>057 · Memory</text><text x='180' y='122' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>budget the peak, per device</text><text x='180' y='139' font-size='11.5' fill='#4e79a7' font-weight='700' text-anchor='start'>2 killed → all under 90%</text><rect x='396.0' y='84.0' width='218.0' height='64.0' rx='8' fill='#ffffff' stroke='#4e79a7' stroke-width='1.6' opacity='1'/><text x='406' y='104' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start'>058 · Heat and battery</text><text x='406' y='122' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>energy per frame, adapt early</text><text x='406' y='139' font-size='11.5' fill='#4e79a7' font-weight='700' text-anchor='start'>8 min → 60 fps all hour</text><text x='24' y='178' font-size='13' fill='#b07aa1' font-weight='700' text-anchor='start'>Smooth frames</text><rect x='170.0' y='162.0' width='218.0' height='64.0' rx='8' fill='#ffffff' stroke='#b07aa1' stroke-width='1.6' opacity='1'/><text x='180' y='182' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start'>059 · Frame pacing</text><text x='180' y='200' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>VSync, slice work, display time</text><text x='180' y='217' font-size='11.5' fill='#b07aa1' font-weight='700' text-anchor='start'>14 repeats → 0</text><rect x='396.0' y='162.0' width='218.0' height='64.0' rx='8' fill='#ffffff' stroke='#b07aa1' stroke-width='1.6' opacity='1'/><text x='406' y='182' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start'>060 · Shader compiles</text><text x='406' y='200' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>recorded list + fallback</text><text x='406' y='217' font-size='11.5' fill='#b07aa1' font-weight='700' text-anchor='start'>40 hitches → 0</text><text x='24' y='256' font-size='13' fill='#cf222e' font-weight='700' text-anchor='start'>Shipping</text><rect x='170.0' y='240.0' width='218.0' height='64.0' rx='8' fill='#ffffff' stroke='#cf222e' stroke-width='1.6' opacity='1'/><text x='180' y='260' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start'>061 · Certification</text><text x='180' y='278' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>platform layer + pre-cert</text><text x='180' y='295' font-size='11.5' fill='#cf222e' font-weight='700' text-anchor='start'>56 → 19 days</text><rect x='396.0' y='240.0' width='218.0' height='64.0' rx='8' fill='#ffffff' stroke='#cf222e' stroke-width='1.6' opacity='1'/><text x='406' y='260' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start'>064 · Crashes</text><text x='406' y='278' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>symbols, top frame, context</text><text x='406' y='295' font-size='11.5' fill='#cf222e' font-weight='700' text-anchor='start'>1.8% → 0.56%</text><text x='24' y='334' font-size='13' fill='#59a14f' font-weight='700' text-anchor='start'>Team process</text><rect x='170.0' y='318.0' width='218.0' height='64.0' rx='8' fill='#ffffff' stroke='#59a14f' stroke-width='1.6' opacity='1'/><text x='180' y='338' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start'>062 · Budgets</text><text x='180' y='356' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>owner per system, CI daily</text><text x='180' y='373' font-size='11.5' fill='#59a14f' font-weight='700' text-anchor='start'>6 releases over → 0</text><rect x='396.0' y='318.0' width='218.0' height='64.0' rx='8' fill='#ffffff' stroke='#59a14f' stroke-width='1.6' opacity='1'/><text x='406' y='338' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start'>063 · Perf tests</text><text x='406' y='356' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>quiet test, then statistics</text><text x='406' y='373' font-size='11.5' fill='#59a14f' font-weight='700' text-anchor='start'>7 false alarms → 0</text><rect x='622.0' y='318.0' width='218.0' height='64.0' rx='8' fill='#ffffff' stroke='#59a14f' stroke-width='1.6' opacity='1'/><text x='632' y='338' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start'>065 · Tech debt</text><text x='632' y='356' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>tests first, piece by piece</text><text x='632' y='373' font-size='11.5' fill='#59a14f' font-weight='700' text-anchor='start'>38 → 72 lures</text><rect x='24.0' y='400.0' width='812.0' height='44.0' rx='8' fill='#fff8e6' stroke='#d4a72c' stroke-width='1.5' opacity='1'/><text x='40' y='427' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>The common thread: measure on the real device, and turn every fix into a check that runs on every build.</text></svg>