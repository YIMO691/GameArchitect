<svg xmlns='http://www.w3.org/2000/svg' width='860' height='410' viewBox='0 0 860 410' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>A performance test you can trust</title><rect x='0.5' y='0.5' width='859' height='409' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>A performance test you can trust</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>What runs after every build of the Reef, on a dedicated test PC and a dedicated phone.</text><rect x='24.0' y='90.0' width='122.0' height='56.0' rx='8' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1.5' opacity='1'/><text x='85.0' y='115' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='middle'>Build</text><text x='85.0' y='133' font-size='11' fill='#57606a' font-weight='400' text-anchor='middle'>from CI</text><line x1='147' y1='118' x2='151.0' y2='118.0' stroke='#9aa0a6' stroke-width='2'/><polygon points='161,118 151.0,112.0 151.0,124.0' fill='#9aa0a6'/><rect x='162.0' y='90.0' width='122.0' height='56.0' rx='8' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1.5' opacity='1'/><text x='223.0' y='115' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='middle'>Deploy</text><text x='223.0' y='133' font-size='11' fill='#57606a' font-weight='400' text-anchor='middle'>to test device</text><line x1='285' y1='118' x2='289.0' y2='118.0' stroke='#9aa0a6' stroke-width='2'/><polygon points='299,118 289.0,112.0 289.0,124.0' fill='#9aa0a6'/><rect x='300.0' y='90.0' width='122.0' height='56.0' rx='8' fill='#fdf0e2' stroke='#f28e2b' stroke-width='1.5' opacity='1'/><text x='361.0' y='115' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='middle'>Warm up</text><text x='361.0' y='133' font-size='11' fill='#57606a' font-weight='400' text-anchor='middle'>10 s, not measured</text><line x1='423' y1='118' x2='427.0' y2='118.0' stroke='#9aa0a6' stroke-width='2'/><polygon points='437,118 427.0,112.0 427.0,124.0' fill='#9aa0a6'/><rect x='438.0' y='90.0' width='122.0' height='56.0' rx='8' fill='#eaf1fb' stroke='#4e79a7' stroke-width='1.5' opacity='1'/><text x='499.0' y='115' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='middle'>Measure</text><text x='499.0' y='133' font-size='11' fill='#57606a' font-weight='400' text-anchor='middle'>fixed path, 60 s</text><line x1='561' y1='118' x2='565.0' y2='118.0' stroke='#9aa0a6' stroke-width='2'/><polygon points='575,118 565.0,112.0 565.0,124.0' fill='#9aa0a6'/><rect x='576.0' y='90.0' width='122.0' height='56.0' rx='8' fill='#eaf1fb' stroke='#4e79a7' stroke-width='1.5' opacity='1'/><text x='637.0' y='115' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='middle'>Repeat</text><text x='637.0' y='133' font-size='11' fill='#57606a' font-weight='400' text-anchor='middle'>5 runs, median</text><line x1='699' y1='118' x2='703.0' y2='118.0' stroke='#9aa0a6' stroke-width='2'/><polygon points='713,118 703.0,112.0 703.0,124.0' fill='#9aa0a6'/><rect x='714.0' y='90.0' width='122.0' height='56.0' rx='8' fill='#e9f5e6' stroke='#59a14f' stroke-width='1.5' opacity='1'/><text x='775.0' y='115' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='middle'>Compare</text><text x='775.0' y='133' font-size='11' fill='#57606a' font-weight='400' text-anchor='middle'>last 10 builds</text><text x='24' y='180' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>The report, per system (Lesson 062), sent to owners:</text><rect x='24.0' y='192.0' width='812.0' height='138.0' rx='8' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><text x='40' y='214' font-family='Consolas, Menlo, monospace' font-size='13' fill='#57606a'>perf · build 4127 · test PC (fixed clocks) · harbour path · 5 runs</text><text x='40' y='234' font-family='Consolas, Menlo, monospace' font-size='13' fill='#57606a'>system      median   baseline   alarm at   result</text><text x='40' y='254' font-family='Consolas, Menlo, monospace' font-size='13' fill='#1f2328'>Rendering   5.60     5.60       5.85       ok</text><text x='40' y='274' font-family='Consolas, Menlo, monospace' font-size='13' fill='#cf222e'>Gameplay    3.63     3.22       3.47       OVER  → Omar · trace attached</text><text x='40' y='294' font-family='Consolas, Menlo, monospace' font-size='13' fill='#1f2328'>UI          1.20     1.20       1.45       ok</text><text x='40' y='314' font-family='Consolas, Menlo, monospace' font-size='13' fill='#cf222e'>total      14.71    14.30      14.55       OVER</text><rect x='24.0' y='346.0' width='812.0' height='44.0' rx='8' fill='#fff8e6' stroke='#d4a72c' stroke-width='1.5' opacity='1'/><text x='40' y='373' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>A flagged result comes with the evidence: which system, which commit, and a profiler capture.</text></svg>