<svg xmlns='http://www.w3.org/2000/svg' width='860' height='416' viewBox='0 0 860 416' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Signal against noise</title><rect x='0.5' y='0.5' width='859' height='415' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Signal against noise</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Typical spread of one result (±ms), against the real regression the test must see (0.4 ms).</text><line x1='458.0' y1='80' x2='458.0' y2='346' stroke='#4e79a7' stroke-width='2' stroke-dasharray='5 4'/><text x='458.0' y='78' font-size='12' fill='#4e79a7' font-weight='700' text-anchor='middle'>real regression: 0.4 ms</text><text x='24' y='114' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>Shared agent, free play, no warm-up</text><rect x='330.0' y='100.0' width='400.0' height='22.0' rx='4' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='738.0' y='116' font-size='12.5' fill='#cf222e' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>±1.25</text><text x='330' y='138' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>7 false alarms</text><text x='24' y='164' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>Dedicated machine</text><rect x='330.0' y='150.0' width='240.0' height='22.0' rx='4' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='578.0' y='166' font-size='12.5' fill='#cf222e' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>±0.75</text><text x='330' y='188' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>5 false alarms</text><text x='24' y='214' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>+ fixed camera path and seed</text><rect x='330.0' y='200.0' width='179.2' height='22.0' rx='4' fill='#f28e2b' stroke='none' stroke-width='1' opacity='1'/><text x='517.2' y='216' font-size='12.5' fill='#b35c00' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>±0.56</text><text x='330' y='238' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>5 false alarms, regression found late</text><text x='24' y='264' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>+ 10 s warm-up skipped</text><rect x='330.0' y='250.0' width='44.8' height='22.0' rx='4' fill='#1a7f37' stroke='none' stroke-width='1' opacity='1'/><text x='382.8' y='266' font-size='12.5' fill='#1a7f37' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>±0.14</text><text x='330' y='288' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>1 false alarm</text><text x='24' y='314' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>+ median of 5 runs</text><rect x='330.0' y='300.0' width='22.4' height='22.0' rx='4' fill='#1a7f37' stroke='none' stroke-width='1' opacity='1'/><text x='360.4' y='316' font-size='12.5' fill='#1a7f37' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>±0.07</text><text x='330' y='338' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>0 false alarms, found on build 14</text><rect x='24.0' y='352.0' width='812.0' height='44.0' rx='8' fill='#fff8e6' stroke='#d4a72c' stroke-width='1.5' opacity='1'/><text x='40' y='379' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>A test can only see changes bigger than its noise. Make it quiet first, then use statistics.</text></svg>