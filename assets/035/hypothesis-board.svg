 x='455.0' y='356' font-size='11.5' fill='#cf222e' font-weight='700' text-anchor='middle'>H1 refuted</text><text x='605.0' y='356' font-size='11.5' fill='#57606a' font-weight='700' text-anchor='middle'>H2 = H3: no information</text><text x='755.0' y='356' font-size='11.5' fill='#1a7f37' font-weight='700' text-anchor='middle'>H3: 24 ms · H2: 2 ms</text><rect x='24.0' y='376.0' width='812.0' height='34.0' rx='8' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><text x='40' y='398' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>Before each test, ask: do the hypotheses still in play predict different numbers? Only Test 3 did.</text></svg>