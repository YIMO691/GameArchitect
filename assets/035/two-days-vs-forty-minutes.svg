<svg xmlns='http://www.w3.org/2000/svg' width='860' height='356' viewBox='0 0 860 356' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Two days vs forty minutes</title><rect x='0.5' y='0.5' width='859' height='355' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Two days vs forty minutes</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Same bug, same team. Haul frame on the phone, main thread, during the investigation.</text><text x='24' y='100' font-size='16' fill='#cf222e' font-weight='700' text-anchor='start'>Profile and see</text><rect x='24.0' y='112.0' width='400.0' height='48.0' rx='6' fill='#ffebe9' stroke='#cf222e' stroke-width='1' opacity='1'/><text x='36' y='132' font-size='13' fill='#cf222e' font-weight='700' text-anchor='start'>Day 1</text><text x='36' y='150' font-size='11.5' fill='#1f2328' font-weight='400' text-anchor='start'>Deep Profile in the editor: 160 ms, 2,400 markers</text><rect x='430.0' y='112.0' width='400.0' height='48.0' rx='6' fill='#ffebe9' stroke='#cf222e' stroke-width='1' opacity='1'/><text x='442' y='132' font-size='13' fill='#cf222e' font-weight='700' text-anchor='start'>Day 2</text><text x='442' y='150' font-size='11.5' fill='#1f2328' font-weight='400' text-anchor='start'>Fix the top 5 rows: Fish.Update, NetRope, string.Format…</text><text x='24' y='184' font-size='13' fill='#cf222e' font-weight='700' text-anchor='start'>Haul frame: 40.0 ms → 40.0 ms. Every fix real, none of them the cause.</text><text x='24' y='228' font-size='16' fill='#1a7f37' font-weight='700' text-anchor='start'>Hypotheses first</text><rect x='24.0' y='240.0' width='130.0' height='40.0' rx='0' fill='#d4a72c' stroke='#ffffff' stroke-width='1' opacity='1'/><text x='89.0' y='258' font-size='11.5' fill='#ffffff' font-weight='700' text-anchor='middle'>Write H1–H3</text><text x='89.0' y='273' font-size='11' fill='#ffffff' font-weight='400' text-anchor='middle'>10 min</text><rect x='154.0' y='240.0' width='65.0' height='40.0' rx='0' fill='#cf222e' stroke='#ffffff' stroke-width='1' opacity='1'/><text x='186.5' y='258' font-size='11.5' fill='#ffffff' font-weight='700' text-anchor='middle'>GC test</text><text x='186.5' y='273' font-size='11' fill='#ffffff' font-weight='400' text-anchor='middle'>5 min</text><rect x='219.0' y='240.0' width='130.0' height='40.0' rx='0' fill='#9aa0a6' stroke='#ffffff' stroke-width='1' opacity='1'/><text x='284.0' y='258' font-size='11.5' fill='#ffffff' font-weight='700' text-anchor='middle'>150 fish</text><text x='284.0' y='273' font-size='11' fill='#ffffff' font-weight='400' text-anchor='middle'>10 min</text><rect x='349.0' y='240.0' width='65.0' height='40.0' rx='0' fill='#1a7f37' stroke='#ffffff' stroke-width='1' opacity='1'/><text x='381.5' y='258' font-size='11.5' fill='#ffffff' font-weight='700' text-anchor='middle'>UI off</text><text x='381.5' y='273' font-size='11' fill='#ffffff' font-weight='400' text-anchor='middle'>5 min</text><rect x='414.0' y='240.0' width='130.0' height='40.0' rx='0' fill='#4e79a7' stroke='#ffffff' stroke-width='1' opacity='1'/><text x='479.0' y='258' font-size='11.5' fill='#ffffff' font-weight='700' text-anchor='middle'>Confirm on phone</text><text x='479.0' y='273' font-size='11' fill='#ffffff' font-weight='400' text-anchor='middle'>10 min</text><text x='556.0' y='258' font-size='13' fill='#1a7f37' font-weight='700' text-anchor='start'>cause found</text><text x='556.0' y='274' font-size='13' fill='#1a7f37' font-weight='700' text-anchor='start'>after 40 min</text><text x='89.0' y='298' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>40.0</text><text x='186.5' y='298' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>40.0</text><text x='284.0' y='298' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>27.0</text><text x='381.5' y='298' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>16.0</text><text x='479.0' y='298' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>40.0 split</text><text x='24' y='330' font-size='13' fill='#1a7f37' font-weight='700' text-anchor='start'>Then an afternoon for the fix: 12 pooled icons. Predicted 14 + 2 + 0.72 + 0.24 = 16.96 ms. Measured: 16.96 ms.</text></svg>