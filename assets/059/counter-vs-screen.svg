<svg xmlns='http://www.w3.org/2000/svg' width='860' height='440' viewBox='0 0 860 440' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Same counter, different screen</title><rect x='0.5' y='0.5' width='859' height='439' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Same counter, different screen</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Ten refreshes of a 60 Hz screen (167 ms). Each box is one refresh; the number is the frame it shows.</text><text x='24' y='106' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>Sleep cap 60, no VSync</text><text x='24' y='124' font-size='12' fill='#cf222e' font-weight='700' text-anchor='start'>counter: 60 fps</text><rect x='300.0' y='90.0' width='46.0' height='36.0' rx='5' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><text x='323.0' y='113' font-size='14' fill='#1f2328' font-weight='700' text-anchor='middle'>1</text><rect x='352.0' y='90.0' width='46.0' height='36.0' rx='5' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><text x='375.0' y='113' font-size='14' fill='#1f2328' font-weight='700' text-anchor='middle'>2</text><line x1='376' y1='86' x2='376' y2='130' stroke='#cf222e' stroke-width='2' stroke-dasharray='4 3'/><rect x='404.0' y='90.0' width='46.0' height='36.0' rx='5' fill='#fde2e1' stroke='#cf222e' stroke-width='1.5' opacity='1'/><text x='427.0' y='113' font-size='14' fill='#cf222e' font-weight='700' text-anchor='middle'>2</text><rect x='456.0' y='90.0' width='46.0' height='36.0' rx='5' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><text x='479.0' y='113' font-size='14' fill='#1f2328' font-weight='700' text-anchor='middle'>4</text><rect x='508.0' y='90.0' width='46.0' height='36.0' rx='5' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><text x='531.0' y='113' font-size='14' fill='#1f2328' font-weight='700' text-anchor='middle'>5</text><line x1='532' y1='86' x2='532' y2='130' stroke='#cf222e' stroke-width='2' stroke-dasharray='4 3'/><rect x='560.0' y='90.0' width='46.0' height='36.0' rx='5' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><text x='583.0' y='113' font-size='14' fill='#1f2328' font-weight='700' text-anchor='middle'>6</text><rect x='612.0' y='90.0' width='46.0' height='36.0' rx='5' fill='#fde2e1' stroke='#cf222e' stroke-width='1.5' opacity='1'/><text x='635.0' y='113' font-size='14' fill='#cf222e' font-weight='700' text-anchor='middle'>6</text><line x1='630' y1='86' x2='630' y2='130' stroke='#cf222e' stroke-width='2' stroke-dasharray='4 3'/><rect x='664.0' y='90.0' width='46.0' height='36.0' rx='5' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><text x='687.0' y='113' font-size='14' fill='#1f2328' font-weight='700' text-anchor='middle'>8</text><rect x='716.0' y='90.0' width='46.0' height='36.0' rx='5' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><text x='739.0' y='113' font-size='14' fill='#1f2328' font-weight='700' text-anchor='middle'>9</text><line x1='746' y1='86' x2='746' y2='130' stroke='#cf222e' stroke-width='2' stroke-dasharray='4 3'/><rect x='768.0' y='90.0' width='46.0' height='36.0' rx='5' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><text x='791.0' y='113' font-size='14' fill='#1f2328' font-weight='700' text-anchor='middle'>10</text><text x='300' y='146' font-size='12' fill='#cf222e' font-weight='600' text-anchor='start'>red box: same frame again  ·  frames 3 and 7 never shown whole; every frame tears</text><text x='24' y='192' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>VSync, reflection every 4th frame</text><text x='24' y='210' font-size='12' fill='#f28e2b' font-weight='700' text-anchor='start'>counter: 48 fps</text><rect x='300.0' y='176.0' width='46.0' height='36.0' rx='5' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><text x='323.0' y='199' font-size