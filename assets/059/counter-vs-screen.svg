' font-size='14' fill='#1f2328' font-weight='700' text-anchor='middle'>8</text><text x='300' y='232' font-size='12' fill='#b35c00' font-weight='600' text-anchor='start'>red box: same frame again  ·  frames 4 and 8 miss their refresh: the old frame stays 33.3 ms</text><text x='24' y='278' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>VSync, time-sliced, paced delta time</text><text x='24' y='296' font-size='12' fill='#1a7f37' font-weight='700' text-anchor='start'>counter: 60 fps</text><rect x='300.0' y='262.0' width='46.0' height='36.0' rx='5' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><text x='323.0' y='285' font-size='14' fill='#1f2328' font-weight='700' text-anchor='middle'>1</text><rect x='352.0' y='262.0' width='46.0' height='36.0' rx='5' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><text x='375.0' y='285' font-size='14' fill='#1f2328' font-weight='700' text-anchor='middle'>2</text><rect x='404.0' y='262.0' width='46.0' height='36.0' rx='5' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><text x='427.0' y='285' font-size='14' fill='#1f2328' font-weight='700' text-anchor='middle'>3</text><rect x='456.0' y='262.0' width='46.0' height='36.0' rx='5' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><text x='479.0' y='285' font-size='14' fill='#1f2328' font-weight='700' text-anchor='middle'>4</text><rect x='508.0' y='262.0' width='46.0' height='36.0' rx='5' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><text x='531.0' y='285' font-size='14' fill='#1f2328' font-weight='700' text-anchor='middle'>5</text><rect x='560.0' y='262.0' width='46.0' height='36.0' rx='5' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><text x='583.0' y='285' font-size='14' fill='#1f2328' font-weight='700' text-anchor='middle'>6</text><rect x='612.0' y='262.0' width='46.0' height='36.0' rx='5' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><text x='635.0' y='285' fon