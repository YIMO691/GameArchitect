<svg xmlns='http://www.w3.org/2000/svg' width='860' height='404' viewBox='0 0 860 404' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Delta time decides how smooth motion looks</title><rect x='0.5' y='0.5' width='859' height='403' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Delta time decides how smooth motion looks</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>The camera pans at a steady speed. Dots: where it is drawn on each refresh. Refreshes are exactly 16.7 ms apart.</text><text x='24' y='116' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>Measured delta time</text><text x='24' y='134' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>CPU clock at frame start</text><line x1='300' y1='112' x2='801.0' y2='112' stroke='#d0d7de' stroke-width='2'/><line x1='300.0' y1='98' x2='300.0' y2='126' stroke='#9aa0a6' stroke-dasharray='2 2'/><line x1='350.1' y1='98' x2='350.1' y2='126' stroke='#9aa0a6' stroke-dasharray='2 2'/><line x1='400.2' y1='98' x2='400.2' y2='126' stroke='#9aa0a6' stroke-dasharray='2 2'/><line x1='450.3' y1='98' x2='450.3' y2='126' stroke='#9aa0a6' stroke-dasharray='2 2'/><line x1='500.4' y1='98' x2='500.4' y2='126' stroke='#9aa0a6' stroke-dasharray='2 2'/><line x1='550.5' y1='98' x2='550.5' y2='126' stroke='#9aa0a6' stroke-dasharray='2 2'/><line x1='600.6' y1='98' x2='600.6' y2='126' stroke='#9aa0a6' stroke-dasharray='2 2'/><line x1='650.7' y1='98' x2='650.7' y2='126' stroke='#9aa0a6' stroke-dasharray='2 2'/><line x1='700.8' y1='98' x2='700.8' y2='126' stroke='#9aa0a6' stroke-dasharray='2 2'/><line x1='750.9' y1='98' x2='750.9' y2='126' stroke='#9aa0a6' stroke-dasharray='2 2'/><circle cx='300.0' cy='112' r='7' fill='#4e79a7'/><circle cx='350.1' cy='112' r='7' fill='#4e79a7'/><circle cx='395.7' cy='112' r='7' fill='#cf222e'/><circle cx='450.9' cy='112' r='7' fill='#4e79a7'/><circle cx='499.2' cy='112' r='7' fill='#4e79a7'/><circle cx='543.9' cy='112' r='7' fill='#cf222e'/><circle cx='599.7' cy='112' r='7' fill='#4e79a7'/><circle cx='650.4' cy='112' r='7' fill='#4e79a7'/><circle cx='696.9' cy='112' r='7' fill='#cf222e'/><circle cx='750.3' cy='112' r='7' fill='#4e79a7'/><text x='300' y='148' font-size='12' fill='#cf222e' font-weight='600' text-anchor='start'>dt = 15.2, 18.4, 16.1, 14.9 ... ms: the camera jumps, though every refresh is on time</text><text x='24' y='200' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>Paced delta time</text><text x='24' y='218' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>time between the refreshes</text><line x1='300' y1='196' x2='801.0' y2='196' stroke='#d0d7de' stroke-width='2'/><line x1='300.0' y1='182' x2='300.0' y2='210' stroke='#9aa0a6' stroke-dasharray='2 2'/><line x1='350.1' y1='182' x2='350.1' y2='210' stroke='#9aa0a6' stroke-dasharray='2 2'/><line x1='400.2' y1='182' x2='400.2' y2='210' stroke='#9aa0a6' stroke-dasharray='2 2'/><line x1='450.3' y1='182' x2='450.3' y2='210' stroke='#9aa0a6' stroke-dasharray='2 2'/><line x1='500.4' y1='182' x2='500.4' y2='210' stroke='#9aa0a6' stroke-dasharray='2 2'/><line x1='550.5' y1='182' x2='550.5' y2='210' stroke='#9aa0a6' stroke-dasharray='2 2'/><line x1='600.6' y1='182' x2='600.6' y2='210' stroke='#9aa0a6' stroke-dasharray='2 2'/><line x1='650.7' y1='182' x2='650.7' y2='210' stroke='#9aa0a6' stroke-dasharray='2 2'/><line x1='700.8' y1='182' x2='700.8' y2='210' stroke='#9aa0a6' stroke-dasharray='2 2'/><line x1='750.9' y1='182' x2='750.9' y2='210' stroke='#9aa0a6' stroke-dasharray='2 2'/><circle cx='300.0' cy='196' r='7' fill='#1a7f37'/><circle cx='350.1' cy='196' r='7' fill='#1a7f37'/><circle cx='400.2' cy='196' r='7' fill='#1a7f37'/><circle cx='450.3' cy='196' r='7' fill='#1a7f37'/><circle cx='500.4' cy='196' r='7' fill='#1a7f37'/><circle cx='550.5' cy='196' r='7' fill='#1a7f37'/><circle cx='600.6' cy='196' r='7' fill='#1a7f37'/><circle cx='650.7' cy='196' r='7' fill='#1a7f37'/><circle cx='700.8' cy='196' r='7' fill='#1a7f37'/><circle cx='750.9' cy='196' r='7' fill='#1a7f37'/><text x='300' y='232' font-size='12' fill='#1a7f37' font-weight='600' text-anchor='start'>dt = 16.7 ms every frame: even steps, smooth pan</text><text x='300' y='262' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>grey dashes: refreshes, 16.7 ms apart  ·  red dot: more than 1 ms off where it should be</text><rect x='24.0' y='282.0' width='812.0' height='98.0' rx='8' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><text x='40' y='304' font-family='Consolas, Menlo, monospace' font-size='13' fill='#57606a'>// what the frame will be shown at, not when the CPU started it</text><text x='40' y='324' font-family='Consolas, Menlo, monospace' font-size='13' fill='#1f2328'>dt = displayInterval;      // 16.7 ms on a 60 Hz screen, if on time</text><text x='40' y='344' font-family='Consolas, Menlo, monospace' font-size='13' fill='#1f2328'>if (missedRefresh) dt = framesHeld * displayInterval;</text><text x='40' y='364' font-family='Consolas, Menlo, monospace' font-size='13' fill='#1f2328'>camera.position += panSpeed * dt;</text></svg>