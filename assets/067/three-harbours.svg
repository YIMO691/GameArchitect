<svg xmlns='http://www.w3.org/2000/svg' width='860' height='410' viewBox='0 0 860 410' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>One request, three harbours</title><rect x='0.5' y='0.5' width='859' height='409' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>One request, three harbours</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Two lines in chat. Each team answers the open questions its own way; the answers meet in week 4.</text><rect x='300.0' y='82.0' width='260.0' height='58.0' rx='8' fill='#fff8e6' stroke='#d4a72c' stroke-width='1.5' opacity='1'/><text x='430' y='106' font-size='13' fill='#1f2328' font-weight='600' text-anchor='middle'>"Add a harbour: dock, shop,</text><text x='430' y='126' font-size='13' fill='#1f2328' font-weight='600' text-anchor='middle'>show off boats. Handheld too."</text><line x1='430' y1='142' x2='169.9' y2='170.9' stroke='#4e79a7' stroke-width='2.5'/><polygon points='160,172 170.6,176.9 169.3,164.9' fill='#4e79a7'/><rect x='40.0' y='176.0' width='240.0' height='118.0' rx='8' fill='#ffffff' stroke='#4e79a7' stroke-width='1.6' opacity='1'/><text x='52' y='198' font-size='13' fill='#4e79a7' font-weight='700' text-anchor='start'>Gameplay team guesses</text><text x='52' y='222' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>• docking on the client</text><text x='52' y='244' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>• 40 boats on screen</text><text x='52' y='266' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>• new shop screen</text><line x1='160' y1='296' x2='420.1' y2='328.8' stroke='#4e79a7' stroke-width='2.5'/><polygon points='430,330 420.8,322.8 419.3,334.7' fill='#4e79a7'/><line x1='430' y1='142' x2='430.0' y2='162.0' stroke='#b07aa1' stroke-width='2.5'/><polygon points='430,172 436.0,162.0 424.0,162.0' fill='#b07aa1'/><rect x='310.0' y='176.0' width='240.0' height='118.0' rx='8' fill='#ffffff' stroke='#b07aa1' stroke-width='1.6' opacity='1'/><text x='322' y='198' font-size='13' fill='#b07aa1' font-weight='700' text-anchor='start'>Online team guesses</text><text x='322' y='222' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>• docking on the server</text><text x='322' y='244' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>• trading between players</text><text x='322' y='266' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>• no boat limit</text><line x1='430' y1='296' x2='430.0' y2='320.0' stroke='#b07aa1' stroke-width='2.5'/><polygon points='430,330 436.0,320.0 424.0,320.0' fill='#b07aa1'/><line x1='430' y1='142' x2='690.1' y2='170.9' stroke='#59a14f' stroke-width='2.5'/><polygon points='700,172 690.7,164.9 689.4,176.9' fill='#59a14f'/><rect x='580.0' y='176.0' width='240.0' height='118.0' rx='8' fill='#ffffff' stroke='#59a14f' stroke-width='1.6' opacity='1'/><text x='592' y='198' font-size='13' fill='#59a14f' font-weight='700' text-anchor='start'>UI team guesses</text><text x='592' y='222' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>• reuse the tackle shop</text><text x='592' y='244' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>• PC layout only</text><text x='592' y='266' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>• combat icons in HUD</text><line x1='700' y1='296' x2='439.9' y2='328.8' stroke='#59a14f' stroke-width='2.5'/><polygon points='430,330 440.7,334.7 439.2,322.8' fill='#59a14f'/><rect x='250.0' y='334.0' width='360.0' height='54.0' rx='8' fill='#fff1f0' stroke='#cf222e' stroke-width='1.6' opacity='1'/><text x='430' y='357' font-size='14' fill='#cf222e' font-weight='700' text-anchor='middle'>Week 4 integration: 12 surprises</text><text x='430' y='377' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='middle'>12 × 12 h = 144 hours of rework</text></svg>