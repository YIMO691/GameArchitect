<svg xmlns='http://www.w3.org/2000/svg' width='860' height='420' viewBox='0 0 860 420' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Five pages that settle twelve decisions</title><rect x='0.5' y='0.5' width='859' height='419' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Five pages that settle twelve decisions</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Five pages, decisions first. Every section settles questions a team would otherwise guess.</text><rect x='24.0' y='84.0' width='410.0' height='38.0' rx='6' fill='#ffffff' stroke='#1f2328' stroke-width='1.4' opacity='1'/><text x='36' y='108' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start'>1 · Goal</text><text x='160' y='108' font-size='11.5' fill='#1f2328' font-weight='400' text-anchor='start'>one paragraph: why players want it</text><text x='424' y='108' font-size='11.5' fill='#57606a' font-weight='600' text-anchor='end'>½ page</text><rect x='24.0' y='128.0' width='410.0' height='38.0' rx='6' fill='#ffffff' stroke='#4e79a7' stroke-width='1.4' opacity='1'/><text x='36' y='152' font-size='12.5' fill='#4e79a7' font-weight='700' text-anchor='start'>2 · Non-goals</text><text x='160' y='152' font-size='11.5' fill='#1f2328' font-weight='400' text-anchor='start'>no combat, no trading in 3.0</text><text x='424' y='152' font-size='11.5' fill='#57606a' font-weight='600' text-anchor='end'>¼ page</text><rect x='24.0' y='172.0' width='410.0' height='38.0' rx='6' fill='#ffffff' stroke='#4e79a7' stroke-width='1.4' opacity='1'/><text x='36' y='196' font-size='12.5' fill='#4e79a7' font-weight='700' text-anchor='start'>3 · The feature</text><text x='160' y='196' font-size='11.5' fill='#1f2328' font-weight='400' text-anchor='start'>where, 24 berths, dock/shop/show, 3.0</text><text x='424' y='196' font-size='11.5' fill='#57606a' font-weight='600' text-anchor='end'>1 page</text><rect x='24.0' y='216.0' width='410.0' height='38.0' rx='6' fill='#ffffff' stroke='#b07aa1' stroke-width='1.4' opacity='1'/><text x='36' y='240' font-size='12.5' fill='#b07aa1' font-weight='700' text-anchor='start'>4 · Interfaces</text><text x='160' y='240' font-size='11.5' fill='#1f2328' font-weight='400' text-anchor='start'>server docks boats; reuse the shop</text><text x='424' y='240' font-size='11.5' fill='#57606a' font-weight='600' text-anchor='end'>1 page</text><rect x='24.0' y='260.0' width='410.0' height='38.0' rx='6' fill='#ffffff' stroke='#b07aa1' stroke-width='1.4' opacity='1'/><text x='36' y='284' font-size='12.5' fill='#b07aa1' font-weight='700' text-anchor='start'>5 · Numbers</text><text x='160' y='284' font-size='11.5' fill='#1f2328' font-weight='400' text-anchor='start'>24 boats, 300 MB, 0.4 ms on handheld</text><text x='424' y='284' font-size='11.5' fill='#57606a' font-weight='600' text-anchor='end'>½ page</text><rect x='24.0' y='304.0' width='410.0' height='38.0' rx='6' fill='#ffffff' stroke='#59a14f' stroke-width='1.4' opacity='1'/><text x='36' y='328' font-size='12.5' fill='#59a14f' font-weight='700' text-anchor='start'>6 · Options</text><text x='160' y='328' font-size='11.5' fill='#1f2328' font-weight='400' text-anchor='start'>2 rejected options and why</text><text x='424' y='328' font-size='11.5' fill='#57606a' font-weight='600' text-anchor='end'>1 page</text><rect x='24.0' y='348.0' width='410.0' height='38.0' rx='6' fill='#ffffff' stroke='#59a14f' stroke-width='1.4' opacity='1'/><text x='36' y='372' font-size='12.5' fill='#59a14f' font-weight='700' text-anchor='start'>7 · Risks, tests</text><text x='160' y='372' font-size='11.5' fill='#1f2328' font-weight='400' text-anchor='start'>open questions; how we test it</text><text x='424' y='372' font-size='11.5' fill='#57606a' font-weight='600' text-anchor='end'>¾ page</text><text x='24' y='406' font-size='12' fill='#57606a' font-weight='600' text-anchor='start'>Reviewed by each owner: one 1-hour meeting.</text>