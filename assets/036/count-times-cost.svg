<svg xmlns='http://www.w3.org/2000/svg' width='860' height='344' viewBox='0 0 860 344' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Count the work before its price</title><rect x='0.5' y='0.5' width='859' height='343' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Count the work before its price</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Time per frame = how many times × cost each time. Minute 5, 1,500 fish visible.</text><text x='24' y='120' font-size='14' fill='#1f2328' font-weight='700' text-anchor='start'>List + Equals</text><rect x='250.0' y='104.0' width='220.0' height='24.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='478' y='121' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='start'>1,125,000 compares</text><text x='720' y='121' font-size='13' fill='#1f2328' font-weight='600' text-anchor='end'>× 8 ns</text><text x='836' y='121' font-size='14' fill='#cf222e' font-weight='700' text-anchor='end'>= 9.00 ms</text><text x='24' y='170' font-size='14' fill='#1f2328' font-weight='700' text-anchor='start'>List, tuned (a week)</text><rect x='250.0' y='154.0' width='220.0' height='24.0' rx='3' fill='#f28e2b' stroke='none' stroke-width='1' opacity='1'/><text x='478' y='171' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='start'>1,125,000 compares</text><text x='720' y='171' font-size='13' fill='#1f2328' font-weight='600' text-anchor='end'>× 3 ns</text><text x='836' y='171' font-size='14' fill='#f28e2b' font-weight='700' text-anchor='end'>= 3.38 ms</text><text x='24' y='220' font-size='14' fill='#1f2328' font-weight='700' text-anchor='start'>HashSet (an afternoon)</text><rect x='250.0' y='204.0' width='4.0' height='24.0' rx='3' fill='#1a7f37' stroke='none' stroke-width='1' opacity='1'/><text x='262' y='221' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='start'>1,500 lookups</text><text x='720' y='221' font-size='13' fill='#1f2328' font-weight='600' text-anchor='end'>× 25 ns</text><text x='836' y='221' font-size='14' fill='#1a7f37' font-weight='700' text-anchor='end'>= 0.0375 ms</text><text x='250' y='254' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>bar length: number of operations (to true scale the HashSet bar would be 0.3 px wide)</text><rect x='24.0' y='270.0' width='812.0' height='54.0' rx='8' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><text x='40' y='292' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>Micro-optimization shrinks the second number: 8 → 3 ns, 2.7×.</text><text x='40' y='312' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>The algorithm shrinks the first: 1,125,000 → 1,500, 750×, so each step can even be slower (25 ns).</text></svg>