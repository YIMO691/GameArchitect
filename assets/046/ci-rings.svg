<svg xmlns='http://www.w3.org/2000/svg' width='860' height='390' viewBox='0 0 860 390' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>A build pipeline in three rings</title><rect x='0.5' y='0.5' width='859' height='389' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>A build pipeline in three rings</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Three rings: fast and narrow on every commit, platform builds on every merge, slow and complete every night.</text><rect x='24.0' y='84.0' width='812.0' height='88.0' rx='10' fill='#ffffff' stroke='#4e79a7' stroke-width='2' opacity='1'/><rect x='24.0' y='84.0' width='150.0' height='88.0' rx='10' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><rect x='160.0' y='84.0' width='14.0' height='88.0' rx='0' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><text x='99' y='122' font-size='15' fill='#ffffff' font-weight='700' text-anchor='middle'>Every commit</text><text x='99' y='144' font-size='13' fill='#ffffff' font-weight='600' text-anchor='middle'>6 min</text><text x='194' y='110' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>• Compile all platforms' scripts</text><text x='194' y='132' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>• Unit tests (edit mode)</text><text x='194' y='154' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>• Asset import rules (045)</text><text x='820' y='134' font-size='12.5' fill='#4e79a7' font-weight='700' text-anchor='end'>finds 1.2 of 1.9 breaks a day · 1 suspect</text><rect x='24.0' y='184.0' width='812.0' height='88.0' rx='10' fill='#ffffff' stroke='#59a14f' stroke-width='2' opacity='1'/><rect x='24.0' y='184.0' width='150.0' height='88.0' rx='10' fill='#59a14f' stroke='none' stroke-width='1' opacity='1'/><rect x='160.0' y='184.0' width='14.0' height='88.0' rx='0' fill='#59a14f' stroke='none' stroke-width='1' opacity='1'/><text x='99' y='222' font-size='15' fill='#ffffff' font-weight='700' text-anchor='middle'>Every merge</text><text x='99' y='244' font-size='13' fill='#ffffff' font-weight='600' text-anchor='middle'>25 + 10 min</text><text x='194' y='210' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>• Android build from a warm cache</text><text x='194' y='232' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>• Install on a test phone</text><text x='194' y='254' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>• Launch + 2 min smoke test</text><text x='820' y='234' font-size='12.5' fill='#59a14f' font-weight='700' text-anchor='end'>finds Android-only breaks and crashes · 2 suspects</text><rect x='24.0' y='284.0' width='812.0' height='88.0' rx='10' fill='#ffffff' stroke='#b07aa1' stroke-width='2' opacity='1'/><rect x='24.0' y='284.0' width='150.0' height='88.0' rx='10' fill='#b07aa1' stroke='none' stroke-width='1' opacity='1'/><rect x='160.0' y='284.0' width='14.0' height='88.0' rx='0' fill='#b07aa1' stroke='none' stroke-width='1' opacity='1'/><text x='99' y='322' font-size='15' fill='#ffffff' font-weight='700' text-anchor='middle'>Every night</text><text x='99' y='344' font-size='13' fill='#ffffff' font-weight='600' text-anchor='middle'>160 min +</text><text x='194' y='310' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>• Clean build, all platforms</text><text x='194' y='332' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>• Long play tests, performance</text><text x='194' y='354' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>• Build size report (045)</text><text x='820' y='334' font-size='12.5' fill='#b07aa1' font-weight='700' text-anchor='end'>proves a clean build still works; trends</text></svg>