<svg xmlns='http://www.w3.org/2000/svg' width='860' height='484' viewBox='0 0 860 484' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>The price of one full-screen pass</title><rect x='0.5' y='0.5' width='859' height='483' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>The price of one full-screen pass</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Mid-range phone, 1600 × 720 = 1,152,000 pixels, HDR colour at 8 bytes per pixel (RGBA16F).</text><rect x='24.0' y='90.0' width='200.0' height='90.0' rx='6' fill='#1b2a44' stroke='none' stroke-width='1' opacity='1'/><text x='124' y='140' font-size='14' fill='#ffffff' font-weight='700' text-anchor='middle'>screen in</text><line x1='232' y1='135' x2='300' y2='135' stroke='#4e79a7' stroke-width='3'/><polygon points='300,135 290,129 290,141' fill='#4e79a7'/><text x='266' y='122' font-size='12' fill='#4e79a7' font-weight='600' text-anchor='middle'>read 8 B</text><rect x='306.0' y='96.0' width='150.0' height='78.0' rx='8' fill='#fff8f0' stroke='#f28e2b' stroke-width='1' opacity='1'/><text x='381' y='128' font-size='14' fill='#1f2328' font-weight='700' text-anchor='middle'>shader</text><text x='381' y='148' font-size='12' fill='#57606a' font-weight='400' text-anchor='middle'>(the math)</text><line x1='464' y1='135' x2='532' y2='135' stroke='#4e79a7' stroke-width='3'/><polygon points='532,135 522,129 522,141' fill='#4e79a7'/><text x='498' y='122' font-size='12' fill='#4e79a7' font-weight='600' text-anchor='middle'>write 8 B</text><rect x='540.0' y='90.0' width='200.0' height='90.0' rx='6' fill='#1b2a44' stroke='none' stroke-width='1' opacity='1'/><text x='640' y='140' font-size='14' fill='#ffffff' font-weight='700' text-anchor='middle'>screen out</text><text x='24' y='214' font-size='14' fill='#1f2328' font-weight='700' text-anchor='start'>1,152,000 × (8 + 8) bytes ≈ 18.4 MB moved per pass  →  about 0.9 ms on this phone, before any math.</text><text x='24' y='244' font-size='14' fill='#1f2328' font-weight='600' text-anchor='start'>Three small effects as three passes:</text><text x='24' y='275' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>Vignette, its own pass</text><rect x='260.0' y='262.0' width='108.0' height='20.0' rx='2' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><rect x='368.0' y='262.0' width='12.0' height='20.0' rx='2' fill='#f28e2b' stroke='none' stroke-width='1' opacity='1'/><text x='388.0' y='277' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>1 ms</text><text x='24' y='303' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>Grain, its own pass</text><rect x='260.0' y='290.0' width='108.0' height='20.0' rx='2' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><rect x='368.0' y='290.0' width='12.0' height='20.0' rx='2' fill='#f28e2b' stroke='none' stroke-width='1' opacity='1'/><text x='388.0' y='305' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>1 ms</text><text x='24' y='331' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>Aberration, its own pass</text><rect x='260.0' y='318.0' width='108.0' height='20.0' rx='2' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><rect x='368.0' y='318.0' width='24.0' height='20.0' rx='2' fill='#f28e2b' stroke='none' stroke-width='1' opacity='1'/><text x='400.0' y='333' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>1.1 ms</text><text x='470.0' y='300' font-size='13' fill='#cf222e' font-weight='700' text-anchor='start'>= 3.1 ms, of which 2.7 ms is only carrying bytes</text><text x='24' y='356' font-size='14' fill='#1f2328' font-weight='600' text-anchor='start'>The same three effects inside the existing uber pass:</text><text x='24' y='387' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>Uber pass before</text><rect x='260.0' y='374.0' width='108.0' height='20.0' rx='2' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><rect x='368.0' y='374.0' width='48.0' height='20.0' rx='2' fill='#f28e2b' stroke='none' stroke-width='1' opacity='1'/><text x='424.0' y='389' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>1.3 ms</text><text x='24' y='415' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>Uber pass with all three</text><rect x='260.0' y='402.0' width='108.0' height='20.0' rx='2' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><rect x='368.0' y='402.0' width='96.0' height='20.0' rx='2' fill='#f28e2b' stroke='none' stroke-width='1' opacity='1'/><text x='472.0' y='417' font-size='13' fill='#1a7f37' font-weight='700' text-anchor='start'>1.7 ms: only +0.4 ms</text><rect x='24.0' y='431.0' width='13.0' height='13.0' rx='2' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><text x='42' y='442' font-size='12' fill='#1f2328' font-weight='400' text-anchor='start'>bandwidth (reading and writing the screen)</text><rect x='330.0' y='431.0' width='13.0' height='13.0' rx='2' fill='#f28e2b' stroke='none' stroke-width='1' opacity='1'/><text x='348' y='442' font-size='12' fill='#1f2328' font-weight='400' text-anchor='start'>math (the effect itself)</text><text x='24' y='464' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>Analogy: repainting a wall to change one detail; you still carry the ladder along the whole wall.</text></svg>