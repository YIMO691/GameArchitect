<svg xmlns='http://www.w3.org/2000/svg' width='860' height='466' viewBox='0 0 860 466' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>What one innocent line really does</title><rect x='0.5' y='0.5' width='859' height='465' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>What one innocent line really does</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Each line looks like one small step. Here is what it really does, every time it runs.</text><rect x='24.0' y='84.0' width='396.0' height='170.0' rx='10' fill='#ffffff' stroke='#d0d7de' stroke-width='1.5' opacity='1'/><rect x='24.0' y='84.0' width='396.0' height='36.0' rx='10' fill='#f6f8fa' stroke='none' stroke-width='1' opacity='1'/><rect x='24.0' y='110.0' width='396.0' height='10.0' rx='0' fill='#f6f8fa' stroke='none' stroke-width='1' opacity='1'/><text x='38' y='108' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>Debug.Log("Price " + p)</text><circle cx='46' cy='140' r='9' fill='#4e79a7'/><text x='46' y='144' font-size='11' fill='#ffffff' font-weight='700' text-anchor='middle'>1</text><text x='64' y='144' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>build a new string</text><circle cx='46' cy='164' r='9' fill='#4e79a7'/><text x='46' y='168' font-size='11' fill='#ffffff' font-weight='700' text-anchor='middle'>2</text><text x='64' y='168' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>capture a stack trace</text><circle cx='46' cy='188' r='9' fill='#4e79a7'/><text x='46' y='192' font-size='11' fill='#ffffff' font-weight='700' text-anchor='middle'>3</text><text x='64' y='192' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>write to the log file</text><circle cx='46' cy='212' r='9' fill='#4e79a7'/><text x='46' y='216' font-size='11' fill='#ffffff' font-weight='700' text-anchor='middle'>4</text><text x='64' y='216' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>still runs in release builds</text><text x='406' y='242' font-size='13' fill='#cf222e' font-weight='700' text-anchor='end'>0.3 ms, 1 KB each</text><rect x='440.0' y='84.0' width='396.0' height='170.0' rx='10' fill='#ffffff' stroke='#d0d7de' stroke-width='1.5' opacity='1'/><rect x='440.0' y='84.0' width='396.0' height='36.0' rx='10' fill='#f6f8fa' stroke='none' stroke-width='1' opacity='1'/><rect x='440.0' y='110.0' width='396.0' height='10.0' rx='0' fill='#f6f8fa' stroke='none' stroke-width='1' opacity='1'/><text x='454' y='108' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>label.text = "Price: " + p + " coins"</text><circle cx='462' cy='140' r='9' fill='#4e79a7'/><text x='462' y='144' font-size='11' fill='#ffffff' font-weight='700' text-anchor='middle'>1</text><text x='480' y='144' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>turn p into a string</text><circle cx='462' cy='164' r='9' fill='#4e79a7'/><text x='462' y='168' font-size='11' fill='#ffffff' font-weight='700' text-anchor='middle'>2</text><text x='480' y='168' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>join three strings: new string</text><circle cx='462' cy='188' r='9' fill='#4e79a7'/><text x='462' y='192' font-size='11' fill='#ffffff' font-weight='700' text-anchor='middle'>3</text><text x='480' y='192' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>mark the label for rebuild</text><circle cx='462' cy='212' r='9' fill='#4e79a7'/><text x='462' y='216' font-size='11' fill='#ffffff' font-weight='700' text-anchor='middle'>4</text><text x='480' y='216' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>every label, every frame</text><text x='822' y='242' font-size='13' fill='#cf222e' font-weight='700' text-anchor='end'>0.1 KB each</text><rect x='24.0' y='270.0' width='396.0' height='170.0' rx='10' fill='#ffffff' stroke='#d0d7de' stroke-width='1.5' opacity='1'/><rect x='24.0' y='270.0' width='396.0' height='36.0' rx='10' fill='#f6f8fa' stroke='none' stroke-width='1' opacity='1'/><rect x='24.0' y='296.0' width='396.0' height='10.0' rx='0' fill='#f6f8fa' stroke='none' stroke-width='1' opacity='1'/><text x='38' y='294' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>SendMessage("OnPriceChanged")</text><circle cx='46' cy='326' r='9' fill='#4e79a7'/><text x='46' y='330' font-size='11' fill='#ffffff' font-weight='700' text-anchor='middle'>1</text><text x='64' y='330' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>look at every component</text><circle cx='46' cy='350' r='9' fill='#4e79a7'/><text x='46' y='354' font-size='11' fill='#ffffff' font-weight='700' text-anchor='middle'>2</text><text x='64' y='354' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>find a method by its name</text><circle cx='46' cy='374' r='9' fill='#4e79a7'/><text x='46' y='378' font-size='11' fill='#ffffff' font-weight='700' text-anchor='middle'>3</text><text x='64' y='378' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>call it through reflection</text><circle cx='46' cy='398' r='9' fill='#4e79a7'/><text x='46' y='402' font-size='11' fill='#ffffff' font-weight='700' text-anchor='middle'>4</text><text x='64' y='402' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>no compile-time check</text><text x='406' y='428' font-size='13' fill='#cf222e' font-weight='700' text-anchor='end'>8 µs each</text><rect x='440.0' y='270.0' width='396.0' height='170.0' rx='10' fill='#ffffff' stroke='#d0d7de' stroke-width='1.5' opacity='1'/><rect x='440.0' y='270.0' width='396.0' height='36.0' rx='10' fill='#f6f8fa' stroke='none' stroke-width='1' opacity='1'/><rect x='440.0' y='296.0' width='396.0' height='10.0' rx='0' fill='#f6f8fa' stroke='none' stroke-width='1' opacity='1'/><text x='454' y='294' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>bus.Publish((object)evt)</text><circle cx='462' cy='326' r='9' fill='#4e79a7'/><text x='462' y='330' font-size='11' fill='#ffffff' font-weight='700' text-anchor='middle'>1</text><text x='480' y='330' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>allocate a box on the heap</text><circle cx='462' cy='350' r='9' fill='#4e79a7'/><text x='462' y='354' font-size='11' fill='#ffffff' font-weight='700' text-anchor='middle'>2</text><text x='480' y='354' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>copy the struct into it</text><circle cx='462' cy='374' r='9' fill='#4e79a7'/><text x='462' y='378' font-size='11' fill='#ffffff' font-weight='700' text-anchor='middle'>3</text><text x='480' y='378' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>cast it back to read it</text><circle cx='462' cy='398' r='9' fill='#4e79a7'/><text x='462' y='402' font-size='11' fill='#ffffff' font-weight='700' text-anchor='middle'>4</text><text x='480' y='402' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>box becomes garbage</text><text x='822' y='428' font-size='13' fill='#cf222e' font-weight='700' text-anchor='end'>32 B each</text></svg>