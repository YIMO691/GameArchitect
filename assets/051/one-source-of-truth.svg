<svg xmlns='http://www.w3.org/2000/svg' width='860' height='372' viewBox='0 0 860 372' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>One source of truth for the UI</title><rect x='0.5' y='0.5' width='859' height='371' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>One source of truth for the UI</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>A fish is sold for 50 coins. Who updates the three places that show coins?</text><text x='24' y='100' font-size='15' fill='#cf222e' font-weight='700' text-anchor='start'>❌ A copy per panel</text><rect x='24.0' y='116.0' width='170.0' height='46.0' rx='8' fill='#ffffff' stroke='#d0d7de' stroke-width='1.5' opacity='1'/><text x='109' y='144' font-size='13' fill='#1f2328' font-weight='600' text-anchor='middle'>SellFish()</text><rect x='260.0' y='106.0' width='160.0' height='40.0' rx='8' fill='#ffffff' stroke='#d0d7de' stroke-width='1.5' opacity='1'/><text x='272' y='131' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='start'>Header</text><text x='408' y='131' font-size='13' fill='#1f2328' font-weight='700' text-anchor='end'>1,840</text><line x1='196' y1='139' x2='246.2' y2='128.1' stroke='#9aa0a6' stroke-width='2'/><polygon points='256,126 245.0,122.3 247.5,134.0' fill='#9aa0a6'/><rect x='260.0' y='156.0' width='160.0' height='40.0' rx='8' fill='#fff1f0' stroke='#cf222e' stroke-width='1.5' opacity='1'/><text x='272' y='181' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='start'>Shop</text><text x='408' y='181' font-size='13' fill='#cf222e' font-weight='700' text-anchor='end'>1,790</text><rect x='260.0' y='206.0' width='160.0' height='40.0' rx='8' fill='#ffffff' stroke='#d0d7de' stroke-width='1.5' opacity='1'/><text x='272' y='231' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='start'>Sell popup</text><text x='408' y='231' font-size='13' fill='#1f2328' font-weight='700' text-anchor='end'>1,840</text><line x1='196' y1='139' x2='250.3' y2='217.8' stroke='#9aa0a6' stroke-width='2'/><polygon points='256,226 255.3,214.4 245.4,221.2' fill='#9aa0a6'/><text x='24' y='270' font-size='12.5' fill='#cf222e' font-weight='600' text-anchor='start'>SellFish() remembers to update two of the three copies.</text><text x='24' y='288' font-size='12.5' fill='#cf222e' font-weight='600' text-anchor='start'>The shop still shows the old number: 340 reports a day.</text><text x='450' y='100' font-size='15' fill='#1a7f37' font-weight='700' text-anchor='start'>✅ One model, a view model, bindings</text><rect x='450.0' y='116.0' width='110.0' height='46.0' rx='8' fill='#dafbe1' stroke='#1a7f37' stroke-width='1.5' opacity='1'/><text x='505' y='136' font-size='13' fill='#1f2328' font-weight='700' text-anchor='middle'>Model</text><text x='505' y='153' font-size='11' fill='#57606a' font-weight='400' text-anchor='middle'>coins = 1,840</text><rect x='450.0' y='196.0' width='110.0' height='46.0' rx='8' fill='#e8f0fb' stroke='#4e79a7' stroke-width='1.5' opacity='1'/><text x='505' y='216' font-size='13' fill='#1f2328' font-weight='700' text-anchor='middle'>View model</text><text x='505' y='233' font-size='11' fill='#57606a' font-weight='400' text-anchor='middle'>"Coins changed"</text><line x1='505' y1='164' x2='505.0' y2='184.0' stroke='#1a7f37' stroke-width='2.5'/><polygon points='505,194 511.0,184.0 499.0,184.0' fill='#1a7f37'/><rect x='666.0' y='106.0' width='160.0' height='40.0' rx='8' fill='#ffffff' stroke='#1a7f37' stroke-width='1.5' opacity='1'/><text x='678' y='131' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='start'>Header</text><text x='814' y='131' font-size='13' fill='#1a7f37' font-weight='700' text-anchor='end'>1,840</text><line x1='562' y1='219' x2='654.7' y2='132.8' stroke='#4e79a7' stroke-width='2'/><polygon points='662,126 650.6,128.4 658.8,137.2' fill='#4e79a7'/><rect x='666.0' y='156.0' width='160.0' height='40.0' rx='8' fill='#ffffff' stroke='#1a7f37' stroke-width='1.5' opacity='1'/><text x='678' y='181' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='start'>Shop</text><text x='814' y='181' font-size='13' fill='#1a7f37' font-weight='700' text-anchor='end'>1,840</text><line x1='562' y1='219' x2='652.8' y2='180.0' stroke='#4e79a7' stroke-width='2'/><polygon points='662,176 650.4,174.4 655.2,185.5' fill='#4e79a7'/><rect x='666.0' y='206.0' width='160.0' height='40.0' rx='8' fill='#ffffff' stroke='#1a7f37' stroke-width='1.5' opacity='1'/><text x='678' y='231' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='start'>Sell popup</text><text x='814' y='231' font-size='13' fill='#1a7f37' font-weight='700' text-anchor='end'>1,840</text><line x1='562' y1='219' x2='652.0' y2='225.3' stroke='#4e79a7' stroke-width='2'/><polygon points='662,226 652.4,219.3 651.6,231.3' fill='#4e79a7'/><text x='450' y='270' font-size='12.5' fill='#1a7f37' font-weight='600' text-anchor='start'>Game code changes only the model. Every panel binds</text><text x='450' y='288' font-size='12.5' fill='#1a7f37' font-weight='600' text-anchor='start'>to the view model and updates its label: 0.06 ms.</text><rect x='24.0' y='308.0' width='812.0' height='44.0' rx='8' fill='#fff8e6' stroke='#d4a72c' stroke-width='1.5' opacity='1'/><text x='40' y='335' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>Views never own game data. They show it, and send the player's intent ("sell this fish") back to the game.</text></svg>