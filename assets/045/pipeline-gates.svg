<svg xmlns='http://www.w3.org/2000/svg' width='860' height='402' viewBox='0 0 860 402' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>An asset pipeline with gates</title><rect x='0.5' y='0.5' width='859' height='401' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>An asset pipeline with gates</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>From an artist's source file to a shipped asset. Each gate stops a kind of mistake as early as possible.</text><rect x='24.0' y='96.0' width='122.0' height='96.0' rx='10' fill='#ffffff' stroke='#9aa0a6' stroke-width='2' opacity='1'/><rect x='24.0' y='96.0' width='122.0' height='30.0' rx='10' fill='#9aa0a6' stroke='none' stroke-width='1' opacity='1'/><rect x='24.0' y='114.0' width='122.0' height='12.0' rx='0' fill='#9aa0a6' stroke='none' stroke-width='1' opacity='1'/><text x='85.0' y='116' font-size='14' fill='#ffffff' font-weight='700' text-anchor='middle'>Source</text><text x='85.0' y='152' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>.blend .psd</text><text x='85.0' y='174' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='middle'>artist's tool</text><line x1='148' y1='155' x2='150.0' y2='155.0' stroke='#57606a' stroke-width='2'/><polygon points='160,155 150.0,149.0 150.0,161.0' fill='#57606a'/><rect x='162.0' y='96.0' width='122.0' height='96.0' rx='10' fill='#ffffff' stroke='#4e79a7' stroke-width='2' opacity='1'/><rect x='162.0' y='96.0' width='122.0' height='30.0' rx='10' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><rect x='162.0' y='114.0' width='122.0' height='12.0' rx='0' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><text x='223.0' y='116' font-size='14' fill='#ffffff' font-weight='700' text-anchor='middle'>Import</text><text x='223.0' y='152' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>presets per folder</text><text x='223.0' y='174' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='middle'>right defaults</text><line x1='286' y1='155' x2='288.0' y2='155.0' stroke='#57606a' stroke-width='2'/><polygon points='298,155 288.0,149.0 288.0,161.0' fill='#57606a'/><rect x='300.0' y='96.0' width='122.0' height='96.0' rx='10' fill='#ffffff' stroke='#59a14f' stroke-width='2' opacity='1'/><rect x='300.0' y='96.0' width='122.0' height='30.0' rx='10' fill='#59a14f' stroke='none' stroke-width='1' opacity='1'/><rect x='300.0' y='114.0' width='122.0' height='12.0' rx='0' fill='#59a14f' stroke='none' stroke-width='1' opacity='1'/><text x='361.0' y='116' font-size='14' fill='#ffffff' font-weight='700' text-anchor='middle'>Validate</text><text x='361.0' y='152' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>AssetPostprocessor</text><text x='361.0' y='174' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='middle'>fails loudly</text><line x1='424' y1='155' x2='426.0' y2='155.0' stroke='#57606a' stroke-width='2'/><polygon points='436,155 426.0,149.0 426.0,161.0' fill='#57606a'/><rect x='438.0' y='96.0' width='122.0' height='96.0' rx='10' fill='#ffffff' stroke='#9aa0a6' stroke-width='2' opacity='1'/><rect x='438.0' y='96.0' width='122.0' height='30.0' rx='10' fill='#9aa0a6' stroke='none' stroke-width='1' opacity='1'/><rect x='438.0' y='114.0' width='122.0' height='12.0' rx='0' fill='#9aa0a6' stroke='none' stroke-width='1' opacity='1'/><text x='499.0' y='116' font-size='14' fill='#ffffff' font-weight='700' text-anchor='middle'>Commit</text><text x='499.0' y='152' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>version control</text><text x='499.0' y='174' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='middle'>sources + .meta</text><line x1='562' y1='155' x2='564.0' y2='155.0' stroke='#57606a' stroke-width='2'/><polygon points='574,155 564.0,149.0 564.0,161.0' fill='#57606a'/><rect x='576.0' y='96.0' width='122.0' height='96.0' rx='10' fill='#ffffff' stroke='#b07aa1' stroke-width='2' opacity='1'/><rect x='576.0' y='96.0' width='122.0' height='30.0' rx='10' fill='#b07aa1' stroke='none' stroke-width='1' opacity='1'/><rect x='576.0' y='114.0' width='122.0' height='12.0' rx='0' fill='#b07aa1' stroke='none' stroke-width='1' opacity='1'/><text x='637.0' y='116' font-size='14' fill='#ffffff' font-weight='700' text-anchor='middle'>Cache</text><text x='637.0' y='152' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>shared import cache</text><text x='637.0' y='174' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='middle'>import once</text><line x1='700' y1='155' x2='702.0' y2='155.0' stroke='#57606a' stroke-width='2'/><polygon points='712,155 702.0,149.0 702.0,161.0' fill='#57606a'/><rect x='714.0' y='96.0' width='122.0' height='96.0' rx='10' fill='#ffffff' stroke='#f28e2b' stroke-width='2' opacity='1'/><rect x='714.0' y='96.0' width='122.0' height='30.0' rx='10' fill='#f28e2b' stroke='none' stroke-width='1' opacity='1'/><rect x='714.0' y='114.0' width='122.0' height='12.0' rx='0' fill='#f28e2b' stroke='none' stroke-width='1' opacity='1'/><text x='775.0' y='116' font-size='14' fill='#ffffff' font-weight='700' text-anchor='middle'>CI build</text><text x='775.0' y='152' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>budget report</text><text x='775.0' y='174' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='middle'>size per category</text><text x='24' y='236' font-size='14' fill='#1f2328' font-weight='700' text-anchor='start'>What each stage catches</text><rect x='24.0' y='248.0' width='96.0' height='24.0' rx='6' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><text x='72' y='264' font-size='12.5' fill='#ffffff' font-weight='700' text-anchor='middle'>Import</text><text x='134' y='264' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>oversized and uncompressed textures, fixed by default</text><rect x='24.0' y='280.0' width='96.0' height='24.0' rx='6' fill='#59a14f' stroke='none' stroke-width='1' opacity='1'/><text x='72' y='296' font-size='12.5' fill='#ffffff' font-weight='700' text-anchor='middle'>Validate</text><text x='134' y='296' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>over-budget meshes, wrong scale, missing LODs, bad names</text><rect x='24.0' y='312.0' width='96.0' height='24.0' rx='6' fill='#b07aa1' stroke='none' stroke-width='1' opacity='1'/><text x='72' y='328' font-size='12.5' fill='#ffffff' font-weight='700' text-anchor='middle'>Cache</text><text x='134' y='328' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>not a gate: every import after the first comes from the cache</text><rect x='24.0' y='344.0' width='96.0' height='24.0' rx='6' fill='#f28e2b' stroke='none' stroke-width='1' opacity='1'/><text x='72' y='360' font-size='12.5' fill='#ffffff' font-weight='700' text-anchor='middle'>CI build</text><text x='134' y='360' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>anything that slipped: a category over budget fails the merge</text></svg>