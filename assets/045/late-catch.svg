<svg xmlns='http://www.w3.org/2000/svg' width='860' height='292' viewBox='0 0 860 292' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>The later the catch, the higher the bill</title><rect x='0.5' y='0.5' width='859' height='291' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>The later the catch, the higher the bill</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Left: what fixing one mistake costs, by where it is caught. Right: a week of the Reef's 9 mistakes, per setup.</text><text x='24' y='88' font-size='14' fill='#1f2328' font-weight='700' text-anchor='start'>One mistake</text><text x='24' y='116' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>Preset</text><rect x='140.0' y='102.0' width='1.5' height='22.0' rx='3' fill='#59a14f' stroke='none' stroke-width='1' opacity='1'/><text x='148.0' y='118' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>0 min</text><text x='24' y='152' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>Import check</text><rect x='140.0' y='138.0' width='4.8' height='22.0' rx='3' fill='#59a14f' stroke='none' stroke-width='1' opacity='1'/><text x='152.79166666666666' y='154' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>5 min</text><text x='24' y='188' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>CI</text><rect x='140.0' y='174.0' width='57.5' height='22.0' rx='3' fill='#f28e2b' stroke='none' stroke-width='1' opacity='1'/><text x='205.5' y='190' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>1 h</text><text x='24' y='224' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>QA</text><rect x='140.0' y='210.0' width='230.0' height='22.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='378.0' y='226' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>4 h</text><text x='24' y='260' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>Ships</text><text x='140' y='262' font-size='12.5' fill='#cf222e' font-weight='700' text-anchor='start'>build +16 MB, players pay</text><text x='440' y='88' font-size='14' fill='#1f2328' font-weight='700' text-anchor='start'>A week, 9 mistakes</text><text x='440' y='116' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>No pipeline</text><rect x='560.0' y='102.0' width='100.0' height='22.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='668.0' y='118' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>4.00 h</text><text x='440' y='132' font-size='11.5' fill='#cf222e' font-weight='600' text-anchor='start'>+100 MB a week</text><text x='440' y='160' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>Presets</text><rect x='560.0' y='146.0' width='100.0' height='22.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='668.0' y='162' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>4.00 h</text><text x='440' y='176' font-size='11.5' fill='#cf222e' font-weight='600' text-anchor='start'>+36 MB</text><text x='440' y='204' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>Presets + CI</text><rect x='560.0' y='190.0' width='200.0' height='22.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='768.0' y='206' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>8.00 h</text><text x='440' y='220' font-size='11.5' fill='#1a7f37' font-weight='600' text-anchor='start'>+0 MB</text><text x='440' y='248' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>+ import check</text><rect x='560.0' y='234.0' width='10.5' height='22.0' rx='3' fill='#59a14f' stroke='none' stroke-width='1' opacity='1'/><text x='578.5' y='250' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>0.42 h</text><text x='440' y='264' font-size='11.5' fill='#1a7f37' font-weight='600' text-anchor='start'>+0 MB</text></svg>