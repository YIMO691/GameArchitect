<svg xmlns='http://www.w3.org/2000/svg' width='860' height='390' viewBox='0 0 860 390' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Why it stutters only the first time</title><rect x='0.5' y='0.5' width='859' height='389' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Why it stutters only the first time</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>A shader is compiled twice. The second compile happens on the player's machine, the first time it is needed.</text><text x='24' y='94' font-size='11.5' fill='#4e79a7' font-weight='700' text-anchor='start'>ON YOUR BUILD MACHINE</text><rect x='24.0' y='104.0' width='190.0' height='56.0' rx='8' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1.5' opacity='1'/><text x='119.0' y='128' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='middle'>Shader source</text><text x='119.0' y='147' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='middle'>HLSL / Shader Graph</text><line x1='218' y1='132' x2='252.0' y2='132.0' stroke='#4e79a7' stroke-width='2.5'/><polygon points='262,132 252.0,126.0 252.0,138.0' fill='#4e79a7'/><rect x='266.0' y='104.0' width='190.0' height='56.0' rx='8' fill='#eaf1fb' stroke='#4e79a7' stroke-width='1.5' opacity='1'/><text x='361.0' y='128' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='middle'>Bytecode</text><text x='361.0' y='147' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='middle'>DXIL / SPIR-V, in the build</text><text x='480' y='94' font-size='11.5' fill='#cf222e' font-weight='700' text-anchor='start'>ON THE PLAYER'S PC, WHILE PLAYING</text><line x1='460' y1='132' x2='494.0' y2='132.0' stroke='#cf222e' stroke-width='2.5'/><polygon points='504,132 494.0,126.0 494.0,138.0' fill='#cf222e'/><rect x='508.0' y='104.0' width='328.0' height='56.0' rx='8' fill='#fde2e1' stroke='#cf222e' stroke-width='1.5' opacity='1'/><text x='672.0' y='128' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='middle'>Pipeline (PSO) = bytecode + render state</text><text x='672.0' y='147' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='middle'>the driver compiles it for this GPU: ~11 ms each</text><text x='24' y='196' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>First lake, first visit</text><text x='24' y='214' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>15 new pipelines</text><rect x='250.0' y='182.0' width='42.0' height='26.0' rx='3' fill='#1a7f37' stroke='none' stroke-width='1' opacity='1'/><text x='271.0' y='200' font-size='11' fill='#ffffff' font-weight='700' text-anchor='middle'>14</text><rect x='292.0' y='182.0' width='31.0' height='26.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><rect x='325.0' y='182.0' width='31.0' height='26.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><rect x='358.0' y='182.0' width='31.0' height='26.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><rect x='391.0' y='182.0' width='31.0' height='26.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><rect x='424.0' y='182.0' width='31.0' height='26.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><rect x='457.0' y='182.0' width='31.0' height='26.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><rect x='490.0' y='182.0' width='31.0' height='26.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><rect x='523.0' y='182.0' width='31.0' height='26.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><rect x='556.0' y='182.0' width='31.0' height='26.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><rect x='589.0' y='182.0' width='31.0' height='26.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><rect x='622.0' y='182.0' width='31.0' height='26.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><rect x='655.0' y='182.0' width='31.0' height='26.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><rect x='688.0' y='182.0' width='31.0' height='26.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><rect x='721.0' y='182.0' width='31.0' height='26.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><rect x='754.0' y='182.0' width='31.0' height='26.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='795.0' y='200' font-size='13' fill='#cf222e' font-weight='700' text-anchor='start'>179 ms</text><text x='250' y='230' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>normal frame work, then 15 driver compiles of 11 ms, all inside one frame</text><text x='24' y='270' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>First lake, next session</text><text x='24' y='288' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>driver cache on disk</text><rect x='250.0' y='256.0' width='42.0' height='26.0' rx='3' fill='#1a7f37' stroke='none' stroke-width='1' opacity='1'/><text x='300.0' y='274' font-size='13' fill='#1a7f37' font-weight='700' text-anchor='start'>14 ms: already compiled</text><text x='250' y='304' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>so the team, replaying on their own PCs, never sees it. New players, new drivers and new GPUs do.</text><rect x='24.0' y='326.0' width='812.0' height='44.0' rx='8' fill='#fff8e6' stroke='#d4a72c' stroke-width='1.5' opacity='1'/><text x='40' y='353' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>The first session is the one reviewers and streamers play. Compile before the player gets there.</text></svg>