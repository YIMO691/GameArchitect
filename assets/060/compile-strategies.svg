<svg xmlns='http://www.w3.org/2000/svg' width='860' height='448' viewBox='0 0 860 448' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>When to compile pipelines</title><rect x='0.5' y='0.5' width='859' height='447' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>When to compile pipelines</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Start-up time against hitches in a 30-minute first session. Goal: start-up under 3 s, no frame over 50 ms.</text><line x1='485.0' y1='80' x2='485.0' y2='356' stroke='#4e79a7' stroke-width='2' stroke-dasharray='5 4'/><text x='484.9598053188307' y='78' font-size='12' fill='#4e79a7' font-weight='700' text-anchor='middle'>3 s limit</text><text x='24' y='116' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>Compile on first draw</text><rect x='330.0' y='102.0' width='3.0' height='22.0' rx='4' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='341' y='118' font-size='12.5' fill='#cf222e' font-weight='700' text-anchor='start'>0 s</text><text x='330' y='140' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>40 hitches, worst 179 ms</text><text x='24' y='168' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>Every variant (24,000)</text><rect x='330.0' y='154.0' width='470.0' height='22.0' rx='4' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='808.0' y='170' font-size='12.5' fill='#cf222e' font-weight='700' text-anchor='start'>66 s</text><text x='330' y='192' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>0 hitches, 66 s start-up</text><text x='24' y='220' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>Every variant, stripped (6,000)</text><rect x='330.0' y='206.0' width='319.9' height='22.0' rx='4' fill='#f28e2b' stroke='none' stroke-width='1' opacity='1'/><text x='657.936446206073' y='222' font-size='12.5' fill='#b35c00' font-weight='700' text-anchor='start'>16.5 s</text><text x='330' y='244' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>0 hitches, 16.5 s start-up</text><text x='24' y='272' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>Recorded list (270)</text><rect x='330.0' y='258.0' width='61.9' height='22.0' rx='4' fill='#f28e2b' stroke='none' stroke-width='1' opacity='1'/><text x='399.91320669098826' y='274' font-size='12.5' fill='#b35c00' font-weight='700' text-anchor='start'>0.74 s</text><text x='330' y='296' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>5 hitches, worst 91 ms (QA never saw 30)</text><text x='24' y='324' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>Recorded list + fallback</text><rect x='330.0' y='310.0' width='61.9' height='22.0' rx='4' fill='#1a7f37' stroke='none' stroke-width='1' opacity='1'/><text x='399.91320669098826' y='326' font-size='12.5' fill='#1a7f37' font-weight='700' text-anchor='start'>0.74 s</text><text x='330' y='348' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>0 hitches; 30 fallbacks, at most 19.3 ms</text><text x='330' y='370' font-size='11' fill='#57606a' font-weight='400' text-anchor='start'>start-up seconds (log scale)</text><rect x='24.0' y='384.0' width='812.0' height='44.0' rx='8' fill='#fff8e6' stroke='#d4a72c' stroke-width='1.5' opacity='1'/><text x='40' y='411' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>Compile what players will use, record it from real play, and never let a missing one stop the frame.</text></svg>