<svg xmlns='http://www.w3.org/2000/svg' width='860' height='500' viewBox='0 0 860 500' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>How big is one 2048 × 2048 texture?</title><rect x='0.5' y='0.5' width='859' height='499' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>How big is one 2048 × 2048 texture?</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>One 2048 × 2048 texture: the mip pyramid (left) and the same texture in four formats (right). 1 MB = 1,048,576 bytes.</text><rect x='30.0' y='100.0' width='200.0' height='200.0' rx='0' fill='#4e79a7' stroke='#ffffff' stroke-width='1' opacity='0.85'/><text x='130.0' y='94' font-size='12' fill='#1f2328' font-weight='600' text-anchor='middle'>2048</text><rect x='236.0' y='200.0' width='100.0' height='100.0' rx='0' fill='#59a14f' stroke='#ffffff' stroke-width='1' opacity='0.85'/><text x='286.0' y='194' font-size='12' fill='#1f2328' font-weight='600' text-anchor='middle'>1024</text><rect x='342.0' y='250.0' width='50.0' height='50.0' rx='0' fill='#f28e2b' stroke='#ffffff' stroke-width='1' opacity='0.85'/><text x='367.0' y='244' font-size='12' fill='#1f2328' font-weight='600' text-anchor='middle'>512</text><rect x='398.0' y='275.0' width='25.0' height='25.0' rx='0' fill='#b07aa1' stroke='#ffffff' stroke-width='1' opacity='0.85'/><text x='410.5' y='269' font-size='12' fill='#1f2328' font-weight='600' text-anchor='middle'>256</text><rect x='429.0' y='287.0' width='13.0' height='13.0' rx='0' fill='#9aa0a6' stroke='#ffffff' stroke-width='1' opacity='0.85'/><rect x='448.0' y='293.0' width='7.0' height='7.0' rx='0' fill='#9aa0a6' stroke='#ffffff' stroke-width='1' opacity='0.85'/><text x='463' y='295' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>…1</text><text x='30' y='330' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>mip 0</text><text x='236' y='330' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>mip 1</text><text x='342' y='330' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>mip 2 …</text><text x='30' y='362' font-size='14' fill='#1f2328' font-weight='600' text-anchor='start'>Each mip is ¼ of the one before:</text><text x='30' y='384' font-size='14' fill='#1f2328' font-weight='400' text-anchor='start'>1 + ¼ + 1/16 + 1/64 + … ≈ 4/3</text><text x='30' y='406' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>So the whole chain costs one third more</text><text x='30' y='424' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>than mip 0 alone.</text><rect x='30.0' y='444.0' width='300.0' height='22.0' rx='3' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><rect x='330.0' y='444.0' width='100.0' height='22.0' rx='3' fill='#59a14f' stroke='none' stroke-width='1' opacity='1'/><text x='180' y='460' font-size='12' fill='#ffffff' font-weight='600' text-anchor='middle'>mip 0: 3/4 of the chain</text><text x='380' y='460' font-size='12' fill='#ffffff' font-weight='600' text-anchor='middle'>the rest: 1/4</text><text x='480' y='100' font-size='15' fill='#1f2328' font-weight='700' text-anchor='start'>Same texture, four formats</text><text x='480' y='138' font-size='14' fill='#1f2328' font-weight='600' text-anchor='start'>RGBA32 (no compression)</text><text x='840' y='138' font-size='12' fill='#57606a' font-weight='400' text-anchor='end'>4 bytes / pixel</text><rect x='480.0' y='146.0' width='225.0' height='18.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><rect x='705.0' y='146.0' width='75.0' height='18.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='0.45'/><text x='774.0' y='160' font-size='12' fill='#ffffff' font-weight='700' text-anchor='end'>16 MB + mips = 21.33 MB</text><text x='480' y='200' font-size='14' fill='#1f2328' font-weight='600' text-anchor='start'>ASTC 4×4</text><text x='840' y='200' font-size='12' fill='#57606a' font-weight='400' text-anchor='end'>1 byte / pixel</text><rect x='480.0' y='208.0' width='56.3' height='18.0' rx='3' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><rect x='536.3' y='208.0' width='18.7' height='18.0' rx='3' fill='#4e79a7' stroke='none' stroke-width='1' opacity='0.45'/><text x='562.9648382559775' y='222' font-size='12' fill='#1f2328' font-weight='700' text-anchor='start'>4 MB + mips = 5.33 MB</text><text x='480' y='262' font-size='14' fill='#1f2328' font-weight='600' text-anchor='start'>ASTC 6×6</text><text x='840' y='262' font-size='12' fill='#57606a' font-weight='400' text-anchor='end'>0.45 bytes / pixel</text><rect x='480.0' y='270.0' width='25.0' height='18.0' rx='3' fill='#59a14f' stroke='none' stroke-width='1' opacity='1'/><rect x='505.0' y='270.0' width='8.4' height='18.0' rx='3' fill='#59a14f' stroke='none' stroke-width='1' opacity='0.45'/><text x='521.4739803094234' y='284' font-size='12' fill='#1f2328' font-weight='700' text-anchor='start'>1.78 MB + mips = 2.38 MB</text><text x='480' y='324' font-size='14' fill='#1f2328' font-weight='600' text-anchor='start'>ASTC 8×8</text><text x='840' y='324' font-size='12' fill='#57606a' font-weight='400' text-anchor='end'>0.25 bytes / pixel</text><rect x='480.0' y='332.0' width='14.1' height='18.0' rx='3' fill='#9aa0a6' stroke='none' stroke-width='1' opacity='1'/><rect x='494.1' y='332.0' width='4.6' height='18.0' rx='3' fill='#9aa0a6' stroke='none' stroke-width='1' opacity='0.45'/><text x='506.7060478199719' y='346' font-size='12' fill='#1f2328' font-weight='700' text-anchor='start'>1 MB + mips = 1.33 MB</text><rect x='480.0' y='378.0' width='360.0' height='64.0' rx='8' fill='#fff8f0' stroke='#f28e2b' stroke-width='1' opacity='1'/><text x='492' y='400' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>Read/Write Enabled keeps a CPU copy too.</text><text x='492' y='420' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>On a phone CPU and GPU share RAM:</text><text x='492' y='436' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>the texture is counted twice.</text><text x='480' y='470' font-size='15' fill='#1a7f37' font-weight='700' text-anchor='start'>Memory = width × height × bytes per pixel × 4/3</text></svg>