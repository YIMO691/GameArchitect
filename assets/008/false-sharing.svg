<text x='24.0' y='460.0' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>8 lines × 64 B = 512 B instead of 32 B. Each line stays in one core's cache: +0 ns per write.</text>
<text x='24.0' y='482.0' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Local variable: alive++ lives in a register; write aliveCount[w] once at the end. Works on any line size.</text>
<text x='24.0' y='504.0' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Apple M-series chips use 128-byte lines: pad to 128 B there, or use the local variable.</text>
