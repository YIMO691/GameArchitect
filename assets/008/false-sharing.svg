<text x='60.0' y='266.0' font-size='14' fill='#1f2328' font-weight='600' text-anchor='start'>One cache line = 64 bytes. Only one core may write a line at a time.</text>
<text x='60.0' y='286.0' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Each aliveCount[w]++ must first pull the whole line away from the core that wrote it last.</text>
<text x='60.0' y='306.0' font-size='13' fill='#e5534b' font-weight='600' text-anchor='start'>Different counters, same line: about +6.4 ns per write with 8 threads (approximate).</text>
<text x='24.0' y='350.0' font-size='16' fill='#1a7f37' font-weight='700' text-anchor='start'>Fix: pad each counter to its own 64-byte line (or count in a local variable)</text>
