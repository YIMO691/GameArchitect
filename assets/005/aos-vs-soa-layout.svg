<text x='576' y='128' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>To add up everyone's age in a class,</text>
<text x='576' y='147' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>you don't open each student's whole</text>
<text x='576' y='166' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>file. You read one list: the ages.</text>
<text x='576' y='188' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>SoA keeps that list ready.</text>
<text x='24' y='252' font-size='15' fill='#1f2328' font-weight='700' text-anchor='start'>AoS in memory: particle 0, particle 1, particle 2 … (fields mixed)</text>
