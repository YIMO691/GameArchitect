<svg xmlns='http://www.w3.org/2000/svg' width='860' height='356' viewBox='0 0 860 356' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>The average hides the spike</title><rect x='0.5' y='0.5' width='859' height='355' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>The average hides the spike</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Four frames in a row, after culling, with near every frame, mid every 2nd, far every 4th.</text><text x='24' y='100' font-size='15' fill='#cf222e' font-weight='700' text-anchor='start'>Together: average 3.14, worst 5.06</text><line x1='244.0' x2='244.0' y1='114' y2='278' stroke='#1a7f37' stroke-width='2.5' stroke-dasharray='6 4'/><text x='24' y='138' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>frame 1</text><rect x='94.0' y='122.0' width='253.0' height='24.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='353.0' y='139' font-size='13' fill='#cf222e' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>5.06</text><text x='24' y='178' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>frame 2</text><rect x='94.0' y='162.0' width='95.5' height='24.0' rx='3' fill='#59a14f' stroke='none' stroke-width='1' opacity='1'/><text x='195.5' y='179' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>1.91</text><text x='24' y='218' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>frame 3</text><rect x='94.0' y='202.0' width='183.0' height='24.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='283.0' y='219' font-size='13' fill='#cf222e' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>3.66</text><text x='24' y='258' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>frame 4</text><rect x='94.0' y='242.0' width='95.5' height='24.0' rx='3' fill='#59a14f' stroke='none' stroke-width='1' opacity='1'/><text x='195.5' y='259' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>1.91</text><text x='244.0' y='294' font-size='12' fill='#1a7f37' font-weight='700' text-anchor='middle'>budget 3</text><text x='450' y='100' font-size='15' fill='#1f2328' font-weight='700' text-anchor='start'>Staggered: every frame 3.14</text><line x1='670.0' x2='670.0' y1='114' y2='278' stroke='#1a7f37' stroke-width='2.5' stroke-dasharray='6 4'/><text x='450' y='138' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>frame 1</text><rect x='520.0' y='122.0' width='156.8' height='24.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='682.75' y='139' font-size='13' fill='#cf222e' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>3.14</text><text x='450' y='178' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>frame 2</text><rect x='520.0' y='162.0' width='156.8' height='24.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='682.75' y='179' font-size='13' fill='#cf222e' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>3.14</text><text x='450' y='218' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>frame 3</text><rect x='520.0' y='202.0' width='156.8' height='24.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='682.75' y='219' font-size='13' fill='#cf222e' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>3.14</text><text x='450' y='258' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>frame 4</text><rect x='520.0' y='242.0' width='156.8' height='24.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='682.75' y='259' font-size='13' fill='#cf222e' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>3.14</text><text x='670.0' y='294' font-size='12' fill='#1a7f37' font-weight='700' text-anchor='middle'>budget 3</text><text x='24' y='330' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Same work in total (12.54 ms over four frames). Staggering moves it, so no frame pays everyone at once.</text></svg>