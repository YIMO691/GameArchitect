<svg xmlns='http://www.w3.org/2000/svg' width='860' height='428' viewBox='0 0 860 428' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Energy per frame is the budget</title><rect x='0.5' y='0.5' width='859' height='427' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Energy per frame is the budget</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Sustained chip power is the real budget. Divide it by what one frame costs.</text><line x1='514.0' y1='84' x2='514.0' y2='356' stroke='#4e79a7' stroke-width='2' stroke-dasharray='5 4'/><text x='514.0' y='80' font-size='12' fill='#4e79a7' font-weight='700' text-anchor='middle'>2.2 W: what the phone can cool</text><text x='24' y='112' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>60 fps · full</text><text x='24' y='129' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>60 × 77 mJ</text><rect x='250.0' y='100.0' width='552.0' height='22.0' rx='4' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='810.0' y='116' font-size='12.5' fill='#cf222e' font-weight='700' text-anchor='start'>4.60 W</text><text x='250' y='138' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>throttles at 8 min, then 38 fps</text><text x='24' y='164' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>60 fps · full · adapt</text><text x='24' y='181' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>60 × 57.5 mJ</text><rect x='250.0' y='152.0' width='414.0' height='22.0' rx='4' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='672.0' y='168' font-size='12.5' fill='#cf222e' font-weight='700' text-anchor='start'>3.45 W</text><text x='250' y='190' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>throttles at 15.3 min, then 51 fps</text><text x='24' y='216' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>60 fps · mobile tier</text><text x='24' y='233' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>60 × 46 mJ</text><rect x='250.0' y='204.0' width='331.2' height='22.0' rx='4' fill='#f28e2b' stroke='none' stroke-width='1' opacity='1'/><text x='589.2' y='220' font-size='12.5' fill='#f28e2b' font-weight='700' text-anchor='start'>2.76 W</text><text x='250' y='242' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>throttles at 34.3 min</text><text x='24' y='268' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>60 fps · mobile · adapt</text><text x='24' y='285' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>60 × 36.7 mJ</text><rect x='250.0' y='256.0' width='264.0' height='22.0' rx='4' fill='#1a7f37' stroke='none' stroke-width='1' opacity='1'/><text x='522.0' y='272' font-size='12.5' fill='#1a7f37' font-weight='700' text-anchor='start'>2.20 W</text><text x='250' y='294' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>never: 60 fps all hour, 4.05 h battery</text><text x='24' y='320' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>30 fps · mobile tier</text><text x='24' y='337' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>30 × 46 mJ</text><rect x='250.0' y='308.0' width='165.6' height='22.0' rx='4' fill='#1a7f37' stroke='none' stroke-width='1' opacity='1'/><text x='423.6' y='324' font-size='12.5' fill='#1a7f37' font-weight='700' text-anchor='start'>1.38 W</text><text x='250' y='346' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>never: 5.17 h battery</text><rect x='24.0' y='364.0' width='812.0' height='44.0' rx='8' fill='#fff8e6' stroke='#d4a72c' stroke-width='1.5' opacity='1'/><text x='40' y='391' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>Sustained fps = 2.2 W ÷ energy per frame. Cheaper frames, or fewer of them, are the only way to keep it.</text></svg>