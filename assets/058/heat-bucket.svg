<svg xmlns='http://www.w3.org/2000/svg' width='860' height='444' viewBox='0 0 860 444' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Why phones slow down</title><rect x='0.5' y='0.5' width='859' height='443' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Why phones slow down</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>A phone is a bucket with a small hole: it can drain 2.2 W of chip heat forever, and hold 19.2 watt-minutes extra.</text><path d='M60,100 L80,320 L240,320 L260,100' fill='none' stroke='#1f2328' stroke-width='3'/><path d='M65,155.0 L80,320 L240,320 L255,155.0 Z' fill='#fde2d8' stroke='none'/><text x='160.0' y='225.0' font-size='13' fill='#cf222e' font-weight='700' text-anchor='middle'>stored heat</text><text x='160.0' y='245.0' font-size='12' fill='#1f2328' font-weight='400' text-anchor='middle'>19.2 W·min until full</text><line x1='160.0' y1='78' x2='160.0' y2='104.0' stroke='#cf222e' stroke-width='3'/><polygon points='160.0,114 166.0,104.0 154.0,104.0' fill='#cf222e'/><text x='170.0' y='94' font-size='12.5' fill='#cf222e' font-weight='700' text-anchor='start'>in: 4.6 W (60 fps, full)</text><line x1='160.0' y1='322' x2='160.0' y2='348.0' stroke='#4e79a7' stroke-width='3'/><polygon points='160.0,358 166.0,348.0 154.0,348.0' fill='#4e79a7'/><text x='172.0' y='350' font-size='12.5' fill='#4e79a7' font-weight='700' text-anchor='start'>out: 2.2 W, always</text><line x1='360' y1='300' x2='820' y2='300' stroke='#9aa0a6'/><line x1='360' y1='216' x2='820' y2='216' stroke='#eaeef2'/><text x='354' y='220.39999999999998' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='end'>2.2 W</text><line x1='360' y1='125' x2='820' y2='125' stroke='#eaeef2'/><text x='354' y='129.20000000000002' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='end'>4.6 W</text><path d='M360,125 L421,125 L421,216 L820,216' fill='none' stroke='#cf222e' stroke-width='3'/><path d='M360,220 L820,220' fill='none' stroke='#1a7f37' stroke-width='3' stroke-dasharray='6 4'/><text x='427.3333333333333' y='141.20000000000002' font-size='12' fill='#cf222e' font-weight='700' text-anchor='start'>bucket full at 8 min: clocks drop</text><text x='590.0' y='240.39999999999998' font-size='12' fill='#1a7f37' font-weight='700' text-anchor='middle'>adaptive game: asks for 2.2 W from the start</text><text x='360.0' y='318' font-size='11' fill='#57606a' font-weight='400' text-anchor='middle'>0 min</text><text x='475.0' y='318' font-size='11' fill='#57606a' font-weight='400' text-anchor='middle'>15 min</text><text x='590.0' y='318' font-size='11' fill='#57606a' font-weight='400' text-anchor='middle'>30 min</text><text x='705.0' y='318' font-size='11' fill='#57606a' font-weight='400' text-anchor='middle'>45 min</text><text x='820.0' y='318' font-size='11' fill='#57606a' font-weight='400' text-anchor='middle'>60 min</text><text x='360' y='100' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>Chip power over a session</text><rect x='24.0' y='380.0' width='812.0' height='44.0' rx='8' fill='#fff8e6' stroke='#d4a72c' stroke-width='1.5' opacity='1'/><text x='40' y='407' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>Time to throttle = 19.2 ÷ (power asked − 2.2). At 4.6 W: 8 minutes. At 2.2 W or less: never.</text></svg>