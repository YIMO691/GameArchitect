<svg xmlns='http://www.w3.org/2000/svg' width='860' height='446' viewBox='0 0 860 446' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Immediate-mode vs tile-based GPU</title><rect x='0.5' y='0.5' width='859' height='445' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Immediate-mode vs tile-based GPU</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Same frame, two kinds of GPU. Red arrows are trips to main memory: they cost time, battery and heat.</text><text x='24' y='96' font-size='16' fill='#1f2328' font-weight='700' text-anchor='start'>Immediate-mode (desktop style)</text><text x='24' y='116' font-size='12.5' fill='#57606a' font-weight='400' text-anchor='start'>reads and writes full buffers while drawing</text><rect x='24.0' y='132.0' width='390.0' height='110.0' rx='8' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><text x='219' y='152' font-size='13' fill='#1f2328' font-weight='600' text-anchor='middle'>GPU chip</text><rect x='24.0' y='320.0' width='390.0' height='70.0' rx='8' fill='#eef2f7' stroke='#d0d7de' stroke-width='1' opacity='1'/><text x='219' y='342' font-size='13' fill='#1f2328' font-weight='600' text-anchor='middle'>Main memory (RAM)</text><rect x='54.0' y='352.0' width='150.0' height='28.0' rx='4' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><text x='129' y='371' font-size='12' fill='#ffffff' font-weight='700' text-anchor='middle'>colour 4.39 MB</text><rect x='234.0' y='352.0' width='150.0' height='28.0' rx='4' fill='#b07aa1' stroke='none' stroke-width='1' opacity='1'/><text x='309' y='371' font-size='12' fill='#ffffff' font-weight='700' text-anchor='middle'>depth 4.39 MB</text><rect x='64.0' y='170.0' width='310.0' height='56.0' rx='6' fill='#ffffff' stroke='#d0d7de' stroke-width='1' opacity='1'/><text x='219' y='203' font-size='13' fill='#1f2328' font-weight='400' text-anchor='middle'>shader cores + caches</text><line x1='104' y1='226' x2='104.0' y2='340.0' stroke='#cf222e' stroke-width='2.5'/><polygon points='104,350 110.0,340.0 98.0,340.0' fill='#cf222e'/><line x1='174' y1='350' x2='174.0' y2='238.0' stroke='#cf222e' stroke-width='2.5'/><polygon points='174,228 168.0,238.0 180.0,238.0' fill='#cf222e'/><line x1='264' y1='226' x2='264.0' y2='340.0' stroke='#cf222e' stroke-width='2.5'/><polygon points='264,350 270.0,340.0 258.0,340.0' fill='#cf222e'/><line x1='334' y1='350' x2='334.0' y2='238.0' stroke='#cf222e' stroke-width='2.5'/><polygon points='334,228 328.0,238.0 340.0,238.0' fill='#cf222e'/><text x='219' y='280' font-size='12.5' fill='#cf222e' font-weight='700' text-anchor='middle' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>every depth test and blend</text><text x='219' y='298' font-size='12.5' fill='#cf222e' font-weight='700' text-anchor='middle' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>touches main memory</text><text x='442' y='96' font-size='16' fill='#1f2328' font-weight='700' text-anchor='start'>Tile-based (phones)</text><text x='442' y='116' font-size='12.5' fill='#57606a' font-weight='400' text-anchor='start'>draws one tile at a time on the chip</text><rect x='442.0' y='132.0' width='390.0' height='110.0' rx='8' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><text x='637' y='152' font-size='13' fill='#1f2328' font-weight='600' text-anchor='middle'>GPU chip</text><rect x='442.0' y='320.0' width='390.0' height='70.0' rx='8' fill='#eef2f7' stroke='#d0d7de' stroke-width='1' opacity='1'/><text x='637' y='342' font-size='13' fill='#1f2328' font-weight='600' text-anchor='middle'>Main memory (RAM)</text><rect x='472.0' y='352.0' width='150.0' height='28.0' rx='4' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><text x='547' y='371' font-size='12' fill='#ffffff' font-weight='700' text-anchor='middle'>colour 4.39 MB</text><rect x='652.0' y='352.0' width='150.0' height='28.0' rx='4' fill='#b07aa1' stroke='none' stroke-width='1' opacity='1'/><text x='727' y='371' font-size='12' fill='#ffffff' font-weight='700' text-anchor='middle'>depth 4.39 MB</text><rect x='472.0' y='170.0' width='160.0' height='56.0' rx='6' fill='#ffffff' stroke='#d0d7de' stroke-width='1' opacity='1'/><text x='552' y='203' font-size='13' fill='#1f2328' font-weight='400' text-anchor='middle'>shader cores</text><rect x='662.0' y='166.0' width='140.0' height='64.0' rx='6' fill='#dafbe1' stroke='#1a7f37' stroke-width='1' opacity='1'/><text x='732' y='190' font-size='13' fill='#1a7f37' font-weight='700' text-anchor='middle'>tile memory</text><text x='732' y='208' font-size='11.5' fill='#1f2328' font-weight='400' text-anchor='middle'>16×16 px: depth,</text><text x='732' y='222' font-size='11.5' fill='#1f2328' font-weight='400' text-anchor='middle'>blend, MSAA here</text><line x1='632' y1='198' x2='650.0' y2='198.0' stroke='#1a7f37' stroke-width='2.5'/><polygon points='660,198 650.0,192.0 650.0,204.0' fill='#1a7f37'/><line x1='712' y1='350' x2='712.0' y2='242.0' stroke='#cf222e' stroke-width='2.5'/><polygon points='712,232 706.0,242.0 718.0,242.0' fill='#cf222e'/><line x1='757' y1='232' x2='757.0' y2='340.0' stroke='#cf222e' stroke-width='2.5'/><polygon points='757,350 763.0,340.0 751.0,340.0' fill='#cf222e'/><text x='704' y='282' font-size='12' fill='#cf222e' font-weight='700' text-anchor='end' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>LOAD</text><text x='765' y='282' font-size='12' fill='#cf222e' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>STORE</text><text x='462' y='266' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='start'>Only at the start and the</text><text x='462' y='284' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='start'>end of a render pass,</text><text x='462' y='302' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='start'>and only if asked.</text><text x='24' y='420' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>With MSAA 4× each buffer holds 4 samples per pixel: 17.58 MB per load or store. On a tile GPU the samples can stay on the chip.</text></svg>