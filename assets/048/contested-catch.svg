<svg xmlns='http://www.w3.org/2000/svg' width='860' height='470' viewBox='0 0 860 470' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Two hooks, one fish</title><rect x='0.5' y='0.5' width='859' height='469' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Two hooks, one fish</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Players A and B hook the same fish 40 ms apart. Messages take 60 ms phone to phone, 25 ms phone to server.</text><text x='24' y='98' font-size='15' fill='#cf222e' font-weight='700' text-anchor='start'>❌ Peer to peer: each phone decides</text><text x='24' y='132' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>Phone A</text><line x1='150' y1='128' x2='774.0' y2='128' stroke='#d0d7de'/><text x='24' y='182' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>Phone B</text><line x1='150' y1='178' x2='774.0' y2='178' stroke='#d0d7de'/><circle cx='150.0' cy='128' r='6' fill='#4e79a7'/><text x='160' y='118' font-size='12' fill='#4e79a7' font-weight='700' text-anchor='start'>A hooks: "mine!"</text><circle cx='254.0' cy='178' r='6' fill='#b07aa1'/><text x='264.0' y='198' font-size='12' fill='#b07aa1' font-weight='700' text-anchor='start'>B hooks: "mine!"</text><line x1='154' y1='132' x2='296.4' y2='171.3' stroke='#4e79a7' stroke-width='1.8'/><polygon points='306.0,174 298.0,165.6 294.8,177.1' fill='#4e79a7'/><line x1='258.0' y1='174' x2='400.4' y2='134.7' stroke='#b07aa1' stroke-width='1.8'/><polygon points='410.0,132 398.8,128.9 402.0,140.4' fill='#b07aa1'/><text x='424.0' y='110' font-size='12.5' fill='#cf222e' font-weight='700' text-anchor='start'>news arrives at 60 and 100 ms: too late,</text><text x='424.0' y='126' font-size='12.5' fill='#cf222e' font-weight='700' text-anchor='start'>both phones already gave out the fish</text><text x='24' y='250' font-size='15' fill='#1a7f37' font-weight='700' text-anchor='start'>✅ Server decides</text><text x='24' y='284' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>Phone A</text><line x1='150' y1='280' x2='774.0' y2='280' stroke='#d0d7de'/><text x='24' y='334' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>Server</text><line x1='150' y1='330' x2='774.0' y2='330' stroke='#d0d7de'/><text x='24' y='384' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>Phone B</text><line x1='150' y1='380' x2='774.0' y2='380' stroke='#d0d7de'/><circle cx='150.0' cy='280' r='6' fill='#4e79a7'/><text x='160' y='270' font-size='12' fill='#4e79a7' font-weight='700' text-anchor='start'>A asks</text><circle cx='254.0' cy='380' r='6' fill='#b07aa1'/><text x='264.0' y='400' font-size='12' fill='#b07aa1' font-weight='700' text-anchor='start'>B asks</text><line x1='153' y1='284' x2='206.7' y2='320.4' stroke='#4e79a7' stroke-width='1.8'/><polygon points='215.0,326 210.1,315.4 203.4,325.4' fill='#4e79a7'/><line x1='257.0' y1='376' x2='310.7' y2='339.6' stroke='#b07aa1' stroke-width='1.8'/><polygon points='319.0,334 307.4,334.6 314.1,344.6' fill='#b07aa1'/><circle cx='319.0' cy='330' r='6' fill='#9aa0a6'/><circle cx='215.0' cy='330' r='6' fill='#d4a72c'/><text x='215.0' y='354' font-size='12' fill='#1f2328' font-weight='700' text-anchor='middle'>first: A wins</text><line x1='218.0' y1='326' x2='271.7' y2='289.6' stroke='#1a7f37' stroke-width='1.8'/><polygon points='280.0,284 268.4,284.6 275.1,294.6' fill='#1a7f37'/><text x='290.0' y='274' font-size='12' fill='#1a7f37' font-weight='700' text-anchor='start'>"fish is yours" at 50 ms</text><line x1='322.0' y1='334' x2='375.7' y2='370.4' stroke='#1a7f37' stroke-width='1.8'/><polygon points='384.0,376 379.1,365.4 372.4,375.4' fill='#1a7f37'/><text x='394.0' y='400' font-size='12' fill='#1a7f37' font-weight='700' text-anchor='start'>"it got away" at 90 ms</text><line x1='150' y1='436' x2='774.0' y2='436' stroke='#9aa0a6' stroke-width='1.5'/><line x1='150.0' y1='432' x2='150.0' y2='440' stroke='#9aa0a6'/><text x='150.0' y='454' font-size='11' fill='#57606a' font-weight='400' text-anchor='middle'>0 ms</text><line x1='254.0' y1='432' x2='254.0' y2='440' stroke='#9aa0a6'/><text x='254.0' y='454' font-size='11' fill='#57606a' font-weight='400' text-anchor='middle'>40 ms</text><line x1='358.0' y1='432' x2='358.0' y2='440' stroke='#9aa0a6'/><text x='358.0' y='454' font-size='11' fill='#57606a' font-weight='400' text-anchor='middle'>80 ms</text><line x1='462.0' y1='432' x2='462.0' y2='440' stroke='#9aa0a6'/><text x='462.0' y='454' font-size='11' fill='#57606a' font-weight='400' text-anchor='middle'>120 ms</text><line x1='566.0' y1='432' x2='566.0' y2='440' stroke='#9aa0a6'/><text x='566.0' y='454' font-size='11' fill='#57606a' font-weight='400' text-anchor='middle'>160 ms</text><line x1='670.0' y1='432' x2='670.0' y2='440' stroke='#9aa0a6'/><text x='670.0' y='454' font-size='11' fill='#57606a' font-weight='400' text-anchor='middle'>200 ms</text><line x1='774.0' y1='432' x2='774.0' y2='440' stroke='#9aa0a6'/><text x='774.0' y='454' font-size='11' fill='#57606a' font-weight='400' text-anchor='middle'>240 ms</text></svg>