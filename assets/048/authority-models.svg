es</text><text x='820' y='290' font-size='13' fill='#1a7f37' font-weight='700' text-anchor='end'>0</text><text x='592' y='318' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>Cut short</text><text x='820' y='318' font-size='13' fill='#1a7f37' font-weight='700' text-anchor='end'>0</text><text x='592' y='346' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>Wait for an answer</text><text x='820' y='346' font-size='13' fill='#f28e2b' font-weight='700' text-anchor='end'>50 ms</text><text x='592' y='374' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>Bill a month</text><text x='820' y='374' font-size='13' fill='#f28e2b' font-weight='700' text-anchor='end'>$3,000</text><text x='24' y='436' font-size='12.5' fill='#57606a' font-weight='400' text-anchor='start'>★ = decides catches.  Player D runs a modified app that claims a legendary fish on every cast.</text></svg>