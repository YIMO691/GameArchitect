<svg xmlns='http://www.w3.org/2000/svg' width='860' height='376' viewBox='0 0 860 376' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Which slice answers the questions?</title><rect x='0.5' y='0.5' width='859' height='375' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Which slice answers the questions?</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Four possible slices. Only one tests the questions that could sink the project.</text><text x='355.0' y='100' font-size='13' fill='#1f2328' font-weight='700' text-anchor='middle'>Sunny reef (easy)</text><text x='675.0' y='100' font-size='13' fill='#1f2328' font-weight='700' text-anchor='middle'>Trench at night (hard)</text><text x='184' y='160' font-size='13' fill='#1f2328' font-weight='700' text-anchor='end'>Grey boxes</text><text x='184' y='270' font-size='13' fill='#1f2328' font-weight='700' text-anchor='end'>Final quality</text><rect x='200.0' y='110.0' width='310.0' height='100.0' rx='8' fill='#fff8e6' stroke='#d4a72c' stroke-width='1.6' opacity='1'/><text x='214' y='138' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>8 min playable</text><text x='214' y='162' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>answers: fun</text><text x='214' y='188' font-size='12.5' fill='#f28e2b' font-weight='700' text-anchor='start'>46 team-weeks unknown</text><rect x='520.0' y='110.0' width='310.0' height='100.0' rx='8' fill='#fff8e6' stroke='#d4a72c' stroke-width='1.6' opacity='1'/><text x='534' y='138' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>6 min playable</text><text x='534' y='162' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>answers: fun, streaming</text><text x='534' y='188' font-size='12.5' fill='#f28e2b' font-weight='700' text-anchor='start'>36 team-weeks unknown</text><rect x='200.0' y='220.0' width='310.0' height='100.0' rx='8' fill='#fff1f0' stroke='#cf222e' stroke-width='1.6' opacity='1'/><text x='214' y='248' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>4 min playable</text><text x='214' y='272' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>fun; content cost too low (2)</text><text x='214' y='298' font-size='12.5' fill='#cf222e' font-weight='700' text-anchor='start'>46 team-weeks unknown</text><rect x='520.0' y='220.0' width='310.0' height='100.0' rx='8' fill='#dafbe1' stroke='#1a7f37' stroke-width='1.6' opacity='1'/><text x='534' y='248' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>3 min playable</text><text x='534' y='272' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>all four answered</text><text x='534' y='298' font-size='12.5' fill='#1a7f37' font-weight='700' text-anchor='start'>0 team-weeks unknown</text><text x='24' y='356' font-size='12.5' fill='#57606a' font-weight='600' text-anchor='start'>The easy, beautiful slice is the most misleading one: it proves what nobody doubted and underprices the content.</text></svg>