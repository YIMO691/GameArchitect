<svg xmlns='http://www.w3.org/2000/svg' width='880' height='440' viewBox='0 0 880 440' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Per-step cost of helper access: singleton 0.003 ms, locator lookup in the loop 0.12 ms, cached or injected 0.003 ms</title><defs><marker id='ag' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#1a7f37'/></marker><marker id='ar' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#9aa0a6'/></marker><marker id='ab' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#57606a'/></marker></defs><rect x='0.5' y='0.5' width='879' height='439' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' fill='#1f2328' font-weight='bold' text-anchor='start'>1,000 gulls × 3 helpers = 3,000 uses per step. What do they cost?</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>Approximate phone numbers. Bars: critters + events + helper access, per physics step. Green line: 1.0 ms budget.</text><line x1='250.0' y1='82' x2='250.0' y2='330' stroke='#eaeef2' stroke-width='1'/><text x='250.0' y='348' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>0.0 ms</text><line x1='341.6666666666667' y1='82' x2='341.6666666666667' y2='330' stroke='#eaeef2' stroke-width='1'/><text x='341.6666666666667' y='348' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>0.2 ms</text><line x1='433.33333333333337' y1='82' x2='433.33333333333337' y2='330' stroke='#eaeef2' stroke-width='1'/><text x='433.33333333333337' y='348' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>0.4 ms</text><line x1='525.0' y1='82' x2='525.0' y2='330' stroke='#eaeef2' stroke-width='1'/><text x='525.0' y='348' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>0.6 ms</text><line x1='616.6666666666667' y1='82' x2='616.6666666666667' y2='330' stroke='#eaeef2' stroke-width='1'/><text x='616.6666666666667' y='348' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>0.8 ms</text><line x1='708.3333333333334' y1='82' x2='708.3333333333334' y2='330' stroke='#eaeef2' stroke-width='1'/><text x='708.3333333333334' y='348' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>1.0 ms</text><line x1='800.0' y1='82' x2='800.0' y2='330' stroke='#eaeef2' stroke-width='1'/><text x='800.0' y='348' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>1.2 ms</text><text x='24' y='110' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start'>Singleton field</text><text x='24' y='128' font-size='11.5' fill='#57606a' font-weight='normal' text-anchor='start' font-family='Consolas, Menlo, monospace'>Ocean.Instance</text><rect x='250' y='96' width='151.25' height='30' rx='3' fill='#4e79a7' stroke='none' stroke-width='1.5'/><rect x='401.25' y='96' width='2' height='30' rx='3' fill='#1a7f37' stroke='none' stroke-width='1.5'/><text x='410.625' y='110' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='start'>0.33 ms</text><text x='410.625' y='126' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>3,000 × 1 ns = 0.003 ms</text><text x='24' y='168' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start'>Locator in the loop</text><text x='24' y='186' font-size='11.5' fill='#57606a' font-weight='normal' text-anchor='start' font-family='Consolas, Menlo, monospace'>Services.Get&lt;IWaterQuery&gt;()</text><rect x='250' y='154' width='151.25' height='30' rx='3' fill='#4e79a7' stroke='none' stroke-width='1.5'/><rect x='401.25' y='154' width='55.0' height='30' rx='3' fill='#e5534b' stroke='none' stroke-width='1.5'/><text x='464.25' y='168' font-size='13' fill='#cf222e' font-weight='bold' text-anchor='start'>0.45 ms</text><text x='464.25' y='184' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>3,000 × 40 ns = 0.12 ms</text><text x='24' y='226' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start'>Locator, cached once</text><text x='24' y='244' font-size='11.5' fill='#57606a' font-weight='normal' text-anchor='start' font-family='Consolas, Menlo, monospace'>field set in OnCreate</text><rect x='250' y='212' width='151.25' height='30' rx='3' fill='#4e79a7' stroke='none' stroke-width='1.5'/><rect x='401.25' y='212' width='2' height='30' rx='3' fill='#1a7f37' stroke='none' stroke-width='1.5'/><text x='410.625' y='226' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='start'>0.33 ms</text><text x='410.625' y='242' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>3,000 × 1 ns = 0.003 ms</text><text x='24' y='284' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start'>Injected field</text><text x='24' y='302' font-size='11.5' fill='#57606a' font-weight='normal' text-anchor='start' font-family='Consolas, Menlo, monospace'>this.water</text><rect x='250' y='270' width='151.25' height='30' rx='3' fill='#4e79a7' stroke='none' stroke-width='1.5'/><rect x='401.25' y='270' width='2' height='30' rx='3' fill='#1a7f37' stroke='none' stroke-width='1.5'/><text x='410.625' y='284' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='start'>0.33 ms</text><text x='410.625' y='300' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>3,000 × 1 ns = 0.003 ms</text><line x1='708.3333333333334' y1='84' x2='708.3333333333334' y2='330' stroke='#1a7f37' stroke-width='2.5'/><text x='714.3333333333334' y='96' font-size='12' fill='#1a7f37' font-weight='bold' text-anchor='start'>budget 1.0 ms</text><rect x='24' y='366' width='12' height='12' rx='2' fill='#4e79a7' stroke='none' stroke-width='1.5'/><text x='42' y='377' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>critters + events, 0.33 ms (Lesson 014)</text><rect x='330' y='366' width='12' height='12' rx='2' fill='#e5534b' stroke='none' stroke-width='1.5'/><text x='348' y='377' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>Get&lt;T&gt;(): dictionary lookup 35 ns + cast 5 ns = 40 ns</text><text x='24' y='414' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='start'>Singletons were never slow. The locator is slow only when you ask the phone book again for every gull.</text></svg>