<svg xmlns='http://www.w3.org/2000/svg' width='880' height='484' viewBox='0 0 880 484' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Good boot, bad boot and DI container: the bad boot reads the high score before it is loaded and saves over it</title><defs><marker id='ag' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#1a7f37'/></marker><marker id='ar' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#9aa0a6'/></marker><marker id='ab' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#57606a'/></marker></defs><rect x='0.5' y='0.5' width='879' height='483' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' fill='#1f2328' font-weight='bold' text-anchor='start'>Who wakes up first? The high score that turned into 0</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>Unity does not promise the Awake order between objects. Saved high score: 12,480.</text><rect x='20' y='84' width='840' height='108' rx='10' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1.5'/><text x='36' y='114' font-size='15' fill='#1a7f37' font-weight='bold' text-anchor='start'>Good boot</text><text x='36' y='134' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>24 of 25 cold starts</text><rect x='170' y='106' width='160' height='60' rx='8' fill='#ffffff' stroke='#4e79a7' stroke-width='1.6'/><text x='250' y='130' font-size='12' fill='#1f2328' font-weight='bold' text-anchor='middle' font-family='Consolas, Menlo, monospace'>SaveSystem.Awake</text><text x='250' y='150' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>loads file: 12,480</text><line x1='330' y1='136' x2='346' y2='136' stroke='#57606a' stroke-width='1.5' marker-end='url(#ab)'/><rect x='348' y='106' width='160' height='60' rx='8' fill='#ffffff' stroke='#4e79a7' stroke-width='1.6'/><text x='428' y='130' font-size='12' fill='#1f2328' font-weight='bold' text-anchor='middle' font-family='Consolas, Menlo, monospace'>ScoreManager.Awake</text><text x='428' y='150' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>reads 12,480</text><line x1='508' y1='136' x2='524' y2='136' stroke='#57606a' stroke-width='1.5' marker-end='url(#ab)'/><rect x='526' y='106' width='160' height='60' rx='8' fill='#ffffff' stroke='#9aa0a6' stroke-width='1.6'/><text x='606' y='130' font-size='12' fill='#1f2328' font-weight='bold' text-anchor='middle' font-family='Consolas, Menlo, monospace'>Run ends: 3,150</text><text x='606' y='150' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>3,150 &lt; 12,480, no save</text><text x='712' y='134' font-size='14' fill='#1a7f37' font-weight='bold' text-anchor='start'>High score 12,480 ✅</text><text x='712' y='154' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>time →</text><rect x='20' y='204' width='840' height='108' rx='10' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1.5'/><text x='36' y='234' font-size='15' fill='#cf222e' font-weight='bold' text-anchor='start'>Bad boot</text><text x='36' y='254' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>1 of 25 cold starts</text><rect x='170' y='226' width='160' height='60' rx='8' fill='#ffffff' stroke='#e5534b' stroke-width='1.6'/><text x='250' y='250' font-size='12' fill='#1f2328' font-weight='bold' text-anchor='middle' font-family='Consolas, Menlo, monospace'>ScoreManager.Awake</text><text x='250' y='270' font-size='12' fill='#cf222e' font-weight='bold' text-anchor='middle'>reads 0: not loaded yet</text><line x1='330' y1='256' x2='346' y2='256' stroke='#57606a' stroke-width='1.5' marker-end='url(#ab)'/><rect x='348' y='226' width='160' height='60' rx='8' fill='#ffffff' stroke='#9aa0a6' stroke-width='1.6'/><text x='428' y='250' font-size='12' fill='#1f2328' font-weight='bold' text-anchor='middle' font-family='Consolas, Menlo, monospace'>SaveSystem.Awake</text><text x='428' y='270' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>loads 12,480: too late</text><line x1='508' y1='256' x2='524' y2='256' stroke='#57606a' stroke-width='1.5' marker-end='url(#ab)'/><rect x='526' y='226' width='160' height='60' rx='8' fill='#ffffff' stroke='#e5534b' stroke-width='1.6'/><text x='606' y='250' font-size='12' fill='#1f2328' font-weight='bold' text-anchor='middle' font-family='Consolas, Menlo, monospace'>Run ends: 3,150</text><text x='606' y='270' font-size='12' fill='#cf222e' font-weight='bold' text-anchor='middle'>3,150 &gt; 0: Save(3,150)</text><text x='712' y='254' font-size='14' fill='#cf222e' font-weight='bold' text-anchor='start'>12,480 is gone ❌</text><text x='712' y='274' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>time →</text><rect x='20' y='324' width='840' height='108' rx='10' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1.5'/><text x='36' y='354' font-size='15' fill='#1a7f37' font-weight='bold' text-anchor='start'>DI container</text><text x='36' y='374' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>every start</text><rect x='170' y='346' width='160' height='60' rx='8' fill='#ffffff' stroke='#1a7f37' stroke-width='1.6'/><text x='250' y='370' font-size='12' fill='#1f2328' font-weight='bold' text-anchor='middle' font-family='Consolas, Menlo, monospace'>new SaveSystem()</text><text x='250' y='390' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>loads file: 12,480</text><line x1='330' y1='376' x2='346' y2='376' stroke='#57606a' stroke-width='1.5' marker-end='url(#ab)'/><rect x='348' y='346' width='160' height='60' rx='8' fill='#ffffff' stroke='#1a7f37' stroke-width='1.6'/><text x='428' y='370' font-size='12' fill='#1f2328' font-weight='bold' text-anchor='middle' font-family='Consolas, Menlo, monospace'>new ScoreService(..)</text><text x='428' y='390' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>needs save, so 2nd</text><line x1='508' y1='376' x2='524' y2='376' stroke='#57606a' stroke-width='1.5' marker-end='url(#ab)'/><rect x='526' y='346' width='160' height='60' rx='8' fill='#ffffff' stroke='#9aa0a6' stroke-width='1.6'/><text x='606' y='370' font-size='12' fill='#1f2328' font-weight='bold' text-anchor='middle' font-family='Consolas, Menlo, monospace'>Run ends: 3,150</text><text x='606' y='390' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>3,150 &lt; 12,480, no save</text><text x='712' y='374' font-size='14' fill='#1a7f37' font-weight='bold' text-anchor='start'>High score 12,480 ✅</text><text x='712' y='394' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>time →</text><text x='24' y='464' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>The container reads each constructor, so it must build SaveSystem before ScoreService. The order is in the code, not in luck.</text></svg>