<svg xmlns='http://www.w3.org/2000/svg' width='880' height='470' viewBox='0 0 880 470' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Singletons hide GullDiveSystem's five helpers inside its body; constructor injection lists them in the header</title><defs><marker id='ag' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#1a7f37'/></marker><marker id='ar' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#9aa0a6'/></marker><marker id='ab' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#57606a'/></marker></defs><rect x='0.5' y='0.5' width='879' height='469' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' fill='#1f2328' font-weight='bold' text-anchor='start'>Where do GullDiveSystem's five helpers come from?</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>Same class, same five helpers. Left: singletons, found by reading the whole body. Right: constructor injection.</text><rect x='20' y='80' width='410' height='330' rx='10' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1.5'/><text x='36' y='106' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='start'>❌ Singletons</text><text x='36' y='126' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>The header lists nothing. The body reaches out.</text><rect x='36' y='144' width='218' height='226' rx='8' fill='#ffffff' stroke='#e5534b' stroke-width='1.6'/><text x='46' y='164' font-size='12' fill='#1f2328' font-weight='bold' text-anchor='start' font-family='Consolas, Menlo, monospace'>class GullDiveSystem</text><text x='46' y='180' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start' font-family='Consolas, Menlo, monospace'>  // no fields, no params</text><line x1='44' y1='190' x2='246' y2='190' stroke='#d0d7de' stroke-width='1'/><text x='46' y='210' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start' font-family='Consolas, Menlo, monospace'>void Step() {</text><text x='46' y='228' font-size='12' fill='#cf222e' font-weight='bold' text-anchor='start' font-family='Consolas, Menlo, monospace'>  FishIndex.Instance</text><text x='46' y='246' font-size='12' fill='#cf222e' font-weight='bold' text-anchor='start' font-family='Consolas, Menlo, monospace'>  Ocean.Instance</text><text x='46' y='264' font-size='12' fill='#cf222e' font-weight='bold' text-anchor='start' font-family='Consolas, Menlo, monospace'>  GameRandom.Instance</text><text x='46' y='282' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start' font-family='Consolas, Menlo, monospace'>  ...200 lines later...</text><text x='46' y='300' font-size='12' fill='#cf222e' font-weight='bold' text-anchor='start' font-family='Consolas, Menlo, monospace'>  EventQueues.Instance</text><text x='46' y='318' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start' font-family='Consolas, Menlo, monospace'>  ...</text><text x='46' y='336' font-size='12' fill='#cf222e' font-weight='bold' text-anchor='start' font-family='Consolas, Menlo, monospace'>  GameClock.Instance</text><text x='46' y='354' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start' font-family='Consolas, Menlo, monospace'>  ... 412 lines ...</text><line x1='254' y1='224' x2='298' y2='165' stroke='#9aa0a6' stroke-width='1.4' stroke-dasharray='5 4' marker-end='url(#ar)'/><rect x='300' y='150' width='120' height='30' rx='6' fill='#ffffff' stroke='#9aa0a6' stroke-width='1.5'/><text x='360' y='170' font-size='12' fill='#1f2328' font-weight='normal' text-anchor='middle'>FishIndex</text><line x1='254' y1='242' x2='298' y2='209' stroke='#9aa0a6' stroke-width='1.4' stroke-dasharray='5 4' marker-end='url(#ar)'/><rect x='300' y='194' width='120' height='30' rx='6' fill='#ffffff' stroke='#9aa0a6' stroke-width='1.5'/><text x='360' y='214' font-size='12' fill='#1f2328' font-weight='normal' text-anchor='middle'>Ocean (water)</text><line x1='254' y1='260' x2='298' y2='253' stroke='#9aa0a6' stroke-width='1.4' stroke-dasharray='5 4' marker-end='url(#ar)'/><rect x='300' y='238' width='120' height='30' rx='6' fill='#ffffff' stroke='#9aa0a6' stroke-width='1.5'/><text x='360' y='258' font-size='12' fill='#1f2328' font-weight='normal' text-anchor='middle'>GameRandom</text><line x1='254' y1='296' x2='298' y2='297' stroke='#9aa0a6' stroke-width='1.4' stroke-dasharray='5 4' marker-end='url(#ar)'/><rect x='300' y='282' width='120' height='30' rx='6' fill='#ffffff' stroke='#9aa0a6' stroke-width='1.5'/><text x='360' y='302' font-size='12' fill='#1f2328' font-weight='normal' text-anchor='middle'>FishCaught queue</text><line x1='254' y1='332' x2='298' y2='341' stroke='#9aa0a6' stroke-width='1.4' stroke-dasharray='5 4' marker-end='url(#ar)'/><rect x='300' y='326' width='120' height='30' rx='6' fill='#ffffff' stroke='#9aa0a6' stroke-width='1.5'/><text x='360' y='346' font-size='12' fill='#1f2328' font-weight='normal' text-anchor='middle'>GameClock</text><text x='36' y='394' font-size='13' fill='#cf222e' font-weight='bold' text-anchor='start'>Header: 0 helpers. Real count: 5, hidden.</text><rect x='450' y='80' width='410' height='330' rx='10' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1.5'/><text x='466' y='106' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='start'>✅ Constructor injection</text><text x='466' y='126' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>The header lists every helper.</text><rect x='466' y='144' width='218' height='226' rx='8' fill='#ffffff' stroke='#1a7f37' stroke-width='1.6'/><rect x='466' y='144' width='218' height='106' rx='8' fill='#dafbe1' stroke='none' stroke-width='1.5'/><text x='476' y='164' font-size='12' fill='#1f2328' font-weight='bold' text-anchor='start' font-family='Consolas, Menlo, monospace'>class GullDiveSystem</text><text x='476' y='180' font-size='12' fill='#1a7f37' font-weight='normal' text-anchor='start' font-family='Consolas, Menlo, monospace'>  (IFishIndex fish,</text><text x='476' y='196' font-size='12' fill='#1a7f37' font-weight='normal' text-anchor='start' font-family='Consolas, Menlo, monospace'>   IWaterQuery water,</text><text x='476' y='212' font-size='12' fill='#1a7f37' font-weight='normal' text-anchor='start' font-family='Consolas, Menlo, monospace'>   IRandom rng,</text><text x='476' y='228' font-size='12' fill='#1a7f37' font-weight='normal' text-anchor='start' font-family='Consolas, Menlo, monospace'>   EventQueue&lt;FishCaught&gt; q,</text><text x='476' y='244' font-size='12' fill='#1a7f37' font-weight='normal' text-anchor='start' font-family='Consolas, Menlo, monospace'>   IGameClock clock)</text><line x1='474' y1='256' x2='676' y2='256' stroke='#d0d7de' stroke-width='1'/><text x='476' y='276' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start' font-family='Consolas, Menlo, monospace'>void Step() {</text><text x='476' y='294' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start' font-family='Consolas, Menlo, monospace'>  fish.Nearest(...)</text><text x='476' y='312' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start' font-family='Consolas, Menlo, monospace'>  water.Depth(...)</text><text x='476' y='330' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start' font-family='Consolas, Menlo, monospace'>  rng.Next()</text><text x='476' y='348' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start' font-family='Consolas, Menlo, monospace'>  ... 412 lines ...</text><line x1='684' y1='170' x2='728' y2='165' stroke='#1a7f37' stroke-width='1.6' marker-end='url(#ag)'/><rect x='730' y='150' width='120' height='30' rx='6' fill='#ffffff' stroke='#1a7f37' stroke-width='1.5'/><text x='790' y='170' font-size='12' fill='#1f2328' font-weight='normal' text-anchor='middle'>FishIndex</text><line x1='684' y1='186' x2='728' y2='209' stroke='#1a7f37' stroke-width='1.6' marker-end='url(#ag)'/><rect x='730' y='194' width='120' height='30' rx='6' fill='#ffffff' stroke='#1a7f37' stroke-width='1.5'/><text x='790' y='214' font-size='12' fill='#1f2328' font-weight='normal' text-anchor='middle'>Ocean (water)</text><line x1='684' y1='202' x2='728' y2='253' stroke='#1a7f37' stroke-width='1.6' marker-end='url(#ag)'/><rect x='730' y='238' width='120' height='30' rx='6' fill='#ffffff' stroke='#1a7f37' stroke-width='1.5'/><text x='790' y='258' font-size='12' fill='#1f2328' font-weight='normal' text-anchor='middle'>GameRandom</text><line x1='684' y1='218' x2='728' y2='297' stroke='#1a7f37' stroke-width='1.6' marker-end='url(#ag)'/><rect x='730' y='282' width='120' height='30' rx='6' fill='#ffffff' stroke='#1a7f37' stroke-width='1.5'/><text x='790' y='302' font-size='12' fill='#1f2328' font-weight='normal' text-anchor='middle'>FishCaught queue</text><line x1='684' y1='234' x2='728' y2='341' stroke='#1a7f37' stroke-width='1.6' marker-end='url(#ag)'/><rect x='730' y='326' width='120' height='30' rx='6' fill='#ffffff' stroke='#1a7f37' stroke-width='1.5'/><text x='790' y='346' font-size='12' fill='#1f2328' font-weight='normal' text-anchor='middle'>GameClock</text><text x='466' y='394' font-size='13' fill='#1a7f37' font-weight='bold' text-anchor='start'>Header: 5 helpers. A test hands in 5 fakes.</text><text x='24' y='440' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>Analogy: a recipe that lists its ingredients at the top vs one that says "now take something from the fridge" on page 3.</text></svg>