<svg xmlns='http://www.w3.org/2000/svg' width='860' height='372' viewBox='0 0 860 372' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Why batching saves battery</title><rect x='0.5' y='0.5' width='859' height='371' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Why batching saves battery</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Each request wakes the phone's radio, which then stays in high power for a few seconds (the "tail").</text><text x='24' y='108' font-size='14' fill='#cf222e' font-weight='700' text-anchor='start'>One request each</text><text x='24' y='126' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>every ~9 s (400 an hour)</text><rect x='180.0' y='90.0' width='600.0' height='30.0' rx='4' fill='#ffffff' stroke='#d0d7de' stroke-width='1' opacity='1'/><rect x='180.0' y='90.0' width='25.0' height='30.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='0.75'/><rect x='225.0' y='90.0' width='25.0' height='30.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='0.75'/><rect x='270.0' y='90.0' width='25.0' height='30.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='0.75'/><rect x='315.0' y='90.0' width='25.0' height='30.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='0.75'/><rect x='360.0' y='90.0' width='25.0' height='30.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='0.75'/><rect x='405.0' y='90.0' width='25.0' height='30.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='0.75'/><rect x='450.0' y='90.0' width='25.0' height='30.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='0.75'/><rect x='495.0' y='90.0' width='25.0' height='30.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='0.75'/><rect x='540.0' y='90.0' width='25.0' height='30.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='0.75'/><rect x='585.0' y='90.0' width='25.0' height='30.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='0.75'/><rect x='630.0' y='90.0' width='25.0' height='30.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='0.75'/><rect x='675.0' y='90.0' width='25.0' height='30.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='0.75'/><rect x='720.0' y='90.0' width='25.0' height='30.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='0.75'/><rect x='765.0' y='90.0' width='15.0' height='30.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='0.75'/><line x1='180.0' y1='86' x2='180.0' y2='124' stroke='#1f2328' stroke-width='1.2'/><line x1='225.0' y1='86' x2='225.0' y2='124' stroke='#1f2328' stroke-width='1.2'/><line x1='270.0' y1='86' x2='270.0' y2='124' stroke='#1f2328' stroke-width='1.2'/><line x1='315.0' y1='86' x2='315.0' y2='124' stroke='#1f2328' stroke-width='1.2'/><line x1='360.0' y1='86' x2='360.0' y2='124' stroke='#1f2328' stroke-width='1.2'/><line x1='405.0' y1='86' x2='405.0' y2='124' stroke='#1f2328' stroke-width='1.2'/><line x1='450.0' y1='86' x2='450.0' y2='124' stroke='#1f2328' stroke-width='1.2'/><line x1='495.0' y1='86' x2='495.0' y2='124' stroke='#1f2328' stroke-width='1.2'/><line x1='540.0' y1='86' x2='540.0' y2='124' stroke='#1f2328' stroke-width='1.2'/><line x1='585.0' y1='86' x2='585.0' y2='124' stroke='#1f2328' stroke-width='1.2'/><line x1='630.0' y1='86' x2='630.0' y2='124' stroke='#1f2328' stroke-width='1.2'/><line x1='675.0' y1='86' x2='675.0' y2='124' stroke='#1f2328' stroke-width='1.2'/><line x1='720.0' y1='86' x2='720.0' y2='124' stroke='#1f2328' stroke-width='1.2'/><line x1='765.0' y1='86' x2='765.0' y2='124' stroke='#1f2328' stroke-width='1.2'/><text x='788.0' y='110' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start'>57% on</text><text x='24' y='188' font-size='14' fill='#1a7f37' font-weight='700' text-anchor='start'>Batched</text><text x='24' y='206' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>every 60 s</text><rect x='180.0' y='170.0' width='600.0' height='30.0' rx='4' fill='#ffffff' stroke='#d0d7de' stroke-width='1' opacity='1'/><rect x='180.0' y='170.0' width='25.0' height='30.0' rx='3' fill='#1a7f37' stroke='none' stroke-width='1' opacity='0.75'/><rect x='480.0' y='170.0' width='25.0' height='30.0' rx='3' fill='#1a7f37' stroke='none' stroke-width='1' opacity='0.75'/><line x1='180.0' y1='166' x2='180.0' y2='204' stroke='#1f2328' stroke-width='1.2'/><line x1='480.0' y1='166' x2='480.0' y2='204' stroke='#1f2328' stroke-width='1.2'/><text x='788.0' y='190' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start'>8% on</text><text x='180.0' y='228' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='middle'>0 s</text><text x='330.0' y='228' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='middle'>30 s</text><text x='480.0' y='228' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='middle'>60 s</text><text x='630.0' y='228' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='middle'>90 s</text><text x='780.0' y='228' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='middle'>120 s</text><text x='24' y='268' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='start'>Radio high-power time over 2 minutes (shaded). Each black line is one request.</text><rect x='24.0' y='288.0' width='812.0' height='64.0' rx='8' fill='#fff8e6' stroke='#d4a72c' stroke-width='1.5' opacity='1'/><text x='40' y='312' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>One request each: 6% battery and 480 KB an hour. Batched and compressed: 0.8% and 90 KB.</text><text x='40' y='333' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>Also send when the app goes to the background, and keep unsent batches on disk for the next start.</text></svg>