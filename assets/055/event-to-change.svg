<svg xmlns='http://www.w3.org/2000/svg' width='860' height='430' viewBox='0 0 860 430' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>From an event to a safe change</title><rect x='0.5' y='0.5' width='859' height='429' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>From an event to a safe change</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Typed events answer the question; remote config and a staged rollout act on the answer.</text><rect x='24.0' y='82.0' width='300.0' height='150.0' rx='8' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1.2' opacity='1'/><text x='40' y='106' font-size='12.5' font-family='Menlo, Consolas, monospace' fill='#1f2328'>tutorial_step {</text><text x='40' y='123' font-size='12.5' font-family='Menlo, Consolas, monospace' fill='#1f2328'>  schema: 3,</text><text x='40' y='140' font-size='12.5' font-family='Menlo, Consolas, monospace' fill='#1f2328'>  player: "a91f…",</text><text x='40' y='157' font-size='12.5' font-family='Menlo, Consolas, monospace' fill='#1f2328'>  step: 3,</text><text x='40' y='174' font-size='12.5' font-family='Menlo, Consolas, monospace' fill='#1f2328'>  result: "fail",</text><text x='40' y='191' font-size='12.5' font-family='Menlo, Consolas, monospace' fill='#1f2328'>  seconds: 74</text><text x='40' y='208' font-size='12.5' font-family='Menlo, Consolas, monospace' fill='#1f2328'>}</text><text x='24' y='252' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>One typed event, versioned like a save file</text><text x='360' y='90' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>New players reaching each tutorial step</text><text x='360' y='119' font-size='12' fill='#1f2328' font-weight='400' text-anchor='start'>Started</text><rect x='490.0' y='104.0' width='290.0' height='20.0' rx='3' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><text x='786.0' y='119' font-size='12' fill='#4e79a7' font-weight='700' text-anchor='start'>100%</text><text x='360' y='149' font-size='12' fill='#1f2328' font-weight='400' text-anchor='start'>Step 1: cast</text><rect x='490.0' y='134.0' width='281.3' height='20.0' rx='3' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><text x='777.3' y='149' font-size='12' fill='#4e79a7' font-weight='700' text-anchor='start'>97%</text><text x='360' y='179' font-size='12' fill='#1f2328' font-weight='400' text-anchor='start'>Step 2: reel</text><rect x='490.0' y='164.0' width='266.8' height='20.0' rx='3' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><text x='762.8' y='179' font-size='12' fill='#4e79a7' font-weight='700' text-anchor='start'>92%</text><text x='360' y='209' font-size='12' fill='#1f2328' font-weight='400' text-anchor='start'>Step 3: tie a knot</text><rect x='490.0' y='194.0' width='104.4' height='20.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='600.4' y='209' font-size='12' fill='#cf222e' font-weight='700' text-anchor='start'>36%</text><text x='360' y='239' font-size='12' fill='#1f2328' font-weight='400' text-anchor='start'>Step 4: sell</text><rect x='490.0' y='224.0' width='101.5' height='20.0' rx='3' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><text x='597.5' y='239' font-size='12' fill='#4e79a7' font-weight='700' text-anchor='start'>35%</text><text x='360' y='266' font-size='12.5' fill='#cf222e' font-weight='700' text-anchor='start'>61% of players who reach step 3 fail it</text><rect x='24.0' y='290.0' width='812.0' height='120.0' rx='10' fill='#ffffff' stroke='#d0d7de' stroke-width='1.2' opacity='1'/><text x='40' y='316' font-size='14' fill='#1f2328' font-weight='700' text-anchor='start'>The fix: easier knot tying, through remote config</text><rect x='40.0' y='330.0' width='78.0' height='30.0' rx='6' fill='#dafbe1' stroke='#1a7f37' stroke-width='1.5' opacity='1'/><text x='79' y='350' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='middle'>10%</text><rect x='118.0' y='330.0' width='702.0' height='30.0' rx='6' fill='#ffffff' stroke='#d0d7de' stroke-width='1.2' opacity='1'/><text x='469' y='350' font-size='12' fill='#57606a' font-weight='400' text-anchor='middle'>90%: current settings (the comparison group)</text><text x='40' y='386' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='start'>Live in 30 minutes, not 14 days. Compare day-2 return between the groups; widen only if it helps.</text><text x='40' y='402' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='start'>A bad value reaches 10,000 players, not 100,000, and is rolled back from the server.</text></svg>