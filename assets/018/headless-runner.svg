<svg xmlns='http://www.w3.org/2000/svg' width='860' height='470' viewBox='0 0 860 470' font-family='Segoe UI, Helvetica, Arial, sans-serif'>
<rect x='0.5' y='0.5' width='859' height='469' rx='14' fill='#ffffff' stroke='#d0d7de'/>
<text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>What the replay runner must load</text>
<text x='24' y='60' font-size='13' fill='#57606a'>It needs the simulation and everything the simulation depends on, all the way down. The build server has no GPU and no sound card.</text>
<rect x='24' y='80' width='396' height='370' rx='10' fill='#fff5f5' stroke='#e5534b'/>
<text x='44' y='108' font-size='16' font-weight='700' fill='#cf222e'>Before: the tangle</text>
<text x='44' y='128' font-size='13' fill='#57606a'>Simulation → HUD → Render, and Core → UI</text>
<rect x='54.0' y='146.0' width='150' height='38' rx='8' fill='#eef3f9' stroke='#4e79a7' stroke-width='1.5'/>
<text x='129' y='170' font-size='14' font-weight='600' text-anchor='middle' fill='#1f2328'>Simulation</text>
<rect x='229.0' y='146.0' width='150' height='38' rx='8' fill='#eef3f9' stroke='#4e79a7' stroke-width='1.5'/>
<text x='304' y='170' font-size='14' font-weight='600' text-anchor='middle' fill='#1f2328'>Physics</text>
<rect x='54.0' y='198.0' width='150' height='38' rx='8' fill='#eef3f9' stroke='#4e79a7' stroke-width='1.5'/>
<text x='129' y='222' font-size='14' font-weight='600' text-anchor='middle' fill='#1f2328'>Core</text>
<rect x='229.0' y='198.0' width='150' height='38' rx='8' fill='#ffebe9' stroke='#cf222e' stroke-width='1.5'/>
<text x='304' y='222' font-size='14' font-weight='600' text-anchor='middle' fill='#1f2328'>HUD</text>
<rect x='54.0' y='250.0' width='150' height='38' rx='8' fill='#ffebe9' stroke='#cf222e' stroke-width='1.5'/>
<text x='129' y='274' font-size='14' font-weight='600' text-anchor='middle' fill='#1f2328'>UI</text>
<rect x='229.0' y='250.0' width='150' height='38' rx='8' fill='#ffebe9' stroke='#cf222e' stroke-width='1.5'/>
<text x='304' y='274' font-size='14' font-weight='600' text-anchor='middle' fill='#1f2328'>Render</text>
<rect x='54.0' y='302.0' width='150' height='38' rx='8' fill='#ffebe9' stroke='#cf222e' stroke-width='1.5'/>
<text x='129' y='326' font-size='14' font-weight='600' text-anchor='middle' fill='#1f2328'>Audio</text>
<rect x='229.0' y='302.0' width='150' height='38' rx='8' fill='#ffebe9' stroke='#cf222e' stroke-width='1.5'/>
<text x='304' y='326' font-size='14' font-weight='600' text-anchor='middle' fill='#1f2328'>Platform</text>
<text x='44' y='392' font-size='14' font-weight='700' fill='#1f2328'>8 modules · 38 s of code</text>
<text x='44' y='414' font-size='14' fill='#cf222e' font-weight='600'>Crash at start: HUD makes a render texture,</text>
<text x='44' y='434' font-size='14' fill='#cf222e' font-weight='600'>Audio opens a sound device. Test never ran.</text>
<rect x='440' y='80' width='396' height='370' rx='10' fill='#f0fff4' stroke='#1a7f37'/>
<text x='460' y='108' font-size='16' font-weight='700' fill='#1a7f37'>After: allow-list = Core, Physics</text>
<text x='460' y='128' font-size='13' fill='#57606a'>HUD reads the hook; sounds go out as cues</text>
<rect x='538.0' y='150.0' width='200' height='40' rx='8' fill='#dafbe1' stroke='#1a7f37' stroke-width='1.5'/>
<text x='638' y='175' font-size='14' font-weight='600' text-anchor='middle' fill='#1f2328'>Simulation</text>
<rect x='538.0' y='208.0' width='200' height='40' rx='8' fill='#dafbe1' stroke='#1a7f37' stroke-width='1.5'/>
<text x='638' y='233' font-size='14' font-weight='600' text-anchor='middle' fill='#1f2328'>Physics</text>
<rect x='538.0' y='266.0' width='200' height='40' rx='8' fill='#dafbe1' stroke='#1a7f37' stroke-width='1.5'/>
<text x='638' y='291' font-size='14' font-weight='600' text-anchor='middle' fill='#1f2328'>Core</text>
<path d='M638 190 L638 208' stroke='#1a7f37' stroke-width='2'/><path d='M638 248 L638 266' stroke='#1a7f37' stroke-width='2'/>
<text x='460' y='336' font-size='14' font-weight='700' fill='#1f2328'>3 modules · 16 s of code · no screen, no speakers</text>
<text x='460' y='370' font-size='14' fill='#1a7f37' font-weight='600'>10-min replay: 36,000 ticks × 2.11 ms ≈ 76 s</text>
<text x='460' y='394' font-size='14' fill='#1a7f37' font-weight='600'>20 replays a night: 1,520 s ≈ 25 min</text>
<text x='460' y='428' font-size='13' fill='#57606a'>Same build also runs the unit tests (Lesson 015).</text>
</svg>
