<svg xmlns='http://www.w3.org/2000/svg' width='860' height='412' viewBox='0 0 860 412' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Interpolation: draw the past, smoothly</title><rect x='0.5' y='0.5' width='859' height='411' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Interpolation: draw the past, smoothly</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Updates arrive every 50 ms. Draw other boats 100 ms in the past, between two updates you already have.</text><rect x='440.0' y='150.0' width='190.0' height='80.0' rx='6' fill='#fff8e6' stroke='#d4a72c' stroke-width='1.5' opacity='1'/><line x1='60.0' y1='190' x2='820.0' y2='190' stroke='#9aa0a6' stroke-width='2'/><circle cx='60.0' cy='190' r='9' fill='#4e79a7' stroke='#4e79a7' stroke-width='2'/><text x='60.0' y='222' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='middle'>0</text><circle cx='155.0' cy='190' r='9' fill='#4e79a7' stroke='#4e79a7' stroke-width='2'/><text x='155.0' y='222' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='middle'>50</text><circle cx='250.0' cy='190' r='9' fill='#4e79a7' stroke='#4e79a7' stroke-width='2'/><text x='250.0' y='222' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='middle'>100</text><circle cx='345.0' cy='190' r='9' fill='#4e79a7' stroke='#4e79a7' stroke-width='2'/><text x='345.0' y='222' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='middle'>150</text><circle cx='440.0' cy='190' r='9' fill='#4e79a7' stroke='#4e79a7' stroke-width='2'/><text x='440.0' y='222' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='middle'>200</text><circle cx='535.0' cy='190' r='9' fill='#4e79a7' stroke='#4e79a7' stroke-width='2'/><text x='535.0' y='222' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='middle'>250</text><circle cx='630.0' cy='190' r='9' fill='#4e79a7' stroke='#4e79a7' stroke-width='2'/><text x='630.0' y='222' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='middle'>300</text><circle cx='725.0' cy='190' r='9' fill='#ffffff' stroke='#4e79a7' stroke-width='2'/><text x='725.0' y='222' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='middle'>350</text><circle cx='820.0' cy='190' r='9' fill='#ffffff' stroke='#4e79a7' stroke-width='2'/><text x='820.0' y='222' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='middle'>400 ms</text><line x1='630.0' y1='110' x2='630.0' y2='250' stroke='#cf222e' stroke-width='2.5'/><text x='630.0' y='104' font-size='13' fill='#cf222e' font-weight='700' text-anchor='middle'>now: 300 ms</text><line x1='440.0' y1='126' x2='440.0' y2='250' stroke='#1a7f37' stroke-width='2.5'/><text x='440.0' y='120' font-size='13' fill='#1a7f37' font-weight='700' text-anchor='middle'>draw at 200 ms</text><text x='535.0' y='270' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='middle'>100 ms buffer: 2 updates in hand</text><text x='677.5' y='150' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>updates still</text><text x='677.5' y='166' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>on the way</text><rect x='24.0' y='300.0' width='812.0' height='92.0' rx='8' fill='#ffffff' stroke='#d0d7de' stroke-width='1.2' opacity='1'/><text x='40' y='324' font-size='13' fill='#cf222e' font-weight='600' text-anchor='start'>❌ Latest update: the boat sits still for 50 ms, then jumps. 20 jumps a second.</text><text x='40' y='348' font-size='13' fill='#1a7f37' font-weight='600' text-anchor='start'>✅ Interpolate: blend between the two updates around "now − 100 ms". 0 jumps; one lost update is covered.</text><text x='40' y='372' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>The price: other boats are shown 90 ms (half the round trip) + 100 ms = 190 ms behind the server.</text></svg>