<svg xmlns='http://www.w3.org/2000/svg' width='860' height='472' viewBox='0 0 860 472' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Prediction with rollback and replay</title><rect x='0.5' y='0.5' width='859' height='471' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Prediction with rollback and replay</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>One input every 20 ms. The server's answer is 180 ms old when it arrives, so 9 of your inputs are not in it yet.</text><text x='24' y='104' font-size='14' fill='#1f2328' font-weight='700' text-anchor='start'>1. The server confirms input #12: "line at 3.6 m"</text><rect x='40.0' y='118.0' width='34.0' height='34.0' rx='5' fill='#dafbe1' stroke='#1a7f37' stroke-width='1.5' opacity='1'/><text x='57.0' y='140' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>#4</text><rect x='80.0' y='118.0' width='34.0' height='34.0' rx='5' fill='#dafbe1' stroke='#1a7f37' stroke-width='1.5' opacity='1'/><text x='97.0' y='140' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>#5</text><rect x='120.0' y='118.0' width='34.0' height='34.0' rx='5' fill='#dafbe1' stroke='#1a7f37' stroke-width='1.5' opacity='1'/><text x='137.0' y='140' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>#6</text><rect x='160.0' y='118.0' width='34.0' height='34.0' rx='5' fill='#dafbe1' stroke='#1a7f37' stroke-width='1.5' opacity='1'/><text x='177.0' y='140' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>#7</text><rect x='200.0' y='118.0' width='34.0' height='34.0' rx='5' fill='#dafbe1' stroke='#1a7f37' stroke-width='1.5' opacity='1'/><text x='217.0' y='140' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>#8</text><rect x='240.0' y='118.0' width='34.0' height='34.0' rx='5' fill='#dafbe1' stroke='#1a7f37' stroke-width='1.5' opacity='1'/><text x='257.0' y='140' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>#9</text><rect x='280.0' y='118.0' width='34.0' height='34.0' rx='5' fill='#dafbe1' stroke='#1a7f37' stroke-width='1.5' opacity='1'/><text x='297.0' y='140' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>#10</text><rect x='320.0' y='118.0' width='34.0' height='34.0' rx='5' fill='#dafbe1' stroke='#1a7f37' stroke-width='1.5' opacity='1'/><text x='337.0' y='140' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>#11</text><rect x='360.0' y='118.0' width='34.0' height='34.0' rx='5' fill='#dafbe1' stroke='#1a7f37' stroke-width='1.5' opacity='1'/><text x='377.0' y='140' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>#12</text><rect x='400.0' y='118.0' width='34.0' height='34.0' rx='5' fill='#ffffff' stroke='#d0d7de' stroke-width='1.5' opacity='1'/><text x='417.0' y='140' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>#13</text><rect x='440.0' y='118.0' width='34.0' height='34.0' rx='5' fill='#ffffff' stroke='#d0d7de' stroke-width='1.5' opacity='1'/><text x='457.0' y='140' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>#14</text><rect x='480.0' y='118.0' width='34.0' height='34.0' rx='5' fill='#ffffff' stroke='#d0d7de' stroke-width='1.5' opacity='1'/><text x='497.0' y='140' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>#15</text><rect x='520.0' y='118.0' width='34.0' height='34.0' rx='5' fill='#ffffff' stroke='#d0d7de' stroke-width='1.5' opacity='1'/><text x='537.0' y='140' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>#16</text><rect x='560.0' y='118.0' width='34.0' height='34.0' rx='5' fill='#ffffff' stroke='#d0d7de' stroke-width='1.5' opacity='1'/><text x='577.0' y='140' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>#17</text><rect x='600.0' y='118.0' width='34.0' height='34.0' rx='5' fill='#ffffff' stroke='#d0d7de' stroke-width='1.5' opacity='1'/><text x='617.0' y='140' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>#18</text><rect x='640.0' y='118.0' width='34.0' height='34.0' rx='5' fill='#ffffff' stroke='#d0d7de' stroke-width='1.5' opacity='1'/><text x='657.0' y='140' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>#19</text><rect x='680.0' y='118.0' width='34.0' height='34.0' rx='5' fill='#ffffff' stroke='#d0d7de' stroke-width='1.5' opacity='1'/><text x='697.0' y='140' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>#20</text><rect x='720.0' y='118.0' width='34.0' height='34.0' rx='5' fill='#ffffff' stroke='#d0d7de' stroke-width='1.5' opacity='1'/><text x='737.0' y='140' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>#21</text><text x='404' y='172' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>inputs #13–#21: sent, not yet confirmed</text><text x='24' y='210' font-size='14' fill='#1f2328' font-weight='700' text-anchor='start'>2. Rewind: set the line to the server's 3.6 m at input #12</text><rect x='40.0' y='224.0' width='354.0' height='34.0' rx='5' fill='#dafbe1' stroke='#1a7f37' stroke-width='1.5' opacity='1'/><text x='217.0' y='246' font-size='12' fill='#1a7f37' font-weight='700' text-anchor='middle'>server state after #12</text><text x='24' y='298' font-size='14' fill='#1f2328' font-weight='700' text-anchor='start'>3. Replay the 9 unconfirmed inputs, then draw</text><rect x='400.0' y='312.0' width='34.0' height='34.0' rx='5' fill='#e8f0fb' stroke='#4e79a7' stroke-width='1.5' opacity='1'/><text x='417.0' y='334' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>#13</text><rect x='440.0' y='312.0' width='34.0' height='34.0' rx='5' fill='#e8f0fb' stroke='#4e79a7' stroke-width='1.5' opacity='1'/><text x='457.0' y='334' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>#14</text><rect x='480.0' y='312.0' width='34.0' height='34.0' rx='5' fill='#e8f0fb' stroke='#4e79a7' stroke-width='1.5' opacity='1'/><text x='497.0' y='334' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>#15</text><rect x='520.0' y='312.0' width='34.0' height='34.0' rx='5' fill='#e8f0fb' stroke='#4e79a7' stroke-width='1.5' opacity='1'/><text x='537.0' y='334' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>#16</text><rect x='560.0' y='312.0' width='34.0' height='34.0' rx='5' fill='#e8f0fb' stroke='#4e79a7' stroke-width='1.5' opacity='1'/><text x='577.0' y='334' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>#17</text><rect x='600.0' y='312.0' width='34.0' height='34.0' rx='5' fill='#e8f0fb' stroke='#4e79a7' stroke-width='1.5' opacity='1'/><text x='617.0' y='334' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>#18</text><rect x='640.0' y='312.0' width='34.0' height='34.0' rx='5' fill='#e8f0fb' stroke='#4e79a7' stroke-width='1.5' opacity='1'/><text x='657.0' y='334' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>#19</text><rect x='680.0' y='312.0' width='34.0' height='34.0' rx='5' fill='#e8f0fb' stroke='#4e79a7' stroke-width='1.5' opacity='1'/><text x='697.0' y='334' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>#20</text><rect x='720.0' y='312.0' width='34.0' height='34.0' rx='5' fill='#e8f0fb' stroke='#4e79a7' stroke-width='1.5' opacity='1'/><text x='737.0' y='334' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>#21</text><line x1='396' y1='241' x2='403.0' y2='314.0' stroke='#4e79a7' stroke-width='2'/><polygon points='404,324 409.0,313.5 397.1,314.6' fill='#4e79a7'/><text x='400' y='368' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='start'>9 × 0.03 ms per update × 20 updates a second = 5.4 ms a second</text><rect x='24.0' y='388.0' width='812.0' height='64.0' rx='8' fill='#fff8e6' stroke='#d4a72c' stroke-width='1.5' opacity='1'/><text x='40' y='412' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>If your prediction was right, the line ends exactly where it already was: nothing moves. If the fish did</text><text x='40' y='434' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>something you couldn't know (12 times a minute), the difference is blended in over 100 ms.</text></svg>