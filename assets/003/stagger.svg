<svg xmlns='http://www.w3.org/2000/svg' width='880' height='400' viewBox='0 0 880 400' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Spreading path requests over frames</title><rect x='0.50' y='0.50' width='879.00' height='399.00' fill='#ffffff' stroke='#d0d7de' stroke-width='1' rx='14' /><text x='24' y='36' font-size='20' fill='#1f2328' font-weight='bold' text-anchor='start'>Same work, spread out: FindPath cost per frame</text><text x='24' y='58' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>Frames 1 to 120. Like a whole office using one microwave at 12:00, or a few people every minute. Example numbers.</text><text x='24' y='88' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='start'>Before: every zombie’s timer started on the same frame</text><rect x='96.00' y='100.00' width='674.00' height='100.00' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' rx='0' /><text x='88' y='204.0' font-size='12' fill='#57606a' font-weight='normal' text-anchor='end'>0</text><text x='88' y='154.0' font-size='12' fill='#57606a' font-weight='normal' text-anchor='end'>30 ms</text><text x='88' y='104.0' font-size='12' fill='#57606a' font-weight='normal' text-anchor='end'>60 ms</text><rect x='427.78' y='110.00' width='4.82' height='90.00' fill='#e5534b' stroke='none' stroke-width='0' rx='0' /><rect x='764.78' y='110.00' width='4.82' height='90.00' fill='#e5534b' stroke='none' stroke-width='0' rx='0' /><text x='778' y='146.0' font-size='12' fill='#cf222e' font-weight='bold' text-anchor='start'>54 ms</text><text x='778' y='162.0' font-size='12' fill='#cf222e' font-weight='normal' text-anchor='start'>per spike</text><text x='421.3833333333333' y='118' font-size='12' fill='#cf222e' font-weight='bold' text-anchor='end'>frame 60: 5,000 paths</text><text x='208.33333333333331' y='180' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>frames 1–59: 0 paths</text><text x='24' y='238' font-size='15' fill='#1f2328' font-weight='b