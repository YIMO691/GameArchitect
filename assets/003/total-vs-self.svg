.0' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='middle'>4</text><rect x='40.00' y='176.00' width='653.05' height='40.00' fill='#e5534b' stroke='#ffffff' stroke-width='1.5' rx='3' /><text x='367.27272727272725' y='201.0' font-size='13' fill='#ffffff' font-weight='bold' text-anchor='middle'>Pathfinding.FindPath ×5,000   total 54.0   self 54.0</text><rect x='694.55' y='176.00' width='10.62' height='40.00' fill='#ffffff' stroke='#4e79a7' stroke-width='2' rx='3' stroke-dasharray='4 3'/><line x1='700.61' y1='220.00' x2='700.61' y2='246.00' stroke='#4e79a7' stroke-width='1.5'/><text x='700.6060606060605' y='262' font-size='13' fill='#4e79a7' font-weight='bold' text-anchor='middle'>ZombieAI.Update self = 55 − 54 = 1.0 ms</text><text x='712.6666666666666' y='192' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>Physics 3 · Animation 2</text><text x='712.6666666666666' y='208' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>Render prep 2 · Scripts 4</text><rect x='24.00' y='300.00' width='404.00' height='100.00' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' rx='8' /><text x='40' y='326' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start'>Total = own work + all children</text><text x='40' y='348' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start'>Self = own lines of code only</text><text x='40' y='372' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>Like a manager: the team’s hours (total)</text><text x='40' y='390' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>vs the hours the manager works alone (self).</text><rect x='448.00' y='300.00' width='408.00' height='100.00' fill='#dafbe1' stroke='#1a7f37' stroke-width='1.5' rx='8' /><text x='464' y='326' font-size='14' fill='#1a7f37' font-weight='bold' text-anchor='start'>Sorted by self time, the worker is on top:</text><text x='464' y='350' font-size='13' fill='#1f2328' font-weight='b