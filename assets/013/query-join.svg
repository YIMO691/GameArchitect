='285' font-size='13' fill='#ffffff' font-weight='bold' text-anchor='middle'>#9</text><rect x='396' y='264' width='52' height='32' fill='#7fa6cc' rx='4'/><text x='422.0' y='285' font-size='13' fill='#ffffff' font-weight='bold' text-anchor='middle'>#0</text><rect x='452' y='264' width='52' height='32' fill='#7fa6cc' rx='4'/><text x='478.0' y='285' font-size='13' fill='#ffffff' font-weight='bold' text-anchor='middle'>#7</text><rect x='508' y='264' width='52' height='32' fill='#7fa6cc' rx='4'/><text x='534.0' y='285' font-size='13' fill='#ffffff' font-weight='bold' text-anchor='middle'>#4</text><rect x='564' y='264' width='52' height='32' fill='#7fa6cc' rx='4'/><text x='590.0' y='285' font-size='13' fill='#ffffff' font-weight='bold' text-anchor='middle'>#2</text><rect x='620' y='264' width='52' height='32' fill='#7fa6cc' rx='4'/><text x='646.0' y='285' font-size='13' fill='#ffffff' font-weight='bold' text-anchor='middle'>#11</text><rect x='676' y='264' width='52' height='32' fill='#7fa6cc' rx='4'/><text x='702.0' y='285' font-size='13' fill='#ffffff' font-weight='bold' text-anchor='middle'>#1</text><rect x='732' y='264' width='52' height='32' fill='#7fa6cc' rx='4'/><text x='758.0' y='285' font-size='13' fill='#ffffff' font-weight='bold' text-anchor='middle'>#5</text><rect x='226' y='102' width='56' height='36' fill='none' rx='5' stroke='#1a7f37' stroke-width='3'/><rect x='674' y='182' width='56' height='36' fill='none' rx='5' stroke='#cf222e' stroke-width='3'/><rect x='338' y='262' width='56' height='36' fill='none' rx='5' stroke='#cf222e' stroke-width='3'/><path d='M254.0 138 C 254.0 165, 702.0 155, 702.0 180' fill='none' stroke='#cf222e' stroke-width='2' marker-end='url(#arR)'/><path d='M260.0 138 C 286 230, 366.0 220, 366.0 260' fill='none' stroke='#cf222e' stroke-width='2' marker-end='url(#arR)'/><line x1='172' y1='92' x2='782' y2='92' stroke='#1a7f37' stroke-width='2' marker-end='url(#arG)'/><text x='172' y='86' font-size='12' fill='#1a7f37' font-weight='bold' text-anchor='start'>walk in order</text><rect x='24' y='320' width='832' height='160' fill='#f6f8fa' rx='8' stroke='#d0d7de' stroke-width='1'/><text x='40' y='346' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start'>One SwimSystem visit, entity #9, on our phone (approx.)</text><text x='40' y='372' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start'>Walk the Swimmer pool (in order)</text><rect x='420' y='360' width='180' height='14' fill='#1a7f37' rx='3'/><text x='608' y='372' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='start'>10 ns</text><text x='40' y='394' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start'>Find #9's Position: sparse → dense, a jump</text><rect x='420' y='382' width='270' height='14' fill='#cf222e' rx='3'/><text x='698' y='394' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='start'>15 ns</text><text x='40' y='416' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start'>Find #9's Velocity: another jump</text><rect x='420' y='404' width='270' height='14' fill='#cf222e' rx='3'/><text x='698' y='416' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='start'>15 ns</text><text x='40' y='438' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start'>Check: is #9 Stunned? (sparse read)</text><rect x='420' y='426' width='90' height='14' fill='#d4a017' rx='3'/><text x='518' y='438' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='start'>5 ns</text><text x='40' y='466' font-size='13' fill='#cf222e' font-weight='bold' text-anchor='start'>Total 45 ns per visit, vs 10 ns when all three sit in the same table row.</text></svg>