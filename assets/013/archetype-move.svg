<svg xmlns='http://www.w3.org/2000/svg' width='880' height='500' viewBox='0 0 880 500' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Adding a component moves the entity to another archetype table</title><rect x='0.5' y='0.5' width='879' height='499' rx='14' fill='#ffffff' stroke='#d0d7de'/><defs><marker id='arR' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0 L10 5 L0 10 z' fill='#cf222e'/></marker><marker id='arG' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0 L10 5 L0 10 z' fill='#1a7f37'/></marker><marker id='arB' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0 L10 5 L0 10 z' fill='#4e79a7'/></marker><marker id='arK' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0 L10 5 L0 10 z' fill='#57606a'/></marker></defs><text x='24' y='38' font-size='20' fill='#1f2328' font-weight='bold' text-anchor='start'>Adding Stunned to one fish = moving it to another table</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>Archetype storage: every exact set of components has its own table. Fish #40 gets Stunned.</text><text x='24' y='98' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='start'>🐟 Fish table</text><text x='390' y='98' font-size='12' fill='#1f2328' font-weight='normal' text-anchor='start'></text><text x='24' y='124' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>entity</text><text x='121.0' y='124' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>Position</text><text x='195.0' y='124' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>Velocity</text><text x='269.0' y='124' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>Swimmer</text><text x='343.0' y='124' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>Health</text><text x='30' y='154' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start'>0  #12</text><rect x='86' y='137' width='70' height='24' fill='#4e79a7' rx='4'/><rect x='160' y='137' width='70' height='24' fill='#7fa6cc' rx='4'/><rect x='234' y='137' width='70' height='24' fill='#2f8f9d' rx='4'/><rect x='308' y='137' width='70' height='24' fill='#9aa0a6' rx='4'/><text x='30' y='184' font-size='13' fill='#cf222e' font-weight='bold' text-anchor='start'>1  #40</text><rect x='86' y='167' width='70' height='24' fill='#4e79a7' rx='4'/><rect x='160' y='167' width='70' height='24' fill='#7fa6cc' rx='4'/><rect x='234' y='167' width='70' height='24' fill='#2f8f9d' rx='4'/><rect x='308' y='167' width='70' height='24' fill='#9aa0a6' rx='4'/><rect x='82' y='165' width='296' height='28' fill='none' rx='5' stroke='#cf222e' stroke-width='2.5'/><text x='30' y='214' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start'>2  #7</text><rect x='86' y='197' width='70' height='24' fill='#4e79a7' rx='4'/><rect x='160' y='197' width='70' height='24' fill='#7fa6cc' rx='4'/><rect x='234' y='197' width='70' height='24' fill='#2f8f9d' rx='4'/><rect x='308' y='197' width='70' height='24' fill='#9aa0a6' rx='4'/><text x='30' y='244' font-size='13' fill='#b07aa1' font-weight='bold' text-anchor='start'>3  #93</text><rect x='86' y='227' width='70' height='24' fill='#4e79a7' rx='4'/><rect x='160' y='227' width='70' height='24' fill='#7fa6cc' rx='4'/><rect x='234' y='227' width='70' height='24' fill='#2f8f9d' rx='4'/><rect x='308' y='227' width='70' height='24' fill='#9aa0a6' rx='4'/><rect x='82' y='225' width='296' height='28' fill='none' rx='5' stroke='#b07aa1' stroke-width='2' stroke-dasharray='5 3'/><text x='24' y='274' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>… 4,000 fish, 40 B each</text><text x='452' y='98' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='start'>🐟⚡ Fish + Stunned table</text><text x='452' y='124' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>entity</text><text x='535.0' y='124' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>Position</text><text x='601.0' y='124' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>Velocity</text><text x='667.0' y='124' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>Swimmer</text><text x='733.0' y='124' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>Health</text><text x='799.0' y='124' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>Stunned</text><text x='458' y='154' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start'>0  #55</text><rect x='504' y='137' width='62' height='24' fill='#4e79a7' rx='4'/><rect x='570' y='137' width='62' height='24' fill='#7fa6cc' rx='4'/><rect x='636' y='137' width='62' height='24' fill='#2f8f9d' rx='4'/><rect x='702' y='137' width='62' height='24' fill='#9aa0a6' rx='4'/><rect x='768' y='137' width='62' height='24' fill='#d4a017' rx='4'/><text x='458' y='184' font-size='13' fill='#cf222e' font-weight='bold' text-anchor='start'>1  #40</text><rect x='504' y='167' width='62' height='24' fill='#4e79a7' rx='4'/><rect x='570' y='167' width='62' height='24' fill='#7fa6cc' rx='4'/><rect x='636' y='167' width='62' height='24' fill='#2f8f9d' rx='4'/><rect x='702' y='167' width='62' height='24' fill='#9aa0a6' rx='4'/><rect x='768' y='167' width='62' height='24' fill='#d4a017' rx='4'/><rect x='500' y='165' width='330' height='28' fill='none' rx='5' stroke='#cf222e' stroke-width='2.5'/><path d='M384 179.0 L 448 179.0' fill='none' stroke='#cf222e' stroke-width='2.5' marker-end='url(#arR)'/><text x='452' y='214' font-size='12' fill='#cf222e' font-weight='bold' text-anchor='start'>① copy its 4 components (40 B), column by column</text><text x='452' y='232' font-size='12' fill='#9a6b00' font-weight='bold' text-anchor='start'>② write the new Stunned data (8 B: timer, strength)</text><path d='M386 239.0 C 430 239.0, 430 185.0, 388 185.0' fill='none' stroke='#b07aa1' stroke-width='2' stroke-dasharray='5 3'/><text x='424' y='267.0' font-size='12' fill='#b07aa1' font-weight='bold' text-anchor='start'>③ the last fish (#93) moves</text><text x='424' y='282.0' font-size='12' fill='#b07aa1' font-weight='normal' text-anchor='start'>into the hole: no gaps</text><rect x='470' y='330' width='386' height='74' fill='#f6f8fa' rx='8' stroke='#d0d7de' stroke-width='1'/><text x='486' y='352' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='start'>④ update the entity index (ID → table, row)</text><text x='486' y='374' font-size='13' fill='#cf222e' font-weight='normal' text-anchor='start'>#40 → Fish + Stunned, row 1</text><text x='486' y='392' font-size='13' fill='#b07aa1' font-weight='normal' text-anchor='start'>#93 → Fish, row 1</text><rect x='24' y='420' width='832' height='62' fill='#fff8f7' rx='8' stroke='#f5c2bf' stroke-width='1'/><text x='40' y='444' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start'>One move ≈ 0.5 µs on our phone (approx.): two copies, two index writes, maybe a new 16 KB chunk.</text><text x='40' y='466' font-size='13' fill='#cf222e' font-weight='bold' text-anchor='start'>The storm makes 2,400 adds + removes per step: 2,400 × 0.5 µs = 1.20 ms. The budget is 1.0 ms.</text></svg>