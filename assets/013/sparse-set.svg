<svg xmlns='http://www.w3.org/2000/svg' width='880' height='500' viewBox='0 0 880 500' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>A sparse set: a sparse array indexed by entity ID points into packed dense arrays</title><rect x='0.5' y='0.5' width='879' height='499' rx='14' fill='#ffffff' stroke='#d0d7de'/><defs><marker id='arR' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0 L10 5 L0 10 z' fill='#cf222e'/></marker><marker id='arG' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0 L10 5 L0 10 z' fill='#1a7f37'/></marker><marker id='arB' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0 L10 5 L0 10 z' fill='#4e79a7'/></marker><marker id='arK' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0 L10 5 L0 10 z' fill='#57606a'/></marker></defs><text x='24' y='38' font-size='20' fill='#1f2328' font-weight='bold' text-anchor='start'>A sparse set: the Stunned pool</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>Two arrays. The sparse array has one slot per entity ID. The dense arrays are packed, with no gaps.</text><text x='24' y='126' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start'>sparse</text><text x='24' y='144' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>index = entity ID</text><text x='176.0' y='94' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>#0</text><rect x='152' y='100' width='48' height='36' fill='#f3f4f6' rx='4' stroke='#d8dce1' stroke-width='1'/><text x='176.0' y='123' font-size='14' fill='#9aa0a6' font-weight='normal' text-anchor='middle'>–</text><text x='228.0' y='94' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>#1</text><rect x='204' y='100' width='48' height='36' fill='#f3f4f6' rx='4' stroke='#d8dce1' stroke-width='1'/><text x='228.0' y='123' font-size='14' fill='#9aa0a6' font-weight='normal' text-anchor='middle'>–</text><text x='280.0' y='94' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>#2</text><rect x='256' y='100' width='48' height='36' fill='#f3f4f6' rx='4' stroke='#d8dce1' stroke-width='1'/><text x='280.0' y='123' font-size='14' fill='#9aa0a6' font-weight='normal' text-anchor='middle'>–</text><text x='332.0' y='94' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>#3</text><rect x='308' y='100' width='48' height='36' fill='#eef6ff' rx='4' stroke='#b6cbe3' stroke-width='1'/><text x='332.0' y='123' font-size='14' fill='#4e79a7' font-weight='bold' text-anchor='middle'>1</text><text x='384.0' y='94' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>#4</text><rect x='360' y='100' width='48' height='36' fill='#eef6ff' rx='4' stroke='#b6cbe3' stroke-width='1'/><text x='384.0' y='123' font-size='14' fill='#4e79a7' font-weight='bold' text-anchor='middle'>3</text><text x='436.0' y='94' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>#5</text><rect x='412' y='100' width='48' height='36' fill='#f3f4f6' rx='4' stroke='#d8dce1' stroke-width='1'/><text x='436.0' y='123' font-size='14' fill='#9aa0a6' font-weight='normal' text-anchor='middle'>–</text><text x='488.0' y='94' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>#6</text><rect x='464' y='100' width='48' height='36' fill='#f3f4f6' rx='4' stroke='#d8dce1' stroke-width='1'/><text x='488.0' y='123' font-size='14' fill='#9aa0a6' font-weight='normal' text-anchor='middle'>–</text><text x='540.0' y='94' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>#7</text><rect x='516' y='100' width='48' height='36' fill='#eef6ff' rx='4' stroke='#b6cbe3' stroke-width='1'/><text x='540.0' y='123' font-size='14' fill='#4e79a7' font-weight='bold' text-anchor='middle'>0</text><text x='592.0' y='94' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>#8</text><rect x='568' y='100' width='48' height='36' fill='#f3f4f6' rx='4' stroke='#d8dce1' stroke-width='1'/><text x='592.0' y='123' font-size='14' fill='#9aa0a6' font-weight='normal' text-anchor='middle'>–</text><text x='644.0' y='94' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>#9</text><rect x='620' y='100' width='48' height='36' fill='#eef6ff' rx='4' stroke='#b6cbe3' stroke-width='1'/><text x='644.0' y='123' font-size='14' fill='#4e79a7' font-weight='bold' text-anchor='middle'>2</text><text x='696.0' y='94' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>#10</text><rect x='672' y='100' width='48' height='36' fill='#f3f4f6' rx='4' stroke='#d8dce1' stroke-width='1'/><text x='696.0' y='123' font-size='14' fill='#9aa0a6' font-weight='normal' text-anchor='middle'>–</text><text x='748.0' y='94' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>#11</text><rect x='724' y='100' width='48' height='36' fill='#f3f4f6' rx='4' stroke='#d8dce1' stroke-width='1'/><text x='748.0' y='123' font-size='14' fill='#9aa0a6' font-weight='normal' text-anchor='middle'>–</text><text x='24' y='232' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start'>dense</text><text x='24' y='250' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>entities</text><text x='24' y='286' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>data</text><text x='24' y='302' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>(timer, strength)</text><text x='198.0' y='204' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>slot 0</text><rect x='152' y='210' width='92' height='34' fill='#d4a017' rx='4'/><text x='198.0' y='232' font-size='14' fill='#ffffff' font-weight='bold' text-anchor='middle'>#7</text><rect x='152' y='262' width='92' height='34' fill='#f2d68a' rx='4'/><text x='198.0' y='284' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='middle'>0.40 s</text><text x='294.0' y='204' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>slot 1</text><rect x='248' y='210' width='92' height='34' fill='#d4a017' rx='4'/><text x='294.0' y='232' font-size='14' fill='#ffffff' font-weight='bold' text-anchor='middle'>#3</text><rect x='248' y='262' width='92' height='34' fill='#f2d68a' rx='4'/><text x='294.0' y='284' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='middle'>0.25 s</text><text x='390.0' y='204' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>slot 2</text><rect x='344' y='210' width='92' height='34' fill='#d4a017' rx='4'/><text x='390.0' y='232' font-size='14' fill='#ffffff' font-weight='bold' text-anchor='middle'>#9</text><rect x='344' y='262' width='92' height='34' fill='#f2d68a' rx='4'/><text x='390.0' y='284' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='middle'>0.10 s</text><text x='486.0' y='204' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>slot 3</text><rect x='440' y='210' width='92' height='34' fill='#d4a017' rx='4'/><text x='486.0' y='232' font-size='14' fill='#ffffff' font-weight='bold' text-anchor='middle'>#4</text><rect x='440' y='262' width='92' height='34' fill='#f2d68a' rx='4'/><text x='486.0' y='284' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='middle'>0.35 s</text><line x1='332.0' y1='138' x2='294.0' y2='190' stroke='#4e79a7' stroke-width='1.8' marker-end='url(#arB)'/><line x1='644.0' y1='138' x2='390.0' y2='190' stroke='#4e79a7' stroke-width='1.8' marker-end='url(#arB)'/><text x='554' y='232' font-size='13' fill='#1a7f37' font-weight='bold' text-anchor='start'>Systems walk the dense arrays</text><text x='554' y='250' font-size='13' fill='#1a7f37' font-weight='normal' text-anchor='start'>in order: fast, like a table.</text><text x='554' y='280' font-size='13' fill='#4e79a7' font-weight='normal' text-anchor='start'>"Is #9 stunned?" Read sparse[9],</text><text x='554' y='298' font-size='13' fill='#4e79a7' font-weight='normal' text-anchor='start'>then check that slot 2 holds #9.</text><rect x='24' y='330' width='410' height='150' fill='#f6fff8' rx='8' stroke='#b7e1c2' stroke-width='1'/><text x='40' y='356' font-size='15' fill='#1a7f37' font-weight='bold' text-anchor='start'>Add #5:  ≈ 20 ns</text><text x='40' y='380' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start'>1. append #5 and its data at slot 4</text><text x='40' y='400' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start'>2. write sparse[5] = 4</text><text x='40' y='424' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>Nothing else moves. Position, Velocity and</text><text x='40' y='442' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>Swimmer stay where they are.</text><rect x='446' y='330' width='410' height='150' fill='#fff8f7' rx='8' stroke='#f5c2bf' stroke-width='1'/><text x='462' y='356' font-size='15' fill='#cf222e' font-weight='bold' text-anchor='start'>Remove #3 (swap and pop):  ≈ 20 ns</text><text x='462' y='380' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start'>1. copy the last one (#4) into slot 1</text><text x='462' y='400' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start'>2. write sparse[4] = 1, clear sparse[3]</text><text x='462' y='420' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start'>3. shrink the dense arrays by one</text><text x='462' y='444' font-size='13' fill='#b07aa1' font-weight='bold' text-anchor='start'>Result:  #7  #4  #9   (still packed)</text></svg>