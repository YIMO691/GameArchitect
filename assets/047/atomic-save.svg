<svg xmlns='http://www.w3.org/2000/svg' width='860' height='356' viewBox='0 0 860 356' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>A save is a transaction</title><rect x='0.5' y='0.5' width='859' height='355' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>A save is a transaction</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>The phone can close the app at any moment. What is on disk if it happens in the middle of a save?</text><text x='24' y='100' font-size='15' fill='#cf222e' font-weight='700' text-anchor='start'>❌ Overwrite in place</text><rect x='24.0' y='114.0' width='180.0' height='52.0' rx='8' fill='#ffffff' stroke='#d0d7de' stroke-width='1.5' opacity='1'/><text x='114' y='145' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='middle'>open save.json, truncate</text><rect x='220.0' y='114.0' width='180.0' height='52.0' rx='8' fill='#ffffff' stroke='#d0d7de' stroke-width='1.5' opacity='1'/><text x='310' y='145' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='middle'>write 40% …</text><rect x='416.0' y='114.0' width='180.0' height='52.0' rx='8' fill='#fff1f0' stroke='#cf222e' stroke-width='1.5' opacity='1'/><text x='506' y='145' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='middle'>💥 app closed</text><rect x='612.0' y='114.0' width='180.0' height='52.0' rx='8' fill='#fff1f0' stroke='#cf222e' stroke-width='1.5' opacity='1'/><text x='702' y='145' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='middle'>save.json: half new</text><text x='24' y='192' font-size='13' fill='#cf222e' font-weight='700' text-anchor='start'>The only copy is half old, half nothing: 80 saves a day at 2,000,000 saves and 1 in 25,000 interrupted.</text><text x='24' y='232' font-size='15' fill='#1a7f37' font-weight='700' text-anchor='start'>✅ Temp file + rename + backup</text><rect x='24.0' y='246.0' width='180.0' height='52.0' rx='8' fill='#ffffff' stroke='#d0d7de' stroke-width='1.5' opacity='1'/><text x='114' y='277' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='middle'>write save.tmp, flush</text><rect x='220.0' y='246.0' width='180.0' height='52.0' rx='8' fill='#fff8e6' stroke='#d4a72c' stroke-width='1.5' opacity='1'/><text x='310' y='277' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='middle'>💥 app closed here?</text><rect x='416.0' y='246.0' width='180.0' height='52.0' rx='8' fill='#dafbe1' stroke='#1a7f37' stroke-width='1.5' opacity='1'/><text x='506' y='277' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='middle'>save.json untouched</text><rect x='612.0' y='246.0' width='180.0' height='52.0' rx='8' fill='#dafbe1' stroke='#1a7f37' stroke-width='1.5' opacity='1'/><text x='702' y='277' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='middle'>else: rename tmp → json</text><text x='24' y='324' font-size='13' fill='#1a7f37' font-weight='700' text-anchor='start'>A crash before the rename leaves the old save; after it, the new one. The previous save is kept as save.bak.</text></svg>