<svg xmlns='http://www.w3.org/2000/svg' width='860' height='356' viewBox='0 0 860 356' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>A save migration chain</title><rect x='0.5' y='0.5' width='859' height='355' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>A save migration chain</text><text x='24' y='62' font-size='12.5' fill='#57606a' font-weight='400' text-anchor='start'>Every save carries the format version that wrote it. Loading runs each small step from that version up to the current one.</text><rect x='24.0' y='96.0' width='120.0' height='76.0' rx='10' fill='#ffffff' stroke='#4e79a7' stroke-width='2' opacity='1'/><text x='84.0' y='122' font-size='15' fill='#1f2328' font-weight='700' text-anchor='middle'>format 1</text><text x='84.0' y='142' font-size='12.5' fill='#57606a' font-weight='600' text-anchor='middle'>v1.0</text><text x='84.0' y='162' font-size='12' fill='#57606a' font-weight='400' text-anchor='middle'>20,000</text><line x1='148' y1='134' x2='183.0' y2='134.0' stroke='#59a14f' stroke-width='2.5'/><polygon points='193,134 183.0,128.0 183.0,140.0' fill='#59a14f'/><rect x='197.0' y='96.0' width='120.0' height='76.0' rx='10' fill='#ffffff' stroke='#4e79a7' stroke-width='2' opacity='1'/><text x='257.0' y='122' font-size='15' fill='#1f2328' font-weight='700' text-anchor='middle'>format 2</text><text x='257.0' y='142' font-size='12.5' fill='#57606a' font-weight='600' text-anchor='middle'>v1.1</text><text x='257.0' y='162' font-size='12' fill='#57606a' font-weight='400' text-anchor='middle'>24,000</text><line x1='321' y1='134' x2='356.0' y2='134.0' stroke='#59a14f' stroke-width='2.5'/><polygon points='366,134 356.0,128.0 356.0,140.0' fill='#59a14f'/><rect x='370.0' y='96.0' width='120.0' height='76.0' rx='10' fill='#ffffff' stroke='#4e79a7' stroke-width='2' opacity='1'/><text x='430.0' y='122' font-size='15' fill='#1f2328' font-weight='700' text-anchor='middle'>format 3</text><text x='430.0' y='142' font-size='12.5' fill='#57606a' font-weight='600' text-anchor='middle'>v1.2</text><text x='430.0' y='162' font-size='12' fill='#57606a' font-weight='400' text-anchor='middle'>46,000</text><line x1='494' y1='134' x2='529.0' y2='134.0' stroke='#59a14f' stroke-width='2.5'/><polygon points='539,134 529.0,128.0 529.0,140.0' fill='#59a14f'/><rect x='543.0' y='96.0' width='120.0' height='76.0' rx='10' fill='#ffffff' stroke='#4e79a7' stroke-width='2' opacity='1'/><text x='603.0' y='122' font-size='15' fill='#1f2328' font-weight='700' text-anchor='middle'>format 4</text><text x='603.0' y='142' font-size='12.5' fill='#57606a' font-weight='600' text-anchor='middle'>v1.3</text><text x='603.0' y='162' font-size='12' fill='#57606a' font-weight='400' text-anchor='middle'>110,000</text><line x1='667' y1='134' x2='702.0' y2='134.0' stroke='#59a14f' stroke-width='2.5'/><polygon points='712,134 702.0,128.0 702.0,140.0' fill='#59a14f'/><rect x='716.0' y='96.0' width='120.0' height='76.0' rx='10' fill='#ffffff' stroke='#f28e2b' stroke-width='2' opacity='1'/><text x='776.0' y='122' font-size='15' fill='#1f2328' font-weight='700' text-anchor='middle'>format 5</text><text x='776.0' y='142' font-size='12.5' fill='#57606a' font-weight='600' text-anchor='middle'>v1.4</text><text x='776.0' y='162' font-size='12' fill='#57606a' font-weight='400' text-anchor='middle'>current</text><text x='170.5' y='200' font-size='12' fill='#1a7f37' font-weight='700' text-anchor='middle'>Migrate_1_to_2</text><text x='170.5' y='218' font-size='11.5' fill='#1f2328' font-weight='400' text-anchor='middle'>add coins field</text><text x='343.5' y='240' font-size='12' fill='#1a7f37' font-weight='700' text-anchor='middle'>Migrate_2_to_3</text><text x='343.5' y='258' font-size='11.5' fill='#1f2328' font-weight='400' text-anchor='middle'>boats: ids → objects</text><text x='516.5' y='200' font-size='12' fill='#1a7f37' font-weight='700' text-anchor='middle'>Migrate_3_to_4</text><text x='516.5' y='218' font-size='11.5' fill='#1f2328' font-weight='400' text-anchor='middle'>add paint to boats</text><text x='689.5' y='240' font-size='12' fill='#1a7f37' font-weight='700' text-anchor='middle'>Migrate_4_to_5</text><text x='689.5' y='258' font-size='11.5' fill='#1f2328' font-weight='400' text-anchor='middle'>ownedBoats → fleet</text><rect x='24.0' y='282.0' width='812.0' height='56.0' rx='8' fill='#fff8e6' stroke='#d4a72c' stroke-width='1.5' opacity='1'/><text x='40' y='306' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>A 1.0 save runs all four steps; a 1.3 save runs only the last. Each step is small, tested and never changed</text><text x='40' y='326' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>once shipped: old saves will run it for years.</text></svg>