<svg xmlns='http://www.w3.org/2000/svg' width='860' height='380' viewBox='0 0 860 380' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Which weight would change our mind?</title><rect x='0.5' y='0.5' width='859' height='379' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Which weight would change our mind?</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Totals as the team moves from "ship this summer" (time × 3, flexibility × 2) to "flexibility first" (× 1, × 5).</text><line x1='90' y1='330.0' x2='760' y2='330.0' stroke='#eaeef2'/><text x='82' y='334.0' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='end'>20</text><line x1='90' y1='270.0' x2='760' y2='270.0' stroke='#eaeef2'/><text x='82' y='274.0' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='end'>25</text><line x1='90' y1='210.0' x2='760' y2='210.0' stroke='#eaeef2'/><text x='82' y='214.0' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='end'>30</text><line x1='90' y1='150.0' x2='760' y2='150.0' stroke='#eaeef2'/><text x='82' y='154.0' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='end'>35</text><line x1='90' y1='90.0' x2='760' y2='90.0' stroke='#eaeef2'/><text x='82' y='94.0' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='end'>40</text><line x1='90.0' y1='282.0' x2='760.0' y2='126.0' stroke='#b07aa1' stroke-width='3.5'/><circle cx='90.0' cy='282.0' r='4.5' fill='#b07aa1'/><circle cx='760.0' cy='126.0' r='4.5' fill='#b07aa1'/><text x='82' y='273.0' font-size='1' fill='#1f2328' font-weight='400' text-anchor='start'></text><line x1='90.0' y1='162.0' x2='760.0' y2='210.0' stroke='#4e79a7' stroke-width='3.5'/><circle cx='90.0' cy='162.0' r='4.5' fill='#4e79a7'/><circle cx='760.0' cy='210.0' r='4.5' fill='#4e79a7'/><text x='82' y='153.0' font-size='1' fill='#1f2328' font-weight='400' text-anchor='start'></text><line x1='90.0' y1='150.0' x2='760.0' y2='102.0' stroke='#1a7f37' stroke-width='3.5'/><circle cx='90.0' cy='150.0' r='4.5' fill='#1a7f37'/><circle cx='760.0' cy='102.0' r='4.5' fill='#1a7f37'/><text x='82' y='141.0' font-size='1' fill='#1f2328' font-weight='400' text-anchor='start'></text><text x='98' y='300.0' font-size='12' fill='#b07aa1' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>service 24</text><text x='98' y='180.0' font-size='12' fill='#4e79a7' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>managed 34</text><text x='98' y='140.0' font-size='12' fill='#1a7f37' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>with interface 35</text><text x='770' y='131.0' font-size='13' fill='#b07aa1' font-weight='700' text-anchor='start'>37</text><text x='770' y='215.0' font-size='13' fill='#4e79a7' font-weight='700' text-anchor='start'>30</text><text x='770' y='107.0' font-size='13' fill='#1a7f37' font-weight='700' text-anchor='start'>39</text><line x1='484.1' y1='90' x2='484.1' y2='330' stroke='#cf222e' stroke-width='1.5' stroke-dasharray='5 4'/><text x='490.11764705882354' y='294.0' font-size='12' fill='#cf222e' font-weight='600' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>without an exit plan,</text><text x='490.11764705882354' y='310.0' font-size='12' fill='#cf222e' font-weight='600' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>the choice flips here</text><text x='90' y='354' font-size='12' fill='#1f2328' font-weight='600' text-anchor='start'>← ship this summer</text><text x='760' y='354' font-size='12' fill='#1f2328' font-weight='600' text-anchor='end'>flexibility first →</text></svg>