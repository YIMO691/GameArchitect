<svg xmlns='http://www.w3.org/2000/svg' width='860' height='310' viewBox='0 0 860 310' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Filter, then weigh, then try to break it</title><rect x='0.5' y='0.5' width='859' height='309' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Filter, then weigh, then try to break it</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Must-haves remove options. Weights from the goals rank what is left. Then check what would flip it.</text><rect x='24.0' y='90.0' width='220.0' height='50.0' rx='8' fill='#ffffff' stroke='#4e79a7' stroke-width='1.6' opacity='1'/><text x='36' y='111' font-size='13' fill='#4e79a7' font-weight='700' text-anchor='start'>Game servers</text><text x='36' y='130' font-size='11.5' fill='#1f2328' font-weight='400' text-anchor='start'>$1,200 · 6 weeks · 20,000/min</text><rect x='24.0' y='150.0' width='220.0' height='50.0' rx='8' fill='#ffffff' stroke='#b07aa1' stroke-width='1.6' opacity='1'/><text x='36' y='171' font-size='13' fill='#b07aa1' font-weight='700' text-anchor='start'>New service</text><text x='36' y='190' font-size='11.5' fill='#1f2328' font-weight='400' text-anchor='start'>$2,000 · 12 weeks · scales</text><rect x='24.0' y='210.0' width='220.0' height='50.0' rx='8' fill='#ffffff' stroke='#59a14f' stroke-width='1.6' opacity='1'/><text x='36' y='231' font-size='13' fill='#59a14f' font-weight='700' text-anchor='start'>Managed product</text><text x='36' y='250' font-size='11.5' fill='#1f2328' font-weight='400' text-anchor='start'>$3,500 · 3 weeks · scales</text><rect x='282.0' y='90.0' width='170.0' height='170.0' rx='8' fill='#fff8e6' stroke='#d4a72c' stroke-width='1.6' opacity='1'/><text x='367' y='116' font-size='13' fill='#1f2328' font-weight='700' text-anchor='middle'>1 · Must-haves</text><text x='367' y='140' font-size='12' fill='#1f2328' font-weight='600' text-anchor='middle'>50,000 entries</text><text x='367' y='158' font-size='12' fill='#1f2328' font-weight='600' text-anchor='middle'>in 1 minute</text><text x='367' y='184' font-size='12' fill='#1f2328' font-weight='600' text-anchor='middle'>server-checked</text><text x='367' y='202' font-size='12' fill='#1f2328' font-weight='600' text-anchor='middle'>scores</text><text x='367' y='236' font-size='12' fill='#57606a' font-weight='600' text-anchor='middle'>pass / fail</text><line x1='246' y1='115' x2='270.0' y2='115.0' stroke='#9aa0a6' stroke-width='2'/><polygon points='280,115 270.0,109.0 270.0,121.0' fill='#9aa0a6'/><line x1='246' y1='175' x2='270.0' y2='175.0' stroke='#9aa0a6' stroke-width='2'/><polygon points='280,175 270.0,169.0 270.0,181.0' fill='#9aa0a6'/><line x1='246' y1='235' x2='270.0' y2='235.0' stroke='#9aa0a6' stroke-width='2'/><polygon points='280,235 270.0,229.0 270.0,241.0' fill='#9aa0a6'/><text x='367' y='282' font-size='12.5' fill='#cf222e' font-weight='700' text-anchor='middle'>Game servers: out</text><rect x='490.0' y='90.0' width='170.0' height='170.0' rx='8' fill='#ffffff' stroke='#1f2328' stroke-width='1.6' opacity='1'/><text x='575' y='116' font-size='13' fill='#1f2328' font-weight='700' text-anchor='middle'>2 · Weights</text><text x='512' y='142' font-size='12' fill='#1f2328' font-weight='400' text-anchor='start'>time</text><text x='640' y='142' font-size='12' fill='#f28e2b' font-weight='700' text-anchor='end'>× 3</text><text x='512' y='164' font-size='12' fill='#1f2328' font-weight='400' text-anchor='start'>operations</text><text x='640' y='164' font-size='12' fill='#f28e2b' font-weight='700' text-anchor='end'>× 2</text><text x='512' y='186' font-size='12' fill='#1f2328' font-weight='400' text-anchor='start'>flexibility</text><text x='640' y='186' font-size='12' fill='#f28e2b' font-weight='700' text-anchor='end'>× 2</text><text x='512' y='208' font-size='12' fill='#1f2328' font-weight='400' text-anchor='start'>cost</text><text x='640' y='208' font-size='12' fill='#f28e2b' font-weight='700' text-anchor='end'>× 1</text><text x='512' y='230' font-size='12' fill='#1f2328' font-weight='400' text-anchor='start'>team skills</text><text x='640' y='230' font-size='12' fill='#f28e2b' font-weight='700' text-anchor='end'>× 1</text><line x1='454' y1='175' x2='478.0' y2='175.0' stroke='#9aa0a6' stroke-width='2'/><polygon points='488,175 478.0,169.0 478.0,181.0' fill='#9aa0a6'/><text x='575' y='282' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='middle'>Managed 34 · service 24</text><rect x='698.0' y='90.0' width='138.0' height='170.0' rx='8' fill='#dafbe1' stroke='#1a7f37' stroke-width='1.6' opacity='1'/><text x='767' y='116' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='middle'>3 · What flips it?</text><text x='767' y='142' font-size='11.5' fill='#1f2328' font-weight='400' text-anchor='middle'>Flexibility × 5,</text><text x='767' y='160' font-size='11.5' fill='#1f2328' font-weight='400' text-anchor='middle'>time × 1:</text><text x='767' y='178' font-size='11.5' fill='#1f2328' font-weight='400' text-anchor='middle'>service wins.</text><text x='767' y='196' font-size='11.5' fill='#1f2328' font-weight='400' text-anchor='middle'></text><text x='767' y='214' font-size='11.5' fill='#1a7f37' font-weight='700' text-anchor='middle'>Exit plan:</text><text x='767' y='232' font-size='11.5' fill='#1a7f37' font-weight='700' text-anchor='middle'>managed wins</text><text x='767' y='250' font-size='11.5' fill='#1a7f37' font-weight='700' text-anchor='middle'>both ways</text><line x1='662' y1='175' x2='686.0' y2='175.0' stroke='#9aa0a6' stroke-width='2'/><polygon points='696,175 686.0,169.0 686.0,181.0' fill='#9aa0a6'/><text x='767' y='282' font-size='12.5' fill='#1a7f37' font-weight='700' text-anchor='middle'>Decision holds ✅</text></svg>