<svg xmlns='http://www.w3.org/2000/svg' width='860' height='464' viewBox='0 0 860 464' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Time slicing: batch vs spread</title><rect x='0.5' y='0.5' width='859' height='463' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Time slicing: batch vs spread</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>5,000 zombies think once every 4 frames. Same total work; where it lands is what players feel.</text><text x='24' y='100' font-size='14' fill='#cf222e' font-weight='700' text-anchor='start'>Batch</text><text x='24' y='118' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>all 5,000 on frame 1, 5, 9…: 15 ms</text><rect x='170.0' y='134.4' width='26.0' height='65.6' rx='0' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='183.0' y='216' font-size='10.5' fill='#57606a' font-weight='400' text-anchor='middle'>1</text><rect x='200.0' y='200.0' width='26.0' height='1.0' rx='0' fill='#1a7f37' stroke='none' stroke-width='1' opacity='1'/><text x='213.0' y='216' font-size='10.5' fill='#57606a' font-weight='400' text-anchor='middle'>2</text><rect x='230.0' y='200.0' width='26.0' height='1.0' rx='0' fill='#1a7f37' stroke='none' stroke-width='1' opacity='1'/><text x='243.0' y='216' font-size='10.5' fill='#57606a' font-weight='400' text-anchor='middle'>3</text><rect x='260.0' y='200.0' width='26.0' height='1.0' rx='0' fill='#1a7f37' stroke='none' stroke-width='1' opacity='1'/><text x='273.0' y='216' font-size='10.5' fill='#57606a' font-weight='400' text-anchor='middle'>4</text><rect x='290.0' y='134.4' width='26.0' height='65.6' rx='0' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='303.0' y='216' font-size='10.5' fill='#57606a' font-weight='400' text-anchor='middle'>5</text><rect x='320.0' y='200.0' width='26.0' height='1.0' rx='0' fill='#1a7f37' stroke='none' stroke-width='1' opacity='1'/><text x='333.0' y='216' font-size='10.5' fill='#57606a' font-weight='400' text-anchor='middle'>6</text><rect x='350.0' y='200.0' width='26.0' height='1.0' rx='0' fill='#1a7f37' stroke='none' stroke-width='1' opacity='1'/><text x='363.0' y='216' font-size='10.5' fill='#57606a' font-weight='400' text-anchor='middle'>7</text><rect x='380.0' y='200.0' width='26.0' height='1.0' rx='0' fill='#1a7f37' stroke='none' stroke-width='1' opacity='1'/><text x='393.0' y='216' font-size='10.5' fill='#57606a' font-weight='400' text-anchor='middle'>8</text><rect x='410.0' y='134.4' width='26.0' height='65.6' rx='0' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='423.0' y='216' font-size='10.5' fill='#57606a' font-weight='400' text-anchor='middle'>9</text><rect x='440.0' y='200.0' width='26.0' height='1.0' rx='0' fill='#1a7f37' stroke='none' stroke-width='1' opacity='1'/><text x='453.0' y='216' font-size='10.5' fill='#57606a' font-weight='400' text-anchor='middle'>10</text><rect x='470.0' y='200.0' width='26.0' height='1.0' rx='0' fill='#1a7f37' stroke='none' stroke-width='1' opacity='1'/><text x='483.0' y='216' font-size='10.5' fill='#57606a' font-weight='400' text-anchor='middle'>11</text><rect x='500.0' y='200.0' width='26.0' height='1.0' rx='0' fill='#1a7f37' stroke='none' stroke-width='1' opacity='1'/><text x='513.0' y='216' font-size='10.5' fill='#57606a' font-weight='400' text-anchor='middle'>12</text><rect x='530.0' y='134.4' width='26.0' height='65.6' rx='0' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='543.0' y='216' font-size='10.5' fill='#57606a' font-weight='400' text-anchor='middle'>13</text><rect x='560.0' y='200.0' width='26.0' height='1.0' rx='0' fill='#1a7f37' stroke='none' stroke-width='1' opacity='1'/><text x='573.0' y='216' font-size='10.5' fill='#57606a' font-weight='400' text-anchor='middle'>14</text><rect x='590.0' y='200.0' width='26.0' height='1.0' rx='0' fill='#1a7f37' stroke='none' stroke-width='1' opacity='1'/><text x='603.0' y='216' font-size='10.5' fill='#57606a' font-weight='400' text-anchor='middle'>15</text><rect x='620.0' y='200.0' width='26.0' height='1.0' rx='0' fill='#1a7f37' stroke='none' stroke-width='1' opacity='1'/><text x='633.0' y='216' font-size='10.5' fill='#57606a' font-weight='400' text-anchor='middle'>16</text><line x1='166' y1='191.2' x2='650' y2='191.2' stroke='#1a7f37' stroke-width='2' stroke-dasharray='5 4'/><text x='656' y='195.25' font-size='12' fill='#1a7f37' font-weight='700' text-anchor='start'>2 ms</text><text x='24' y='240' font-size='14' fill='#f28e2b' font-weight='700' text-anchor='start'>Spread</text><text x='24' y='258' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>1,250 a frame: 3.75 ms, no spikes</text><rect x='170.0' y='323.6' width='26.0' height='16.4' rx='0' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='183.0' y='356' font-size='10.5' fill='#57606a' font-weight='400' text-anchor='middle'>1</text><rect x='200.0' y='323.6' width='26.0' height='16.4' rx='0' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='213.0' y='356' font-size='10.5' fill='#57606a' font-weight='400' text-anchor='middle'>2</text><rect x='230.0' y='323.6' width='26.0' height='16.4' rx='0' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='243.0' y='356' font-size='10.5' fill='#57606a' font-weight='400' text-anchor='middle'>3</text><rect x='260.0' y='323.6' width='26.0' height='16.4' rx='0' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='273.0' y='356' font-size='10.5' fill='#57606a' font-weight='400' text-anchor='middle'>4</text><rect x='290.0' y='323.6' width='26.0' height='16.4' rx='0' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='303.0' y='356' font-size='10.5' fill='#57606a' font-weight='400' text-anchor='middle'>5</text><rect x='320.0' y='323.6' width='26.0' height='16.4' rx='0' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='333.0' y='356' font-size='10.5' fill='#57606a' font-weight='400' text-anchor='middle'>6</text><rect x='350.0' y='323.6' width='26.0' height='16.4' rx='0' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='363.0' y='356' font-size='10.5' fill='#57606a' font-weight='400' text-anchor='middle'>7</text><rect x='380.0' y='323.6' width='26.0' height='16.4' rx='0' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='393.0' y='356' font-size='10.5' fill='#57606a' font-weight='400' text-anchor='middle'>8</text><rect x='410.0' y='323.6' width='26.0' height='16.4' rx='0' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='423.0' y='356' font-size='10.5' fill='#57606a' font-weight='400' text-anchor='middle'>9</text><rect x='440.0' y='323.6' width='26.0' height='16.4' rx='0' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='453.0' y='356' font-size='10.5' fill='#57606a' font-weight='400' text-anchor='middle'>10</text><rect x='470.0' y='323.6' width='26.0' height='16.4' rx='0' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='483.0' y='356' font-size='10.5' fill='#57606a' font-weight='400' text-anchor='middle'>11</text><rect x='500.0' y='323.6' width='26.0' height='16.4' rx='0' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='513.0' y='356' font-size='10.5' fill='#57606a' font-weight='400' text-anchor='middle'>12</text><rect x='530.0' y='323.6' width='26.0' height='16.4' rx='0' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='543.0' y='356' font-size='10.5' fill='#57606a' font-weight='400' text-anchor='middle'>13</text><rect x='560.0' y='323.6' width='26.0' height='16.4' rx='0' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='573.0' y='356' font-size='10.5' fill='#57606a' font-weight='400' text-anchor='middle'>14</text><rect x='590.0' y='323.6' width='26.0' height='16.4' rx='0' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='603.0' y='356' font-size='10.5' fill='#57606a' font-weight='400' text-anchor='middle'>15</text><rect x='620.0' y='323.6' width='26.0' height='16.4' rx='0' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='633.0' y='356' font-size='10.5' fill='#57606a' font-weight='400' text-anchor='middle'>16</text><line x1='166' y1='331.2' x2='650' y2='331.2' stroke='#1a7f37' stroke-width='2' stroke-dasharray='5 4'/><text x='656' y='335.25' font-size='12' fill='#1a7f37' font-weight='700' text-anchor='start'>2 ms</text><rect x='24.0' y='380.0' width='812.0' height='64.0' rx='8' fill='#fff8e6' stroke='#d4a72c' stroke-width='1.5' opacity='1'/><text x='40' y='404' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>Both average 3.75 ms. Batching makes every 4th frame miss 16.7 ms; spreading makes every frame</text><text x='40' y='425' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>a little heavier. Spread work by zombie index: frame f handles zombies where id % 4 == f % 4.</text></svg>