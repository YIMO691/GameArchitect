<svg xmlns='http://www.w3.org/2000/svg' width='860' height='430' viewBox='0 0 860 430' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>What each pool setup does to the finale</title><rect x='0.5' y='0.5' width='859' height='429' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>What each pool setup does to the finale</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Worst frame of the fireworks finale (ms). Left bar: first finale of a session. Right bar: every later one.</text><line x1='623.9' x2='623.9' y1='80' y2='364' stroke='#1a7f37' stroke-width='2.5' stroke-dasharray='6 4'/><text x='24' y='110' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>Instantiate + Destroy</text><rect x='230.0' y='88.0' width='472.7' height='18.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='710.7272727272727' y='102' font-size='12' fill='#1f2328' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>20.00 first</text><rect x='230.0' y='110.0' width='472.7' height='18.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='710.7272727272727' y='124' font-size='12' fill='#1f2328' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>20.00 later</text><text x='24' y='166' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>Pool, starts empty</text><rect x='230.0' y='144.0' width='451.5' height='18.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='689.4545454545455' y='158' font-size='12' fill='#1f2328' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>19.10 first</text><rect x='230.0' y='166.0' width='295.5' height='18.0' rx='3' fill='#59a14f' stroke='none' stroke-width='1' opacity='1'/><text x='533.4545454545455' y='180' font-size='12' fill='#1f2328' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>12.50 later</text><text x='24' y='222' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>Pool, prewarm 120</text><rect x='230.0' y='200.0' width='295.5' height='18.0' rx='3' fill='#59a14f' stroke='none' stroke-width='1' opacity='1'/><text x='533.4545454545455' y='214' font-size='12' fill='#1f2328' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>12.50 first</text><rect x='230.0' y='222.0' width='295.5' height='18.0' rx='3' fill='#59a14f' stroke='none' stroke-width='1' opacity='1'/><text x='533.4545454545455' y='236' font-size='12' fill='#1f2328' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>12.50 later</text><text x='24' y='278' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>Prewarm 120, maxSize 60</text><rect x='230.0' y='256.0' width='472.7' height='18.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='710.7272727272727' y='270' font-size='12' fill='#1f2328' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>20.00 first</text><rect x='230.0' y='278.0' width='472.7' height='18.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='710.7272727272727' y='292' font-size='12' fill='#1f2328' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>20.00 later</text><text x='24' y='334' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>Prewarm 2,000</text><rect x='230.0' y='312.0' width='295.5' height='18.0' rx='3' fill='#59a14f' stroke='none' stroke-width='1' opacity='1'/><text x='533.4545454545455' y='326' font-size='12' fill='#1f2328' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>12.50 first</text><rect x='230.0' y='334.0' width='295.5' height='18.0' rx='3' fill='#59a14f' stroke='none' stroke-width='1' opacity='1'/><text x='533.4545454545455' y='348' font-size='12' fill='#1f2328' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>12.50 later</text><text x='623.939393939394' y='380' font-size='12' fill='#1a7f37' font-weight='700' text-anchor='middle'>budget 16.67 ms</text><text x='24' y='408' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Prewarm 2,000 is as fast as prewarm 120. Its cost is in memory, loading and GC: see the next picture.</text></svg>