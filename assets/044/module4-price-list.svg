<svg xmlns='http://www.w3.org/2000/svg' width='860' height='478' viewBox='0 0 860 478' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Module 4 price list</title><rect x='0.5' y='0.5' width='859' height='477' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Module 4 price list</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>One rule and one price per lesson. Multiply the price by what you count in the capture.</text><rect x='24.0' y='84.0' width='812.0' height='36.0' rx='8' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><rect x='24.0' y='84.0' width='58.0' height='36.0' rx='8' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><rect x='70.0' y='84.0' width='12.0' height='36.0' rx='0' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><text x='53' y='107' font-size='14' fill='#ffffff' font-weight='700' text-anchor='middle'>035</text><text x='96' y='107' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>Hypothesis first</text><text x='250' y='107' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>Write cause + number + test before you change anything</text><rect x='24.0' y='126.0' width='812.0' height='36.0' rx='8' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><rect x='24.0' y='126.0' width='58.0' height='36.0' rx='8' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><rect x='70.0' y='126.0' width='12.0' height='36.0' rx='0' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><text x='53' y='149' font-size='14' fill='#ffffff' font-weight='700' text-anchor='middle'>036</text><text x='96' y='149' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>Hot paths</text><text x='250' y='149' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>cost = count × each; List.Contains O(n): 3–8 ns a compare; HashSet ≈ 25 ns, flat</text><rect x='24.0' y='168.0' width='812.0' height='36.0' rx='8' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><rect x='24.0' y='168.0' width='58.0' height='36.0' rx='8' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><rect x='70.0' y='168.0' width='12.0' height='36.0' rx='0' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><text x='53' y='191' font-size='14' fill='#ffffff' font-weight='700' text-anchor='middle'>037</text><text x='96' y='191' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>Spatial structures</text><text x='250' y='191' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>One structure per question; cell ≈ query radius</text><rect x='24.0' y='210.0' width='812.0' height='36.0' rx='8' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><rect x='24.0' y='210.0' width='58.0' height='36.0' rx='8' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><rect x='70.0' y='210.0' width='12.0' height='36.0' rx='0' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><text x='53' y='233' font-size='14' fill='#ffffff' font-weight='700' text-anchor='middle'>038</text><text x='96' y='233' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>Physics</text><text x='250' y='233' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>step = awake bodies + pairs × (detect + solve); box pair 1.8 µs, convex 5.0</text><rect x='24.0' y='252.0' width='812.0' height='36.0' rx='8' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><rect x='24.0' y='252.0' width='58.0' height='36.0' rx='8' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><rect x='70.0' y='252.0' width='12.0' height='36.0' rx='0' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><text x='53' y='275' font-size='14' fill='#ffffff' font-weight='700' text-anchor='middle'>039</text><text x='96' y='275' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>Animation</text><text x='250' y='275' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>70 bones 14 µs + 7,000 vertices 21 µs; off screen culled 2 µs</text><rect x='24.0' y='294.0' width='812.0' height='36.0' rx='8' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><rect x='24.0' y='294.0' width='58.0' height='36.0' rx='8' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><rect x='70.0' y='294.0' width='12.0' height='36.0' rx='0' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><text x='53' y='317' font-size='14' fill='#ffffff' font-weight='700' text-anchor='middle'>040</text><text x='96' y='317' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>Allocations</text><text x='250' y='317' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>GC every = 16,384 KB ÷ KB a frame × frame time; steady state 0 B</text><rect x='24.0' y='336.0' width='812.0' height='36.0' rx='8' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><rect x='24.0' y='336.0' width='58.0' height='36.0' rx='8' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><rect x='70.0' y='336.0' width='12.0' height='36.0' rx='0' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><text x='53' y='359' font-size='14' fill='#ffffff' font-weight='700' text-anchor='middle'>041</text><text x='96' y='359' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>Pooling</text><text x='250' y='359' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>Instantiate 0.25 ms vs Get 0.03 ms; pool = measured peak</text><rect x='24.0' y='378.0' width='812.0' height='36.0' rx='8' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><rect x='24.0' y='378.0' width='58.0' height='36.0' rx='8' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><rect x='70.0' y='378.0' width='12.0' height='36.0' rx='0' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><text x='53' y='401' font-size='14' fill='#ffffff' font-weight='700' text-anchor='middle'>042</text><text x='96' y='401' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>Hidden costs</text><text x='250' y='401' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>Debug.Log ≈ 0.3 ms + 1 KB; SendMessage ≈ 8 µs; a box 32 B</text><rect x='24.0' y='420.0' width='812.0' height='36.0' rx='8' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><rect x='24.0' y='420.0' width='58.0' height='36.0' rx='8' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><rect x='70.0' y='420.0' width='12.0' height='36.0' rx='0' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><text x='53' y='443' font-size='14' fill='#ffffff' font-weight='700' text-anchor='middle'>043</text><text x='96' y='443' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>Loading</text><text x='250' y='443' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>read + unpack + create; LZ4 unpacks 7.5× faster; one owner per shared asset</text></svg>