<text x='24' y='38' font-size='20' fill='#1f2328' font-weight='700' text-anchor='start'>SIMD: one instruction, 8 particles</text>
<text x='24' y='62' font-size='14' fill='#57606a' font-weight='400' text-anchor='start'>AVX2 registers are 256 bits wide: 8 floats side by side. Each slot is a lane.</text>
