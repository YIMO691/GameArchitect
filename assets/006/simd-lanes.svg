<rect x='24' y='512' width='812' height='92' rx='10' fill='#dafbe1' stroke='#1a7f37' stroke-width='1.5'/>
<text x='44' y='540' font-size='14' fill='#1f2328' font-weight='700' text-anchor='start'>Both sides are computed for every lane, then the mask picks one. Nothing to guess.</text>
<text x='44' y='566' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>Work: 1.5 ns per particle ÷ 8 lanes ≈ 0.19 ns. 500,000 particles ≈ 0.09 ms of work,</text>
<text x='44' y='588' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>but reading and writing 4.5 MB takes 0.36 ms. So Fade now waits on memory: 0.36 ms.</text>
