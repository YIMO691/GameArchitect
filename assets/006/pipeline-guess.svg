<svg xmlns='http://www.w3.org/2000/svg' width='860' height='560' viewBox='0 0 860 560' font-family='Segoe UI, Helvetica, Arial, sans-serif'>
<rect x='0.5' y='0.5' width='859' height='559' rx='14' fill='#ffffff' stroke='#d0d7de'/>
<text x='24' y='38' font-size='20' fill='#1f2328' font-weight='700' text-anchor='start'>An if is a fork in the track: the CPU guesses, then checks</text>
<text x='24' y='62' font-size='14' fill='#57606a' font-weight='400' text-anchor='start'>The core works like an assembly line about 15 stages long. It can't wait at every if, so it guesses.</text>
<text x='190' y='92' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>stage 1 (fetch)</text>
<text x='846' y='92' font-size='12' fill='#57606a' font-weight='400' text-anchor='end'>stage 15 (done)</text>
<line x1='190' y1='98' x2='846' y2='98' stroke='#57606a' stroke-width='1'/>
<text x='24' y='128' font-size='15' fill='#1f2328' font-weight='700' text-anchor='start'>No if</text>
<text x='24' y='148' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>line always full</text>
<rect x='190' y='110' width='40' height='44' rx='4' fill='#4e79a7'/>
<text x='210.0' y='137' font-size='12' fill='#ffffff' font-weight='600' text-anchor='middle'>p15</text>
