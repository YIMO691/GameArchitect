<text x='826.0' y='237' font-size='12' fill='#ffffff' font-weight='600' text-anchor='middle'>p1</text>
<text x='190' y='274' font-size='13' fill='#1a7f37' font-weight='600' text-anchor='start'>The guess was right: the work after the if was already correct. Cost: 0.</text>
<text x='24' y='328' font-size='15' fill='#1f2328' font-weight='700' text-anchor='start'>Wrong guess</text>
<text x='24' y='348' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>guessed rain, it was blood</text>
<rect x='190' y='310' width='40' height='44' rx='4' fill='#ffebe9'/>
<text x='210.0' y='337' font-size='12' fill='#cf222e' font-weight='600' text-anchor='middle'>✗</text>
<rect x='234' y='310' width='40' height='44' rx='4' fill='#ffebe9'/>
<text x='254.0' y='337' font-size='12' fill='#cf222e' font-weight='600' text-anchor='middle'>✗</text>
<rect x='278' y='310' width='40' height='44' rx='4' fill='#ffebe9'/>
<text x='298.0' y='337' font-size='12' fill='#cf222e' font-weight='600' text-anchor='middle'>✗</text>
