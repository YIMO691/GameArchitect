<text x='650.0' y='137' font-size='12' fill='#ffffff' font-weight='600' text-anchor='middle'>p5</text>
<rect x='674' y='110' width='40' height='44' rx='4' fill='#4e79a7'/>
<text x='694.0' y='137' font-size='12' fill='#ffffff' font-weight='600' text-anchor='middle'>p4</text>
<rect x='718' y='110' width='40' height='44' rx='4' fill='#4e79a7'/>
<text x='738.0' y='137' font-size='12' fill='#ffffff' font-weight='600' text-anchor='middle'>p3</text>
<rect x='762' y='110' width='40' height='44' rx='4' fill='#4e79a7'/>
<text x='782.0' y='137' font-size='12' fill='#ffffff' font-weight='600' text-anchor='middle'>p2</text>
<rect x='806' y='110' width='40' height='44' rx='4' fill='#4e79a7'/>
<text x='826.0' y='137' font-size='12' fill='#ffffff' font-weight='600' text-anchor='middle'>p1</text>
<text x='190' y='174' font-size='13' fill='#57606a' font-weight='600' text-anchor='start'>One particle finishes every step. Nothing is wasted.</text>
<text x='24' y='228' font-size='15' fill='#1f2328' font-weight='700' text-anchor='start'>Right guess</text>
<text x='24' y='248' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>guessed rain, it was rain</text>
<rect x='190' y='210' width='40' height='44' rx='4' fill='#4e79a7'/>
<text x='210.0' y='237' font-size='12' fill='#ffffff' font-weight='600' text-anchor='middle'>p15</text>
