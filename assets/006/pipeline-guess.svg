<text x='826.0' y='337' font-size='12' fill='#ffffff' font-weight='600' text-anchor='middle'>p1</text>
<text x='190' y='374' font-size='13' fill='#cf222e' font-weight='600' text-anchor='start'>Everything started after the if is thrown away and the line refills.</text>
<rect x='24' y='410' width='812' height='126' rx='10' fill='#fff8f6' stroke='#e5534b' stroke-width='1.5'/>
<text x='44' y='440' font-size='15' fill='#1f2328' font-weight='700' text-anchor='start'>What one wrong guess costs (approximate, our laptop at about 3 GHz)</text>
<text x='44' y='466' font-size='14' fill='#1f2328' font-weight='400' text-anchor='start'>about 15 lost steps (cycles) × 0.33 ns = about 5 ns</text>
<text x='44' y='492' font-size='14' fill='#1f2328' font-weight='400' text-anchor='start'>Big fight: 500,000 particles × 50% wrong guesses = 250,000 wrong guesses</text>
<text x='44' y='518' font-size='14' fill='#cf222e' font-weight='700' text-anchor='start'>250,000 × 5 ns = 1.25 ms per frame, just for guessing wrong</text>
</svg>
