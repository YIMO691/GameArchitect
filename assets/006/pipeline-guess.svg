<text x='342.0' y='137' font-size='12' fill='#ffffff' font-weight='600' text-anchor='middle'>p12</text>
<rect x='366' y='110' width='40' height='44' rx='4' fill='#4e79a7'/>
<text x='386.0' y='137' font-size='12' fill='#ffffff' font-weight='600' text-anchor='middle'>p11</text>
<rect x='410' y='110' width='40' height='44' rx='4' fill='#4e79a7'/>
<text x='430.0' y='137' font-size='12' fill='#ffffff' font-weight='600' text-anchor='middle'>p10</text>
