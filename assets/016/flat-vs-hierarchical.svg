<svg xmlns='http://www.w3.org/2000/svg' width='880' height='508' viewBox='0 0 880 508' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Flat state machine needs 27 transition arrows; the hierarchical one needs 13</title><defs><marker id='mink' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#1f2328'/></marker><marker id='mred' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#cf222e'/></marker><marker id='mgrn' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#1a7f37'/></marker><marker id='mpur' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#b07aa1'/></marker><marker id='mpink' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#e17ca6'/></marker><marker id='mor' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#f28e2b'/></marker><marker id='mblue' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#4e79a7'/></marker></defs><rect x='0.5' y='0.5' width='879' height='507' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' fill='#1f2328' font-weight='bold' text-anchor='start' >Storm and stun added: 27 arrows by hand, or 13</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start' >Left: every arrow of the flat state machine (row = from, column = to). Right: the same gull, grouped.</text><text x='100.0' y='132' font-size='12' fill='#1f2328' font-weight='normal' text-anchor='start' transform='rotate(-50 100.0 132)'>Circle</text><text x='74' y='162.0' font-size='12' fill='#1f2328' font-weight='normal' text-anchor='end' >Circle</text><text x='136.0' y='132' font-size='12' fill='#1f2328' font-weight='normal' text-anchor='start' transform='rotate(-50 136.0 132)'>Dive</text><text x='74' y='198.0' font-size='12' fill='#1f2328' font-weight='normal' text-anchor='end' >Dive</text><text x='172.0' y='132' font-size='12' fill='#1f2328' font-weight='normal' text-anchor='start' transform='rotate(-50 172.0 132)'>Carry</text><text x='74' y='234.0' font-size='12' fill='#1f2328' font-weight='normal' text-anchor='end' >Carry</text><text x='208.0' y='132' font-size='12' fill='#1f2328' font-weight='normal' text-anchor='start' transform='rotate(-50 208.0 132)'>Eat</text><text x='74' y='270.0' font-size='12' fill='#1f2328' font-weight='normal' text-anchor='end' >Eat</text><text x='244.0' y='132' font-size='12' fill='#1f2328' font-weight='normal' text-anchor='start' transform='rotate(-50 244.0 132)'>Rest</text><text x='74' y='306.0' font-size='12' fill='#1f2328' font-weight='normal' text-anchor='end' >Rest</text><text x='280.0' y='132' font-size='12' fill='#1f2328' font-weight='normal' text-anchor='start' transform='rotate(-50 280.0 132)'>Flee</text><text x='74' y='342.0' font-size='12' fill='#1f2328' font-weight='normal' text-anchor='end' >Flee</text><text x='316.0' y='132' font-size='12' fill='#1f2328' font-weight='normal' text-anchor='start' transform='rotate(-50 316.0 132)'>Shelter</text><text x='74' y='378.0' font-size='12' fill='#1f2328' font-weight='normal' text-anchor='end' >Shelter</text><text x='352.0' y='132' font-size='12' fill='#1f2328' font-weight='normal' text-anchor='start' transform='rotate(-50 352.0 132)'>Stun</text><text x='74' y='414.0' font-size='12' fill='#1f2328' font-weight='normal' text-anchor='end' >Stun</text><rect x='83' y='141' width='34' height='34' rx='3' fill='#eaeef2' stroke='none' stroke-width='1.5' /><rect x='119' y='141' width='34' height='34' rx='3' fill='#4e79a7' stroke='none' stroke-width='1.5' /><rect x='155' y='141' width='34' height='34' rx='3' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' /><rect x='191' y='141' width='34' height='34' rx='3' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' /><rect x=