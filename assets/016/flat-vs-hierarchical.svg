 width='34' height='34' rx='3' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' /><rect x='227' y='321' width='34' height='34' rx='3' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' /><rect x='263' y='321' width='34' height='34' rx='3' fill='#eaeef2' stroke='none' stroke-width='1.5' /><rect x='299' y='321' width='34' height='34' rx='3' fill='#e17ca6' stroke='none' stroke-width='1.5' /><rect x='335' y='321' width='34' height='34' rx='3' fill='#f28e2b' stroke='none' stroke-width='1.5' /><rect x='83' y='357' width='34' height='34' rx='3' fill='#e17ca6' stroke='none' stroke-width='1.5' /><rect x='119' y='357' width='34' height='34' rx='3' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' /><rect x='155' y='357' width='34' height='34' rx='3' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' /><rect x='191' y='357' width='34' height='34' rx='3' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' /><rect x='227' y='357' width='34' height='34' rx='3' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' /><rect x='263' y='357' width='34' height='34' rx='3' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' /><rect x='299' y='357' width='34' height='34' rx='3' fill='#eaeef2' stroke='none' stroke-width='1.5' /><rect x='335' y='357' width='34' height='34' rx='3' fill='#f28e2b' stroke='none' stroke-width='1.5' /><rect x='83' y='393' width='34' height='34' rx='3' fill='#f28e2b' stroke='none' stroke-width='1.5' /><rect x='119' y='393' width='34' height='34' rx='3' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' /><rect x='155' y='393' width='34' height='34' rx='3' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' /><rect x='191' y='393' width='34' height='34' rx='3' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' /><rect x='227' y='393' width='34' height='34' rx='3' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' /><rect x='263' y='393' width='34' height='34' rx='3' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' /><rect x='299' y='393' width='34' height='34' rx='3' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' /><rect x='335' y='393' width='34' height='34' rx='3' fill='#eaeef2' stroke='none' stroke-width='1.5' /><rect x='297' y='211' width='38' height='38' rx='4' fill='none' stroke='#cf222e' stroke-width='3' stroke-dasharray='5 3'/><text x='24' y='450' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='start' >6 feeding + 6 Flee + 7 Shelter + 8 Stun = 27</text><text x='24' y='470' font-size='12' fill='#cf222e' font-weight='normal' text-anchor='start' >Dashed: Carry → Shelter. Forget it, and 120 of</text><text x='24' y='486' font-size='12' fill='#cf222e' font-weight='normal' text-anchor='start' >1,000 gulls carry their fish through the storm.</text><rect x='410' y='84' width='450' height='250' rx='12' fill='#ffffff' stroke='#57606a' stroke-width='1.5' /><text x='424' y='104' font-size='13' fill='#57606a' font-weight='bold' text-anchor='start' >Awake</text><rect x='424' y='114' width='250' height='200' rx='10' fill='#eef4fa' stroke='#4e79a7' stroke-width='1.5' /><text x='436' y='134' font-size='13' fill='#4e79a7' font-weight='bold' text-anchor='start' >Feeding</text><rect x='440' y='150' width='88' height='30' rx='15' fill='#ffffff' stroke='#4e79a7' stroke-width='1.5' /><text x='484' y='170' font-size='12' fill='#1f2328' font-weight='bold' text-anchor='middle' >Circle</text><rect x='550' y='150' width='88' height='30' rx='15' fill='#ffffff' stroke='#4e79a7' stroke-width='1.5' /><text x='594' y='170' font-size='12' fill='#1f2328' font-weight='bold' text-anchor='middle' >Dive</text><rect x='550' y='206' width='88' height='30' rx='15' fill='#ffffff' stroke='#4e79a7' stroke-width='1.5' /><text x='594' y='226' font-size='12' fill='#1f2328' font-weight='bold' text-anchor='middle' >Carry</text><rect x='550' y='262' width='88' height='30' rx='15' fill='#ffffff' stroke='#4e79a7' stroke-width='1.5' /><text x='594' y='282' font-size='12' fill='#1f2328' font-weight='bold' text-anchor='middle' >Eat</text><rect x='440' y='262' width='88' height='30' rx='15' fill='#ffffff' stroke='#4e79a7' stroke-width='1.5' /><text x='484' y='282' font-size='12' fill='#1f2328' font-weight='bold' text-anchor='middle' >Rest</text><line x1='528' y1='162' x2='548' y2='162' stroke='#4e79a7' stroke-width='2' marker-end='url(#mblue)'/><line x1='594' y1='180' x2='594' y2='204' stroke='#4e79a7' stroke-width='2' marker-end='url(#mblue)'/><line x1='594' y1='236' x2='594' y2='260' stroke='#4e79a7' stroke-width='2' marker-end='url(#mblue)'/><line x1='548' y1='277' x2='530' y2='277' stroke='#4e79a7' stroke-width='2' marker-end='url(#mblue)'/><line x1='484' y1='260' x2='484' y2='182' stroke='#4e79a7' stroke-width='2' marker-end='url(#mblue)'/><path d='M560,181 Q538,204 516,183' fill='none' stroke='#4e79a7' stroke-width='2' marker-end='url(#mblue)'/><text x='436' y='306' font-size='12' fill='#4e79a7' font-weight='bold' text-anchor='start' >6 arrows inside</text><rect x='710' y='130' width='130' height='40' rx='20' fill='#f6f0f5' stroke='#b07aa1' stroke-width='1.5' /><text x='775' y='155' font-size='13' fill='#b07aa1' font-weight='bold' text-anchor='middle' >Flee</text><rect x='710' y='250' width='130' height='40' rx='20' fill='#fcf0f5' stroke='#e17ca6' stroke-width='1.5' /><text x='775' y='275' font-size='13' fill='#b0457a' font-weight='bold' text-anchor='middle' >Shelter</text><line x1='674' y1='144' x2='708' y2='144' stroke='#b07aa1' stroke-width='2' marker-end='url(#mpur)'/><line x1='708' y1='160' x2='676' y2='160' stroke='#b07aa1' stroke-width='2' marker-end='url(#mpur)'/><line x1='674' y1='264' x2='708' y2='264' stroke='#e17ca6' stroke-width='2' marker-end='url(#mpink)'/><line x1='708' y1='280' x2='676' y2='280' stroke='#e17ca6' stroke-width='2' marker-end='url(#mpink)'/><line x1='775' y1='172' x2='775' y2='248' stroke='#e17ca6' stroke-width='2' marker-end='url(#mpink)'/><text x='782' y='214' font-size='11' fill='#b0457a' font-weight='normal' text-anchor='start' >Flee → Shelter</text><rect x='710' y='372' width='130' height='40' rx='20' fill='#fff4eb' stroke='#f28e2b' stroke-width='1.5' /><text x='775' y='397' font-size='13' fill='#b85c00' font-weight='bold' text-anchor='middle' >Stunned</text><line x1='805' y1='334' x2='805' y2='370' stroke='#f28e2b' stroke-width='2' marker-end='url(#mor)'/><text x='813' y='357' font-size='11' fill='#b85c00' font-weight='normal' text-anchor='start' >1 arrow</text><text x='796' y='357' font-size='11' fill='#b85c00' font-weight='normal' text-anchor='end' >Awake → Stunned</text><line x1='710' y1='396' x2='560' y2='318' stroke='#f28e2b' stroke-width='2' marker-end='url(#mor)'/><text x='424' y='400' font-size='11' fill='#b85c00' font-weight='normal' text-anchor='start' >Stunned → Feeding</text><text x='424' y='476' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='start' >6 inside + Flee 2 + Shelter 3 + Stun 2 = 13 arrows. Each interrupt</text><text x='424' y='494' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start' >is written once, on the parent; every child state gets it.</text></svg>