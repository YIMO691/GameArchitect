<svg xmlns='http://www.w3.org/2000/svg' width='880' height='460' viewBox='0 0 880 460' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>32 flag combinations, 6 legal; isDiving plus isFleeing makes a gull hover 1 m above the water</title><defs><marker id='mink' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#1f2328'/></marker><marker id='mred' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#cf222e'/></marker><marker id='mgrn' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#1a7f37'/></marker><marker id='mpur' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#b07aa1'/></marker><marker id='mpink' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#e17ca6'/></marker><marker id='mor' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#f28e2b'/></marker><marker id='mblue' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#4e79a7'/></marker></defs><rect x='0.5' y='0.5' width='879' height='459' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' fill='#1f2328' font-weight='bold' text-anchor='start' >5 flags make 32 gulls. Only 6 of them can really exist.</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start' >Each box is one combination of isDiving, isCarrying, isEating, isResting, isFleeing.</text><rect x='26' y='86' width='54' height='42' rx='5' fill='#dafbe1' stroke='#1a7f37' stroke-width='1.5' /><text x='53.0' y='109.0' font-size='12' fill='#1a7f37' font-weight='bold' text-anchor='middle' >none</text><text x='53.0' y='122.0' font-size='10' fill='#1a7f37' font-weight='normal' text-anchor='middle' >Circle</text><rect x='84' y='86' width='54' height='42' rx='5' fill='#dafbe1' stroke='#1a7f37' stroke-width='1.5' /><text x='111.0' y='109.0' font-size='12' fill='#1a7f37' font-weight='bold' text-anchor='middle' >D</text><text x='111.0' y='122.0' font-size='10' fill='#1a7f37' font-weight='normal' text-anchor='middle' >Dive</text><rect x='142' y='86' width='54' height='42' rx='5' fill='#dafbe1' stroke='#1a7f37' stroke-width='1.5' /><text x='169.0' y='109.0' font-size='12' fill='#1a7f37' font-weight='bold' text-anchor='middle' >C</text><text x='169.0' y='122.0' font-size='10' fill='#1a7f37' font-weight='normal' text-anchor='middle' >Carry</text><rect x='200' y='86' width='54' height='42' rx='5' fill='#fff5f5' stroke='#f1aeb5' stroke-width='1' /><text x='227.0' y='109.0' font-size='12' fill='#b35a62' font-weight='normal' text-anchor='middle' >D+C</text><rect x='258' y='86' width='54' height='42' rx='5' fill='#dafbe1' stroke='#1a7f37' stroke-width='1.5' /><text x='285.0' y='109.0' font-size='12' fill='#1a7f37' font-weight='bold' text-anchor='middle' >E</text><text x='285.0' y='122.0' font-size='10' fill='#1a7f37' font-weight='normal' text-anchor='middle' >Eat</text><rect x='316' y='86' width='54' height='42' rx='5' fill='#fff5f5' stroke='#f1aeb5' stroke-width='1' /><text x='343.0' y='109.0' font-size='12' fill='#b35a62' font-weight='normal' text-anchor='middle' >D+E</text><rect x='374' y='86' width='54' height='42' rx='5' fill='#fff5f5' stroke='#f1aeb5' stroke-width='1' /><text x='401.0' y='109.0' font-size='12' fill='#b35a62' font-weight='normal' text-anchor='middle' >C+E</text><rect x='432' y='86' width='54' height='42' rx='5' fill='#fff5f5' stroke='#f1aeb5' stroke-width='1' /><text x='459.0' y='109.0' font-size='12' fill='#b35a62' font-weight='normal' text-anchor='middle' >D+C+E</text><rect x='26' y='132' width='54' height='42' rx='5' fill='#dafbe1' stroke='#1a7f37' stroke-width='1.5' /><text x='53.0' y='155.0' font-size='12' fill='#1a7f37' font-weight='bold' text-anchor='middle' >R</text><text x='53.0' y='168.0' font-size='10' fill='#1a7f37' font-weight='normal' text-anchor='middle' >Rest</text><rect x='84' y='132' width='54' height='42' rx='5' fill='#fff5f5' stroke='#f1aeb5' stroke-width='1' /><text x='111.0' y='155.0' font-size='12' fill='#b35a62' font-weight='normal' text-anchor='middle' >D+R</text><rect x='142' y='132' width='54' height='42' rx='5' fill='#fff5f5' stroke='#f1aeb5' stroke-width='1' /><text x='169.0' y='155.0' font-size='12' fill='#b35a62' font-weight='normal' text-anchor='middle' >C+R</text><rect x='200' y='132' width='54' height='42' rx='5' fill='#fff5f5' stroke='#f1aeb5' stroke-width='1' /><text x='227.0' y='155.0' font-size='12' fill='#b35a62' font-weight='normal' text-anchor='middle' >D+C+R</text><rect x='258' y='132' width='54' height='42' rx='5' fill='#fff5f5' stroke='#f1aeb5' stroke-width='1' /><text x='285.0' y='155.0' font-size='12' fill='#b35a62' font-weight='normal' text-anchor='middle' >E+R</text><rect x='316' y='132' width='54' height='42' rx='5' fill='#fff5f5' stroke='#f1aeb5' stroke-width='1' /><text x='343.0' y='155.0' font-size='12' fill='#b35a62' font-weight='normal' text-anchor='middle' >D+E+R</text><rect x='374' y='132' width='54' height='42' rx='5' fill='#fff5f5' stroke='#f1aeb5' stroke-width='1' /><text x='401.0' y='155.0' font-size='12' fill='#b35a62' font-weight='normal' text-anchor='middle' >C+E+R</text><rect x='432' y='132' width='54' height='42' rx='5' fill='#fff5f5' stroke='#f1aeb5' stroke-width='1' /><text x='459.0' y='155.0' font-size='11' fill='#b35a62' font-weight='normal' text-anchor='middle' >D+C+E+R</text><rect x='26' y='178' width='54' height='42' rx='5' fill='#dafbe1' stroke='#1a7f37' stroke-width='1.5' /><text x='53.0' y='201.0' font-size='12' fill='#1a7f37' font-weight='bold' text-anchor='middle' >F</text><text x='53.0' y='214.0' font-size='10' fill='#1a7f37' font-weight='normal' text-anchor='middle' >Flee</text><rect x='84' y='178' width='54' height='42' rx='5' fill='#e5534b' stroke='#cf222e' stroke-width='1.5' /><text x='111.0' y='201.0' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle' >D+F</text><rect x='142' y='178' width='54' height='42' rx='5' fill='#fff5f5' stroke='#f1aeb5' stroke-width='1' /><text x='169.0' y='201.0' font-size='12' fill='#b35a62' font-weight='normal' text-anchor='middle' >C+F</text><rect x='200' y='178' width='54' height='42' rx='5' fill='#fff5f5' stroke='#f1aeb5' stroke-width='1' /><text x='227.0' y='201.0' font-size='12' fill='#b35a62' font-weight='normal' text-anchor='middle' >D+C+F</text><rect x='258' y='178' width='54' height='42' rx='5' fill='#fff5f5' stroke='#f1aeb5' stroke-width='1' /><text x='285.0' y='201.0' font-size='12' fill='#b35a62' font-weight='normal' text-anchor='middle' >E+F</text><rect x='316' y='178' width='54' height='42' rx='5' fill='#fff5f5' stroke='#f1aeb5' stroke-width='1' /><text x='343.0' y='201.0' font-size='12' fill='#b35a62' font-weight='normal' text-anchor='middle' >D+E+F</text><rect x='374' y='178' width='54' height='42' rx='5' fill='#fff5f5' stroke='#f1aeb5' stroke-width='1' /><text x='401.0' y='201.0' font-size='12' fill='#b35a62' font-weight='normal' text-anchor='middle' >C+E+F</text><rect x='432' y='178' width='54' height='42' rx='5' fill='#fff5f5' stroke='#f1aeb5' stroke-width='1' /><text x='459.0' y='201.0' font-size='11' fill='#b35a62' font-weight='normal' text-anchor='middle' >D+C+E+F</text><rect x='26' y='224' width='54' height='42' rx='5' fill='#fff5f5' stroke='#f1aeb5' stroke-width='1' /><text x='53.0' y='247.0' font-size='12' fill='#b35a62' font-weight='normal' text-anchor='middle' >R+F</text><rect x='84' y='224' width='54' height='42' rx='5' fill='#fff5f5' stroke='#f1aeb5' stroke-width='1' /><text x='111.0' y='247.0' font-size='12' fill='#b35a62' font-weight='normal' text-anchor='middle' >D+R+F</text><rect x='142' y='224' width='54' height='42' rx='5' fill='#fff5f5' stroke='#f1aeb5' stroke-width='1' /><text x='169.0' y='247.0' font-size='12' fill='#b35a62' font-weight='normal' text-anchor='middle' >C+R+F</text><rect x='200' y='224' width='54' height='42' rx='5' fill='#fff5f5' stroke='#f1aeb5' stroke-width='1' /><text x='227.0' y='247.0' font-size='11' fill='#b35a62' font-weight='normal' text-anchor='middle' >D+C+R+F</text><rect x='258' y='224' width='54' height='42' rx='5' fill='#fff5f5' stroke='#f1aeb5' stroke-width='1' /><text x='285.0' y='247.0' font-size='12' fill='#b35a62' font-weight='normal' text-anchor='middle' >E+R+F</text><rect x='316' y='224' width='54' height='42' rx='5' fill='#fff5f5' stroke='#f1aeb5' stroke-width='1' /><text x='343.0' y='247.0' font-size='11' fill='#b35a62' font-weight='normal' text-anchor='middle' >D+E+R+F</text><rect x='374' y='224' width='54' height='42' rx='5' fill='#fff5f5' stroke='#f1aeb5' stroke-width='1' /><text x='401.0' y='247.0' font-size='11' fill='#b35a62' font-weight='normal' text-anchor='middle' >C+E+R+F</text><rect x='432' y='224' width='54' height='42' rx='5' fill='#fff5f5' stroke='#f1aeb5' stroke-width='1' /><text x='459.0' y='247.0' font-size='12' fill='#b35a62' font-weight='normal' text-anchor='middle' >D+C…</text><rect x='24' y='279' width='12' height='12' rx='2' fill='#dafbe1' stroke='#1a7f37' stroke-width='1.5' /><text x='42' y='290' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start' >6 legal: none = Circle, or exactly one flag</text><rect x='24' y='299' width='12' height='12' rx='2' fill='#fff5f5' stroke='#f1aeb5' stroke-width='1.5' /><text x='42' y='310' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start' >25 impossible, nobody tests them</text><rect x='24' y='319' width='12' height='12' rx='2' fill='#e5534b' stroke='#cf222e' stroke-width='1.5' /><text x='42' y='330' font-size='12' fill='#cf222e' font-weight='bold' text-anchor='start' >D+F: the one the Frenzy found</text><text x='24' y='356' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start' >D Diving · C Carrying · E Eating · R Resting · F Fleeing</text><rect x='520' y='84' width='336' height='300' rx='10' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' /><text x='536' y='108' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start' >Gull #412 after a pelican scare</text><rect x='521' y='300' width='334' height='83' fill='#d6e4f0'/><text x='536' y='324' font-size='12' fill='#4e79a7' font-weight='normal' text-anchor='start' >water</text><path d='M666,230 L688,244 L710,230' fill='none' stroke='#cf222e' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/><line x1='628' y1='232' x2='628' y2='282' stroke='#1a7f37' stroke-width='3' marker-end='url(#mgrn)'/><text x='618' y='248' font-size='12' fill='#1a7f37' font-weight='bold' text-anchor='end' >isDiving</text><text x='618' y='264' font-size='12' fill='#1a7f37' font-weight='normal' text-anchor='end' >climb −6 m/s</text><line x1='738' y1='244' x2='738' y2='194' stroke='#b07aa1' stroke-width='3' marker-end='url(#mpur)'/><text x='750' y='224' font-size='12' fill='#b07aa1' font-weight='bold' text-anchor='start' >isFleeing</text><text x='750' y='240' font-size='12' fill='#b07aa1' font-weight='normal' text-anchor='start' >climb +6 m/s</text><line x1='688' y1='252' x2='688' y2='298' stroke='#57606a' stroke-dasharray='3 3'/><text x='694' y='282' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start' >1 m</text><text x='688' y='140' font-size='14' fill='#cf222e' font-weight='bold' text-anchor='middle' >−6 + 6 = 0 m/s: it hovers.</text><text x='688' y='160' font-size='12' fill='#1f2328' font-weight='normal' text-anchor='middle' >It never reaches the fish, never gets</text><text x='688' y='176' font-size='12' fill='#1f2328' font-weight='normal' text-anchor='middle' >far from the pelican: no flag is cleared.</text><text x='688' y='352' font-size='13' fill='#cf222e' font-weight='bold' text-anchor='middle' >10-minute Frenzy test: 46 of 1,000 gulls</text><text x='688' y='370' font-size='13' fill='#cf222e' font-weight='bold' text-anchor='middle' >stuck like this</text></svg>