<svg xmlns='http://www.w3.org/2000/svg' width='860' height='410' viewBox='0 0 860 410' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Anatomy of a useful crash report</title><rect x='0.5' y='0.5' width='859' height='409' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Anatomy of a useful crash report</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>One crash from the Reef, with symbols uploaded and context attached.</text><rect x='24.0' y='80.0' width='520.0' height='250.0' rx='8' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><text x='40' y='102' font-size='11.5' fill='#57606a' font-weight='700' text-anchor='start'>STACK (symbolized)</text><text x='40' y='128' font-family='Consolas, Menlo, monospace' font-size='12.5' font-weight='400' fill='#57606a'>0  libc.so          abort</text><text x='40' y='152' font-family='Consolas, Menlo, monospace' font-size='12.5' font-weight='400' fill='#57606a'>1  libc.so          __malloc_fail</text><text x='40' y='176' font-family='Consolas, Menlo, monospace' font-size='12.5' font-weight='400' fill='#57606a'>2  engine.so        Allocator::Alloc(size=8388608)</text><text x='40' y='200' font-family='Consolas, Menlo, monospace' font-size='12.5' font-weight='400' fill='#57606a'>3  engine.so        Texture::Upload</text><rect x='32.0' y='208.0' width='504.0' height='22.0' rx='4' fill='#fde2e1' stroke='#cf222e' stroke-width='1' opacity='1'/><text x='40' y='224' font-family='Consolas, Menlo, monospace' font-size='12.5' font-weight='700' fill='#cf222e'>4  reef.so          LakeStreamer::LoadTile(tile=41)</text><text x='40' y='248' font-family='Consolas, Menlo, monospace' font-size='12.5' font-weight='400' fill='#1f2328'>5  reef.so          LakeStreamer::Update</text><text x='40' y='272' font-family='Consolas, Menlo, monospace' font-size='12.5' font-weight='400' fill='#1f2328'>6  reef.so          GameLoop::Tick</text><text x='40' y='296' font-family='Consolas, Menlo, monospace' font-size='12.5' font-weight='400' fill='#57606a'>7  engine.so        Main</text><text x='40' y='318' font-size='11.5' fill='#cf222e' font-weight='600' text-anchor='start'>Grouped by the first frame in the game's own code (red), not frames 0–3.</text><rect x='560.0' y='80.0' width='276.0' height='250.0' rx='8' fill='#eaf1fb' stroke='#4e79a7' stroke-width='1.5' opacity='1'/><text x='576' y='102' font-size='11.5' fill='#4e79a7' font-weight='700' text-anchor='start'>CONTEXT</text><text x='576' y='126' font-family='Consolas, Menlo, monospace' font-size='12' font-weight='400' fill='#1f2328'>build 2.1.4 (3a91f0)</text><text x='576' y='146' font-family='Consolas, Menlo, monospace' font-size='12' font-weight='400' fill='#1f2328'>device  2 GB Android, API 33</text><text x='576' y='166' font-family='Consolas, Menlo, monospace' font-size='12' font-weight='400' fill='#1f2328'>memory  1,286 of ~1,300 MB</text><text x='576' y='186' font-family='Consolas, Menlo, monospace' font-size='12' font-weight='400' fill='#1f2328'>GPU     Mali-G52, driver r40</text><text x='576' y='206' font-family='Consolas, Menlo, monospace' font-size='12' font-weight='400' fill='#1f2328'>session 47 min, third lake</text><text x='576' y='226' font-family='Consolas, Menlo, monospace' font-size='12' font-weight='400' fill='#1f2328'></text><text x='576' y='246' font-family='Consolas, Menlo, monospace' font-size='12' font-weight='400' fill='#57606a'>last breadcrumbs:</text><text x='576' y='266' font-family='Consolas, Menlo, monospace' font-size='12' font-weight='400' fill='#1f2328'>46:58 enter Ice Lake</text><text x='576' y='286' font-family='Consolas, Menlo, monospace' font-size='12' font-weight='400' fill='#1f2328'>46:59 stream tile 40</text><text x='576' y='306' font-family='Consolas, Menlo, monospace' font-size='12' font-weight='400' fill='#1f2328'>47:00 stream tile 41  ✗</text><rect x='24.0' y='346.0' width='812.0' height='44.0' rx='8' fill='#fff8e6' stroke='#d4a72c' stroke-width='1.5' opacity='1'/><text x='40' y='373' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>The stack says where it died. The context says why: a 2 GB phone, 47 minutes in, still loading tiles.</text></svg>