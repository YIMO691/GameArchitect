<svg xmlns='http://www.w3.org/2000/svg' width='860' height='504' viewBox='0 0 860 504' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>From crash rows to causes</title><rect x='0.5' y='0.5' width='859' height='503' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>From crash rows to causes</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>The same 1.8% crash rate, shown three ways on the dashboard.</text><text x='24' y='106' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>No symbols, whole stack</text><text x='24' y='124' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>one crash = a row per build and per path</text><rect x='330.0' y='92.0' width='320.0' height='26.0' rx='4' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='658.0' y='110' font-size='12.5' fill='#cf222e' font-weight='700' text-anchor='start'>276 rows · biggest 1.2%</text><text x='24' y='160' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>+ symbols for every build</text><text x='24' y='178' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>builds merge; paths still split</text><rect x='330.0' y='146.0' width='106.7' height='26.0' rx='4' fill='#f28e2b' stroke='none' stroke-width='1' opacity='1'/><text x='444.66666666666663' y='164' font-size='12.5' fill='#b35c00' font-weight='700' text-anchor='start'>92 rows · biggest 3.5%</text><text x='24' y='214' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>+ group by top game frame</text><text x='24' y='232' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>one row per cause</text><rect x='330.0' y='200.0' width='53.3' height='26.0' rx='4' fill='#1a7f37' stroke='none' stroke-width='1' opacity='1'/><text x='391.3333333333333' y='218' font-size='12.5' fill='#1a7f37' font-weight='700' text-anchor='start'>46 rows · biggest 22%</text><text x='24' y='266' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>With one row per cause, the shape appears: a few causes are most of the crashes.</text><rect x='24.0' y='291.6' width='30.0' height='114.4' rx='3' fill='#1a7f37' stroke='none' stroke-width='1' opacity='1'/><text x='39.0' y='286.6' font-size='11' fill='#1f2328' font-weight='600' text-anchor='middle'>22</text><rect x='60.0' y='333.2' width='30.0' height='72.8' rx='3' fill='#1a7f37' stroke='none' stroke-width='1' opacity='1'/><text x='75.0' y='328.2' font-size='11' fill='#1f2328' font-weight='600' text-anchor='middle'>14</text><rect x='96.0' y='359.2' width='30.0' height='46.8' rx='3' fill='#1a7f37' stroke='none' stroke-width='1' opacity='1'/><text x='111.0' y='354.2' font-size='11' fill='#1f2328' font-weight='600' text-anchor='middle'>9</text><rect x='132.0' y='369.6' width='30.0' height='36.4' rx='3' fill='#1a7f37' stroke='none' stroke-width='1' opacity='1'/><text x='147.0' y='364.6' font-size='11' fill='#1f2328' font-weight='600' text-anchor='middle'>7</text><rect x='168.0' y='380.0' width='30.0' height='26.0' rx='3' fill='#1a7f37' stroke='none' stroke-width='1' opacity='1'/><text x='183.0' y='375.0' font-size='11' fill='#1f2328' font-weight='600' text-anchor='middle'>5</text><rect x='204.0' y='380.0' width='30.0' height='26.0' rx='3' fill='#1a7f37' stroke='none' stroke-width='1' opacity='1'/><text x='219.0' y='375.0' font-size='11' fill='#1f2328' font-weight='600' text-anchor='middle'>5</text><rect x='240.0' y='385.2' width='30.0' height='20.8' rx='3' fill='#1a7f37' stroke='none' stroke-width='1' opacity='1'/><text x='255.0' y='380.2' font-size='11' fill='#1f2328' font-weight='600' text-anchor='middle'>4</text><rect x='276.0' y='390.4' width='30.0' height='15.6' rx='3' fill='#1a7f37' stroke='none' stroke-width='1' opacity='1'/><text x='291.0' y='385.4' font-size='11' fill='#1f2328' font-weight='600' text-anchor='middle'>3</text><rect x='312.0' y='395.6' width='30.0' height='10.4' rx='3' fill='#9aa0a6' stroke='none' stroke-width='1' opacity='1'/><text x='327.0' y='390.6' font-size='11' fill='#1f2328' font-weight='600' text-anchor='middle'>2</text><rect x='348.0' y='398.2' width='30.0' height='7.8' rx='3' fill='#9aa0a6' stroke='none' stroke-width='1' opacity='1'/><text x='363.0' y='393.2' font-size='11' fill='#1f2328' font-weight='600' text-anchor='middle'>1.5</text><rect x='384.0' y='400.8' width='120.0' height='5.2' rx='3' fill='#9aa0a6' stroke='none' stroke-width='1' opacity='0.5'/><text x='444' y='395.8' font-size='11' fill='#57606a' font-weight='400' text-anchor='middle'>36 more, under 1% each</text><line x1='24' y1='406' x2='508' y2='406' stroke='#d0d7de'/><text x='24' y='424' font-size='11' fill='#57606a' font-weight='400' text-anchor='start'>% of crashes, per cause, biggest first</text><rect x='560.0' y='286.0' width='276.0' height='96.0' rx='8' fill='#dafbe1' stroke='#1a7f37' stroke-width='1.5' opacity='1'/><text x='576' y='312' font-size='15' fill='#1a7f37' font-weight='700' text-anchor='start'>Top 8 causes = 69%</text><text x='576' y='334' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>Fixing them in one sprint takes</text><text x='576' y='352' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>the crash rate from 1.8% to 0.56%.</text><rect x='24.0' y='440.0' width='812.0' height='44.0' rx='8' fill='#fff8e6' stroke='#d4a72c' stroke-width='1.5' opacity='1'/><text x='40' y='467' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>Make each cause one row, then fix from the top. The loudest bug is rarely the biggest.</text></svg>