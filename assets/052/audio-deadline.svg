<svg xmlns='http://www.w3.org/2000/svg' width='860' height='364' viewBox='0 0 860 364' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>The audio deadline</title><rect x='0.5' y='0.5' width='859' height='363' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>The audio deadline</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>The sound card plays one buffer (512 samples, 10.7 ms) while the audio thread mixes the next one.</text><text x='24' y='110' font-size='13.5' fill='#cf222e' font-weight='700' text-anchor='start'>180 voices</text><rect x='150.0' y='92.0' width='147.8' height='28.0' rx='4' fill='#ffffff' stroke='#d0d7de' stroke-width='1.2' opacity='1'/><rect x='150.0' y='92.0' width='147.8' height='28.0' rx='4' fill='#cf222e' stroke='none' stroke-width='1' opacity='0.85'/><text x='156.0' y='111' font-size='12' fill='#ffffff' font-weight='700' text-anchor='start'>11.2 ms</text><text x='295.79999999999995' y='140' font-size='12.5' fill='#cf222e' font-weight='700' text-anchor='end'>💥 click</text><rect x='299.8' y='92.0' width='147.8' height='28.0' rx='4' fill='#ffffff' stroke='#d0d7de' stroke-width='1.2' opacity='1'/><rect x='299.8' y='92.0' width='147.8' height='28.0' rx='4' fill='#cf222e' stroke='none' stroke-width='1' opacity='0.85'/><text x='305.79999999999995' y='111' font-size='12' fill='#ffffff' font-weight='700' text-anchor='start'>11.2 ms</text><text x='445.5999999999999' y='140' font-size='12.5' fill='#cf222e' font-weight='700' text-anchor='end'>💥 click</text><rect x='449.6' y='92.0' width='147.8' height='28.0' rx='4' fill='#ffffff' stroke='#d0d7de' stroke-width='1.2' opacity='1'/><rect x='449.6' y='92.0' width='147.8' height='28.0' rx='4' fill='#cf222e' stroke='none' stroke-width='1' opacity='0.85'/><text x='455.59999999999997' y='111' font-size='12' fill='#ffffff' font-weight='700' text-anchor='start'>11.2 ms</text><text x='595.4' y='140' font-size='12.5' fill='#cf222e' font-weight='700' text-anchor='end'>💥 click</text><rect x='599.4' y='92.0' width='147.8' height='28.0' rx='4' fill='#ffffff' stroke='#d0d7de' stroke-width='1.2' opacity='1'/><rect x='599.4' y='92.0' width='147.8' height='28.0' rx='4' fill='#cf222e' stroke='none' stroke-width='1' opacity='0.85'/><text x='605.3999999999999' y='111' font-size='12' fill='#ffffff' font-weight='700' text-anchor='start'>11.2 ms</text><text x='745.1999999999998' y='140' font-size='12.5' fill='#cf222e' font-weight='700' text-anchor='end'>💥 click</text><text x='150' y='158' font-size='12' fill='#cf222e' font-weight='600' text-anchor='start'>Every buffer is 0.5 ms late: the card plays silence or garbage. 5,600 clicks a minute.</text><text x='24' y='208' font-size='13.5' fill='#1a7f37' font-weight='700' text-anchor='start'>32 by priority</text><rect x='150.0' y='190.0' width='147.8' height='28.0' rx='4' fill='#ffffff' stroke='#d0d7de' stroke-width='1.2' opacity='1'/><rect x='150.0' y='190.0' width='36.8' height='28.0' rx='4' fill='#1a7f37' stroke='none' stroke-width='1' opacity='0.85'/><text x='192.78' y='209' font-size='12' fill='#1f2328' font-weight='700' text-anchor='start'>2.77 ms</text><rect x='299.8' y='190.0' width='147.8' height='28.0' rx='4' fill='#ffffff' stroke='#d0d7de' stroke-width='1.2' opacity='1'/><rect x='299.8' y='190.0' width='36.8' height='28.0' rx='4' fill='#1a7f37' stroke='none' stroke-width='1' opacity='0.85'/><text x='342.5799999999999' y='209' font-size='12' fill='#1f2328' font-weight='700' text-anchor='start'>2.77 ms</text><rect x='449.6' y='190.0' width='147.8' height='28.0' rx='4' fill='#ffffff' stroke='#d0d7de' stroke-width='1.2' opacity='1'/><rect x='449.6' y='190.0' width='36.8' height='28.0' rx='4' fill='#1a7f37' stroke='none' stroke-width='1' opacity='0.85'/><text x='492.38' y='209' font-size='12' fill='#1f2328' font-weight='700' text-anchor='start'>2.77 ms</text><rect x='599.4' y='190.0' width='147.8' height='28.0' rx='4' fill='#ffffff' stroke='#d0d7de' stroke-width='1.2' opacity='1'/><rect x='599.4' y='190.0' width='36.8' height='28.0' rx='4' fill='#1a7f37' stroke='none' stroke-width='1' opacity='0.85'/><text x='642.1799999999998' y='209' font-size='12' fill='#1f2328' font-weight='700' text-anchor='start'>2.77 ms</text><text x='150' y='238' font-size='12' fill='#1a7f37' font-weight='600' text-anchor='start'>About half the 5 ms budget: room for the OS, a busy phone and a bad frame.</text><text x='150.0' y='280' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='middle'>0.0 ms</text><text x='299.79999999999995' y='280' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='middle'>10.7 ms</text><text x='449.59999999999997' y='280' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='middle'>21.4 ms</text><text x='599.3999999999999' y='280' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='middle'>32.1 ms</text><text x='749.1999999999999' y='280' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='middle'>42.8 ms</text><rect x='24.0' y='300.0' width='812.0' height='44.0' rx='8' fill='#fff8e6' stroke='#d4a72c' stroke-width='1.5' opacity='1'/><text x='40' y='327' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>A slow frame looks bad for 16 ms. A late audio buffer is a click everyone hears. Audio budgets are hard limits.</text></svg>