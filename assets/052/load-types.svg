<svg xmlns='http://www.w3.org/2000/svg' width='860' height='454' viewBox='0 0 860 454' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>How sounds are loaded</title><rect x='0.5' y='0.5' width='859' height='453' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>How sounds are loaded</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Every sound can be loaded in one of four ways. Each trades memory against CPU on the audio thread.</text><text x='300' y='96' font-size='12' fill='#57606a' font-weight='600' text-anchor='start'>Memory if all 220 MB used it</text><text x='590' y='96' font-size='12' fill='#57606a' font-weight='600' text-anchor='start'>CPU per playing voice</text><text x='24' y='128' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>Decompressed (PCM)</text><text x='24' y='146' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>in memory, ready to play</text><rect x='300.0' y='116.0' width='220.0' height='22.0' rx='4' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='526.0' y='132' font-size='12' fill='#1f2328' font-weight='700' text-anchor='start'>220 MB</text><rect x='590.0' y='116.0' width='60.0' height='22.0' rx='4' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><text x='656.0' y='132' font-size='12' fill='#1f2328' font-weight='700' text-anchor='start'>0.06 ms</text><text x='300' y='156' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>use for: short, very frequent sounds</text><text x='24' y='192' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>Compressed in memory</text><text x='24' y='210' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>Vorbis, decoded while playing</text><rect x='300.0' y='180.0' width='22.0' height='22.0' rx='4' fill='#f28e2b' stroke='none' stroke-width='1' opacity='1'/><text x='328.0' y='196' font-size='12' fill='#1f2328' font-weight='700' text-anchor='start'>22 MB</text><rect x='590.0' y='180.0' width='150.0' height='22.0' rx='4' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><text x='746.0' y='196' font-size='12' fill='#1f2328' font-weight='700' text-anchor='start'>0.15 ms</text><text x='300' y='220' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>use for: medium sounds, few at once</text><text x='24' y='256' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>ADPCM in memory</text><text x='24' y='274' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>simple 3.5:1 compression</text><rect x='300.0' y='244.0' width='62.9' height='22.0' rx='4' fill='#1a7f37' stroke='none' stroke-width='1' opacity='1'/><text x='368.9' y='260' font-size='12' fill='#1f2328' font-weight='700' text-anchor='start'>63 MB*</text><rect x='590.0' y='244.0' width='70.0' height='22.0' rx='4' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><text x='666.0' y='260' font-size='12' fill='#1f2328' font-weight='700' text-anchor='start'>0.07 ms</text><text x='300' y='284' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>use for: most effects</text><text x='24' y='320' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>Streamed from disk</text><text x='24' y='338' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>Vorbis, small buffer</text><rect x='300.0' y='308.0' width='2.0' height='22.0' rx='4' fill='#1a7f37' stroke='none' stroke-width='1' opacity='1'/><text x='308' y='324' font-size='12' fill='#1f2328' font-weight='700' text-anchor='start'>0.4 MB</text><rect x='590.0' y='308.0' width='200.0' height='22.0' rx='4' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><text x='796.0' y='324' font-size='12' fill='#1f2328' font-weight='700' text-anchor='start'>0.2 ms</text><text x='300' y='348' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>use for: music, ambience, long dialogue</text><text x='24' y='374' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>* 220 MB ÷ 3.5. The Reef uses ADPCM only for its 12.6 MB of effects (3.6 MB) and streams its 207.4 MB of music (0.4 MB of buffers): 4 MB in all.</text><rect x='24.0' y='390.0' width='812.0' height='44.0' rx='8' fill='#fff8e6' stroke='#d4a72c' stroke-width='1.5' opacity='1'/><text x='40' y='417' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>Long sounds: stream. Short, frequent sounds: cheap format in memory. One setting for all wastes memory or CPU.</text></svg>