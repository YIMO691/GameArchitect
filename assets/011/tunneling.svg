<svg xmlns='http://www.w3.org/2000/svg' width='880' height='500' viewBox='0 0 880 500' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>One 0.25 second step skips the 0.5 m floor; small fixed steps land</title><rect x='0.5' y='0.5' width='879' height='499' rx='14' fill='#ffffff' stroke='#d0d7de'/><defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto'><path d='M0 0 L10 5 L0 10 z' fill='#cf222e'/></marker></defs><text x='24.0' y='38.0' font-size='20' fill='#1f2328' font-weight='bold' text-anchor='start'>The 250 ms autosave frame: one giant step</text><text x='24.0' y='62.0' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>Left: variable step, one 0.25 s step. Right: fixed 1/60 s steps, 15 of them in the same frame.</text><rect x='24' y='290.0' width='380' height='35.0' fill='#d0d7de' stroke='#9aa0a6'/><text x='394.0' y='318.0' font-size='12' fill='#1f2328' font-weight='normal' text-anchor='end'>floor, 0.5 m thick</text><line x1='24' x2='404' y1='220.0' y2='220.0' stroke='#eaeef2'/><text x='28.0' y='216.0' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>1 m</text><text x='28.0' y='286.0' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>0 m</text><rect x='452' y='290.0' width='380' height='35.0' fill='#d0d7de' stroke='#9aa0a6'/><text x='822.0' y='318.0' font-size='12' fill='#1f2328' font-weight='normal' text-anchor='end'>floor, 0.5 m thick</text><line x1='452' x2='832' y1='220.0' y2='220.0' stroke='#eaeef2'/><text x='456.0' y='216.0' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>1 m</text><text x='456.0' y='286.0' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>0 m</text><text x='214.0' y='96.0' font-size='15' fill='#cf222e' font-weight='bold' text-anchor='middle'>❌ Variable step: fell through</text><text x='642.0' y='96.0' font-size='15' fill='#1a7f37' font-weight='bold' text-anchor='middle'>✅ Fixed step: landed</text><rect x='138' y='187.2' width='24' height='24' fill='#4e79a7' rx='3'/><text x='170.0' y='203.2' font-size='12' fill='#1f2328' font-weight='normal' text-anchor='start'>before: 1.125 m, falling 5 m/s</text><rect x='138' y='426.5' width='24' height='24' fill='#e5534b' rx='3' opacity='0.85'/><line x1='150' x2='150' y1='213.2' y2='422.5' stroke='#cf222e' stroke-width='2.5' stroke-dasharray='6 4' marker-end='url(#ar)'/><text x='170.0' y='442.5' font-size='12' fill='#cf222e' font-weight='bold' text-anchor='start'>after: −2.0 m, under the floor</text><text x='170.0' y='259.0' font-size='13' fill='#cf222e' font-weight='bold' text-anchor='start'>one step = 3.125 m</text><text x='170.0' y='275.0' font-size='12' fill='#1f2328' font-weight='normal' text-anchor='start'>the floor check never sees</text><text x='170.0' y='289.0' font-size='12' fill='#1f2328' font-weight='normal' text-anchor='start'>the player inside the floor</text><circle cx='520' cy='205.2' r='5' fill='#4e79a7'/><circle cx='542' cy='211.7' r='5' fill='#59a14f'/><circle cx='564' cy='218.7' r='5' fill='#59a14f'/><circle cx='586' cy='226.2' r='5' fill='#59a14f'/><circle cx='608' cy='234.4' r='5' fill='#59a14f'/><circle cx='630' cy='243.2' r='5' fill='#59a14f'/><circle cx='652' cy='252.5' r='5' fill='#59a14f'/><circle cx='674' cy='262.4' r='5' fill='#59a14f'/><circle cx='696' cy='272.9' r='5' fill='#59a14f'/><circle cx='718' cy='284.0' r='5' fill='#1a7f37'/><text x='520.0' y='191.2' font-size='12' fill='#1f2328' font-weight='normal' text-anchor='start'>9 steps of 1/60 s, each moves 0.09–0.16 m</text><text x='730.0' y='274.0' font-size='12' fill='#1a7f37' font-weight='bold' text-anchor='start'>lands</text><text x='24.0' y='482.0' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>A collision check only looks at where the player IS after a step, not the path between. Steps bigger than the floor skip it: "tunneling".</text></svg>