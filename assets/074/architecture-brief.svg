<svg xmlns='http://www.w3.org/2000/svg' width='860' height='410' viewBox='0 0 860 410' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>The architecture brief</title><rect x='0.5' y='0.5' width='859' height='409' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>The architecture brief</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>One page the assistant reads with every request. Written once, kept next to the code, reviewed like code.</text><rect x='24.0' y='84.0' width='470.0' height='306.0' rx='8' fill='#ffffff' stroke='#1f2328' stroke-width='1.6' opacity='1'/><text x='40' y='112' font-size='12' fill='#1f2328' font-weight='700' text-anchor='start'># ARCHITECTURE.md</text><text x='40' y='140' font-size='12' fill='#4e79a7' font-weight='400' text-anchor='start'>Layers: Game → Systems → Engine → Platform</text><text x='40' y='168' font-size='12' fill='#4e79a7' font-weight='400' text-anchor='start'>  never call down past one layer; input via commands</text><text x='40' y='196' font-size='12' fill='#b07aa1' font-weight='400' text-anchor='start'>Authority: the server decides catches and scores</text><text x='40' y='224' font-size='12' fill='#59a14f' font-weight='400' text-anchor='start'>AI: every agent uses AiLod (near / mid / far)</text><text x='40' y='252' font-size='12' fill='#f28e2b' font-weight='400' text-anchor='start'>Budgets (handheld): fish AI 0.5 ms, 0 allocs/frame</text><text x='40' y='280' font-size='12' fill='#1f2328' font-weight='400' text-anchor='start'>Use, don’t rewrite: MathUtil, Pool&lt;T&gt;, SeededRandom</text><text x='40' y='308' font-size='12' fill='#1f2328' font-weight='400' text-anchor='start'>Tests: characterization first; perf test per system</text><text x='40' y='336' font-size='12' fill='#cf222e' font-weight='400' text-anchor='start'>Ask before: new dependency, new thread, new file format</text><text x='40' y='368' font-size='11.5' fill='#57606a' font-weight='600' text-anchor='start'>~1 hour to write; reused by every request and every new hire</text><text x='520' y='104' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>What it prevents in the fish AI</text><rect x='520.0' y='118.0' width='316.0' height='48.0' rx='8' fill='#ffffff' stroke='#59a14f' stroke-width='1.5' opacity='1'/><text x='532' y='138' font-size='12.5' fill='#59a14f' font-weight='700' text-anchor='start'>Ignores AI LOD</text><text x='532' y='156' font-size='12' fill='#1f2328' font-weight='400' text-anchor='start'>2.4 ms → 0.4 ms</text><rect x='520.0' y='174.0' width='316.0' height='48.0' rx='8' fill='#ffffff' stroke='#b07aa1' stroke-width='1.5' opacity='1'/><text x='532' y='194' font-size='12.5' fill='#b07aa1' font-weight='700' text-anchor='start'>Client decides catches</text><text x='532' y='212' font-size='12' fill='#1f2328' font-weight='400' text-anchor='start'>Lesson 048 rule kept</text><rect x='520.0' y='230.0' width='316.0' height='48.0' rx='8' fill='#ffffff' stroke='#4e79a7' stroke-width='1.5' opacity='1'/><text x='532' y='250' font-size='12.5' fill='#4e79a7' font-weight='700' text-anchor='start'>Reads input directly</text><text x='532' y='268' font-size='12' fill='#1f2328' font-weight='400' text-anchor='start'>commands, Lesson 017</text><text x='520' y='302' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>What it can’t prevent alone</text><text x='520' y='324' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>allocations, duplicated helpers, bugs:</text><text x='520' y='342' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>that takes checks, small steps and review</text></svg>