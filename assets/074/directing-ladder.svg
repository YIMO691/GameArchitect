<svg xmlns='http://www.w3.org/2000/svg' width='860' height='394' viewBox='0 0 860 394' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Directing, not just prompting</title><rect x='0.5' y='0.5' width='859' height='393' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Directing, not just prompting</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Same assistant, same feature. Hours of fixes after merge, and your own hours.</text><text x='24' y='96' font-size='12' fill='#57606a' font-weight='700' text-anchor='start'>How it was directed</text><text x='250' y='96' font-size='12' fill='#57606a' font-weight='700' text-anchor='start'>Fixes after merge</text><text x='720' y='96' font-size='12' fill='#57606a' font-weight='700' text-anchor='middle'>Merged</text><text x='800' y='96' font-size='12' fill='#57606a' font-weight='700' text-anchor='middle'>Yours</text><text x='24' y='130' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>One line, skim</text><rect x='250.0' y='114.0' width='400.0' height='24.0' rx='4' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='658.0' y='131' font-size='12.5' fill='#cf222e' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>72 h</text><text x='720' y='131' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='middle'>7 of 7</text><text x='800' y='131' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='middle'>0.7 h</text><text x='24' y='170' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>+ architecture brief</text><rect x='250.0' y='154.0' width='200.0' height='24.0' rx='4' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='458.0' y='171' font-size='12.5' fill='#cf222e' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>36 h</text><text x='720' y='171' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='middle'>4 of 7</text><text x='800' y='171' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='middle'>1.5 h</text><text x='24' y='210' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>+ small steps</text><rect x='250.0' y='194.0' width='133.3' height='24.0' rx='4' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='391.3333333333333' y='211' font-size='12.5' fill='#cf222e' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>24 h</text><text x='720' y='211' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='middle'>2 of 7</text><text x='800' y='211' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='middle'>2.5 h</text><text x='24' y='250' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>+ our checks</text><rect x='250.0' y='234.0' width='66.7' height='24.0' rx='4' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='324.66666666666663' y='251' font-size='12.5' fill='#cf222e' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>12 h</text><text x='720' y='251' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='middle'>1 of 7</text><text x='800' y='251' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='middle'>2.5 h</text><text x='24' y='290' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>+ five-question review</text><text x='258.0' y='291' font-size='12.5' fill='#1a7f37' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>0 h</text><text x='720' y='291' font-size='12.5' fill='#1a7f37' font-weight='700' text-anchor='middle'>0 of 7</text><text x='800' y='291' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='middle'>4.0 h</text><line x1='472.2' y1='104' x2='472.2' y2='310' stroke='#f28e2b' stroke-width='2' stroke-dasharray='5 4'/><text x='476.22222222222223' y='322' font-size='11.5' fill='#f28e2b' font-weight='700' text-anchor='start'>by hand ≈ 40 h</text><rect x='24.0' y='334.0' width='812.0' height='40.0' rx='8' fill='#dafbe1' stroke='#1a7f37' stroke-width='1.4' opacity='1'/><text x='40' y='359' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>4 hours of directing and reviewing, instead of 40 of writing, or 72 of fixing.</text></svg>