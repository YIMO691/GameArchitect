<svg xmlns='http://www.w3.org/2000/svg' width='880' height='440' viewBox='0 0 880 440' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>CPU and GPU pipeline timeline</title><defs><pattern id='hatch' width='8' height='8' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='8' height='8' fill='#f0f1f3'/><line x1='0' y1='0' x2='0' y2='8' stroke='#9aa0a6' stroke-width='3'/></pattern></defs><rect x='0' y='0' width='880' height='440' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='36' font-size='20' fill='#1f2328' font-weight='bold' text-anchor='start'>CPU and GPU work side by side — the slower one sets the pace</text><text x='24' y='58' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>Each block is one frame. Scale: 1 ms = 8 px. Example numbers.</text><text x='24' y='94' font-size='15' fill='#cf222e' font-weight='bold' text-anchor='start'>A) GPU-bound: our night city level</text><text x='24' y='126' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start'>CPU</text><text x='24' y='142' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>game code</text><rect x='170' y='108' width='96' height='30' fill='#4e79a7' stroke='#ffffff' stroke-width='1.5' /><text x='218.0' y='128' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>F2 · 12 ms</text><rect x='266' y='108' width='104' height='30' fill='url(#hatch)' stroke='#9aa0a6' stroke-width='1' /><text x='318.0' y='128' font-size='12' fill='#1f2328' font-weight='bold' text-anchor='middle'>waits 13 ms</text><rect x='370' y='108' width='96' height='30' fill='#4e79a7' stroke='#ffffff' stroke-width='1.5' /><text x='418.0' y='128' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>F3 · 12 ms</text><rect x='466' y='108' width='104' height='30' fill='url(#hatch)' stroke='#9aa0a6' stroke-width='1' /><text x='518.0' y='128' font-size='12' fill='#1f2328' font-weight='bold' text-anchor='middle'>waits 13 ms</text><rect x='570' y='108' width='96' height='30' fill='#4e79a7' stroke='#ffffff' stroke-width='1.5' /><text x='618.0' y='128' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>F4 · 12</text><rect x='666' y='108' width='104' height='30' fill='url(#hatch)' stroke='#9aa0a6' stroke-width='1' /><text x='718.0' y='128' font-size='12' fill='#1f2328' font-weight='bold' text-anchor='middle'>waits</text><text x='24' y='168' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start'>GPU</text><text x='24' y='184' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>drawing pixels</text><rect x='170' y='150' width='200' height='30' fill='#e5534b' stroke='#ffffff' stroke-width='1.5' /><text x='270.0' y='170' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>draws F1 · 25 ms</text><rect x='370' y='150' width='200' height='30' fill='#e5534b' stroke='#ffffff' stroke-width='1.5' /><text x='470.0' y='170' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>draws F2 · 25 ms</text><rect x='570' y='150' width='200' height='30' fill='#e5534b' stroke='#ffffff' stroke-width='1.5' /><text x='670.0' y='170' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>draws F3 · 25 ms</text><text x='170' y='204' font-size='13' fill='#cf222e' font-weight='bold' text-anchor='start'>Frame = 25 ms → 40 fps. Cutting CPU from 18 to 12 ms only made the wait longer.</text><text x='24' y='244' font-size='15' fill='#4e79a7' font-weight='bold' text-anchor='start'>B) CPU-bound: e.g. CPU 18 ms, GPU 10 ms</text><text x='24' y='276' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start'>CPU</text><text x='24' y='292' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>game code</text><rect x='170' y='258' width='144' height='30' fill='#4e79a7' stroke='#ffffff' stroke-width='1.5' /><text x='242.0' y='278' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>F2 · 18 ms</text><rect x='314' y='258' width='144' height='30' fill='#4e79a7' stroke='#ffffff' stroke-width='1.5' /><text x='386.0' y='278' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>F3 · 18 ms</text><rect x='458' y='258' width='144' height='30' fill='#4e79a7' stroke='#ffffff' stroke-width='1.5' /><text x='530.0' y='278' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>F4 · 18 ms</text><text x='24' y='318' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start'>GPU</text><text x='24' y='334' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>drawing pixels</text><rect x='170' y='300' width='80' height='30' fill='#59a14f' stroke='#ffffff' stroke-width='1.5' /><text x='210.0' y='320' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>F1 · 10</text><rect x='250' y='300' width='64' height='30' fill='url(#hatch)' stroke='#9aa0a6' stroke-width='1' /><text x='282.0' y='320' font-size='12' fill='#1f2328' font-weight='bold' text-anchor='middle'>idle 8</text><rect x='314' y='300' width='80' height='30' fill='#59a14f' stroke='#ffffff' stroke-width='1.5' /><text x='354.0' y='320' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>F2 · 10</text><rect x='394' y='300' width='64' height='30' fill='url(#hatch)' stroke='#9aa0a6' stroke-width='1' /><text x='426.0' y='320' font-size='12' fill='#1f2328' font-weight='bold' text-anchor='middle'>idle 8</text><rect x='458' y='300' width='80' height='30' fill='#59a14f' stroke='#ffffff' stroke-width='1.5' /><text x='498.0' y='320' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>F3 · 10</text><rect x='538' y='300' width='64' height='30' fill='url(#hatch)' stroke='#9aa0a6' stroke-width='1' /><text x='570.0' y='320' font-size='12' fill='#1f2328' font-weight='bold' text-anchor='middle'>idle</text><text x='170' y='354' font-size='13' fill='#4e79a7' font-weight='bold' text-anchor='start'>Frame = 18 ms → 55.6 fps. Now the GPU sits idle, and GPU savings do nothing.</text><line x1='170' y1='372' x2='770' y2='372' stroke='#57606a' stroke-width='1.5'/><line x1='170' y1='367' x2='170' y2='377' stroke='#57606a' stroke-width='1.5'/><text x='170' y='394' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>0 ms</text><line x1='370' y1='367' x2='370' y2='377' stroke='#57606a' stroke-width='1.5'/><text x='370' y='394' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>25 ms</text><line x1='570' y1='367' x2='570' y2='377' stroke='#57606a' stroke-width='1.5'/><text x='570' y='394' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>50 ms</text><line x1='770' y1='367' x2='770' y2='377' stroke='#57606a' stroke-width='1.5'/><text x='770' y='394' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>75 ms</text><rect x='24' y='410' width='14' height='14' fill='url(#hatch)' stroke='#9aa0a6' stroke-width='1' /><text x='44' y='422' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>= waiting / idle. Waiting time is NOT work, but some profilers count it in "CPU time".</text></svg>