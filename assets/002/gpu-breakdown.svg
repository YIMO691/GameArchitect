<svg xmlns='http://www.w3.org/2000/svg' width='880' height='310' viewBox='0 0 880 310' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>GPU time breakdown before and after</title><defs><pattern id='hatch' width='8' height='8' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='8' height='8' fill='#f0f1f3'/><line x1='0' y1='0' x2='0' y2='8' stroke='#9aa0a6' stroke-width='3'/></pattern></defs><rect x='0' y='0' width='880' height='310' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='36' font-size='20' fill='#1f2328' font-weight='bold' text-anchor='start'>Where the 25 ms of GPU time went</text><text x='24' y='58' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>GPU passes per frame at 2560×1440, mid-range laptop. Example numbers.</text><text x='24' y='106' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start'>Before</text><text x='24' y='122' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>fog full-res</text><rect x='190' y='88' width='60' height='36' fill='#4e79a7' stroke='#ffffff' stroke-width='1.5' /><text x='220.0' y='111' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>3</text><rect x='250' y='88' width='100' height='36' fill='#59a14f' stroke='#ffffff' stroke-width='1.5' /><text x='300.0' y='111' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>Opaque 5</text><rect x='350' y='88' width='240' height='36' fill='#e5534b' stroke='#ffffff' stroke-width='1.5' /><text x='470.0' y='111' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>Fog 12</text><rect x='590' y='88' width='60' height='36' fill='#b07aa1' stroke='#ffffff' stroke-width='1.5' /><text x='620.0' y='111' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>3</text><rect x='650' y='88' width='30.0' height='36' fill='#9aa0a6' stroke='#ffffff' stroke-width='1.5' /><text x='665.0' y='111' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>1.5</text><rect x='680.0' y='88' width='10.0' height='36' fill='#57606a' stroke='#ffffff' stroke-width='1.5' /><text x='698.0' y='111' font-size='13' fill='#cf222e' font-weight='bold' text-anchor='start'>25.0 ms → 40 fps</text><text x='24' y='178' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start'>After</text><text x='24' y='194' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>fog ½-res, less rain</text><rect x='190' y='160' width='60' height='36' fill='#4e79a7' stroke='#ffffff' stroke-width='1.5' /><text x='220.0' y='183' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>3</text><rect x='250' y='160' width='100' height='36' fill='#59a14f' stroke='#ffffff' stroke-width='1.5' /><text x='300.0' y='183' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>Opaque 5</text><rect x='350' y='160' width='70.0' height='36' fill='#e5534b' stroke='#ffffff' stroke-width='1.5' /><text x='385.0' y='183' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>3.5</text><rect x='420.0' y='160' width='20' height='36' fill='#b07aa1' stroke='#ffffff' stroke-width='1.5' /><rect x='440.0' y='160' width='30.0' height='36' fill='#9aa0a6' stroke='#ffffff' stroke-width='1.5' /><text x='455.0' y='183' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>1.5</text><rect x='470.0' y='160' width='10.0' height='36' fill='#57606a' stroke='#ffffff' stroke-width='1.5' /><text x='535.4000000000001' y='183' font-size='13' fill='#1a7f37' font-weight='bold' text-anchor='start'>14.5 ms → capped at a steady 60 fps ✓</text><line x1='523.4000000000001' y1='76' x2='523.4000000000001' y2='214' stroke='#1a7f37' stroke-width='2' stroke-dasharray='6 4'/><text x='529.4000000000001' y='236' font-size='12' fill='#1a7f37' font-weight='normal' text-anchor='start'>16.67 ms budget (60 fps)</text><text x='24' y='262' font-size='13' fill='#cf222e' font-weight='bold' text-anchor='start'>Fog alone was 12 of 25 ms — almost half the GPU frame. That is the hot spot.</text><rect x='24' y='282' width='12' height='12' fill='#4e79a7' stroke='#4e79a7' stroke-width='0' /><text x='42' y='293' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>Shadows</text><rect x='122' y='282' width='12' height='12' fill='#59a14f' stroke='#59a14f' stroke-width='0' /><text x='140' y='293' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>Opaque</text><rect x='212' y='282' width='12' height='12' fill='#e5534b' stroke='#e5534b' stroke-width='0' /><text x='230' y='293' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>Fog</text><rect x='278' y='282' width='12' height='12' fill='#b07aa1' stroke='#b07aa1' stroke-width='0' /><text x='296' y='293' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>Rain</text><rect x='352' y='282' width='12' height='12' fill='#9aa0a6' stroke='#9aa0a6' stroke-width='0' /><text x='370' y='293' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>Post</text><rect x='426' y='282' width='12' height='12' fill='#57606a' stroke='#57606a' stroke-width='0' /><text x='444' y='293' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>UI</text></svg>