<svg xmlns='http://www.w3.org/2000/svg' width='880' height='360' viewBox='0 0 880 360' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Resolution test</title><defs><pattern id='hatch' width='8' height='8' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='8' height='8' fill='#f0f1f3'/><line x1='0' y1='0' x2='0' y2='8' stroke='#9aa0a6' stroke-width='3'/></pattern></defs><rect x='0' y='0' width='880' height='360' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='36' font-size='20' fill='#1f2328' font-weight='bold' text-anchor='start'>The resolution test: shrink the pixels, watch the GPU</text><text x='24' y='58' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>Render scale 100% → 50% (half width, half height = ¼ of the pixels). Example numbers.</text><rect x='40' y='84' width='256' height='144' fill='#fdecea' stroke='#cf222e' stroke-width='2' /><text x='168' y='150' font-size='15' fill='#cf222e' font-weight='bold' text-anchor='middle'>2560 × 1440</text><text x='168' y='172' font-size='13' fill='#cf222e' font-weight='normal' text-anchor='middle'>3.69 million pixels</text><rect x='40' y='244' width='128' height='72' fill='#dafbe1' stroke='#1a7f37' stroke-width='2' /><text x='104' y='276' font-size='13' fill='#1a7f37' font-weight='bold' text-anchor='middle'>1280 × 720</text><text x='104' y='296' font-size='12' fill='#1a7f37' font-weight='normal' text-anchor='middle'>0.92 M (¼)</text><text x='360' y='102' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start'>GPU time at 100%</text><rect x='360' y='112' width='80' height='34' fill='#4e79a7' stroke='#ffffff' stroke-width='1.5' /><text x='400.0' y='134' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>fixed 5</text><rect x='440' y='112' width='320' height='34' fill='#e5534b' stroke='#ffffff' stroke-width='1.5' /><text x='600' y='134' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>pixel work 20 ms</text><text x='768' y='134' font-size='14' fill='#cf222e' font-weight='bold' text-anchor='start'>25 ms</text><text x='360' y='192' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start'>GPU time at 50%</text><rect x='360' y='202' width='80' height='34' fill='#4e79a7' stroke='#ffffff' stroke-width='1.5' /><text x='400.0' y='224' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>fixed 5</text><rect x='440' y='202' width='80' height='34' fill='#59a14f' stroke='#ffffff' stroke-width='1.5' /><text x='480.0' y='224' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>px 5</text><text x='528' y='224' font-size='14' fill='#1a7f37' font-weight='bold' text-anchor='start'>10 ms  (20 ÷ 4 = 5)</text><text x='360' y='278' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='start'>Big drop → most GPU time is per-pixel work.</text><text x='360' y='298' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>Tiny drop → the cost is elsewhere (CPU, or vertices/geometry).</text><text x='360' y='334' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>"Fixed" = cost that does not shrink with pixels (shadow maps, vertices).</text></svg>