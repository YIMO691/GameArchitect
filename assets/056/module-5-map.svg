<svg xmlns='http://www.w3.org/2000/svg' width='860' height='464' viewBox='0 0 860 464' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Module 5 on one page</title><rect x='0.5' y='0.5' width='859' height='463' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Module 5 on one page</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Eleven lessons, eleven systems. Each one has a rule and a number to remember.</text><text x='24' y='100' font-size='13' fill='#4e79a7' font-weight='700' text-anchor='start'>Build and data</text><rect x='190.0' y='84.0' width='210.0' height='64.0' rx='8' fill='#ffffff' stroke='#4e79a7' stroke-width='1.6' opacity='1'/><text x='200' y='104' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start'>045 · Asset pipeline</text><text x='200' y='122' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>import rules in code</text><text x='200' y='139' font-size='11.5' fill='#4e79a7' font-weight='700' text-anchor='start'>growth 100 → 0 MB a week</text><rect x='406.0' y='84.0' width='210.0' height='64.0' rx='8' fill='#ffffff' stroke='#4e79a7' stroke-width='1.6' opacity='1'/><text x='416' y='104' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start'>046 · Build and CI</text><text x='416' y='122' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>build every commit</text><text x='416' y='139' font-size='11.5' fill='#4e79a7' font-weight='700' text-anchor='start'>17.10 → 0.59 h lost a day</text><rect x='622.0' y='84.0' width='210.0' height='64.0' rx='8' fill='#ffffff' stroke='#4e79a7' stroke-width='1.6' opacity='1'/><text x='632' y='104' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start'>047 · Saves</text><text x='632' y='122' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>version + migrations</text><text x='632' y='139' font-size='11.5' fill='#4e79a7' font-weight='700' text-anchor='start'>30,000 boats saved</text><text x='24' y='178' font-size='13' fill='#b07aa1' font-weight='700' text-anchor='start'>Online</text><rect x='190.0' y='162.0' width='210.0' height='64.0' rx='8' fill='#ffffff' stroke='#b07aa1' stroke-width='1.6' opacity='1'/><text x='200' y='182' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start'>048 · Authority</text><text x='200' y='200' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>one decider per fact</text><text x='200' y='217' font-size='11.5' fill='#b07aa1' font-weight='700' text-anchor='start'>10,000 fakes → 0</text><rect x='406.0' y='162.0' width='210.0' height='64.0' rx='8' fill='#ffffff' stroke='#b07aa1' stroke-width='1.6' opacity='1'/><text x='416' y='182' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start'>049 · Netcode</text><text x='416' y='200' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>interpolate, predict, roll back</text><text x='416' y='217' font-size='11.5' fill='#b07aa1' font-weight='700' text-anchor='start'>180 ms → 0 ms felt</text><rect x='622.0' y='162.0' width='210.0' height='64.0' rx='8' fill='#ffffff' stroke='#b07aa1' stroke-width='1.6' opacity='1'/><text x='632' y='182' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start'>050 · Servers</text><text x='632' y='200' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>budget pairs, split crowds</text><text x='632' y='217' font-size='11.5' fill='#b07aa1' font-weight='700' text-anchor='start'>3,998 → 15 ms a tick</text><text x='24' y='256' font-size='13' fill='#59a14f' font-weight='700' text-anchor='start'>Runtime systems</text><rect x='190.0' y='240.0' width='210.0' height='64.0' rx='8' fill='#ffffff' stroke='#59a14f' stroke-width='1.6' opacity='1'/><text x='200' y='260' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start'>051 · UI</text><text x='200' y='278' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>one model, bind changes</text><text x='200' y='295' font-size='11.5' fill='#59a14f' font-weight='700' text-anchor='start'>14.2 → 0.06 ms</text><rect x='406.0' y='240.0' width='210.0' height='64.0' rx='8' fill='#ffffff' stroke='#59a14f' stroke-width='1.6' opacity='1'/><text x='416' y='260' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start'>052 · Audio</text><text x='416' y='278' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>voice cap + priorities</text><text x='416' y='295' font-size='11.5' fill='#59a14f' font-weight='700' text-anchor='start'>11.2 → 2.77 ms, 220 → 4 MB</text><rect x='622.0' y='240.0' width='210.0' height='64.0' rx='8' fill='#ffffff' stroke='#59a14f' stroke-width='1.6' opacity='1'/><text x='632' y='260' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start'>053 · AI</text><text x='632' y='278' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>spread work, AI LOD</text><text x='632' y='295' font-size='11.5' fill='#59a14f' font-weight='700' text-anchor='start'>15 → 1.92 ms</text><text x='24' y='334' font-size='13' fill='#f28e2b' font-weight='700' text-anchor='start'>Team and live game</text><rect x='190.0' y='318.0' width='210.0' height='64.0' rx='8' fill='#ffffff' stroke='#f28e2b' stroke-width='1.6' opacity='1'/><text x='200' y='338' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start'>054 · Tools</text><text x='200' y='356' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>content as data + validators</text><text x='200' y='373' font-size='11.5' fill='#f28e2b' font-weight='700' text-anchor='start'>30.33 → 1.75 h a week</text><rect x='406.0' y='318.0' width='210.0' height='64.0' rx='8' fill='#ffffff' stroke='#f28e2b' stroke-width='1.6' opacity='1'/><text x='416' y='338' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start'>055 · Live ops</text><text x='416' y='356' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>typed events, remote config</text><text x='416' y='373' font-size='11.5' fill='#f28e2b' font-weight='700' text-anchor='start'>9 days → 12 h; 14 days → 30 min</text><rect x='24.0' y='400.0' width='812.0' height='44.0' rx='8' fill='#fff8e6' stroke='#d4a72c' stroke-width='1.5' opacity='1'/><text x='40' y='427' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>The common thread: give every system an owner, a budget and a check that runs without anyone remembering.</text></svg>