<svg xmlns='http://www.w3.org/2000/svg' width='860' height='430' viewBox='0 0 860 430' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Launch review: what to fix first</title><rect x='0.5' y='0.5' width='859' height='429' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Launch review: what to fix first</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Nine findings two weeks before launch. Sort by what can be undone after launch, then by cost.</text><rect x='90.0' y='90.0' width='370.0' height='150.0' rx='0' fill='#fff1f0' stroke='none' stroke-width='1' opacity='1'/><rect x='460.0' y='90.0' width='370.0' height='150.0' rx='0' fill='#fff8e6' stroke='none' stroke-width='1' opacity='1'/><rect x='90.0' y='240.0' width='370.0' height='150.0' rx='0' fill='#fff8e6' stroke='none' stroke-width='1' opacity='1'/><rect x='460.0' y='240.0' width='370.0' height='150.0' rx='0' fill='#dafbe1' stroke='none' stroke-width='1' opacity='1'/><rect x='90.0' y='90.0' width='740.0' height='300.0' rx='0' fill='none' stroke='#d0d7de' stroke-width='1.5' opacity='1'/><text x='100' y='110' font-size='12' fill='#cf222e' font-weight='700' text-anchor='start'>FIX BEFORE LAUNCH</text><text x='820' y='380' font-size='12' fill='#1a7f37' font-weight='700' text-anchor='end'>patch or config after launch</text><text x='275.0' y='412' font-size='12' fill='#1f2328' font-weight='600' text-anchor='middle'>hard to undo once players have it</text><text x='645.0' y='412' font-size='12' fill='#1f2328' font-weight='600' text-anchor='middle'>easy to undo (config, patch)</text><text x='40' y='240.0' font-size='12' font-weight='600' fill='#1f2328' text-anchor='middle' transform='rotate(-90 40 240.0)'>cost if shipped ↑</text><circle cx='179' cy='120' r='7' fill='#cf222e'/><text x='189.8' y='124.0' font-size='12' fill='#1f2328' font-weight='600' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>047 save migration</text><circle cx='312' cy='150' r='7' fill='#cf222e'/><text x='323.0' y='154.0' font-size='12' fill='#1f2328' font-weight='600' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>048 client score</text><circle cx='253' cy='192' r='7' fill='#cf222e'/><text x='263.8' y='196.0' font-size='12' fill='#1f2328' font-weight='600' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>050 crowd test</text><circle cx='371' cy='216' r='7' fill='#cf222e'/><text x='382.2' y='220.0' font-size='12' fill='#1f2328' font-weight='600' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>055 rollout</text><circle cx='519' cy='276' r='7' fill='#f28e2b'/><text x='530.2' y='280.0' font-size='12' fill='#1f2328' font-weight='600' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>045 textures</text><circle cx='578' cy='210' r='7' fill='#f28e2b'/><text x='589.4000000000001' y='214.0' font-size='12' fill='#1f2328' font-weight='600' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>052 music</text><circle cx='667' cy='264' r='7' fill='#1a7f37'/><text x='678.2' y='268.0' font-size='12' fill='#1f2328' font-weight='600' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>051 leaderboard</text><circle cx='726' cy='306' r='7' fill='#1a7f37'/><text x='737.4' y='310.0' font-size='12' fill='#1f2328' font-weight='600' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>053 gulls</text><circle cx='549' cy='348' r='7' fill='#1a7f37'/><text x='559.8' y='352.0' font-size='12' fill='#1f2328' font-weight='600' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>046 perf in CI</text></svg>