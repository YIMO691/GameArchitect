<svg xmlns='http://www.w3.org/2000/svg' width='820' height='344' viewBox='0 0 820 344' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Predict, then test</title><rect x='0.5' y='0.5' width='819' height='343' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Predict, then test</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Hypothesis: every fish checks every other fish, so the cost grows with the square of the count.</text><text x='24' y='104' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>1,500 fish, all pairs</text><text x='24' y='121' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>1.1 million pairs</text><rect x='300.0' y='94.0' width='450.0' height='22.0' rx='4' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='758' y='110' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>25 ms</text><text x='24' y='154' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>750 fish, all pairs</text><text x='24' y='171' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>281,000 pairs</text><rect x='300.0' y='144.0' width='113.4' height='22.0' rx='4' fill='#f28e2b' stroke='none' stroke-width='1' opacity='1'/><text x='421.4' y='160' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>6.3 ms</text><text x='24' y='204' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>1,500 fish, SIMD + SoA</text><text x='24' y='221' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>1.1 million, faster each</text><rect x='300.0' y='194.0' width='162.0' height='22.0' rx='4' fill='#d4a72c' stroke='none' stroke-width='1' opacity='1'/><text x='470' y='210' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>9 ms</text><text x='24' y='254' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>1,500 fish, uniform grid</text><text x='24' y='271' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>~30,000 neighbour checks</text><rect x='300.0' y='244.0' width='18.0' height='22.0' rx='4' fill='#1a7f37' stroke='none' stroke-width='1' opacity='1'/><text x='326' y='260' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>1 ms</text><text x='24' y='300' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='start'>Prediction: half the fish → a quarter of the time (25 → about 6 ms). Measured: 6.3 ms. Quadratic confirmed.</text><text x='24' y='322' font-size='12.5' fill='#57606a' font-weight='600' text-anchor='start'>So the fix is fewer checks (Lessons 036, 037), not faster checks (Lessons 005, 006).</text></svg>