<svg xmlns='http://www.w3.org/2000/svg' width='820' height='392' viewBox='0 0 820 392' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Same knowledge, different moves</title><rect x='0.5' y='0.5' width='819' height='391' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Same knowledge, different moves</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>"This frame takes 40 ms, we need 16.7. Walk me through it." Each move, the frame it reaches and the score.</text><text x='250' y='94' font-size='12' fill='#57606a' font-weight='700' text-anchor='start'>Frame (ms)</text><text x='700' y='94' font-size='12' fill='#57606a' font-weight='700' text-anchor='middle'>Score</text><text x='24' y='124' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>List tricks, fix physics</text><rect x='250.0' y='110.0' width='361.0' height='20.0' rx='4' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='619.0' y='125' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>38</text><rect x='660.0' y='110.0' width='80.0' height='20.0' rx='4' fill='#f6f8fa' stroke='#9aa0a6' stroke-width='1' opacity='1'/><rect x='660.0' y='110.0' width='8.0' height='20.0' rx='4' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='752' y='125' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start'>2/20</text><text x='24' y='158' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>+ ask for a capture</text><rect x='250.0' y='144.0' width='361.0' height='20.0' rx='4' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='619.0' y='159' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>38</text><rect x='660.0' y='144.0' width='80.0' height='20.0' rx='4' fill='#f6f8fa' stroke='#9aa0a6' stroke-width='1' opacity='1'/><rect x='660.0' y='144.0' width='24.0' height='20.0' rx='4' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='752' y='159' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start'>6/20</text><text x='24' y='192' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>+ go to the slowest stage</text><rect x='250.0' y='178.0' width='361.0' height='20.0' rx='4' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='619.0' y='193' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>38</text><rect x='660.0' y='178.0' width='80.0' height='20.0' rx='4' fill='#f6f8fa' stroke='#9aa0a6' stroke-width='1' opacity='1'/><rect x='660.0' y='178.0' width='40.0' height='20.0' rx='4' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='752' y='193' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start'>10/20</text><text x='24' y='226' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>+ hypothesis and a test</text><rect x='250.0' y='212.0' width='228.0' height='20.0' rx='4' fill='#f28e2b' stroke='none' stroke-width='1' opacity='1'/><text x='486.0' y='227' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>24</text><rect x='660.0' y='212.0' width='80.0' height='20.0' rx='4' fill='#f6f8fa' stroke='#9aa0a6' stroke-width='1' opacity='1'/><rect x='660.0' y='212.0' width='56.0' height='20.0' rx='4' fill='#d4a72c' stroke='none' stroke-width='1' opacity='1'/><text x='752' y='227' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start'>14/20</text><text x='24' y='260' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>+ fix the algorithm</text><rect x='250.0' y='246.0' width='171.0' height='20.0' rx='4' fill='#f28e2b' stroke='none' stroke-width='1' opacity='1'/><text x='429.0' y='261' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>18</text><rect x='660.0' y='246.0' width='80.0' height='20.0' rx='4' fill='#f6f8fa' stroke='#9aa0a6' stroke-width='1' opacity='1'/><rect x='660.0' y='246.0' width='64.0' height='20.0' rx='4' fill='#d4a72c' stroke='none' stroke-width='1' opacity='1'/><text x='752' y='261' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start'>16/20</text><text x='24' y='294' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>+ measure again, guard it</text><rect x='250.0' y='280.0' width='152.0' height='20.0' rx='4' fill='#1a7f37' stroke='none' stroke-width='1' opacity='1'/><text x='414.65' y='295' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>16</text><rect x='660.0' y='280.0' width='80.0' height='20.0' rx='4' fill='#f6f8fa' stroke='#9aa0a6' stroke-width='1' opacity='1'/><rect x='660.0' y='280.0' width='80.0' height='20.0' rx='4' fill='#1a7f37' stroke='none' stroke-width='1' opacity='1'/><text x='752' y='295' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start'>20/20</text><line x1='408.6' y1='100' x2='408.6' y2='310' stroke='#cf222e' stroke-width='2' stroke-dasharray='5 4'/><text x='408.65' y='324' font-size='11.5' fill='#cf222e' font-weight='700' text-anchor='middle' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>16.7 ms</text><rect x='24.0' y='336.0' width='772.0' height='38.0' rx='8' fill='#dafbe1' stroke='#1a7f37' stroke-width='1.4' opacity='1'/><text x='40' y='360' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>The moves are the answer. The frame only moves once the method points at the right 25 ms.</text></svg>