<svg xmlns='http://www.w3.org/2000/svg' width='860' height='560' viewBox='0 0 860 560' font-family='Segoe UI, Helvetica, Arial, sans-serif'>
<rect x='0.5' y='0.5' width='859' height='559' rx='14' fill='#ffffff' stroke='#d0d7de'/>
<text x='24.0' y='38.0' font-size='20' fill='#1f2328' font-weight='700' text-anchor='start'>The managed heap fills with garbage, then everyone stops</text>
<text x='24.0' y='62.0' font-size='14' fill='#57606a' font-weight='400' text-anchor='start'>Live data stays. Garbage piles up in the free room. When the room is full, the GC runs.</text>
<text x='24.0' y='123.0' font-size='15' fill='#1f2328' font-weight='400' text-anchor='start'>Frame 0</text>
<rect x='200.0' y='100.0' width='442.1' height='34.0' rx='0' fill='#4e79a7' stroke='none' stroke-width='1'/>
<text x='421.1' y='122.0' font-size='13' fill='#ffffff' font-weight='700' text-anchor='middle'>live data 60 MB</text>
<rect x='642.1' y='100.0' width='117.9' height='34.0' rx='0' fill='#ffffff' stroke='#9aa0a6' stroke-width='1.5' stroke-dasharray='4 3'/>
<text x='760.0' y='150.0' font-size='12' fill='#57606a' font-weight='400' text-anchor='end'>free room: 16 MB empty</text>
<text x='24.0' y='197.0' font-size='15' fill='#1f2328' font-weight='400' text-anchor='start'>Frame 128</text>
<rect x='200.0' y='174.0' width='442.1' height='34.0' rx='0' fill='#4e79a7' stroke='none' stroke-width='1'/>
<text x='421.1' y='196.0' font-size='13' fill='#ffffff' font-weight='700' text-anchor='middle'>live data 60 MB</text>
<rect x='642.1' y='174.0' width='117.9' height='34.0' rx='0' fill='#ffffff' stroke='#9aa0a6' stroke-width='1.5' stroke-dasharray='4 3'/>
<rect x='642.1' y='174.0' width='58.9' height='34.0' rx='0' fill='#e5534b' stroke='none' stroke-width='1'/>
<text x='760.0' y='224.0' font-size='12' fill='#57606a' font-weight='400' text-anchor='end'>8 MB of garbage (128 × 64 KB)</text>
<text x='24.0' y='271.0' font-size='15' fill='#cf222e' font-weight='700' text-anchor='start'>Frame 256</text>
<rect x='200.0' y='248.0' width='442.1' height='34.0' rx='0' fill='#4e79a7' stroke='none' stroke-width='1'/>
<text x='421.1' y='270.0' font-size='13' fill='#ffffff' font-weight='700' text-anchor='middle'>live data 60 MB</text>
<rect x='642.1' y='248.0' width='117.9' height='34.0' rx='0' fill='#ffffff' stroke='#9aa0a6' stroke-width='1.5' stroke-dasharray='4 3'/>
<rect x='642.1' y='248.0' width='117.9' height='34.0' rx='0' fill='#e5534b' stroke='none' stroke-width='1'/>
<text x='760.0' y='298.0' font-size='12' fill='#57606a' font-weight='400' text-anchor='end'>full! the next allocation starts a GC</text>
<text x='770.0' y='271.0' font-size='15' fill='#cf222e' font-weight='700' text-anchor='start'>GC!</text>
<text x='24.0' y='345.0' font-size='15' fill='#1f2328' font-weight='400' text-anchor='start'>After the GC</text>
<rect x='200.0' y='322.0' width='442.1' height='34.0' rx='0' fill='#4e79a7' stroke='none' stroke-width='1'/>
<text x='421.1' y='344.0' font-size='13' fill='#ffffff' font-weight='700' text-anchor='middle'>live data 60 MB</text>
<rect x='642.1' y='322.0' width='117.9' height='34.0' rx='0' fill='#ffffff' stroke='#9aa0a6' stroke-width='1.5' stroke-dasharray='4 3'/>
<text x='760.0' y='372.0' font-size='12' fill='#57606a' font-weight='400' text-anchor='end'>garbage gone, live data untouched</text>
<rect x='200.0' y='386.0' width='14.0' height='14.0' rx='0' fill='#4e79a7' stroke='none' stroke-width='1'/>
<text x='220.0' y='398.0' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>live (still used)</text>
<rect x='350.0' y='386.0' width='14.0' height='14.0' rx='0' fill='#e5534b' stroke='none' stroke-width='1'/>
<text x='370.0' y='398.0' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>garbage (no one points to it)</text>
<rect x='580.0' y='386.0' width='14.0' height='14.0' rx='0' fill='#ffffff' stroke='#9aa0a6' stroke-width='1.5' stroke-dasharray='3 2'/>
<text x='600.0' y='398.0' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>free room</text>
<rect x='24.0' y='426.0' width='812.0' height='110.0' rx='10' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='44.0' y='456.0' font-size='14' fill='#1f2328' font-weight='600' text-anchor='start'>How often:  free room ÷ garbage per frame  =  16 MB ÷ 64 KB  =  256 frames  ≈  3.7 s at 69 fps</text>
<text x='44.0' y='484.0' font-size='14' fill='#1f2328' font-weight='600' text-anchor='start'>How long:   live heap × 0.3 ms per MB  =  60 MB × 0.3  =  18 ms of stopped game</text>
<text x='44.0' y='514.0' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>The GC must check everything that is alive, so the pause grows with live data, not with garbage.</text>
</svg>
