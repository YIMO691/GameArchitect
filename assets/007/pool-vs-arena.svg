<text x='40.0' y='310.0' font-size='14' fill='#1f2328' font-weight='600' text-anchor='start'>Get() → fill 24 drops → Release()</text>
<text x='40.0' y='334.0' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>40 Get + 40 Release per frame</text>
<text x='40.0' y='356.0' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Kept forever: 40 × ≈ 0.45 KB ≈ 18 KB</text>
<text x='40.0' y='392.0' font-size='14' fill='#1a7f37' font-weight='700' text-anchor='start'>Best for things with their own lifetimes</text>
