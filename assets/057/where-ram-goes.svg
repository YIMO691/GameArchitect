<svg xmlns='http://www.w3.org/2000/svg' width='860' height='398' viewBox='0 0 860 398' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Where a device's memory goes</title><rect x='0.5' y='0.5' width='859' height='397' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Where a device's memory goes</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>The number on the box is not your budget. What the game may use before the system stops it:</text><text x='24' y='96' font-size='14' fill='#1f2328' font-weight='700' text-anchor='start'>2 GB Android phone</text><text x='836' y='96' font-size='12' fill='#57606a' font-weight='400' text-anchor='end'>killed by the low-memory killer above ~1,300 MB</text><rect x='24.0' y='106.0' width='99.0' height='34.0' rx='0' fill='#9aa0a6' stroke='#ffffff' stroke-width='1.5' opacity='1'/><rect x='123.0' y='106.0' width='43.4' height='34.0' rx='0' fill='#c9ced4' stroke='#ffffff' stroke-width='1.5' opacity='1'/><rect x='166.4' y='106.0' width='247.6' height='34.0' rx='0' fill='#1a7f37' stroke='#ffffff' stroke-width='1.5' opacity='1'/><text x='174.44140625' y='128' font-size='12' fill='#ffffff' font-weight='700' text-anchor='start'>The game: 1,300 MB</text><text x='24' y='178' font-size='14' fill='#1f2328' font-weight='700' text-anchor='start'>4 GB iPhone</text><text x='836' y='178' font-size='12' fill='#57606a' font-weight='400' text-anchor='end'>killed by the system above ~1,900 MB</text><rect x='24.0' y='188.0' width='247.6' height='34.0' rx='0' fill='#9aa0a6' stroke='#ffffff' stroke-width='1.5' opacity='1'/><text x='32' y='210' font-size='12' fill='#ffffff' font-weight='700' text-anchor='start'>System and services</text><rect x='271.6' y='188.0' width='170.6' height='34.0' rx='0' fill='#c9ced4' stroke='#ffffff' stroke-width='1.5' opacity='1'/><text x='279.55859375' y='210' font-size='12' fill='#1f2328' font-weight='700' text-anchor='start'>Other apps kept alive</text><rect x='442.2' y='188.0' width='361.8' height='34.0' rx='0' fill='#1a7f37' stroke='#ffffff' stroke-width='1.5' opacity='1'/><text x='450.18359375' y='210' font-size='12' fill='#ffffff' font-weight='700' text-anchor='start'>The game: 1,900 MB</text><text x='24' y='260' font-size='14' fill='#1f2328' font-weight='700' text-anchor='start'>Handheld console, 4 GB</text><text x='836' y='260' font-size='12' fill='#57606a' font-weight='400' text-anchor='end'>a fixed amount: allocations beyond it fail</text><rect x='24.0' y='270.0' width='170.6' height='34.0' rx='0' fill='#9aa0a6' stroke='#ffffff' stroke-width='1.5' opacity='1'/><text x='32' y='292' font-size='12' fill='#ffffff' font-weight='700' text-anchor='start'>System, reserved</text><rect x='194.6' y='270.0' width='609.4' height='34.0' rx='0' fill='#1a7f37' stroke='#ffffff' stroke-width='1.5' opacity='1'/><text x='202.625' y='292' font-size='12' fill='#ffffff' font-weight='700' text-anchor='start'>The game: 3,200 MB, fixed</text><rect x='24.0' y='334.0' width='812.0' height='44.0' rx='8' fill='#fff8e6' stroke='#d4a72c' stroke-width='1.5' opacity='1'/><text x='40' y='361' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>Lesson 057 uses these limits for the Reef. Measure your own devices: they differ by model and OS version.</text></svg>