<svg xmlns='http://www.w3.org/2000/svg' width='860' height='408' viewBox='0 0 860 408' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Budget the peak, not the average</title><rect x='0.5' y='0.5' width='859' height='407' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Budget the peak, not the average</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Memory over a scene change on the 2 GB phone (tiered content, scaled rendering). The limit is 1,300 MB.</text><line x1='70' y1='261' x2='810' y2='261' stroke='#eaeef2'/><text x='62' y='265.1111111111111' font-size='11' fill='#57606a' font-weight='400' text-anchor='end'>800</text><line x1='70' y1='212' x2='810' y2='212' stroke='#eaeef2'/><text x='62' y='216.22222222222223' font-size='11' fill='#57606a' font-weight='400' text-anchor='end'>1,000</text><line x1='70' y1='163' x2='810' y2='163' stroke='#eaeef2'/><text x='62' y='167.33333333333334' font-size='11' fill='#57606a' font-weight='400' text-anchor='end'>1,200</text><line x1='70' y1='114' x2='810' y2='114' stroke='#eaeef2'/><text x='62' y='118.44444444444446' font-size='11' fill='#57606a' font-weight='400' text-anchor='end'>1,400</text><line x1='70' y1='139' x2='810' y2='139' stroke='#cf222e' stroke-width='2.5'/><text x='810' y='132.88888888888889' font-size='12' fill='#cf222e' font-weight='700' text-anchor='end'>limit 1,300 MB: killed</text><line x1='70' y1='171' x2='810' y2='171' stroke='#1f2328' stroke-dasharray='5 4'/><text x='810' y='164.66666666666669' font-size='12' fill='#1f2328' font-weight='600' text-anchor='end'>90%: 1,170 MB</text><path d='M70,200 L292,200 L329,127 L477,127 L514,200 L810,200' fill='none' stroke='#cf222e' stroke-width='3'/><path d='M70,200 L292,200 L322,186 L484,186 L514,200 L810,200' fill='none' stroke='#1a7f37' stroke-width='3'/><text x='403.0' y='119.15555555555554' font-size='12.5' fill='#cf222e' font-weight='700' text-anchor='middle' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>overlap: 1,348 MB</text><text x='403.0' y='205.82222222222222' font-size='12.5' fill='#1a7f37' font-weight='700' text-anchor='middle' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>transition scene: 1,108 MB</text><text x='181.0' y='220.48888888888888' font-size='12' fill='#1f2328' font-weight='600' text-anchor='middle' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>steady 1,048 MB</text><text x='70.0' y='328' font-size='11' fill='#57606a' font-weight='400' text-anchor='middle'>0 s</text><text x='218.0' y='328' font-size='11' fill='#57606a' font-weight='400' text-anchor='middle'>2 s</text><text x='366.0' y='328' font-size='11' fill='#57606a' font-weight='400' text-anchor='middle'>4 s</text><text x='514.0' y='328' font-size='11' fill='#57606a' font-weight='400' text-anchor='middle'>6 s</text><text x='662.0' y='328' font-size='11' fill='#57606a' font-weight='400' text-anchor='middle'>8 s</text><text x='810.0' y='328' font-size='11' fill='#57606a' font-weight='400' text-anchor='middle'>10 s</text><rect x='24.0' y='344.0' width='812.0' height='44.0' rx='8' fill='#fff8e6' stroke='#d4a72c' stroke-width='1.5' opacity='1'/><text x='40' y='371' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>The steady state fits easily. The scene change is what gets the game killed: budget the peak.</text></svg>