' text-anchor='end'>15%</text><text x='316' y='328' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>Who you can meet</text><text x='544' y='328' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='end'>199 others</text><text x='316' y='368' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>One world per shard. Ten festivals,</text><text x='316' y='385' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>not one.</text><rect x='576.0' y='80.0' width='260.0' height='330.0' rx='10' fill='#ffffff' stroke='#d0d7de' stroke-width='1.5' opacity='1'/><text x='592' y='106' font-size='16' fill='#59a14f' font-weight='700' text-anchor='start'>Zones</text><text x='592' y='124' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>one world, cut into areas</text><rect x='594.0' y='140.0' width='41.0' height='32.0' rx='4' fill='#fff1f0' stroke='#cf222e' stroke-width='2' opacity='1'/><text x='614.5' y='160' font-size='10.5' fill='#cf222e' font-weight='700' text-anchor='middle'>1,200</text><rect x='639.0' y='140.0' width='41.0' height='32.0' rx='4' fill='#dafbe1' stroke='#1a7f37' stroke-width='1' opacity='1'/><text x='659.5' y='160' font-size='10.5' fill='#1f2328' font-weight='400' text-anchor='middle'>90</text><rect x='684.0' y='140.0' width='41.0' height='32.0' rx='4' fill='#dafbe1' stroke='#1a7f37' stroke-width='1' opacity='1'/><text x='704.5' y='160' font-size='10.5' fill='#1f2328' font-weight='400' text-anchor='middle'>90</text><rect x='729.0' y='140.0' width='41.0' height='32.0' rx='4' fill='#dafbe1' stroke='#1a7f37' stroke-width='1' opacity='1'/><text x='749.5' y='160' font-size='10.5' fill='#1f2328' font-weight='400' text-anchor='middle'>90</text><rect x='774.0' y='140.0' width='41.0' height='32.0' rx='4' fill='#dafbe1' stroke='#1a7f37' stroke-width='1' opacity='1'/><text x='794.5' y='160' font-size='10.5' fill='#1f2328' font-weight='400' text-anchor='middle'>90</text><rect x='594.0' y='176.0' wi