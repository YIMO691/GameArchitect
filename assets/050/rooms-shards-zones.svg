' y='328' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='end'>everyone</text><text x='592' y='368' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>One festival. But the crowd at the</text><text x='592' y='385' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>stage lands on one process.</text><text x='24' y='436' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='start'>Rooms and shards decide who can meet. Zones keep one world and move the problem to the busiest place.</text></svg>