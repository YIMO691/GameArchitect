<svg xmlns='http://www.w3.org/2000/svg' width='860' height='456' viewBox='0 0 860 456' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Rooms, shards and zones</title><rect x='0.5' y='0.5' width='859' height='455' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Rooms, shards and zones</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>2,000 players at the festival. One server process can tick about 200 players who all see each other.</text><rect x='24.0' y='80.0' width='260.0' height='330.0' rx='10' fill='#ffffff' stroke='#d0d7de' stroke-width='1.5' opacity='1'/><text x='40' y='106' font-size='16' fill='#4e79a7' font-weight='700' text-anchor='start'>Rooms</text><text x='40' y='124' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>many small, separate matches</text><rect x='42.0' y='140.0' width='50.0' height='28.0' rx='5' fill='#e8f0fb' stroke='#4e79a7' stroke-width='1.2' opacity='1'/><text x='67' y='158' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>50</text><rect x='100.0' y='140.0' width='50.0' height='28.0' rx='5' fill='#e8f0fb' stroke='#4e79a7' stroke-width='1.2' opacity='1'/><text x='125' y='158' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>50</text><rect x='158.0' y='140.0' width='50.0' height='28.0' rx='5' fill='#e8f0fb' stroke='#4e79a7' stroke-width='1.2' opacity='1'/><text x='183' y='158' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>50</text><rect x='216.0' y='140.0' width='50.0' height='28.0' rx='5' fill='#e8f0fb' stroke='#4e79a7' stroke-width='1.2' opacity='1'/><text x='241' y='158' font-size='11.5' fill='#1f2328' font-weight='600' text-anchor='middle'>50</text><rect x='42.0' y='176.0' width='50.0' height='28.0' rx='5' fill='#e8f0fb' stroke='#4e79a7' stroke-width='1.2' opacity='1'/><text x='67' y='194' font-size='11.5' fill='#1f2328' font-weight='