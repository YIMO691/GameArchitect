<svg xmlns='http://www.w3.org/2000/svg' width='860' height='428' viewBox='0 0 860 428' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Why crowds are expensive</title><rect x='0.5' y='0.5' width='859' height='427' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Why crowds are expensive</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>A tick costs 1 µs for every pair "player A must hear about player B". Budget: 50 ms a tick.</text><line x1='505.0' y1='84' x2='505.0' y2='356' stroke='#1f2328' stroke-width='2' stroke-dasharray='5 4'/><text x='24' y='112' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>One process, 2,000 players</text><text x='24' y='129' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>2,000 × 1,999 pairs</text><rect x='270.0' y='100.0' width='470.0' height='26.0' rx='4' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><path d='M710.0,96 l8,17 l-8,17 M720.0,96 l8,17 l-8,17' stroke='#ffffff' stroke-width='5' fill='none'/><text x='748.0' y='118' font-size='13' fill='#cf222e' font-weight='700' text-anchor='start'>3,998 ms</text><text x='24' y='164' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>Stage zone, 1,200 players</text><text x='24' y='181' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>1,200 × 1,199 pairs</text><rect x='270.0' y='152.0' width='470.0' height='26.0' rx='4' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><path d='M710.0,148 l8,17 l-8,17 M720.0,148 l8,17 l-8,17' stroke='#ffffff' stroke-width='5' fill='none'/><text x='748.0' y='170' font-size='13' fill='#cf222e' font-weight='700' text-anchor='start'>1,439 ms</text><text x='24' y='216' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>Stage zone, nearest 50</text><text x='24' y='233' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>1,200 × 50 pairs</text><rect x='270.0' y='204.0' width='282.0' height='26.0' rx='4' fill='#f28e2b' stroke='none' stroke-width='1' opacity='1'/><text x='560.0' y='222' font-size='13' fill='#f28e2b' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>60 ms</text><text x='24' y='268' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>One shard, 200 players</text><text x='24' y='285' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>200 × 199 pairs</text><rect x='270.0' y='256.0' width='187.1' height='26.0' rx='4' fill='#1a7f37' stroke='none' stroke-width='1' opacity='1'/><text x='465.06' y='274' font-size='13' fill='#1a7f37' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>39.8 ms</text><text x='24' y='320' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>Stage split in 4, nearest 50</text><text x='24' y='337' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>300 × 50 pairs</text><rect x='270.0' y='308.0' width='70.5' height='26.0' rx='4' fill='#1a7f37' stroke='none' stroke-width='1' opacity='1'/><text x='348.5' y='326' font-size='13' fill='#1a7f37' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>15 ms</text><text x='505.0' y='80' font-size='12' fill='#1f2328' font-weight='700' text-anchor='middle'>50 ms budget</text><rect x='24.0' y='362.0' width='812.0' height='44.0' rx='8' fill='#fff8e6' stroke='#d4a72c' stroke-width='1.5' opacity='1'/><text x='40' y='389' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>Ten times the players in one space is a hundred times the work. Send less (nearest 50), then split the crowd.</text></svg>