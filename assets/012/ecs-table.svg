<svg xmlns='http://www.w3.org/2000/svg' width='880' height='510' viewBox='0 0 880 510' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>ECS as a spreadsheet: entities are rows, components are columns, systems work down columns</title><rect x='0.5' y='0.5' width='879' height='509' rx='14' fill='#ffffff' stroke='#d0d7de'/><defs><pattern id='hatch' width='8' height='8' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='8' height='8' fill='#f3f4f6'/><line x1='0' y1='0' x2='0' y2='8' stroke='#c9ced4' stroke-width='2'/></pattern><marker id='arR' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0 L10 5 L0 10 z' fill='#cf222e'/></marker><marker id='arG' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0 L10 5 L0 10 z' fill='#1a7f37'/></marker></defs><text x='24' y='38' font-size='20' fill='#1f2328' font-weight='bold' text-anchor='start'>ECS as a spreadsheet: rows are entities, columns are components</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>An entity is only a row number. A component is plain data in one column. A system works down the columns it needs.</text><rect x='24' y='84' width='690' height='36' fill='#f6f8fa' stroke='#d0d7de' rx='0'/><text x='34' y='107' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='start'>Entity id</text><text x='219.0' y='107' font-size='13' fill='#4e79a7' font-weight='bold' text-anchor='middle'>Position</text><text x='309.0' y='107' font-size='13' fill='#4e79a7' font-weight='bold' text-anchor='middle'>Velocity</text><text x='399.0' y='107' font-size='13' fill='#59a14f' font-weight='bold' text-anchor='middle'>Walker</text><text x='489.0' y='107' font-size='13' fill='#b07aa1' font-weight='bold' text-anchor='middle'>Flyer</text><text x='579.0' y='107' font-size='13' fill='#2f8f9d' font-weight='bold' text-anchor='middle'>Swimmer</text><text x='669.0' y='107' font-size='13' fill='#57606a' font-weight='bold' text-anchor='middle'>Health</text><rect x='24' y='120' width='690' height='34' fill='#ffffff' stroke='#d0d7de' rx='0'/><text x='34' y='142' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start'>0 · Fish 🐟</text><rect x='192' y='127' width='54' height='20' fill='#4e79a7' rx='4'/><text x='219.0' y='142' font-size='13' fill='#ffffff' font-weight='bold' text-anchor='middle'>✓</text><rect x='282' y='127' width='54' height='20' fill='#4e79a7' rx='4'/><text x='309.0' y='142' font-size='13' fill='#ffffff' font-weight='bold' text-anchor='middle'>✓</text><text x='399.0' y='142' font-size='13' fill='#c9ced4' font-weight='normal' text-anchor='middle'>—</text><text x='489.0' y='142' font-size='13' fill='#c9ced4' font-weight='normal' text-anchor='middle'>—</text><rect x='552' y='127' width='54' height='20' fill='#2f8f9d' rx='4'/><text x='579.0' y='142' font-size='13' fill='#ffffff' font-weight='bold' text-anchor='middle'>✓</text><rect x='642' y='127' width='54' height='20' fill='#9aa0a6' rx='4'/><text x='669.0' y='142' font-size='13' fill='#ffffff' font-weight='bold' text-anchor='middle'>✓</text><rect x='24' y='154' width='690' height='34' fill='#ffffff' stroke='#d0d7de' rx='0'/><text x='34' y='176' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start'>1 · Bird 🐦</text><rect x='192' y='161' width='54' height='20' fill='#4e79a7' rx='4'/><text x='219.0' y='176' font-size='13' fill='#ffffff' font-weight='bold' text-anchor='middle'>✓</text><rect x='282' y='161' width='54' height='20' fill='#4e79a7' rx='4'/><text x='309.0' y='176' font-size='13' fill='#ffffff' font-weight='bold' text-anchor='middle'>✓</text><text x='399.0' y='176' font-size='13' fill='#c9ced4' font-weight='normal' text-anchor='middle'>—</text><rect x='462' y='161' width='54' height='20' fill='#b07aa1' rx='4'/><text x='489.0' y='176' font-size='13' fill='#ffffff' font-weight='bold' text-anchor='middle'>✓</text><text x='579.0' y='176' font-size='13' fill='#c9ced4' font-weight='normal' text-anchor='middle'>—</text><rect x='642' y='161' width='54' height='20' fill='#9aa0a6' rx='4'/><text x='669.0' y='176' font-size='13' fill='#ffffff' font-weight='bold' text-anchor='middle'>✓</text><rect x='24' y='188' width='690' height='34' fill='#ffffff' stroke='#d0d7de' rx='0'/><text x='34' y='210' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start'>2 · Crab 🦀</text><rect x='192' y='195' width='54' height='20' fill='#4e79a7' rx='4'/><text x='219.0' y='210' font-size='13' fill='#ffffff' font-weight='bold' text-anchor='middle'>✓</text><rect x='282' y='195' width='54' height='20' fill='#4e79a7' rx='4'/><text x='309.0' y='210' font-size='13' fill='#ffffff' font-weight='bold' text-anchor='middle'>✓</text><rect x='372' y='195' width='54' height='20' fill='#59a14f' rx='4'/><text x='399.0' y='210' font-size='13' fill='#ffffff' font-weight='bold' text-anchor='middle'>✓</text><text x='489.0' y='210' font-size='13' fill='#c9ced4' font-weight='normal' text-anchor='middle'>—</text><text x='579.0' y='210' font-size='13' fill='#c9ced4' font-weight='normal' text-anchor='middle'>—</text><rect x='642' y='195' width='54' height='20' fill='#9aa0a6' rx='4'/><text x='669.0' y='210' font-size='13' fill='#ffffff' font-weight='bold' text-anchor='middle'>✓</text><rect x='24' y='222' width='690' height='34' fill='#fff8e6' stroke='#d0d7de' rx='0'/><text x='34' y='244' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='start'>3 · Gull 🕊️</text><rect x='192' y='229' width='54' height='20' fill='#4e79a7' rx='4'/><text x='219.0' y='244' font-size='13' fill='#ffffff' font-weight='bold' text-anchor='middle'>✓</text><rect x='282' y='229' width='54' height='20' fill='#4e79a7' rx='4'/><text x='309.0' y='244' font-size='13' fill='#ffffff' font-weight='bold' text-anchor='middle'>✓</text><text x='399.0' y='244' font-size='13' fill='#c9ced4' font-weight='normal' text-anchor='middle'>—</text><rect x='462' y='229' width='54' height='20' fill='#b07aa1' rx='4'/><text x='489.0' y='244' font-size='13' fill='#ffffff' font-weight='bold' text-anchor='middle'>✓</text><rect x='552' y='229' width='54' height='20' fill='#2f8f9d' rx='4'/><text x='579.0' y='244' font-size='13' fill='#ffffff' font-weight='bold' text-anchor='middle'>✓</text><rect x='642' y='229' width='54' height='20' fill='#9aa0a6' rx='4'/><text x='669.0' y='244' font-size='13' fill='#ffffff' font-weight='bold' text-anchor='middle'>✓</text><rect x='24' y='256' width='690' height='34' fill='#ffffff' stroke='#d0d7de' rx='0'/><text x='34' y='278' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start'>4 · Fish 🐟</text><rect x='192' y='263' width='54' height='20' fill='#4e79a7' rx='4'/><text x='219.0' y='278' font-size='13' fill='#ffffff' font-weight='bold' text-anchor='middle'>✓</text><rect x='282' y='263' width='54' height='20' fill='#4e79a7' rx='4'/><text x='309.0' y='278' font-size='13' fill='#ffffff' font-weight='bold' text-anchor='middle'>✓</text><text x='399.0' y='278' font-size='13' fill='#c9ced4' font-weight='normal' text-anchor='middle'>—</text><text x='489.0' y='278' font-size='13' fill='#c9ced4' font-weight='normal' text-anchor='middle'>—</text><rect x='552' y='263' width='54' height='20' fill='#2f8f9d' rx='4'/><text x='579.0' y='278' font-size='13' fill='#ffffff' font-weight='bold' text-anchor='middle'>✓</text><rect x='642' y='263' width='54' height='20' fill='#9aa0a6' rx='4'/><text x='669.0' y='278' font-size='13' fill='#ffffff' font-weight='bold' text-anchor='middle'>✓</text><rect x='24' y='290' width='690' height='34' fill='#ffffff' stroke='#d0d7de' rx='0'/><text x='34' y='312' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start'>5 · Bird 🐦</text><rect x='192' y='297' width='54' height='20' fill='#4e79a7' rx='4'/><text x='219.0' y='312' font-size='13' fill='#ffffff' font-weight='bold' text-anchor='middle'>✓</text><rect x='282' y='297' width='54' height='20' fill='#4e79a7' rx='4'/><text x='309.0' y='312' font-size='13' fill='#ffffff' font-weight='bold' text-anchor='middle'>✓</text><text x='399.0' y='312' font-size='13' fill='#c9ced4' font-weight='normal' text-anchor='middle'>—</text><rect x='462' y='297' width='54' height='20' fill='#b07aa1' rx='4'/><text x='489.0' y='312' font-size='13' fill='#ffffff' font-weight='bold' text-anchor='middle'>✓</text><text x='579.0' y='312' font-size='13' fill='#c9ced4' font-weight='normal' text-anchor='middle'>—</text><rect x='642' y='297' width='54' height='20' fill='#9aa0a6' rx='4'/><text x='669.0' y='312' font-size='13' fill='#ffffff' font-weight='bold' text-anchor='middle'>✓</text><text x='728' y='237' font-size='13' fill='#9a6700' font-weight='bold' text-anchor='start'>← the Gull:</text><text x='728' y='253' font-size='12' fill='#1f2328' font-weight='normal' text-anchor='start'>Flyer AND Swimmer.</text><text x='728' y='269' font-size='12' fill='#1f2328' font-weight='normal' text-anchor='start'>No new class.</text><text x='24' y='358' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start'>Three systems, each one loop over the rows that have ALL the columns it needs:</text><rect x='24' y='374' width='124' height='24' fill='#59a14f' rx='12'/><text x='86' y='391' font-size='13' fill='#ffffff' font-weight='bold' text-anchor='middle'>WalkSystem</text><text x='162' y='391' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start'>needs Position + Velocity + Walker</text><text x='520' y='391' font-size='13' fill='#59a14f' font-weight='bold' text-anchor='start'>→ visits row 2</text><rect x='24' y='406' width='124' height='24' fill='#b07aa1' rx='12'/><text x='86' y='423' font-size='13' fill='#ffffff' font-weight='bold' text-anchor='middle'>FlySystem</text><text x='162' y='423' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start'>needs Position + Velocity + Flyer</text><text x='520' y='423' font-size='13' fill='#b07aa1' font-weight='bold' text-anchor='start'>→ visits rows 1, 3, 5</text><rect x='24' y='438' width='124' height='24' fill='#2f8f9d' rx='12'/><text x='86' y='455' font-size='13' fill='#ffffff' font-weight='bold' text-anchor='middle'>SwimSystem</text><text x='162' y='455' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start'>needs Position + Velocity + Swimmer</text><text x='520' y='455' font-size='13' fill='#2f8f9d' font-weight='bold' text-anchor='start'>→ visits rows 0, 3, 4</text><text x='24' y='490' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>The Gull (row 3) is visited by FlySystem AND SwimSystem. Health is read by none of them, so it is never loaded.</text></svg>