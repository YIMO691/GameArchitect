16.0' y='378' font-size='12' fill='#1a7f37' font-weight='bold' text-anchor='middle'>Swimmer</text><line x1='736.0' x2='848.0' y1='384' y2='384' stroke='#1a7f37' stroke-width='2' marker-end='url(#arG)'/><text x='792.0' y='378' font-size='12' fill='#1a7f37' font-weight='bold' text-anchor='middle'>Flyer</text><text x='24' y='434' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start'>No jumps, every byte read is used · ≈ 0.35 MB per step · ≈ 10 ns per visit on the phone</text><rect x='24' y='456' width='832' height='56' fill='#f6f8fa' stroke='#d0d7de' rx='8'/><text x='40' y='479' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start'>The CPU fetches whole lines. A jump to a new line costs a trip to RAM (≈ 50 ns on our phone, Lessons 004–005).</text><text x='40' y='499' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start'>Reading lines in order lets the prefetcher fetch the next ones early, so the trips overlap.</text></svg>