<svg xmlns='http://www.w3.org/2000/svg' width='880' height='482' viewBox='0 0 880 482' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>The fat Enemy class: 320 bytes per critter, most abilities unused</title><rect x='0.5' y='0.5' width='879' height='481' rx='14' fill='#ffffff' stroke='#d0d7de'/><defs><pattern id='hatch' width='8' height='8' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='8' height='8' fill='#f3f4f6'/><line x1='0' y1='0' x2='0' y2='8' stroke='#c9ced4' stroke-width='2'/></pattern><marker id='arR' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0 L10 5 L0 10 z' fill='#cf222e'/></marker><marker id='arG' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0 L10 5 L0 10 z' fill='#1a7f37'/></marker></defs><text x='24' y='38' font-size='20' fill='#1f2328' font-weight='bold' text-anchor='start'>The fat base class: every critter carries every ability</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>Sky Hopper 1.1: one Enemy class of 320 bytes = 5 cache lines of 64 B. Coloured = this critter needs it.</text><text x='24' y='80' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>Hatched grey = carried in memory, never used.</text><line x1='150' x2='150' y1='106' y2='374' stroke='#d0d7de' stroke-dasharray='3 4'/><text x='150' y='102' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>0 B</text><line x1='266' x2='266' y1='106' y2='374' stroke='#d0d7de' stroke-dasharray='3 4'/><text x='266' y='102' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>64 B</text><line x1='382' x2='382' y1='106' y2='374' stroke='#d0d7de' stroke-dasharray='3 4'/><text x='382' y='102' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>128 B</text><line x1='498' x2='498' y1='106' y2='374' stroke='#d0d7de' stroke-dasharray='3 4'/><text x='498' y='102' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>192 B</text><line x1='614' x2='614' y1='106' y2='374' stroke='#d0d7de' stroke-dasharray='3 4'/><text x='614' y='102' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>256 B</text><line x1='730' x2='730' y1='106' y2='374' stroke='#d0d7de' stroke-dasharray='3 4'/><text x='730' y='102' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>320 B</text><text x='24' y='142' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='start'>🦀 Crab</text><text x='24' y='160' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>walks</text><rect x='152' y='120' width='112' height='48' fill='#4e79a7' rx='4'/><text x='208.0' y='141' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>header +</text><text x='208.0' y='157' font-size='12' fill='#ffffff' font-weight='normal' text-anchor='middle'>transform</text><rect x='268' y='120' width='112' height='48' fill='#4e79a7' rx='4'/><text x='324.0' y='141' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>velocity, health,</text><text x='324.0' y='157' font-size='12' fill='#ffffff' font-weight='normal' text-anchor='middle'>AI, animation</text><rect x='384' y='120' width='112' height='48' fill='#59a14f' rx='4'/><text x='440.0' y='141' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>walk</text><text x='440.0' y='157' font-size='12' fill='#ffffff' font-weight='normal' text-anchor='middle'>fields</text><rect x='500' y='120' width='112' height='48' fill='url(#hatch)' stroke='#c9ced4' rx='4'/><text x='556.0' y='141' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>fly fields</text><text x='556.0' y='157' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>unused</text><rect x='616' y='120' width='112' height='48' fill='url(#hatch)' stroke='#c9ced4' rx='4'/><text x='672.0' y='141' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>swim fields</text><text x='672.0' y='157' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>unused</text><text x='740' y='142' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='start'>192 of 320 B</text><text x='740' y='158' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>used</text><text x='24' y='206' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='start'>🐦 Bird</text><text x='24' y='224' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>flies</text><rect x='152' y='184' width='112' height='48' fill='#4e79a7' rx='4'/><text x='208.0' y='205' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>header +</text><text x='208.0' y='221' font-size='12' fill='#ffffff' font-weight='normal' text-anchor='middle'>transform</text><rect x='268' y='184' width='112' height='48' fill='#4e79a7' rx='4'/><text x='324.0' y='205' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>velocity, health,</text><text x='324.0' y='221' font-size='12' fill='#ffffff' font-weight='normal' text-anchor='middle'>AI, animation</text><rect x='384' y='184' width='112' height='48' fill='url(#hatch)' stroke='#c9ced4' rx='4'/><text x='440.0' y='205' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>walk fields</text><text x='440.0' y='221' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>unused</text><rect x='500' y='184' width='112' height='48' fill='#b07aa1' rx='4'/><text x='556.0' y='205' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>fly</text><text x='556.0' y='221' font-size='12' fill='#ffffff' font-weight='normal' text-anchor='middle'>fields</text><rect x='616' y='184' width='112' height='48' fill='url(#hatch)' stroke='#c9ced4' rx='4'/><text x='672.0' y='205' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>swim fields</text><text x='672.0' y='221' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>unused</text><text x='740' y='206' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='start'>192 of 320 B</text><text x='740' y='222' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>used</text><text x='24' y='270' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='start'>🐟 Fish</text><text x='24' y='288' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>swims</text><rect x='152' y='248' width='112' height='48' fill='#4e79a7' rx='4'/><text x='208.0' y='269' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>header +</text><text x='208.0' y='285' font-size='12' fill='#ffffff' font-weight='normal' text-anchor='middle'>transform</text><rect x='268' y='248' width='112' height='48' fill='#4e79a7' rx='4'/><text x='324.0' y='269' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>velocity, health,</text><text x='324.0' y='285' font-size='12' fill='#ffffff' font-weight='normal' text-anchor='middle'>AI, animation</text><rect x='384' y='248' width='112' height='48' fill='url(#hatch)' stroke='#c9ced4' rx='4'/><text x='440.0' y='269' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>walk fields</text><text x='440.0' y='285' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>unused</text><rect x='500' y='248' width='112' height='48' fill='url(#hatch)' stroke='#c9ced4' rx='4'/><text x='556.0' y='269' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>fly fields</text><text x='556.0' y='285' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>unused</text><rect x='616' y='248' width='112' height='48' fill='#2f8f9d' rx='4'/><text x='672.0' y='269' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>swim</text><text x='672.0' y='285' font-size='12' fill='#ffffff' font-weight='normal' text-anchor='middle'>fields</text><text x='740' y='270' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='start'>192 of 320 B</text><text x='740' y='286' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>used</text><text x='24' y='334' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='start'>🕊️ Gull</text><text x='24' y='352' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>flies + swims</text><rect x='152' y='312' width='112' height='48' fill='#4e79a7' rx='4'/><text x='208.0' y='333' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>header +</text><text x='208.0' y='349' font-size='12' fill='#ffffff' font-weight='normal' text-anchor='middle'>transform</text><rect x='268' y='312' width='112' height='48' fill='#4e79a7' rx='4'/><text x='324.0' y='333' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>velocity, health,</text><text x='324.0' y='349' font-size='12' fill='#ffffff' font-weight='normal' text-anchor='middle'>AI, animation</text><rect x='384' y='312' width='112' height='48' fill='url(#hatch)' stroke='#c9ced4' rx='4'/><text x='440.0' y='333' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>walk fields</text><text x='440.0' y='349' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>unused</text><rect x='500' y='312' width='112' height='48' fill='#b07aa1' rx='4'/><text x='556.0' y='333' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>fly</text><text x='556.0' y='349' font-size='12' fill='#ffffff' font-weight='normal' text-anchor='middle'>fields</text><rect x='616' y='312' width='112' height='48' fill='#2f8f9d' rx='4'/><text x='672.0' y='333' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>swim</text><text x='672.0' y='349' font-size='12' fill='#ffffff' font-weight='normal' text-anchor='middle'>fields</text><text x='740' y='334' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='start'>256 of 320 B</text><text x='740' y='350' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>used</text><rect x='24' y='390' width='832' height='74' fill='#fff8f7' stroke='#f5c2bf' rx='8'/><text x='40' y='414' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start'>Before the Gull, each class was 192 B: 2 shared lines + 1 line of its own ability.</text><text x='40' y='434' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start'>After moving fly + swim into the base class, every critter is 320 B. 2,000 crabs carry 2,000 × 128 B = 256 KB of wings and gills.</text><text x='40' y='454' font-size='13' fill='#cf222e' font-weight='bold' text-anchor='start'>Each Update reads 3 of the 5 lines (the Gull reads its fly OR its swim line), and the objects are scattered on the heap.</text></svg>