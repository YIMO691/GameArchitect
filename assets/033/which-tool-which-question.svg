<svg xmlns='http://www.w3.org/2000/svg' width='860' height='476' viewBox='0 0 860 476' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Which tool answers which question</title><rect x='0.5' y='0.5' width='859' height='475' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Which tool answers which question</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Each kind of tool answers one question well. Use them top to bottom: timing first, then counters, then the debugger.</text><rect x='274.0' y='92.0' width='132.0' height='40.0' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><text x='340.0' y='117' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='middle'>Is it the GPU?</text><rect x='414.0' y='92.0' width='132.0' height='40.0' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><text x='480.0' y='117' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='middle'>What is drawn?</text><rect x='554.0' y='92.0' width='132.0' height='40.0' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><text x='620.0' y='117' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='middle'>Why this draw?</text><rect x='694.0' y='92.0' width='132.0' height='40.0' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><text x='760.0' y='109' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='middle'>Which pass,</text><text x='760.0' y='125' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='middle'>which station?</text><text x='24' y='169' font-size='14' fill='#1f2328' font-weight='700' text-anchor='start'>1. Frame timing</text><text x='42' y='187' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>FrameTimingManager, stat unit</text><rect x='274.0' y='148.0' width='132.0' height='52.0' rx='6' fill='#dafbe1' stroke='#1a7f37' stroke-width='1' opacity='1'/><text x='340.0' y='179.0' font-size='15' fill='#1a7f37' font-weight='700' text-anchor='middle'>✓ yes</text><rect x='414.0' y='148.0' width='132.0' height='52.0' rx='6' fill='#ffffff' stroke='#e1e4e8' stroke-width='1' opacity='1'/><text x='480.0' y='178.0' font-size='14' fill='#9aa0a6' font-weight='400' text-anchor='middle'>—</text><rect x='554.0' y='148.0' width='132.0' height='52.0' rx='6' fill='#ffffff' stroke='#e1e4e8' stroke-width='1' opacity='1'/><text x='620.0' y='178.0' font-size='14' fill='#9aa0a6' font-weight='400' text-anchor='middle'>—</text><rect x='694.0' y='148.0' width='132.0' height='52.0' rx='6' fill='#ffffff' stroke='#e1e4e8' stroke-width='1' opacity='1'/><text x='760.0' y='178.0' font-size='14' fill='#9aa0a6' font-weight='400' text-anchor='middle'>—</text><text x='24' y='231' font-size='14' fill='#1f2328' font-weight='700' text-anchor='start'>2. Engine frame debugger</text><text x='42' y='249' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>Unity Frame Debugger</text><rect x='274.0' y='210.0' width='132.0' height='52.0' rx='6' fill='#ffffff' stroke='#e1e4e8' stroke-width='1' opacity='1'/><text x='340.0' y='240.0' font-size='14' fill='#9aa0a6' font-weight='400' text-anchor='middle'>—</text><rect x='414.0' y='210.0' width='132.0' height='52.0' rx='6' fill='#dafbe1' stroke='#1a7f37' stroke-width='1' opacity='1'/><text x='480.0' y='241.0' font-size='15' fill='#1a7f37' font-weight='700' text-anchor='middle'>✓ yes</text><rect x='554.0' y='210.0' width='132.0' height='52.0' rx='6' fill='#ffffff' stroke='#e1e4e8' stroke-width='1' opacity='1'/><text x='620.0' y='240.0' font-size='14' fill='#9aa0a6' font-weight='400' text-anchor='middle'>—</text><rect x='694.0' y='210.0' width='132.0' height='52.0' rx='6' fill='#ffffff' stroke='#e1e4e8' stroke-width='1' opacity='1'/><text x='760.0' y='240.0' font-size='14' fill='#9aa0a6' font-weight='400' text-anchor='middle'>—</text><text x='24' y='293' font-size='14' fill='#1f2328' font-weight='700' text-anchor='start'>3. Graphics debugger</text><text x='42' y='311' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>RenderDoc, PIX, Xcode capture</text><rect x='274.0' y='272.0' width='132.0' height='52.0' rx='6' fill='#ffffff' stroke='#e1e4e8' stroke-width='1' opacity='1'/><text x='340.0' y='302.0' font-size='14' fill='#9aa0a6' font-weight='400' text-anchor='middle'>—</text><rect x='414.0' y='272.0' width='132.0' height='52.0' rx='6' fill='#fff8e5' stroke='#d4a72c' stroke-width='1' opacity='1' stroke-dasharray='5 3'/><text x='480.0' y='302.0' font-size='13' fill='#9a6700' font-weight='700' text-anchor='middle'>partly</text><rect x='554.0' y='272.0' width='132.0' height='52.0' rx='6' fill='#dafbe1' stroke='#1a7f37' stroke-width='1' opacity='1'/><text x='620.0' y='303.0' font-size='15' fill='#1a7f37' font-weight='700' text-anchor='middle'>✓ yes</text><rect x='694.0' y='272.0' width='132.0' height='52.0' rx='6' fill='#ffffff' stroke='#e1e4e8' stroke-width='1' opacity='1'/><text x='760.0' y='302.0' font-size='14' fill='#9aa0a6' font-weight='400' text-anchor='middle'>—</text><text x='24' y='355' font-size='14' fill='#1f2328' font-weight='700' text-anchor='start'>4. GPU profiler + counters</text><text x='42' y='373' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>AGI, Streamline, Snapdragon</text><rect x='274.0' y='334.0' width='132.0' height='52.0' rx='6' fill='#fff8e5' stroke='#d4a72c' stroke-width='1' opacity='1' stroke-dasharray='5 3'/><text x='340.0' y='364.0' font-size='13' fill='#9a6700' font-weight='700' text-anchor='middle'>partly</text><rect x='414.0' y='334.0' width='132.0' height='52.0' rx='6' fill='#ffffff' stroke='#e1e4e8' stroke-width='1' opacity='1'/><text x='480.0' y='364.0' font-size='14' fill='#9aa0a6' font-weight='400' text-anchor='middle'>—</text><rect x='554.0' y='334.0' width='132.0' height='52.0' rx='6' fill='#ffffff' stroke='#e1e4e8' stroke-width='1' opacity='1'/><text x='620.0' y='364.0' font-size='14' fill='#9aa0a6' font-weight='400' text-anchor='middle'>—</text><rect x='694.0' y='334.0' width='132.0' height='52.0' rx='6' fill='#dafbe1' stroke='#1a7f37' stroke-width='1' opacity='1'/><text x='760.0' y='365.0' font-size='15' fill='#1a7f37' font-weight='700' text-anchor='middle'>✓ yes</text><rect x='24.0' y='406.0' width='812.0' height='52.0' rx='8' fill='#ffebe9' stroke='#cf222e' stroke-width='1' opacity='1'/><text x='40' y='427' font-size='13' fill='#cf222e' font-weight='700' text-anchor='start'>On a tile-based phone GPU, per-draw durations are not reliable: draws are binned and shaded tile by tile.</text><text x='40' y='446' font-size='13' fill='#1f2328' font-weight='400' text-anchor='start'>RenderDoc said "sand 9.8 ms". Fixing it saved 0.3 ms. Time per render pass, from the counters profiler, is honest.</text></svg>