<svg xmlns='http://www.w3.org/2000/svg' width='860' height='364' viewBox='0 0 860 364' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Thirty minutes, two answers</title><rect x='0.5' y='0.5' width='859' height='363' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Thirty minutes, two answers</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>"Design the save system for the Reef’s online mode." Same candidate, same knowledge, two shapes of answer.</text><text x='24' y='108' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>As answered</text><rect x='160.0' y='92.0' width='583.0' height='26.0' rx='4' fill='#b07aa1' stroke='none' stroke-width='1' opacity='1'/><text x='451.5' y='110' font-size='11.5' fill='#ffffff' font-weight='700' text-anchor='middle'>SaveGame class, 40 fields (30 min)</text><text x='759.0' y='104' font-size='14' fill='#cf222e' font-weight='700' text-anchor='start'>2 / 20</text><text x='759.0' y='121' font-size='11.5' fill='#57606a' font-weight='600' text-anchor='start'>no hire</text><text x='24' y='170' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>With a frame</text><rect x='160.0' y='154.0' width='95.5' height='26.0' rx='4' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><text x='207.75' y='172' font-size='11.5' fill='#ffffff' font-weight='700' text-anchor='middle'>Ask</text><rect x='257.5' y='154.0' width='56.5' height='26.0' rx='4' fill='#59a14f' stroke='none' stroke-width='1' opacity='1'/><text x='285.75' y='172' font-size='11.5' fill='#ffffff' font-weight='700' text-anchor='middle'>3</text><rect x='316.0' y='154.0' width='232.0' height='26.0' rx='4' fill='#f28e2b' stroke='none' stroke-width='1' opacity='1'/><text x='432.0' y='172' font-size='11.5' fill='#ffffff' font-weight='700' text-anchor='middle'>Boxes, then zoom (12)</text><rect x='550.0' y='154.0' width='95.5' height='26.0' rx='4' fill='#d4a72c' stroke='none' stroke-width='1' opacity='1'/><text x='597.75' y='172' font-size='11.5' fill='#ffffff' font-weight='700' text-anchor='middle'>Trade-offs</text><rect x='647.5' y='154.0' width='95.5' height='26.0' rx='4' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='695.25' y='172' font-size='11.5' fill='#ffffff' font-weight='700' text-anchor='middle'>Failures</text><text x='759.0' y='166' font-size='14' fill='#1a7f37' font-weight='700' text-anchor='start'>20 / 20</text><text x='759.0' y='183' font-size='11.5' fill='#57606a' font-weight='600' text-anchor='start'>strong hire</text><text x='160.0' y='206' font-size='11' fill='#57606a' font-weight='400' text-anchor='middle'>0</text><text x='257.5' y='206' font-size='11' fill='#57606a' font-weight='400' text-anchor='middle'>5</text><text x='355.0' y='206' font-size='11' fill='#57606a' font-weight='400' text-anchor='middle'>10</text><text x='452.5' y='206' font-size='11' fill='#57606a' font-weight='400' text-anchor='middle'>15</text><text x='550.0' y='206' font-size='11' fill='#57606a' font-weight='400' text-anchor='middle'>20</text><text x='647.5' y='206' font-size='11' fill='#57606a' font-weight='400' text-anchor='middle'>25</text><text x='745.0' y='206' font-size='11' fill='#57606a' font-weight='400' text-anchor='middle'>30</text><text x='452.5' y='222' font-size='11' fill='#57606a' font-weight='600' text-anchor='middle'>minutes</text><text x='24' y='246' font-size='12.5' fill='#4e79a7' font-weight='700' text-anchor='start'>Ask</text><text x='170' y='246' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='start'>5 min</text><text x='230' y='246' font-size='12.5' fill='#57606a' font-weight='400' text-anchor='start'>who, how many, what must never happen</text><text x='24' y='268' font-size='12.5' fill='#59a14f' font-weight='700' text-anchor='start'>Numbers</text><text x='170' y='268' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='start'>3 min</text><text x='230' y='268' font-size='12.5' fill='#57606a' font-weight='400' text-anchor='start'>5,000 saves/s, 100 MB/s, 300 GB</text><text x='24' y='290' font-size='12.5' fill='#f28e2b' font-weight='700' text-anchor='start'>Boxes, then zoom</text><text x='170' y='290' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='start'>12 min</text><text x='230' y='290' font-size='12.5' fill='#57606a' font-weight='400' text-anchor='start'>whole system, then the two riskiest parts</text><text x='24' y='312' font-size='12.5' fill='#9a7400' font-weight='700' text-anchor='start'>Trade-offs</text><text x='170' y='312' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='start'>5 min</text><text x='230' y='312' font-size='12.5' fill='#57606a' font-weight='400' text-anchor='start'>two options, one choice, the reason</text><text x='24' y='334' font-size='12.5' fill='#cf222e' font-weight='700' text-anchor='start'>Failures, metrics</text><text x='170' y='334' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='start'>5 min</text><text x='230' y='334' font-size='12.5' fill='#57606a' font-weight='400' text-anchor='start'>what breaks, and how you would know</text></svg>