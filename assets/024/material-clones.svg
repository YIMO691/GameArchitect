9.2 331.8 Z' fill='#edc948'/><path d='M612.8 327 Q620.8 319.8 630.4 327 Q620.8 334.2 612.8 327 Z' fill='#e5534b'/><path d='M628.8 327 L635.2 322.2 L635.2 331.8 Z' fill='#e5534b'/><path d='M658.8 327 Q666.8 319.8 676.4 327 Q666.8 334.2 658.8 327 Z' fill='#ff9da7'/><path d='M674.8 327 L681.2 322.2 L681.2 331.8 Z' fill='#ff9da7'/><path d='M704.8 327 Q712.8 319.8 722.4 327 Q712.8 334.2 704.8 327 Z' fill='#4e79a7'/><path d='M720.8 327 L727.2 322.2 L727.2 331.8 Z' fill='#4e79a7'/><path d='M750.8 327 Q758.8 319.8 768.4 327 Q758.8 334.2 750.8 327 Z' fill='#59a14f'/><path d='M766.8 327 L773.2 322.2 L773.2 331.8 Z' fill='#59a14f'/><text x='812' y='331' font-size='12' fill='#57606a' font-weight='normal' text-anchor='end'>×200</text><text x='638' y='368' font-size='13' fill='#1a7f37' font-weight='bold' text-anchor='middle'>1,200 fish = 6 materials = 6 switches</text><text x='24' y='412' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start'>The tint now lives in a small per-fish value (a property block, 16 bytes), not in a whole material.</text><text x='24' y='434' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='start'>Switches: 1,250 → 56.  Render thread: 42.5 → 18.62 ms.  Draw calls are still 1,550.</text><text x='24' y='456' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>Unity also never frees those 1,200 copies by itself: they leak until you Destroy() them or unload the scene.</text></svg>