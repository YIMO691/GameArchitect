<svg xmlns='http://www.w3.org/2000/svg' width='880' height='500' viewBox='0 0 880 500' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Three ways to draw</title><rect x='0.5' y='0.5' width='879' height='499' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' fill='#1f2328' font-weight='bold' text-anchor='start'>Three ways to send the same fish and coral</text><text x='24' y='60' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start'>The waiter (render thread) carries order slips to the kitchen (GPU). Fewer slips = less walking.</text><rect x='24' y='80' width='268' height='330' rx='10' fill='#fff5f5' stroke='#e5534b' stroke-width='1.5'/><text x='38' y='106' font-size='16' fill='#cf222e' font-weight='bold' text-anchor='start'>One draw per object</text><rect x='306' y='80' width='268' height='330' rx='10' fill='#f3f7fc' stroke='#4e79a7' stroke-width='1.5'/><text x='320' y='106' font-size='16' fill='#4e79a7' font-weight='bold' text-anchor='start'>Static batching</text><rect x='588' y='80' width='268' height='330' rx='10' fill='#f3fbf5' stroke='#1a7f37' stroke-width='1.5'/><text x='602' y='106' font-size='16' fill='#1a7f37' font-weight='bold' text-anchor='start'>Instancing</text><rect x='40' y='126' width='32' height='26' rx='3' fill='#ffffff' stroke='#e5534b' stroke-width='1'/><line x1='45' y1='135' x2='67' y2='135' stroke='#9aa0a6' stroke-width='1'/><line x1='45' y1='143' x2='62' y2='143' stroke='#9aa0a6' stroke-width='1'/><rect x='80' y='126' width='32' height='26' rx='3' fill='#ffffff' stroke='#e5534b' stroke-width='1'/><line x1='85' y1='135' x2='107' y2='135' stroke='#9aa0a6' stroke-width='1'/><line x1='85' y1='143' x2='102' y2='143' stroke='#9aa0a6' stroke-width='1'/><rect x='120' y='126' width='32' height='26' rx='3' fill='#ffffff' stroke='#e5534b' stroke-width='1'/><line x1='125' y1='135' x2='147' y2='135' stroke='#9aa0a6' stroke-width='1'/><line x1='125' y1='143' x2='142' y2='143' stroke='#9aa0a6' stroke-widt