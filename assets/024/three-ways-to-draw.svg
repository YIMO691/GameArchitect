h='1'/><line x1='45' y1='245' x2='62' y2='245' stroke='#9aa0a6' stroke-width='1'/><rect x='80' y='228' width='32' height='26' rx='3' fill='#ffffff' stroke='#e5534b' stroke-width='1'/><line x1='85' y1='237' x2='107' y2='237' stroke='#9aa0a6' stroke-width='1'/><line x1='85' y1='245' x2='102' y2='245' stroke='#9aa0a6' stroke-width='1'/><rect x='120' y='228' width='32' height='26' rx='3' fill='#ffffff' stroke='#e5534b' stroke-width='1'/><line x1='125' y1='237' x2='147' y2='237' stroke='#9aa0a6' stroke-width='1'/><line x1='125' y1='245' x2='142' y2='245' stroke='#9aa0a6' stroke-width='1'/><rect x='160' y='228' width='32' height='26' rx='3' fill='#ffffff' stroke='#e5534b' stroke-width='1'/><line x1='165' y1='237' x2='187' y2='237' stroke='#9aa0a6' stroke-width='1'/><line x1='165' y1='245' x2='182' y2='245' stroke='#9aa0a6' stroke-width='1'/><rect x='200' y='228' width='32' height='26' rx='3' fill='#ffffff' stroke='#e5534b' stroke-width='1'/><line x1='205' y1='237' x2='227' y2='237' stroke='#9aa0a6' stroke-width='1'/><line x1='205' y1='245' x2='222' y2='245' stroke='#9aa0a6' stroke-width='1'/><rect x='240' y='228' width='32' height='26' rx='3' fill='#ffffff' stroke='#e5534b' stroke-width='1'/><line x1='245' y1='237' x2='267' y2='237' stroke='#9aa0a6' stroke-width='1'/><line x1='245' y1='245' x2='262' y2='245' stroke='#9aa0a6' stroke-width='1'/><rect x='40' y='262' width='32' height='26' rx='3' fill='#ffffff' stroke='#e5534b' stroke-width='1'/><line x1='45' y1='271' x2='67' y2='271' stroke='#9aa0a6' stroke-width='1'/><line x1='45' y1='279' x2='62' y2='279' stroke='#9aa0a6' stroke-width='1'/><rect x='80' y='262' width='32' height='26' rx='3' fill='#ffffff' stroke='#e5534b' stroke-width='1'/><line x1='85' y1='271' x2='107' y2='271' stroke='#9aa0a6' stroke-width='1'/><line x1='85' y1='279' x2='102' y2='279' stroke='#9aa0a6' stroke-width='1'/><rect x='120' y='262' width='32' height='26' rx='3' fill='#ffffff' stroke='#e5534b' stroke-width='1'/><line x1='125' y1='271' x2='147' y2='271' stroke='#9aa0a6' stroke-width='1'/><line x1='125' y1='279' x2='142' y2='279' stroke='#9aa0a6' stroke-width='1'/><rect x='160' y='262' width='32' height='26' rx='3' fill='#ffffff' stroke='#e5534b' stroke-width='1'/><line x1='165' y1='271' x2='187' y2='271' stroke='#9aa0a6' stroke-width='1'/><line x1='165' y1='279' x2='182' y2='279' stroke='#9aa0a6' stroke-width='1'/><rect x='200' y='262' width='32' height='26' rx='3' fill='#ffffff' stroke='#e5534b' stroke-width='1'/><line x1='205' y1='271' x2='227' y2='271' stroke='#9aa0a6' stroke-width='1'/><line x1='205' y1='279' x2='222' y2='279' stroke='#9aa0a6' stroke-width='1'/><rect x='240' y='262' width='32' height='26' rx='3' fill='#ffffff' stroke='#e5534b' stroke-width='1'/><line x1='245' y1='271' x2='267' y2='271' stroke='#9aa0a6' stroke-width='1'/><line x1='245' y1='279' x2='262' y2='279' stroke='#9aa0a6' stroke-width='1'/><text x='38' y='316' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='start'>1 slip per fish, 1 per coral piece</text><text x='38' y='336' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>1,200 fish → 1,200 draw calls</text><text x='38' y='354' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>300 coral → 300 draw calls</text><text x='38' y='380' font-size='12' fill='#1a7f37' font-weight='normal' text-anchor='start'>+ simple, culls each object</text><text x='38' y='398' font-size='12' fill='#cf222e' font-weight='normal' text-anchor='start'>− 10 µs on the CPU per slip</text><rect x='336' y='150' width='60' height='40' rx='14' fill='#9ec5e8' stroke='#4e79a7' stroke-width='1'/><rect x='386' y='140' width='70' height='55' rx='14' fill='#7aa9d6' stroke='#4e79a7' stroke-width='1'/><rect x='446' y='155' width='60' height='38' rx='14' fill='#b7d3ee' stroke='#4e79a7' stroke-width='1'/><rect x='496' y='146' width='50' height='48' rx='14' fill='#9ec5e8' stroke='#4e79a7' stroke-width='1'/><rect x='346' y='200' width='80' height='40' rx='14' fill='#7aa9d6' stroke='#4e79a7' stroke-width='1'/><rect x='421' y='198' width='70' height='46' rx='14' fill='#b7d3ee' stroke='#4e79a7' stroke-width='1'/><rect x='481' y='204' width='64' height='36' rx='14' fill='#9ec5e8' stroke='#4e79a7' stroke-width='1'/><rect x='330' y='132' width='222' height='122' rx='12' fill='none' stroke='#4e79a7' stroke-width='2.5' stroke-dasharray='7 4'/><text x='441' y='276' font-size='12' fill='#4e79a7' font-weight='bold' text-anchor='middle'>glued into 1 mesh per material</text><text x='320' y='316' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='start'>Still things only</text><text x='320' y='336' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>300 coral → 40 draw calls</text><text x='320' y='354' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>fish move: can't be glued</text><text x='320' y='380' font-size='12' fill='#1a7f37' font-weight='normal' text-anchor='start'>+ 260 fewer slips (−2.6 ms)</text><text x='320' y='398' font-size='12' fill='#cf222e' font-weight='normal' text-anchor='start'>− +18 MB: every copy stored</text><rect x='606' y='126' width='108' height='150' rx='4' fill='#ffffff' stroke='#1a7f37' stroke-width='1.5'/><text x='660' y='146' font-size='12' fill='#1a7f37' font-weight='bold' text-anchor='middle'>Draw salmon</text><text x='660' y='164' font-size='16' fill='#1a7f37' font-weight='bold' text-anchor='middle'>× 200</text><line x1='616' y1='184' x2='704' y2='184' stroke='#9aa0a6' stroke-width='1'/><line x1='616' y1='202' x2='704' y2='202' stroke='#9aa0a6' stroke-width='1'/><line x1='616' y1='220' x2='704' y2='220' stroke='#9aa0a6' stroke-width='1'/><line x1='616' y1='238' x2='704' y2='238' stroke='#9aa0a6' stroke-width='1'/><line x1='616' y1='256' x2='704' y2='256' stroke='#9aa0a6' stroke-width='1'/><text x='724' y='152' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>+ a list:</text><text x='724' y='172' font-size='12' fill='#1f2328' font-weight='normal' text-anchor='start'>position</text><text x='724' y='190' font-size='12' fill='#1f2328' font-weight='normal' text-anchor='start'>rotation, size</text><text x='724' y='208' font-size='12' fill='#1f2328' font-weight='normal' text-anchor='start'>tint</text><text x='724' y='230' font-size='12' fill='#b07aa1' font-weight='bold' text-anchor='start'>80 bytes</text><text x='724' y='246' font-size='12' fill='#b07aa1' font-weight='normal' text-anchor='start'>per fish</text><path d='M738.2 270 Q745.2 263.7 753.6 270 Q745.2 276.3 738.2 270 Z' fill='#4e79a7'/><path d='M752.2 270 L757.8 265.8 L757.8 274.2 Z' fill='#4e79a7'/><path d='M762.2 270 Q769.2 263.7 777.6 270 Q769.2 276.3 762.2 270 Z' fill='#59a14f'/><path d='M776.2 270 L781.8 265.8 L781.8 274.2 Z' fill='#59a14f'/><path d='M786.2 270 Q793.2 263.7 801.6 270 Q793.2 276.3 786.2 270 Z' fill='#f28e2b'/><path d='M800.2 270 L805.8 265.8 L805.8 274.2 Z' fill='#f28e2b'/><path d='M810.2 270 Q817.2 263.7 825.6 270 Q817.2 276.3 810.2 270 Z' fill='#b07aa1'/><path d='M824.2 270 L829.8 265.8 L829.8 274.2 Z' fill='#b07aa1'/><text x='602' y='316' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='start'>Same mesh + same material</text><text x='602' y='336' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>1,200 fish → 6 draw calls</text><text x='602' y='354' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>one per species</text><text x='602' y='380' font-size='12' fill='#1a7f37' font-weight='normal' text-anchor='start'>+ 1 µs per fish, not 10 µs</text><text x='602' y='398' font-size='12' fill='#cf222e' font-weight='normal' text-anchor='start'>− you cull; GPU work unchanged</text><text x='24' y='444' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='start'>All three draw exactly the same triangles. The GPU's vertex and pixel work does not change.</text><text x='24' y='466' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>Only the CPU's paperwork changes: how many slips, and how many material switches between them.</text><text x='24' y='486' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>Numbers: The Reef, mid-range phone, approximate.</text></svg>