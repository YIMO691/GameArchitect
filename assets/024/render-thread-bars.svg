<svg xmlns='http://www.w3.org/2000/svg' width='860' height='470' viewBox='0 0 860 470' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Render thread time per fix</title><rect x='0.5' y='0.5' width='859' height='469' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' fill='#1f2328' font-weight='bold' text-anchor='start'>Where the render thread's time goes</text><text x='24' y='60' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start'>Render thread ms ≈ 2 fixed + 0.01 per draw call + 0.02 per material switch + 0.001 per instanced fish</text><text x='24' y='110' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start'>1,200 fish, a material per fish</text><text x='24' y='128' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>1,550 draws · 1,250 switches</text><rect x='250' y='96' width='510' height='26' rx='3' fill='#f6f8fa' stroke='#eaeef2' stroke-width='1'/><rect x='250' y='96' width='22.7' height='26' rx='0' fill='#9aa0a6' stroke='none' stroke-width='1'/><rect x='272.7' y='96' width='175.7' height='26' rx='0' fill='#4e79a7' stroke='none' stroke-width='1'/><rect x='448.3' y='96' width='283.3' height='26' rx='0' fill='#e5534b' stroke='none' stroke-width='1'/><text x='739.7' y='114' font-size='14' fill='#cf222e' font-weight='bold' text-anchor='start'>42.5 ms</text><text x='24' y='168' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start'>Shared materials + tint block</text><text x='24' y='186' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>1,550 draws · 56 switches</text><rect x='250' y='154' width='510' height='26' rx='3' fill='#f6f8fa' stroke='#eaeef2' stroke-width='1'/><rect x='250' y='154' width='22.7' height='26' rx='0' fill='#9aa0a6' stroke='none' stroke-width='1'/><rect x='272.7' y='154' width='175.7' height='26' rx='0' fill='#4e79a7' stroke='none' stroke-width='1'/><rect x='448.3' y='154' width='12.7' height='26' rx='0' fill='#e5534b' st