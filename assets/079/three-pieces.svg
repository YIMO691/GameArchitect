<svg xmlns='http://www.w3.org/2000/svg' width='860' height='394' viewBox='0 0 860 394' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Three pieces, three proofs</title><rect x='0.5' y='0.5' width='859' height='393' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Three pieces, three proofs</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Each piece proves a different part of the job. Together they answer "can this person decide, measure and choose?"</text><rect x='24.0' y='84.0' width='260.0' height='236.0' rx='10' fill='#ffffff' stroke='#4e79a7' stroke-width='1.8' opacity='1'/><rect x='24.0' y='84.0' width='260.0' height='36.0' rx='10' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><rect x='24.0' y='106.0' width='260.0' height='14.0' rx='0' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><text x='38' y='108' font-size='14' fill='#ffffff' font-weight='700' text-anchor='start'>A design you can defend</text><text x='38' y='146' font-size='14' fill='#1f2328' font-weight='700' text-anchor='start'>Online save service</text><text x='38' y='172' font-size='12.5' fill='#4e79a7' font-weight='700' text-anchor='start'>5,000 saves/s, 0 catches lost</text><text x='38' y='194' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>design doc + 2 ADRs</text><text x='38' y='216' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>snapshots over an event log</text><line x1='38' y1='240' x2='270' y2='240' stroke='#d0d7de'/><text x='38' y='264' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='start'>Proves: you can shape a system</text><text x='38' y='286' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>Lessons 047, 067, 068, 077</text><rect x='300.0' y='84.0' width='260.0' height='236.0' rx='10' fill='#ffffff' stroke='#59a14f' stroke-width='1.8' opacity='1'/><rect x='300.0' y='84.0' width='260.0' height='36.0' rx='10' fill='#59a14f' stroke='none' stroke-width='1' opacity='1'/><rect x='300.0' y='106.0' width='260.0' height='14.0' rx='0' fill='#59a14f' stroke='none' stroke-width='1' opacity='1'/><text x='314' y='108' font-size='14' fill='#ffffff' font-weight='700' text-anchor='start'>A measured optimization</text><text x='314' y='146' font-size='14' fill='#1f2328' font-weight='700' text-anchor='start'>Fish proximity</text><text x='314' y='172' font-size='12.5' fill='#59a14f' font-weight='700' text-anchor='start'>25 → 1 ms on the handheld</text><text x='314' y='194' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>capture, hypothesis, test</text><text x='314' y='216' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>grid over quadtree</text><line x1='314' y1='240' x2='546' y2='240' stroke='#d0d7de'/><text x='314' y='264' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='start'>Proves: you find causes, not tricks</text><text x='314' y='286' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>Lessons 035, 036, 037, 078</text><rect x='576.0' y='84.0' width='260.0' height='236.0' rx='10' fill='#ffffff' stroke='#f28e2b' stroke-width='1.8' opacity='1'/><rect x='576.0' y='84.0' width='260.0' height='36.0' rx='10' fill='#f28e2b' stroke='none' stroke-width='1' opacity='1'/><rect x='576.0' y='106.0' width='260.0' height='14.0' rx='0' fill='#f28e2b' stroke='none' stroke-width='1' opacity='1'/><text x='590' y='108' font-size='14' fill='#ffffff' font-weight='700' text-anchor='start'>A decision at scale</text><text x='590' y='146' font-size='14' fill='#1f2328' font-weight='700' text-anchor='start'>Archipelago streaming</text><text x='590' y='172' font-size='12.5' fill='#f28e2b' font-weight='700' text-anchor='start'>11.0 → 3.1 GB, 95 → 12 s</text><text x='590' y='194' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>cells, async, HLOD, sim LOD</text><text x='590' y='216' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>streaming over smaller textures</text><line x1='590' y1='240' x2='822' y2='240' stroke='#d0d7de'/><text x='590' y='264' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='start'>Proves: you weigh trade-offs</text><text x='590' y='286' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>Lessons 043, 069, 076</text><rect x='24.0' y='336.0' width='812.0' height='38.0' rx='8' fill='#dafbe1' stroke='#1a7f37' stroke-width='1.4' opacity='1'/><text x='40' y='360' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>Three strong pieces get read. Fourteen pieces get skimmed, and the best one is never reached.</text></svg>