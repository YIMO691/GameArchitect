<svg xmlns='http://www.w3.org/2000/svg' width='860' height='418' viewBox='0 0 860 418' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>One piece, top to bottom</title><rect x='0.5' y='0.5' width='859' height='417' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>One piece, top to bottom</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Written so the first 30 seconds tell the whole story, and every later line backs it up.</text><text x='24' y='108' font-size='12.5' fill='#57606a' font-weight='700' text-anchor='start'>0:00</text><rect x='76.0' y='84.0' width='760.0' height='38.0' rx='8' fill='#ffffff' stroke='#4e79a7' stroke-width='1.5' opacity='1'/><rect x='76.0' y='84.0' width='6.0' height='38.0' rx='3' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><text x='94' y='108' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>Title with the result</text><text x='352' y='108' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>Fish proximity: 25 → 1 ms on the handheld</text><text x='24' y='154' font-size='12.5' fill='#57606a' font-weight='700' text-anchor='start'>0:15</text><rect x='76.0' y='130.0' width='760.0' height='38.0' rx='8' fill='#ffffff' stroke='#4e79a7' stroke-width='1.5' opacity='1'/><rect x='76.0' y='130.0' width='6.0' height='38.0' rx='3' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><text x='94' y='154' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>Problem, in two lines</text><text x='352' y='154' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>1,500 fish, 40 ms frame, target 16.7; game thread slowest</text><text x='24' y='200' font-size='12.5' fill='#57606a' font-weight='700' text-anchor='start'>0:30</text><rect x='76.0' y='176.0' width='760.0' height='38.0' rx='8' fill='#ffffff' stroke='#59a14f' stroke-width='1.5' opacity='1'/><rect x='76.0' y='176.0' width='6.0' height='38.0' rx='3' fill='#59a14f' stroke='none' stroke-width='1' opacity='1'/><text x='94' y='200' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>Constraints and numbers</text><text x='352' y='200' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>handheld, 60 fps, 1.1 million pairs a frame</text><text x='24' y='246' font-size='12.5' fill='#57606a' font-weight='700' text-anchor='start'>0:45</text><rect x='76.0' y='222.0' width='760.0' height='38.0' rx='8' fill='#ffffff' stroke='#f28e2b' stroke-width='1.5' opacity='1'/><rect x='76.0' y='222.0' width='6.0' height='38.0' rx='3' fill='#f28e2b' stroke='none' stroke-width='1' opacity='1'/><text x='94' y='246' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>Decision and what you rejected</text><text x='352' y='246' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>uniform grid; rejected quadtree (rebuild cost), SIMD alone (9 ms)</text><text x='24' y='292' font-size='12.5' fill='#57606a' font-weight='700' text-anchor='start'>1:15</text><rect x='76.0' y='268.0' width='760.0' height='38.0' rx='8' fill='#ffffff' stroke='#59a14f' stroke-width='1.5' opacity='1'/><rect x='76.0' y='268.0' width='6.0' height='38.0' rx='3' fill='#59a14f' stroke='none' stroke-width='1' opacity='1'/><text x='94' y='292' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>Measured result</text><text x='352' y='292' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>before/after capture: proximity 25 → 1 ms, frame 40 → 16 ms</text><text x='24' y='338' font-size='12.5' fill='#57606a' font-weight='700' text-anchor='start'>1:45</text><rect x='76.0' y='314.0' width='760.0' height='38.0' rx='8' fill='#ffffff' stroke='#b07aa1' stroke-width='1.5' opacity='1'/><rect x='76.0' y='314.0' width='6.0' height='38.0' rx='3' fill='#b07aa1' stroke='none' stroke-width='1' opacity='1'/><text x='94' y='338' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>What you’d do differently</text><text x='352' y='338' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>write the perf test before the fix, not after it</text><text x='24' y='384' font-size='12.5' fill='#57606a' font-weight='700' text-anchor='start'>2:00</text><rect x='76.0' y='360.0' width='760.0' height='38.0' rx='8' fill='#ffffff' stroke='#9aa0a6' stroke-width='1.5' opacity='1'/><rect x='76.0' y='360.0' width='6.0' height='38.0' rx='3' fill='#9aa0a6' stroke='none' stroke-width='1' opacity='1'/><text x='94' y='384' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>Something to open</text><text x='352' y='384' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>small public rebuild · capture images · ADR</text></svg>