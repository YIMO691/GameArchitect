 stroke-width='1.6'/><line x1='696' y1='277.0' x2='728' y2='277.0' stroke='#1a7f37' stroke-width='1.6'/><line x1='696' y1='315.0' x2='728' y2='315.0' stroke='#1a7f37' stroke-width='1.6'/><line x1='696' y1='361.0' x2='728' y2='361.0' stroke='#1a7f37' stroke-width='1.8' stroke-dasharray='5 4'/><rect x='466' y='161' width='116' height='34' rx='6' fill='#ffffff' stroke='#4e79a7' stroke-width='1.5'/><text x='524' y='183' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='middle'>🐦 Gull</text><rect x='466' y='215' width='116' height='34' rx='6' fill='#ffffff' stroke='#4e79a7' stroke-width='1.5'/><text x='524' y='237' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='middle'>🦤 Pelican</text><rect x='466' y='269' width='116' height='34' rx='6' fill='#ffffff' stroke='#4e79a7' stroke-width='1.5'/><text x='524' y='291' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='middle'>🎣 Player hook</text><rect x='728' y='148' width='116' height='30' rx='6' fill='#ffffff' stroke='#9aa0a6' stroke-width='1.5'/><text x='786' y='168' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='middle'>Score</text><rect x='728' y='186' width='116' height='30' rx='6' fill='#ffffff' stroke='#9aa0a6' stroke-width='1.5'/><text x='786' y='206' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='middle'>Audio</text><rect x='728' y='224' width='116' height='30' rx='6' fill='#ffffff' stroke='#9aa0a6' stroke-width='1.5'/><text x='786' y='244' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='middle'>Splash VFX</text><rect x='728' y='262' width='116' height='30' rx='6' fill='#ffffff' stroke='#9aa0a6' stroke-width='1.5'/><text x='786' y='282' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='middle'>Quests</text><rect x='728' y='300' width='116' height='30' rx='6' fill='#ffffff' stroke='#9aa0a6' stroke-width='1.5'/><text x='786' y='320' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='middle'>Analytics</text><rect x='728' y='346' width='116' height='30' rx='6' fill='#dafbe1' stroke='#1a7f37' stroke-width='1.5' stroke-dasharray='5 4'/><text x='786' y='366' font-size='13' fill='#1a7f37' font-weight='bold' text-anchor='middle'>📳 Haptics</text><text x='466' y='398' font-size='13' fill='#1a7f37' font-weight='bold' text-anchor='start'>3 + 5 = 8 links. Haptics: +1 link, edit 0 senders.</text><text x='24' y='440' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>Fewer links means less coupling: a change to Audio can no longer break the gull code. The cost is on the next pictures.</text></svg>