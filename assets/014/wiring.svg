<svg xmlns='http://www.w3.org/2000/svg' width='880' height='460' viewBox='0 0 880 460' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Direct calls need 15 wires between 3 senders and 5 listeners; a bus or queue needs 8 links</title><rect x='0.5' y='0.5' width='879' height='459' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' fill='#1f2328' font-weight='bold' text-anchor='start'>Who has to know whom?</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>Three senders tell five systems about a catch. Dashed: adding a sixth listener, Haptics (the phone buzzes).</text><rect x='20' y='80' width='410' height='330' rx='10' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1.5'/><text x='36' y='106' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='start'>❌ Direct calls</text><text x='36' y='126' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>Every sender calls every listener itself.</text><rect x='450' y='80' width='410' height='330' rx='10' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1.5'/><text x='466' y='106' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='start'>✅ Event bus or event queue</text><text x='466' y='126' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>Senders post a FishCaught. Listeners sign up.</text><line x1='152' y1='178' x2='300' y2='163.0' stroke='#e5534b' stroke-width='1.3'/><line x1='152' y1='232' x2='300' y2='163.0' stroke='#e5534b' stroke-width='1.3'/><line x1='152' y1='286' x2='300' y2='163.0' stroke='#e5534b' stroke-width='1.3'/><line x1='152' y1='178' x2='300' y2='201.0' stroke='#e5534b' stroke-width='1.3'/><line x1='152' y1='232' x2='300' y2='201.0' stroke='#e5534b' stroke-width='1.3'/><line x1='152' y1='286' x2='300' y2='201.0' stroke='#e5534b' stroke-width='1.3'/><line x1='152' y1='178' x2='300' y2='239.0' stroke='#e5534b' stroke-width='1.3'/><line x1='152' y1='232' x2='300' y2='239.0' stroke='#e5534b' stroke-width='1.3'/><line x1='152' y1='286' x2='300' y2='239.0' stroke='#e5534b' stroke-width='1.3'/><line x1='152' y1='178' x2='300' y2='277.0' stroke='#e5534b' stroke-width='1.3'/><line x1='152' y1='232' x2='300' y2='277.0' stroke='#e5534b' stroke-width='1.3'/><line x1='152' y1='286' x2='300' y2='277.0' stroke='#e5534b' stroke-width='1.3'/><line x1='152' y1='178' x2='300' y2='315.0' stroke='#e5534b' stroke-width='1.3'/><line x1='152' y1='232' x2='300' y2='315.0' stroke='#e5534b' stroke-width='1.3'/><line x1='152' y1='286' x2='300' y2='315.0' stroke='#e5534b' stroke-width='1.3'/><line x1='152' y1='178' x2='300' y2='361.0' stroke='#cf222e' stroke-width='1.6' stroke-dasharray='5 4'/><line x1='152' y1='232' x2='300' y2='361.0' stroke='#cf222e' stroke-width='1.6' stroke-dasharray='5 4'/><line x1='152' y1='286' x2='300' y2='361.0' stroke='#cf222e' stroke-width='1.6' stroke-dasharray='5 4'/><rect x='36' y='161' width='116' height='34' rx='6' fill='#ffffff' stroke='#4e79a7' stroke-width='1.5'/><text x='94' y='183' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='middle'>🐦 Gull</text><rect x='36' y='215' width='116' height='34' rx='6' fill='#ffffff' stroke='#4e79a7' stroke-width='1.5'/><text x='94' y='237' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='middle'>🦤 Pelican</text><rect x='36' y='269' width='116' height='34' rx='6' fill='#ffffff' stroke='#4e79a7' stroke-width='1.5'/><text x='94' y='291' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='middle'>🎣 Player hook</text><rect x='300' y='148' width='116' height='30' rx='6' fill='#ffffff' stroke='#9aa0a6' stroke-width='1.5'/><text x='358' y='168' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='middle'>Score</text><rect x='300' y='186' width='116' height='30' rx='6' fill='#ffffff' stroke='#9aa0a6' stroke-width='1.5'/><text x='358' y='206' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='middle'>Audio</text><rect x='300' y='224' width='11