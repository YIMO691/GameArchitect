1.5' y='76' font-size='12' fill='#1a7f37' font-weight='bold' text-anchor='end'>budget</text><text x='24' y='310' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start'>Zoom into the green block: the fixed order, µs per system</text><rect x='24' y='324' width='112' height='46' rx='6' fill='#dafbe1' stroke='#1a7f37' stroke-width='1.5'/><text x='80.0' y='344' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='middle'>Score</text><text x='80.0' y='362' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>11 µs</text><text x='139.5' y='351' font-size='14' fill='#57606a' font-weight='bold' text-anchor='middle'>›</text><rect x='143' y='324' width='112' height='46' rx='6' fill='#dafbe1' stroke='#1a7f37' stroke-width='1.5'/><text x='199.0' y='344' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='middle'>Achievements</text><text x='199.0' y='362' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>11 µs</text><text x='258.5' y='351' font-size='14' fill='#57606a' font-weight='bold' text-anchor='middle'>›</text><rect x='262' y='324' width='112' height='46' rx='6' fill='#dafbe1' stroke='#1a7f37' stroke-width='1.5'/><text x='318.0' y='344' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='middle'>HUD</text><text x='318.0' y='362' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>23 µs</text><text x='377.5' y='351' font-size='14' fill='#57606a' font-weight='bold' text-anchor='middle'>›</text><rect x='381' y='324' width='112' height='46' rx='6' fill='#dafbe1' stroke='#1a7f37' stroke-width='1.5'/><text x='437.0' y='344' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='middle'>Audio</text><text x='437.0' y='362' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>23 µs</text><text x='496.5' y='351' font-size='14' fill='#57606a' font-weight='bold' text-anchor='middle'>›</text><rect x='500' y='324' width='112' height='46' rx='6' fill='#dafbe1' stroke='#1a7f37' stroke-width='1.5'/><text x='556.0' y='344' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='middle'>Splash VFX</text><text x='556.0' y='362' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>11 µs</text><text x='615.5' y='351' font-size='14' fill='#57606a' font-weight='bold' text-anchor='middle'>›</text><rect x='619' y='324' width='112' height='46' rx='6' fill='#dafbe1' stroke='#1a7f37' stroke-width='1.5'/><text x='675.0' y='344' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='middle'>Quests</text><text x='675.0' y='362' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>11 µs</text><text x='734.5' y='351' font-size='14' fill='#57606a' font-weight='bold' text-anchor='middle'>›</text><rect x='738' y='324' width='112' height='46' rx='6' fill='#dafbe1' stroke='#1a7f37' stroke-width='1.5'/><text x='794.0' y='344' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='middle'>Analytics</text><text x='794.0' y='362' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>23 µs</text><text x='24' y='396' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>Score writes ComboChanged; Achievements reads it and writes AchievementProgress; HUD reads both. So Score must run first.</text><text x='24' y='416' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>If HUD ran before Score, the combo number would show one step late: 16.67 ms. Nobody sees that. A wrong catch is different (Step 5).</text></svg>