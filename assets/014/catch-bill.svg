<svg xmlns='http://www.w3.org/2000/svg' width='880' height='476' viewBox='0 0 880 476' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Cost per catch: direct calls 920 ns, event bus 1,360 ns, typed bus 995 ns, event queue 199 ns</title><rect x='0.5' y='0.5' width='879' height='475' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' fill='#1f2328' font-weight='bold' text-anchor='start'>One catch: 3 events, 10 reactions. What does it cost?</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>Nanoseconds per catch on the 30 fps phone (approximate). Simulation using the lesson's numbers.</text><line x1='190.0' y1='82' x2='190.0' y2='348' stroke='#eaeef2' stroke-width='1'/><text x='190.0' y='366' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>0 ns</text><line x1='290.0' y1='82' x2='290.0' y2='348' stroke='#eaeef2' stroke-width='1'/><text x='290.0' y='366' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>250 ns</text><line x1='390.0' y1='82' x2='390.0' y2='348' stroke='#eaeef2' stroke-width='1'/><text x='390.0' y='366' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>500 ns</text><line x1='490.0' y1='82' x2='490.0' y2='348' stroke='#eaeef2' stroke-width='1'/><text x='490.0' y='366' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>750 ns</text><line x1='590.0' y1='82' x2='590.0' y2='348' stroke='#eaeef2' stroke-width='1'/><text x='590.0' y='366' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>1,000 ns</text><line x1='690.0' y1='82' x2='690.0' y2='348' stroke='#eaeef2' stroke-width='1'/><text x='690.0' y='366' font-size='12' fill='#57606a' font-weight='normal' text-anchor='middle'>1,250 ns</text><text x='24' y='118' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start'>Direct calls</text><rect x='190' y='100' width='8.0' height='28' rx='3' fill='#9aa0a6' stroke='none' stroke-width='1.5'/><rect x='198.0' y='100' width='360.0' height='28' rx='3' fill='#e5534b' stroke='none' stroke-width='1.5'/><text x='566.0' y='113' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='start'>920 ns</text><text x='566.0' y='129' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>× 600 = 0.55 ms</text><text x='190' y='144' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>0 B garbage</text><text x='24' y='180' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start'>Event bus</text><rect x='190' y='162' width='144.0' height='28' rx='3' fill='#b07aa1' stroke='none' stroke-width='1.5'/><rect x='334.0' y='162' width='40.0' height='28' rx='3' fill='#9aa0a6' stroke='none' stroke-width='1.5'/><rect x='374.0' y='162' width='360.0' height='28' rx='3' fill='#e5534b' stroke='none' stroke-width='1.5'/><text x='742.0' y='175' font-size='13' fill='#cf222e' font-weight='bold' text-anchor='start'>1,360 ns</text><text x='742.0' y='191' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>× 600 = 0.82 ms</text><text x='190' y='206' font-size='12' fill='#cf222e' font-weight='bold' text-anchor='start'>+ 264 B of garbage per catch</text><text x='24' y='242' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start'>Typed bus</text><rect x='190' y='224' width='18.0' height='28' rx='3' fill='#b07aa1' stroke='none' stroke-width='1.5'/><rect x='208.0' y='224' width='20.0' height='28' rx='3' fill='#9aa0a6' stroke='none' stroke-width='1.5'/><rect x='228.0' y='224' width='360.0' height='28' rx='3' fill='#e5534b' stroke='none' stroke-width='1.5'/><text x='596.0' y='237' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='start'>995 ns</text><text x='596.0' y='253' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>× 600 = 0.60 ms</text><text x='190' y='268' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>0 B garbage</text><text x='24' y='304' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start'>Event queue</text><rect x='190' y='286' width='3.6' height='28' rx='3' fill='#b07aa1' stroke='none' stroke-width='1.5'/><rect x='193.6' y='286' width='16.0' height='28' rx='3' fill='#9aa0a6' stroke='none' stroke-width='1.5'/><rect x='209.6' y='286' width='60.0' height='28' rx='3' fill='#59a14f' stroke='none' stroke-width='1.5'/><text x='277.6' y='299' font-size='13' fill='#1a7f37' font-weight='bold' text-anchor='start'>199 ns</text><text x='277.6' y='315' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>× 600 = 0.12 ms</text><text x='190' y='330' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>0 B garbage</text><rect x='24' y='392' width='14' height='14' rx='2' fill='#b07aa1' stroke='none' stroke-width='1.5'/><text x='44' y='404' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>posting the event (box, look up, copy list / append)</text><rect x='440' y='392' width='14' height='14' rx='2' fill='#9aa0a6' stroke='none' stroke-width='1.5'/><text x='460' y='404' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>calling or reading, per reaction</text><rect x='24' y='416' width='14' height='14' rx='2' fill='#e5534b' stroke='none' stroke-width='1.5'/><text x='44' y='428' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>reaction work, cold (90 ns: data not in cache)</text><rect x='440' y='416' width='14' height='14' rx='2' fill='#59a14f' stroke='none' stroke-width='1.5'/><text x='460' y='428' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>reaction work, warm (15 ns: batched)</text><text x='24' y='456' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='start'>The red part is the same in all three cold designs: the work runs in the wrong place, not the call itself.</text></svg>