<svg xmlns='http://www.w3.org/2000/svg' width='860' height='398' viewBox='0 0 860 398' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Old regressions cost more</title><rect x='0.5' y='0.5' width='859' height='397' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Old regressions cost more</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Hours to fix one frame-time regression, by how long ago it landed and who fixes it.</text><line x1='110' y1='290' x2='820' y2='290' stroke='#d0d7de'/><rect x='120.0' y='272.0' width='44.0' height='18.0' rx='4' fill='#1a7f37' stroke='none' stroke-width='1' opacity='1'/><text x='142.0' y='266' font-size='12.5' fill='#1a7f37' font-weight='700' text-anchor='middle'>2 h</text><rect x='172.0' y='254.0' width='44.0' height='36.0' rx='4' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='194.0' y='248' font-size='12.5' fill='#cf222e' font-weight='700' text-anchor='middle'>4 h</text><text x='168' y='312' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='middle'>same day (CI)</text><rect x='295.0' y='254.0' width='44.0' height='36.0' rx='4' fill='#1a7f37' stroke='none' stroke-width='1' opacity='1'/><text x='317.0' y='248' font-size='12.5' fill='#1a7f37' font-weight='700' text-anchor='middle'>4 h</text><rect x='347.0' y='218.0' width='44.0' height='72.0' rx='4' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='369.0' y='212' font-size='12.5' fill='#cf222e' font-weight='700' text-anchor='middle'>8 h</text><text x='343' y='312' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='middle'>1 week later</text><rect x='470.0' y='236.0' width='44.0' height='54.0' rx='4' fill='#1a7f37' stroke='none' stroke-width='1' opacity='1'/><text x='492.0' y='230' font-size='12.5' fill='#1a7f37' font-weight='700' text-anchor='middle'>6 h</text><rect x='522.0' y='182.0' width='44.0' height='108.0' rx='4' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='544.0' y='176' font-size='12.5' fill='#cf222e' font-weight='700' text-anchor='middle'>12 h</text><text x='518' y='312' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='middle'>2 weeks later</text><rect x='645.0' y='218.0' width='44.0' height='72.0' rx='4' fill='#1a7f37' stroke='none' stroke-width='1' opacity='1'/><text x='667.0' y='212' font-size='12.5' fill='#1a7f37' font-weight='700' text-anchor='middle'>8 h</text><rect x='697.0' y='146.0' width='44.0' height='144.0' rx='4' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='719.0' y='140' font-size='12.5' fill='#cf222e' font-weight='700' text-anchor='middle'>16 h</text><text x='693' y='312' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='middle'>3 weeks later</text><rect x='120.0' y='90.0' width='14.0' height='14.0' rx='3' fill='#1a7f37' stroke='none' stroke-width='1' opacity='1'/><text x='140' y='102' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>the owner, who wrote it</text><rect x='120.0' y='114.0' width='14.0' height='14.0' rx='3' fill='#cf222e' stroke='none' stroke-width='1' opacity='1'/><text x='140' y='126' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>the optimizer team, who did not</text><text x='120' y='152' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>A monthly pass finds regressions 0–3 weeks old.</text><text x='120' y='170' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>Each week of age = more changes to search through.</text><rect x='24.0' y='334.0' width='812.0' height='44.0' rx='8' fill='#fff8e6' stroke='#d4a72c' stroke-width='1.5' opacity='1'/><text x='40' y='361' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>In the lab: 96 hours a quarter with a monthly pass and no owners, 30 hours with CI and owners.</text></svg>