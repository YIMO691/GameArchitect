<svg xmlns='http://www.w3.org/2000/svg' width='860' height='490' viewBox='0 0 860 490' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>The budget board</title><rect x='0.5' y='0.5' width='859' height='489' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>The budget board</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>The Reef's frame budget on the mid-range PC, 60 fps. Every line has a number and a name.</text><text x='24' y='94' font-size='11' fill='#57606a' font-weight='700' text-anchor='start'>SYSTEM</text><text x='200' y='94' font-size='11' fill='#57606a' font-weight='700' text-anchor='start'>USED OF BUDGET (ms)</text><text x='600' y='94' font-size='11' fill='#57606a' font-weight='700' text-anchor='start'>OWNER</text><text x='700' y='94' font-size='11' fill='#57606a' font-weight='700' text-anchor='start'>HEADROOM</text><text x='24' y='124' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>Rendering</text><rect x='200.0' y='110.0' width='312.0' height='20.0' rx='4' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><rect x='200.0' y='110.0' width='291.2' height='20.0' rx='4' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><text x='520.0' y='125' font-size='12' fill='#1f2328' font-weight='400' text-anchor='start'>5.6 / 6.0</text><text x='600' y='125' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>Lena</text><text x='700' y='125' font-size='12.5' fill='#1a7f37' font-weight='600' text-anchor='start'>0.4 ms</text><text x='24' y='154' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>Gameplay</text><rect x='200.0' y='140.0' width='182.0' height='20.0' rx='4' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><rect x='200.0' y='140.0' width='166.4' height='20.0' rx='4' fill='#f28e2b' stroke='none' stroke-width='1' opacity='1'/><text x='390.0' y='155' font-size='12' fill='#1f2328' font-weight='400' text-anchor='start'>3.2 / 3.5</text><text x='600' y='155' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>Omar</text><text x='700' y='155' font-size='12.5' fill='#1a7f37' font-weight='600' text-anchor='start'>0.3 ms</text><text x='24' y='184' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>Animation</text><rect x='200.0' y='170.0' width='104.0' height='20.0' rx='4' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><rect x='200.0' y='170.0' width='93.6' height='20.0' rx='4' fill='#b07aa1' stroke='none' stroke-width='1' opacity='1'/><text x='312.0' y='185' font-size='12' fill='#1f2328' font-weight='400' text-anchor='start'>1.8 / 2.0</text><text x='600' y='185' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>Kai</text><text x='700' y='185' font-size='12.5' fill='#1a7f37' font-weight='600' text-anchor='start'>0.2 ms</text><text x='24' y='214' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>UI</text><rect x='200.0' y='200.0' width='78.0' height='20.0' rx='4' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><rect x='200.0' y='200.0' width='62.4' height='20.0' rx='4' fill='#d4a72c' stroke='none' stroke-width='1' opacity='1'/><text x='286.0' y='215' font-size='12' fill='#1f2328' font-weight='400' text-anchor='start'>1.2 / 1.5</text><text x='600' y='215' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>Sofia</text><text x='700' y='215' font-size='12.5' fill='#1a7f37' font-weight='600' text-anchor='start'>0.3 ms</text><text x='24' y='244' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>VFX</text><rect x='200.0' y='230.0' width='104.0' height='20.0' rx='4' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><rect x='200.0' y='230.0' width='88.4' height='20.0' rx='4' fill='#e87ba4' stroke='none' stroke-width='1' opacity='1'/><text x='312.0' y='245' font-size='12' fill='#1f2328' font-weight='400' text-anchor='start'>1.7 / 2.0</text><text x='600' y='245' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>Ravi</text><text x='700' y='245' font-size='12.5' fill='#1a7f37' font-weight='600' text-anchor='start'>0.3 ms</text><text x='24' y='274' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>Audio</text><rect x='200.0' y='260.0' width='52.0' height='20.0' rx='4' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><rect x='200.0' y='260.0' width='41.6' height='20.0' rx='4' fill='#6250d6' stroke='none' stroke-width='1' opacity='1'/><text x='260.0' y='275' font-size='12' fill='#1f2328' font-weight='400' text-anchor='start'>0.8 / 1.0</text><text x='600' y='275' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>Mei</text><text x='700' y='275' font-size='12.5' fill='#1a7f37' font-weight='600' text-anchor='start'>0.2 ms</text><line x1='24' y1='288' x2='836' y2='288' stroke='#d0d7de'/><text x='24' y='308' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='start'>Total</text><text x='200' y='308' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='start'>14.3 used of 16.0 budget</text><text x='600' y='308' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>architect</text><text x='700' y='308' font-size='12.5' fill='#4e79a7' font-weight='700' text-anchor='start'>0.7 ms reserve</text><text x='24' y='330' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='start'>The 0.7 ms between 16.0 and 16.7 belongs to nobody's feature: it absorbs measurement noise and the next platform surprise.</text><rect x='24.0' y='344.0' width='812.0' height='66.0' rx='8' fill='#eaf1fb' stroke='#4e79a7' stroke-width='1.5' opacity='1'/><text x='40' y='368' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>A trade: Rendering wants +0.6 ms for the new lake's lights, and has 0.4 ms left.</text><text x='40' y='390' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>Lena asks Mei: Audio gives 0.2 ms of its headroom. The board now says Rendering 6.2, Audio 0.8, agreed and checked by CI.</text><rect x='24.0' y='426.0' width='812.0' height='44.0' rx='8' fill='#fff8e6' stroke='#d4a72c' stroke-width='1.5' opacity='1'/><text x='40' y='453' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>A budget is a promise between teams: a number, an owner, a check on every build, and a way to trade.</text></svg>