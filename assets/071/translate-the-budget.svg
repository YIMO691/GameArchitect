<svg xmlns='http://www.w3.org/2000/svg' width='860' height='330' viewBox='0 0 860 330' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>One budget, two languages</title><rect x='0.5' y='0.5' width='859' height='329' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>One budget, two languages</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>The same budget, in the units each person works in. Agreed once, shown in their tools.</text><rect x='24.0' y='86.0' width='230.0' height='210.0' rx='8' fill='#ffffff' stroke='#1f2328' stroke-width='1.6' opacity='1'/><text x='40' y='112' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start'>Engineering budget</text><text x='40' y='138' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>Harbour art on handheld</text><text x='40' y='172' font-size='28' fill='#4e79a7' font-weight='700' text-anchor='start'>2.0 ms</text><text x='40' y='200' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>of the 16.0 ms frame</text><text x='40' y='238' font-size='22' fill='#b07aa1' font-weight='700' text-anchor='start'>300 MB</text><text x='40' y='262' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>scene memory (Lesson 057)</text><line x1='262' y1='190' x2='292.0' y2='190.0' stroke='#9aa0a6' stroke-width='3'/><polygon points='302,190 292.0,184.0 292.0,196.0' fill='#9aa0a6'/><rect x='310.0' y='86.0' width='526.0' height='48.0' rx='8' fill='#ffffff' stroke='#4e79a7' stroke-width='1.5' opacity='1'/><text x='324' y='115' font-size='13' fill='#4e79a7' font-weight='700' text-anchor='start'>Boat (12)</text><text x='450' y='115' font-size='14' fill='#1f2328' font-weight='700' text-anchor='start'>15,000 triangles</text><text x='600' y='115' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>two 2K textures, 3 materials</text><rect x='310.0' y='140.0' width='526.0' height='48.0' rx='8' fill='#ffffff' stroke='#4e79a7' stroke-width='1.5' opacity='1'/><text x='324' y='169' font-size='13' fill='#4e79a7' font-weight='700' text-anchor='start'>Prop (18)</text><text x='450' y='169' font-size='14' fill='#1f2328' font-weight='700' text-anchor='start'>3,000 triangles</text><text x='600' y='169' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>one 1K texture, 1 material</text><rect x='310.0' y='194.0' width='526.0' height='48.0' rx='8' fill='#ffffff' stroke='#f28e2b' stroke-width='1.5' opacity='1'/><text x='324' y='223' font-size='13' fill='#f28e2b' font-weight='700' text-anchor='start'>Effect (10)</text><text x='450' y='223' font-size='14' fill='#1f2328' font-weight='700' text-anchor='start'>300 particles</text><text x='600' y='223' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>1 transparent layer on screen</text><rect x='310.0' y='248.0' width='526.0' height='48.0' rx='8' fill='#ffffff' stroke='#1a7f37' stroke-width='1.5' opacity='1'/><text x='324' y='277' font-size='13' fill='#1a7f37' font-weight='700' text-anchor='start'>Weather</text><text x='450' y='277' font-size='14' fill='#1f2328' font-weight='700' text-anchor='start'>0.5 ms line</text><text x='600' y='277' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>agreed at kickoff with tech art</text><text x='310' y='316' font-size='12' fill='#57606a' font-weight='600' text-anchor='start'>Each line is checked live in the editor, the same way CI checks the scene (Lesson 057).</text></svg>