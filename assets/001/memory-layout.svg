<svg xmlns='http://www.w3.org/2000/svg' width='820' height='360' viewBox='0 0 820 360' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Scattered objects versus packed arrays</title><rect x='0' y='0' width='820' height='360' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='36' font-size='20' fill='#1f2328' font-weight='bold' text-anchor='start'>Same data, two memory layouts</text><text x='24' y='74' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='start'>A. One object per zombie, scattered on the heap</text><rect x='24' y='88' width='22' height='34' fill='#eaeef2' stroke='#d0d7de'/><rect x='48' y='88' width='22' height='34' fill='#eaeef2' stroke='#d0d7de'/><rect x='72' y='88' width='22' height='34' fill='#ffd8d3' stroke='#d0d7de'/><text x='83.0' y='110' font-size='13' fill='#cf222e' font-weight='bold' text-anchor='middle'>Z</text><rect x='96' y='88' width='22' height='34' fill='#eaeef2' stroke='#d0d7de'/><rect x='120' y='88' width='22' height='34' fill='#eaeef2' stroke='#d0d7de'/><rect x='144' y='88' width='22' height='34' fill='#eaeef2' stroke='#d0d7de'/><rect x='168' y='88' width='22' height='34' fill='#eaeef2' stroke='#d0d7de'/><rect x='192' y='88' width='22' height='34' fill='#eaeef2' stroke='#d0d7de'/><rect x='216' y='88' width='22' height='34' fill='#eaeef2' stroke='#d0d7de'/><rect x='240' y='88' width='22' height='34' fill='#ffd8d3' stroke='#d0d7de'/><text x='251.0' y='110' font-size='13' fill='#cf222e' font-weight='bold' text-anchor='middle'>Z</text><rect x='264' y='88' width='22' height='34' fill='#eaeef2' stroke='#d0d7de'/><rect x='288' y='88' width='22' height='34' fill='#eaeef2' stroke='#d0d7de'/><rect x='312' y='88' width='22' height='34' fill='#eaeef2' stroke='#d0d7de'/><rect x='336' y='88' width='22' height='34' fill='#eaeef2' stroke='#d0d7de'/><rect x='360' y='88' width='22' height='34' fill='#eaeef2' stroke='#d0d7de'/><rect x='384' y='88' width='22' height='34' fill='#ffd8d3' stroke='#d0d7de'/><text x='395.0' y='110' font-size='13' fill='#cf222e' font-weight='bold' text-anchor='middle'>Z</text><rect x='408' y='88' width='22' height='34' fill='#eaeef2' stroke='#d0d7de'/><rect x='432' y='88' width='22' height='34' fill='#eaeef2' stroke='#d0d7de'/><rect x='456' y='88' width='22' height='34' fill='#eaeef2' stroke='#d0d7de'/><rect x='480' y='88' width='22' height='34' fill='#ffd8d3' stroke='#d0d7de'/><text x='491.0' y='110' font-size='13' fill='#cf222e' font-weight='bold' text-anchor='middle'>Z</text><rect x='504' y='88' width='22' height='34' fill='#eaeef2' stroke='#d0d7de'/><rect x='528' y='88' width='22' height='34' fill='#eaeef2' stroke='#d0d7de'/><rect x='552' y='88' width='22' height='34' fill='#eaeef2' stroke='#d0d7de'/><rect x='576' y='88' width='22' height='34' fill='#eaeef2' stroke='#d0d7de'/><rect x='600' y='88' width='22' height='34' fill='#eaeef2' stroke='#d0d7de'/><rect x='624' y='88' width='22' height='34' fill='#eaeef2' stroke='#d0d7de'/><rect x='648' y='88' width='22' height='34' fill='#eaeef2' stroke='#d0d7de'/><rect x='672' y='88' width='22' height='34' fill='#ffd8d3' stroke='#d0d7de'/><text x='683.0' y='110' font-size='13' fill='#cf222e' font-weight='bold' text-anchor='middle'>Z</text><rect x='696' y='88' width='22' height='34' fill='#eaeef2' stroke='#d0d7de'/><rect x='720' y='88' width='22' height='34' fill='#eaeef2' stroke='#d0d7de'/><rect x='744' y='88' width='22' height='34' fill='#eaeef2' stroke='#d0d7de'/><rect x='768' y='88' width='22' height='34' fill='#eaeef2' stroke='#d0d7de'/><text x='24' y='146' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>To read 5 positions the CPU fetches 5 different cache lines — mostly other data it doesn't need.</text><text x='24' y='166' font-size='13' fill='#cf222e' font-weight='bold' text-anchor='start'>Each fetch can be a ~100 ns trip to RAM.</text><text x='24' y='214' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='start'>B. All positions packed in one array</text><rect x='24' y='228' 