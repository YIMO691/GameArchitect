<svg xmlns='http://www.w3.org/2000/svg' width='880' height='330' viewBox='0 0 880 330' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Memory latency analogy</title><rect x='0' y='0' width='880' height='330' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='36' font-size='20' fill='#1f2328' font-weight='bold' text-anchor='start'>How far away is your data?</text><text x='24' y='58' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>Approximate read latency. Pretend 1 nanosecond = 1 second.</text><text x='24' y='106' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='start'>L1 cache</text><rect x='130' y='88' width='6.0' height='26' rx='4' fill='#2da44e'/><text x='146' y='106' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start'>~1 ns</text><text x='216' y='106' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>= 1 s: a note on your desk</text><text x='24' y='158' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='start'>L2 cache</text><rect x='130' y='140' width='13.6' height='26' rx='4' fill='#7cb342'/><text x='153.6' y='158' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start'>~4 ns</text><text x='223.6' y='158' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>= 4 s: in your desk drawer</text><text x='24' y='210' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='start'>L3 cache</text><rect x='130' y='192' width='51.0' height='26' rx='4' fill='#f0a020'/><text x='191.0' y='210' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start'>~15 ns</text><text x='261.0' y='210' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>= 15 s: on the shelf across the room</text><text x='24' y='262' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='start'>RAM</text><rect x='130' y='244' width='340.0' height='26' rx='4' fill='#cf222e'/><text x='480.0' y='262' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start'>~100 ns</text><text x='550.0' y='262' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>= 1 min 40 s: walk to the library and back</text><text x='24' y='300' font-size='13' fill='#cf222e' font-weight='bold' text-anchor='start'>A cache miss to RAM costs about the same time as 100+ simple CPU instructions.</text></svg>