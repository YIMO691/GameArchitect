<text x='24.0' y='38.0' font-size='20' fill='#1f2328' font-weight='700' text-anchor='start'>How big should a job be? The particle update, split 6 ways</text>
<text x='24.0' y='62.0' font-size='14' fill='#57606a' font-weight='400' text-anchor='start'>CPU frame with the task graph. Each job costs about 2 µs extra to schedule and run.</text>
<line x1='584.4666666666667' x2='584.4666666666667' y1='82' y2='370' stroke='#1a7f37' stroke-width='2' stroke-dasharray='6 4'/><text x='590.5' y='380.0' font-size='12' fill='#1a7f37' font-weight='600' text-anchor='start'>budget 6.94 ms</text><text x='318.0' y='110.0' font-size='13' fill='#1f2328' font-weight='400' text-anchor='end'>1 job · 2,000,000 particles · 8.0 ms</text><rect x='330' y='90' width='427.5' height='30' rx='4' fill='#e5534b'/><text x='765.5' y='110.0' font-size='14' fill='#1f2328' font-weight='700' text-anchor='start' stroke='#ffffff' stroke-width='4' paint-order='stroke'>11.66 ms</text><text x='318.0' y='158.0' font-size='13' fill='#1f2328' font-weight='400' text-anchor='end'>2 jobs · 1,000,000 each · 4.0 ms</text><rect x='330' y='138' width='280.9' height='30' rx='4' fill='#e5534b'/><text x='618.9' y='158.0' font-size='14' fill='#1f2328' font-weight='700' text-anchor='start' stroke='#ffffff' stroke-width='4' paint-order='stroke'>7.66 ms</text><text x='318.0' y='206.0' font-size='13' fill='#1f2328' font-weight='700' text-anchor='end'>8 jobs · 250,000 each · 1.0 ms</text><rect x='330' y='186' width='206.9' height='30' rx='4' fill='#59a14f'/><text x='544.9' y='206.0' font-size='14' fill='#1f2328' font-weight='700' text-anchor='start' stroke='#ffffff' stroke-width='4' paint-order='stroke'>5.64 ms</text><text x='318.0' y='254.0' font-size='13' fill='#1f2328' font-weight='700' text-anchor='end'>64 jobs · 31,250 each · 0.125 ms</text><rect x='330' y='234' width='207.4' height='30' rx='4' fill='#59a14f'/><text x='545.4' y='254.0' font-size='14' fill='#1f2328' font-weight='700' text-anchor='start' stroke='#ffffff' stroke-width='4' paint-order='stroke'>5.66 ms</text><text x='318.0' y='302.0' font-size='13' fill='#1f2328' font-weight='400' text-anchor='end'>1,024 jobs · about 1,950 each · 7.8 µs</text><rect x='330' y='282' width='218.4' height='30' rx='4' fill='#59a14f'/><text x='556.4' y='302.0' font-size='14' fill='#1f2328' font-weight='700' text-anchor='start' stroke='#ffffff' stroke-width='4' paint-order='stroke'>5.96 ms</text><text x='318.0' y='350.0' font-size='13' fill='#1f2328' font-weight='400' text-anchor='end'>16,384 jobs · about 120 each · 0.5 µs</text><rect x='330' y='330' width='359.3' height='30' rx='4' fill='#e5534b'/><text x='697.3' y='350.0' font-size='14' fill='#1f2328' font-weight='700' text-anchor='start' stroke='#ffffff' stroke-width='4' paint-order='stroke'>9.80 ms</text><text x='24.0' y='408.0' font-size='14' fill='#57606a' font-weight='400' text-anchor='start'>Too few: cores sit idle. Too many: the cores are busy with overhead. In between, it barely matters.</text>
