<svg xmlns='http://www.w3.org/2000/svg' width='860' height='560' viewBox='0 0 860 560' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Three ways to pay</title><rect x='0.5' y='0.5' width='859' height='559' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' fill='#1f2328' font-weight='bold' text-anchor='start'>Three ways to pay for the night glow</text><text x='24' y='60' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start'>Coral is 20% of ReefLit pixels. 1 cycle on every ReefLit pixel = 0.6 ms. GPU budget 28 ms.</text><rect x='24' y='84' width='258' height='232' rx='10' fill='#fff5f5' stroke='#cf222e' stroke-width='1.5'/><text x='38' y='110' font-size='15' fill='#cf222e' font-weight='bold' text-anchor='start'>A. Always compute</text><text x='38' y='136' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='start'>Pay per pixel</text><text x='38' y='156' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>+2 cycles on every look</text><text x='38' y='176' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>without glow (95%)</text><text x='38' y='216' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start'>Avg 21.9 cycles</text><text x='38' y='236' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start'>Variants: 24</text><text x='38' y='280' font-size='16' fill='#cf222e' font-weight='bold' text-anchor='start'>GPU 28.14 ms ❌</text><text x='38' y='300' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>over budget</text><rect x='301' y='84' width='258' height='232' rx='10' fill='#eef4fb' stroke='#4e79a7' stroke-width='1.5'/><text x='315' y='110' font-size='15' fill='#4e79a7' font-weight='bold' text-anchor='start'>B. Keyword + variant list</text><text x='315' y='136' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='start'>Pay per variant</text><text x='315' y='156' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>0 extra cycles; the build</text><text x='315' y='176' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>must list "coral + glow"</text><text x='315' y='216' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start'>Avg 20 day / 20.4 night</text><text x='315' y='236' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start'>Variants: 28</text><text x='315' y='280' font-size='16' fill='#4e79a7' font-weight='bold' text-anchor='start'>GPU 27.24 ms</text><text x='315' y='300' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>cheapest, if the list is kept right</text><rect x='578' y='84' width='258' height='232' rx='10' fill='#dafbe1' stroke='#1a7f37' stroke-width='1.5'/><text x='592' y='110' font-size='15' fill='#1a7f37' font-weight='bold' text-anchor='start'>C. Uniform branch</text><text x='592' y='136' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='start'>Pay a little per pixel</text><text x='592' y='156' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>+1 cycle check everywhere,</text><text x='592' y='176' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>+2 on coral at night</text><text x='592' y='216' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start'>Avg 21 day / 21.4 night</text><text x='592' y='236' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start'>Variants: 24, none missing</text><text x='592' y='280' font-size='16' fill='#1a7f37' font-weight='bold' text-anchor='start'>GPU 27.84 ms ✅</text><text x='592' y='300' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>at night; 27.6 by day</text><text x='24' y='350' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='start'>Why a uniform branch is cheap: the GPU runs pixels in groups (a warp or wave) that do the same step together</text><text x='24' y='380' font-size='14' fill='#1a7f37' font-weight='bold' text-anchor='start'>Uniform: if (_EmissiveOn)</text><rect x='24' y='392' width='26' height='26' rx='4' fill='#e15759'/><rect x='54' y='392' width='26' height='26' rx='4' fill='#e15759'/><rect x='84' y='392' width='26' height='26' rx='4' fill='#e15759'/><rect x='114' y='392' width='26' height='26' rx='4' fill='#e15759'/><rect x='144' y='392' width='26' height='26' rx='4' fill='#e15759'/><rect x='174' y='392' width='26' height='26' rx='4' fill='#e15759'/><rect x='204' y='392' width='26' height='26' rx='4' fill='#e15759'/><rect x='234' y='392' width='26' height='26' rx='4' fill='#e15759'/><rect x='24' y='422' width='26' height='26' rx='4' fill='#e15759'/><rect x='54' y='422' width='26' height='26' rx='4' fill='#e15759'/><rect x='84' y='422' width='26' height='26' rx='4' fill='#e15759'/><rect x='114' y='422' width='26' height='26' rx='4' fill='#e15759'/><rect x='144' y='422' width='26' height='26' rx='4' fill='#e15759'/><rect x='174' y='422' width='26' height='26' rx='4' fill='#e15759'/><rect x='204' y='422' width='26' height='26' rx='4' fill='#e15759'/><rect x='234' y='422' width='26' height='26' rx='4' fill='#e15759'/><text x='24' y='472' font-size='12' fill='#1f2328' font-weight='normal' text-anchor='start'>Same answer for every pixel of the draw:</text><text x='24' y='490' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>the group runs the glow, or skips it, together.</text><text x='441' y='380' font-size='14' fill='#cf222e' font-weight='bold' text-anchor='start'>Divergent: if (mossMask &gt; 0.5)</text><rect x='441' y='392' width='26' height='26' rx='4' fill='#e15759'/><rect x='471' y='392' width='26' height='26' rx='4' fill='#c9d1d9'/><rect x='501' y='392' width='26' height='26' rx='4' fill='#c9d1d9'/><rect x='531' y='392' width='26' height='26' rx='4' fill='#e15759'/><rect x='561' y='392' width='26' height='26' rx='4' fill='#e15759'/><rect x='591' y='392' width='26' height='26' rx='4' fill='#c9d1d9'/><rect x='621' y='392' width='26' height='26' rx='4' fill='#e15759'/><rect x='651' y='392' width='26' height='26' rx='4' fill='#c9d1d9'/><rect x='441' y='422' width='26' height='26' rx='4' fill='#c9d1d9'/><rect x='471' y='422' width='26' height='26' rx='4' fill='#e15759'/><rect x='501' y='422' width='26' height='26' rx='4' fill='#e15759'/><rect x='531' y='422' width='26' height='26' rx='4' fill='#e15759'/><rect x='561' y='422' width='26' height='26' rx='4' fill='#c9d1d9'/><rect x='591' y='422' width='26' height='26' rx='4' fill='#c9d1d9'/><rect x='621' y='422' width='26' height='26' rx='4' fill='#e15759'/><rect x='651' y='422' width='26' height='26' rx='4' fill='#c9d1d9'/><text x='441' y='472' font-size='12' fill='#1f2328' font-weight='normal' text-anchor='start'>Pixels disagree inside one group:</text><text x='441' y='490' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>it runs BOTH sides and throws half away.</text><rect x='24' y='500' width='14' height='14' rx='3' fill='#e15759'/><text x='44' y='512' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>takes the 'if' side</text><rect x='180' y='500' width='14' height='14' rx='3' fill='#c9d1d9'/><text x='200' y='512' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>takes the other side</text><text x='360' y='512' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>Group of 16 shown; real groups are 16 to 64 pixels.</text></svg>