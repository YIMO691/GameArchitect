<svg xmlns='http://www.w3.org/2000/svg' width='860' height='534' viewBox='0 0 860 534' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Cycles per pixel</title><rect x='0.5' y='0.5' width='859' height='533' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' fill='#1f2328' font-weight='bold' text-anchor='start'>A switched-off feature still costs: cycles per pixel</text><text x='24' y='60' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start'>Each block is one feature's cycles. 1 cycle on every ReefLit pixel = 0.6 ms on the phone.</text><defs><pattern id='h' width='8' height='8' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='8' height='8' fill='#ffffff' opacity='0.0'/><line x1='0' y1='0' x2='0' y2='8' stroke='#ffffff' stroke-width='3'/></pattern></defs><text x='24' y='107' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='start'>ReefLit v1</text><text x='24' y='123' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>every look, every pixel</text><rect x='170' y='90' width='180.0' height='26' fill='#9aa0a6'/><text x='260.0' y='108' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>core 12</text><rect x='350.0' y='90' width='45.0' height='26' fill='#4e79a7' stroke='#ffffff' stroke-width='1'/><rect x='350.0' y='90' width='45.0' height='26' fill='url(#h)' opacity='0.55'/><rect x='395.0' y='90' width='75.0' height='26' fill='#59a14f' stroke='#ffffff' stroke-width='1'/><rect x='395.0' y='90' width='75.0' height='26' fill='url(#h)' opacity='0.55'/><rect x='470.0' y='90' width='60.0' height='26' fill='#edc948' stroke='#ffffff' stroke-width='1'/><rect x='470.0' y='90' width='60.0' height='26' fill='url(#h)' opacity='0.55'/><rect x='530.0' y='90' width='45.0' height='26' fill='#b07aa1' stroke='#ffffff' stroke-width='1'/><rect x='530.0' y='90' width='45.0' height='26' fill='url(#h)' opacity='0.55'/><rect x='575.0' y='90' width='30.0' height='26' fill='#f28e2b' stroke='#ffffff' stroke-width='1'/><rect x='575.0' y='90' width='30.0' height='26' fill='url(#h)' opacity='0.55'/><rect x='605.0' y='90' width='30.0' height='26' fill='#e15759' stroke='#ffffff' stroke-width='1'/><rect x='605.0' y='90' width='30.0' height='26' fill='url(#h)' opacity='0.55'/><rect x='635.0' y='90' width='30.0' height='26' fill='#9c755f' stroke='#ffffff' stroke-width='1'/><rect x='635.0' y='90' width='30.0' height='26' fill='url(#h)' opacity='0.55'/><rect x='665.0' y='90' width='15.0' height='26' fill='#76b7b2' stroke='#ffffff' stroke-width='1'/><rect x='665.0' y='90' width='15.0' height='26' fill='url(#h)' opacity='0.55'/><rect x='680.0' y='90' width='15.0' height='26' fill='#bab0ac' stroke='#ffffff' stroke-width='1'/><rect x='680.0' y='90' width='15.0' height='26' fill='url(#h)' opacity='0.55'/><text x='705.0' y='108' font-size='14' fill='#cf222e' font-weight='bold' text-anchor='start'>35 cycles</text><rect x='170' y='126' width='12' height='12' fill='#4e79a7'/><text x='186' y='136' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>CAUSTICS 3</text><rect x='276.0' y='126' width='12' height='12' fill='#59a14f'/><text x='292.0' y='136' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>MOSS 5</text><rect x='351.6' y='126' width='12' height='12' fill='#edc948'/><text x='367.6' y='136' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>SPARKLE 4</text><rect x='450.0' y='126' width='12' height='12' fill='#b07aa1'/><text x='466.0' y='136' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>DETAIL 3</text><rect x='540.8' y='126' width='12' height='12' fill='#f28e2b'/><text x='556.8' y='136' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>RIM 2</text><rect x='608.8' y='126' width='12' height='12' fill='#e15759'/><text x='624.8' y='136' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>EMISSIVE 2</text><rect x='714.8' y='126' 