e='13' fill='#1f2328' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>P</text><text x='584' y='96' font-size='16' fill='#1f2328' font-weight='700' text-anchor='start'>Forward+ (tiles)</text><clipPath id='cp584'><rect x='584' y='110' width='250' height='150' rx='8'/></clipPath><rect x='584.0' y='110.0' width='250.0' height='150.0' rx='8' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><rect x='584.0' y='180.0' width='250.0' height='80.0' rx='0' fill='#e8e2d4' stroke='none' stroke-width='1' opacity='1'/><text x='826' y='252' font-size='11' fill='#57606a' font-weight='400' text-anchor='end'>road (one mesh)</text><g clip-path='url(#cp584)'><circle cx='604.0' cy='150.0' r='46.0' fill='#fff1c2' stroke='none' stroke-width='1' opacity='0.35'/><circle cx='634.0' cy='150.0' r='46.0' fill='#fff1c2' stroke='none' stroke-width='1' opacity='0.35'/><circle cx='664.0' cy='150.0' r='46.0' fill='#fff1c2' stroke='none' stroke-width='1' opacity='0.35'/><circle cx='694.0' cy='150.0' r='46.0' fill='#fff1c2' stroke='none' stroke-width='1' opacity='0.35'/><circle cx='724.0' cy='150.0' r='46.0' fill='#fff1c2' stroke='none' stroke-width='1' opacity='0.35'/><circle cx='754.0' cy='150.0' r='46.0' fill='#fff1c2' stroke='none' stroke-width='1' opacity='0.35'/><circle cx='784.0' cy='150.0' r='46.0' fill='#fff1c2' stroke='none' stroke-width='1' opacity='0.35'/><circle cx='814.0' cy='150.0' r='46.0' fill='#fff1c2' stroke='none' stroke-width='1' opacity='0.35'/></g><circle cx='604.0' cy='150.0' r='7.0' fill='#d4a72c' stroke='#ffffff' stroke-width='1.5' opacity='1'/><circle cx='634.0' cy='150.0' r='7.0' fill='#d4a72c' stroke='#ffffff' stroke-width='1.5' opacity='1'/><circle cx='664.0' cy='150.0' r='7.0' fill='#d4a72c' stroke='#ffffff' stroke-width='1.5' opacity='1'/><circle cx='694.0' cy='150.0' r='7.0' fill='#d4a72c' stroke='#ffffff' stroke-width='1.5' opacity='1'/><circle cx='724.0' cy='150.0' r='7.0' fill='#d4a72c' stroke='#ffffff' stroke-width='1.5' opacity='1'/><circle cx='754.0' cy='150.0' r='7.0' fill='#d4a72c' stroke='#ffffff' stroke-width='1.5' opacity='1'/><circle cx='784.0' cy='150.0' r='7.0' fill='#d4a72c' stroke='#ffffff' stroke-width='1.5' opacity='1'/><circle cx='814.0' cy='150.0' r='7.0' fill='#d4a72c' stroke='#ffffff' stroke-width='1.5' opacity='1'/><line x1='584' y1='110' x2='584' y2='260' stroke='#b07aa1' stroke-width='1' opacity='0.6'/><line x1='634' y1='110' x2='634' y2='260' stroke='#b07aa1' stroke-width='1' opacity='0.6'/><line x1='684' y1='110' x2='684' y2='260' stroke='#b07aa1' stroke-width='1' opacity='0.6'/><line x1='734' y1='110' x2='734' y2='260' stroke='#b07aa1' stroke-width='1' opacity='0.6'/><line x1='784' y1='110' x2='784' y2='260' stroke='#b07aa1' stroke-width='1' opacity='0.6'/><line x1='834' y1='110' x2='834' y2='260' stroke='#b07aa1' stroke-width='1' opacity='0.6'/><line x1='584' y1='110' x2='834' y2='110' stroke='#b07aa1' stroke-width='1' opacity='0.6'/><line x1='584' y1='160' x2='834' y2='160' stroke='#b07aa1' stroke-width='1' opacity='0.6'/><line x1='584' y1='210' x2='834' y2='210' stroke='#b07aa1' stroke-width='1' opacity='0.6'/><line x1='584' y1='260' x2='834' y2='260' stroke='#b07aa1' stroke-width='1' opacity='0.6'/><rect x='584.0' y='160.0' width='50.0' height='50.0' rx='0' fill='#b07aa1' stroke='none' stroke-width='1' opacity='0.18'/><line x1='618' y1='202' x2='604' y2='150' stroke='#1a7f37' stroke-width='2'/><line x1='618' y1='202' x2='634' y2='150' stroke='#1a7f37' stroke-width='2'/><circle cx='618.0' cy='202.0' r='6.0' fill='#1f2328' stroke='#ffffff' stroke-width='2' opacity='1'/><text x='628' y='206' font-size='13' fill='#1f2328' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>P</text><text x='24' y='288' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='start'>The road gets ONE list: the 4 lanterns</text><text x='24' y='307' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='start'>nearest its middle (blue).</text><text x='24' y='326' font-size='12.5' fill='#57606a' font-weight='400' text-anchor='start'>P evaluates those 4. The lantern right</text><text x='24' y='345' font-size='12.5' fill='#cf222e' font-weight='600' text-anchor='start'>above P is not on the list (red): missing.</text><text x='24' y='364' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>Street: 3 evaluated per pixel,</text><text x='24' y='383' font-size='12.5' fill='#cf222e' font-weight='700' text-anchor='start'>62% of the light missing.</text><text x='304' y='288' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='start'>Each lantern draws a sphere; only pixels</text><text x='304' y='307' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='start'>inside it are lit. P gets exactly 1.</text><text x='304' y='326' font-size='12.5' fill='#57606a' font-weight='400' text-anchor='start'>First, every pixel writes 20 bytes</text><text x='304' y='345' font-size='12.5' fill='#57606a' font-weight='400' text-anchor='start'>of material into the G-buffer.</text><text x='304' y='364' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>Street: 1.1 per pixel, 0% missing,</text><text x='304' y='383' font-size='12.5' fill='#f28e2b' font-weight='700' text-anchor='start'>22 MB G-buffer to write and read.</text><text x='584' y='288' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='start'>The screen is cut into 40 px tiles;</text><text x='584' y='307' font-size='12.5' fill='#1f2328' font-weight='600' text-anchor='start'>each tile has its own list.</text><text x='584' y='326' font-size='12.5' fill='#57606a' font-weight='400' text-anchor='start'>P’s tile (purple) lists 2 lanterns.</text><text x='584' y='345' font-size='12.5' fill='#57606a' font-weight='400' text-anchor='start'>No G-buffer, water lit too.</text><text x='584' y='364' font-size='12.5' fill='#1f2328' font-weight='400' text-anchor='start'>Street: 2.01 per pixel, 0% missing,</text><text x='584' y='383' font-size='12.5' fill='#1a7f37' font-weight='700' text-anchor='start'>GPU 19.02 ms.</text></svg>