<svg xmlns='http://www.w3.org/2000/svg' width='860' height='420' viewBox='0 0 860 420' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>How three renderers choose lights for one pixel</title><rect x='0.5' y='0.5' width='859' height='419' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>How three renderers choose lights for one pixel</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>The same street, the same pixel P at the left edge of the road. Who decides which lanterns P pays for?</text><text x='24' y='96' font-size='16' fill='#1f2328' font-weight='700' text-anchor='start'>Forward, limit 4</text><clipPath id='cp24'><rect x='24' y='110' width='250' height='150' rx='8'/></clipPath><rect x='24.0' y='110.0' width='250.0' height='150.0' rx='8' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' opacity='1'/><rect x='24.0' y='180.0' width='250.0' height='80.0' rx='0' fill='#e8e2d4' stroke='none' stroke-width='1' opacity='1'/><text x='266' y='252' font-size='11' fill='#57606a' font-weight='400' text-anchor='end'>road (one mesh)</text><g clip-path='url(#cp24)'><circle cx='44.0' cy='150.0' r='46.0' fill='#fff1c2' stroke='none' stroke-width='1' opacity='0.35'/><circle cx='74.0' cy='150.0' r='46.0' fill='#fff1c2' stroke='none' stroke-width='1' opacity='0.35'/><circle cx='104.0' cy='150.0' r='46.0' fill='#fff1c2' stroke='none' stroke-width='1' opacity='0.35'/><circle cx='134.0' cy='150.0' r='46.0' fill='#fff1c2' stroke='none' stroke-width='1' opacity='0.35'/><circle cx='164.0' cy='150.0' r='46.0' fill='#fff1c2' stroke='none' stroke-width='1' opacity='0.35'/><circle cx='194.0' cy='150.0' r='46.0' fill='#fff1c2' stroke='none' stroke-width='1' opacity='0.35'/><circle cx='224.0' cy='150.0' r='46.0' fill='#fff1c2' stroke='none' stroke-width='1' opacity='0.35'/><circle cx='254.0' cy='150.0' r='46.0' fill='#fff1c2' stroke='none' stroke-width='1' opacity='0.35'/></g><circle