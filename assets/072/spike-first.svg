<svg xmlns='http://www.w3.org/2000/svg' width='860' height='420' viewBox='0 0 860 420' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Spike first, then promise</title><rect x='0.5' y='0.5' width='859' height='419' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Spike first, then promise</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>One week of experiments narrows the two unknowns before the date is promised.</text><text x='24' y='110' font-size='12.5' fill='#cf222e' font-weight='700' text-anchor='start'>Determinism, before</text><text x='24' y='136' font-size='12.5' fill='#1a7f37' font-weight='700' text-anchor='start'>Determinism, after spike</text><line x1='275.0' y1='106' x2='590.0' y2='106' stroke='#cf222e' stroke-width='3'/><line x1='275.0' y1='99' x2='275.0' y2='113' stroke='#cf222e' stroke-width='3'/><line x1='590.0' y1='99' x2='590.0' y2='113' stroke='#cf222e' stroke-width='3'/><circle cx='310.0' cy='106' r='5' fill='#1f2328'/><text x='598.0' y='110' font-size='12' fill='#cf222e' font-weight='700' text-anchor='start'>1–10</text><line x1='310.0' y1='132' x2='380.0' y2='132' stroke='#1a7f37' stroke-width='3'/><line x1='310.0' y1='125' x2='310.0' y2='139' stroke='#1a7f37' stroke-width='3'/><line x1='380.0' y1='125' x2='380.0' y2='139' stroke='#1a7f37' stroke-width='3'/><circle cx='345.0' cy='132' r='5' fill='#1f2328'/><text x='388.0' y='136' font-size='12' fill='#1a7f37' font-weight='700' text-anchor='start'>2–4</text><text x='24' y='180' font-size='12.5' fill='#cf222e' font-weight='700' text-anchor='start'>Cert rules, before</text><text x='24' y='206' font-size='12.5' fill='#1a7f37' font-weight='700' text-anchor='start'>Cert rules, after spike</text><line x1='257.5' y1='176' x2='450.0' y2='176' stroke='#cf222e' stroke-width='3'/><line x1='257.5' y1='169' x2='257.5' y2='183' stroke='#cf222e' stroke-width='3'/><line x1='450.0' y1='169' x2='450.0' y2='183' stroke='#cf222e' stroke-width='3'/><circle cx='275.0' cy='176' r='5' fill='#1f2328'/><text x='458.0' y='180' font-size='12' fill='#cf222e' font-weight='700' text-anchor='start'>0.5–6</text><line x1='275.0' y1='202' x2='345.0' y2='202' stroke='#1a7f37' stroke-width='3'/><line x1='275.0' y1='195' x2='275.0' y2='209' stroke='#1a7f37' stroke-width='3'/><line x1='345.0' y1='195' x2='345.0' y2='209' stroke='#1a7f37' stroke-width='3'/><circle cx='310.0' cy='202' r='5' fill='#1f2328'/><text x='353.0' y='206' font-size='12' fill='#1a7f37' font-weight='700' text-anchor='start'>1–3</text><line x1='24' y1='236' x2='836' y2='236' stroke='#eaeef2'/><text x='24' y='270' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start'>Whole feature, no spike</text><rect x='516.5' y='256.0' width='164.5' height='22.0' rx='4' fill='#cf222e' stroke='none' stroke-width='1' opacity='0.22'/><line x1='653.0' y1='252' x2='653.0' y2='282' stroke='#f28e2b' stroke-width='3'/><line x1='765.0' y1='252' x2='765.0' y2='282' stroke='#cf222e' stroke-width='3' stroke-dasharray='5 3'/><text x='647.0' y='298' font-size='12' fill='#f28e2b' font-weight='700' text-anchor='end'>promised 11.8</text><text x='771.0' y='298' font-size='12' fill='#cf222e' font-weight='700' text-anchor='start'>delivered 15</text><text x='24' y='336' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='start'>Whole feature, spike first</text><rect x='600.5' y='322.0' width='70.0' height='22.0' rx='4' fill='#1a7f37' stroke='none' stroke-width='1' opacity='0.22'/><line x1='660.0' y1='318' x2='660.0' y2='348' stroke='#f28e2b' stroke-width='3'/><line x1='625.0' y1='318' x2='625.0' y2='348' stroke='#1a7f37' stroke-width='3' stroke-dasharray='5 3'/><text x='666.0' y='364' font-size='12' fill='#f28e2b' font-weight='700' text-anchor='start'>promised 12.0</text><text x='619.0' y='364' font-size='12' fill='#1a7f37' font-weight='700' text-anchor='end'>delivered 11</text><text x='240.0' y='388' font-size='11.5' f