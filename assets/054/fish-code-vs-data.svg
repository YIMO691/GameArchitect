<svg xmlns='http://www.w3.org/2000/svg' width='860' height='432' viewBox='0 0 860 432' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>A new fish: code or data?</title><rect x='0.5' y='0.5' width='859' height='431' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>A new fish: code or data?</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>A designer wants a new fish: the Moon Trout. Two ways it can reach the game.</text><text x='24' y='100' font-size='15' fill='#cf222e' font-weight='700' text-anchor='start'>❌ Fish as code</text><rect x='24.0' y='114.0' width='150.0' height='58.0' rx='8' fill='#ffffff' stroke='#d0d7de' stroke-width='1.5' opacity='1'/><text x='99.0' y='138' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='middle'>Designer: ticket</text><text x='99.0' y='158' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='middle'>waits a day</text><line x1='176' y1='143' x2='178.0' y2='143.0' stroke='#9aa0a6' stroke-width='2'/><polygon points='188,143 178.0,137.0 178.0,149.0' fill='#9aa0a6'/><rect x='190.0' y='114.0' width='150.0' height='58.0' rx='8' fill='#ffffff' stroke='#d0d7de' stroke-width='1.5' opacity='1'/><text x='265.0' y='138' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='middle'>Programmer</text><text x='265.0' y='158' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='middle'>adds enum + case</text><line x1='342' y1='143' x2='344.0' y2='143.0' stroke='#9aa0a6' stroke-width='2'/><polygon points='354,143 344.0,137.0 344.0,149.0' fill='#9aa0a6'/><rect x='356.0' y='114.0' width='150.0' height='58.0' rx='8' fill='#ffffff' stroke='#d0d7de' stroke-width='1.5' opacity='1'/><text x='431.0' y='138' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='middle'>Code review</text><text x='431.0' y='158' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='middle'>and a build</text><line x1='508' y1='143' x2='510.0' y2='143.0' stroke='#9aa0a6' stroke-width='2'/><polygon points='520,143 510.0,137.0 510.0,149.0' fill='#9aa0a6'/><rect x='522.0' y='114.0' width='150.0' height='58.0' rx='8' fill='#ffffff' stroke='#d0d7de' stroke-width='1.5' opacity='1'/><text x='597.0' y='138' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='middle'>Designer tests</text><text x='597.0' y='158' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='middle'>finds a typo</text><line x1='674' y1='143' x2='676.0' y2='143.0' stroke='#9aa0a6' stroke-width='2'/><polygon points='686,143 676.0,137.0 676.0,149.0' fill='#9aa0a6'/><rect x='688.0' y='114.0' width='150.0' height='58.0' rx='8' fill='#ffffff' stroke='#d0d7de' stroke-width='1.5' opacity='1'/><text x='763.0' y='138' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='middle'>…back to step 1</text><text x='763.0' y='158' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='middle'></text><text x='24' y='198' font-size='13' fill='#cf222e' font-weight='700' text-anchor='start'>6 fish a week: designers wait 12 h, programmers spend 9 h.</text><text x='24' y='240' font-size='15' fill='#1a7f37' font-weight='700' text-anchor='start'>✅ Fish as data</text><rect x='24.0' y='254.0' width='150.0' height='58.0' rx='8' fill='#ffffff' stroke='#d0d7de' stroke-width='1.5' opacity='1'/><text x='99.0' y='278' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='middle'>Designer</text><text x='99.0' y='298' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='middle'>new FishData asset</text><line x1='176' y1='283' x2='178.0' y2='283.0' stroke='#9aa0a6' stroke-width='2'/><polygon points='188,283 178.0,277.0 178.0,289.0' fill='#9aa0a6'/><rect x='190.0' y='254.0' width='150.0' height='58.0' rx='8' fill='#ffffff' stroke='#d0d7de' stroke-width='1.5' opacity='1'/><text x='265.0' y='278' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='middle'>Inspector</text><text x='265.0' y='298' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='middle'>fills in fields</text><line x1='342' y1='283' x2='344.0' y2='283.0' stroke='#9aa0a6' stroke-width='2'/><polygon points='354,283 344.0,277.0 344.0,289.0' fill='#9aa0a6'/><rect x='356.0' y='254.0' width='150.0' height='58.0' rx='8' fill='#ffffff' stroke='#d0d7de' stroke-width='1.5' opacity='1'/><text x='431.0' y='278' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='middle'>Validator</text><text x='431.0' y='298' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='middle'>on save: 0.2 s</text><line x1='508' y1='283' x2='510.0' y2='283.0' stroke='#9aa0a6' stroke-width='2'/><polygon points='520,283 510.0,277.0 510.0,289.0' fill='#9aa0a6'/><rect x='522.0' y='254.0' width='150.0' height='58.0' rx='8' fill='#ffffff' stroke='#d0d7de' stroke-width='1.5' opacity='1'/><text x='597.0' y='278' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='middle'>Play in editor</text><text x='597.0' y='298' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='middle'>at once</text><line x1='674' y1='283' x2='676.0' y2='283.0' stroke='#9aa0a6' stroke-width='2'/><polygon points='686,283 676.0,277.0 676.0,289.0' fill='#9aa0a6'/><rect x='688.0' y='254.0' width='150.0' height='58.0' rx='8' fill='#ffffff' stroke='#d0d7de' stroke-width='1.5' opacity='1'/><text x='763.0' y='278' font-size='12.5' fill='#1f2328' font-weight='700' text-anchor='middle'>CI checks again</text><text x='763.0' y='298' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='middle'>every commit</text><text x='24' y='338' font-size='13' fill='#1a7f37' font-weight='700' text-anchor='start'>0 programmer hours. Typos caught on save: 20 bugs a week → 1.</text><rect x='24.0' y='368.0' width='812.0' height='44.0' rx='8' fill='#fff8e6' stroke='#d4a72c' stroke-width='1.5' opacity='1'/><text x='40' y='395' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>Code defines what a fish CAN be (fields, rules). Data says what each fish IS. Validators guard the border.</text></svg>