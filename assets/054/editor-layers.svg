<svg xmlns='http://www.w3.org/2000/svg' width='860' height='456' viewBox='0 0 860 456' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Editor tool architecture</title><rect x='0.5' y='0.5' width='859' height='455' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Editor tool architecture</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Editor tools as layers. Every change goes through commands, so undo, validation and saving work everywhere.</text><rect x='24.0' y='90.0' width='250.0' height='60.0' rx='8' fill='#ffffff' stroke='#4e79a7' stroke-width='1.8' opacity='1'/><text x='149.0' y='114' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='middle'>Inspector</text><text x='149.0' y='134' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='middle'>fields of a FishData</text><rect x='305.0' y='90.0' width='250.0' height='60.0' rx='8' fill='#ffffff' stroke='#4e79a7' stroke-width='1.8' opacity='1'/><text x='430.0' y='114' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='middle'>Lake view + brushes</text><text x='430.0' y='134' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='middle'>paint spots, move rocks</text><rect x='586.0' y='90.0' width='250.0' height='60.0' rx='8' fill='#ffffff' stroke='#4e79a7' stroke-width='1.8' opacity='1'/><text x='711.0' y='114' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='middle'>Spot generator</text><text x='711.0' y='134' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='middle'>rules: depth, weeds, shore</text><rect x='24.0' y='190.0' width='812.0' height='60.0' rx='8' fill='#f6eef5' stroke='#b07aa1' stroke-width='1.8' opacity='1'/><text x='430.0' y='214' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='middle'>Commands: "set price", "paint spots", "regenerate area"</text><text x='430.0' y='234' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='middle'>each one can be undone and redone; tools never edit data directly</text><rect x='24.0' y='290.0' width='395.0' height='60.0' rx='8' fill='#dafbe1' stroke='#59a14f' stroke-width='1.8' opacity='1'/><text x='221.5' y='314' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='middle'>Data model: assets on disk</text><text x='221.5' y='334' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='middle'>FishData, LakeRegion, SpotSet (text, diff-friendly)</text><rect x='441.0' y='290.0' width='395.0' height='60.0' rx='8' fill='#fff8e6' stroke='#f28e2b' stroke-width='1.8' opacity='1'/><text x='638.5' y='314' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='middle'>Validators</text><text x='638.5' y='334' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='middle'>on save, on commit, in CI (Lesson 046)</text><line x1='149' y1='152' x2='149.0' y2='178.0' stroke='#9aa0a6' stroke-width='2'/><polygon points='149,188 155.0,178.0 143.0,178.0' fill='#9aa0a6'/><line x1='430' y1='152' x2='430.0' y2='178.0' stroke='#9aa0a6' stroke-width='2'/><polygon points='430,188 436.0,178.0 424.0,178.0' fill='#9aa0a6'/><line x1='711' y1='152' x2='711.0' y2='178.0' stroke='#9aa0a6' stroke-width='2'/><polygon points='711,188 717.0,178.0 705.0,178.0' fill='#9aa0a6'/><line x1='221' y1='252' x2='221.0' y2='278.0' stroke='#9aa0a6' stroke-width='2'/><polygon points='221,288 227.0,278.0 215.0,278.0' fill='#9aa0a6'/><line x1='638' y1='252' x2='638.0' y2='278.0' stroke='#9aa0a6' stroke-width='2'/><polygon points='638,288 644.0,278.0 632.0,278.0' fill='#9aa0a6'/><rect x='24.0' y='380.0' width='812.0' height='54.0' rx='8' fill='#ffffff' stroke='#1f2328' stroke-width='1.8' opacity='1'/><text x='430.0' y='404' font-size='13.5' fill='#1f2328' font-weight='700' text-anchor='middle'>Loading: one region in full, cached previews for the rest</text><text x='430.0' y='424' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='middle'>40 s → 3 s per open; 12 opens a day × 5 designers</text></svg>