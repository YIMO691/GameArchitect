<svg xmlns='http://www.w3.org/2000/svg' width='880' height='470' viewBox='0 0 880 470' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Memory hierarchy and our data sizes</title><rect x='0.5' y='0.5' width='879' height='469' fill='#ffffff' stroke='#d0d7de' stroke-width='1' rx='14' /><text x='24' y='36' font-size='20' fill='#1f2328' font-weight='bold' text-anchor='start'>Where the data lives: size and distance</text><text x='24' y='58' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>Mid-range gaming laptop, approximate. Desk analogy from Lesson 001: pretend 1 ns = 1 second.</text><rect x='24' y='82' width='120' height='46' fill='#1a7f37' stroke='none' stroke-width='1' rx='6' /><text x='36' y='111' font-size='15' fill='#ffffff' font-weight='bold' text-anchor='start'>L1 cache</text><text x='460' y='102' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start'>48 KB per core</text><text x='460' y='120' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>size</text><text x='600' y='102' font-size='14' fill='#1a7f37' font-weight='bold' text-anchor='start'>~1 ns</text><text x='600' y='120' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>to fetch</text><text x='690' y='102' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start'>a note on your desk</text><rect x='24' y='140' width='200' height='46' fill='#59a14f' stroke='none' stroke-width='1' rx='6' /><text x='36' y='169' font-size='15' fill='#ffffff' font-weight='bold' text-anchor='start'>L2 cache</text><text x='460' y='160' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start'>1.25 MB per core</text><text x='460' y='178' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>size</text><text x='600' y='160' font-size='14' fill='#59a14f' font-weight='bold' text-anchor='start'>~4 ns</text><text x='600' y='178' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>to fetch</text><text x='690' y='160' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start'>in your desk drawer</text><rect x='24' y='198' width='300' height='46' fill='#4e79a7' stroke='none' stroke-width='1' rx='6' /><text x='36' y='227' font-size='15' fill='#ffffff' font-weight='bold' text-anchor='start'>L3 cache</text><text x='460' y='218' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start'>8 MB, shared</text><text x='460' y='236' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>size</text><text x='600' y='218' font-size='14' fill='#4e79a7' font-weight='bold' text-anchor='start'>~15 ns</text><text x='600' y='236' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>to fetch</text><text x='690' y='218' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start'>on the shelf across the room</text><rect x='24' y='256' width='420' height='46' fill='#e5534b' stroke='none' stroke-width='1' rx='6' /><text x='36' y='285' font-size='15' fill='#ffffff' font-weight='bold' text-anchor='start'>RAM</text><text x='460' y='276' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start'>16 GB</text><text x='460' y='294' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>size</text><text x='600' y='276' font-size='14' fill='#cf222e' font-weight='bold' text-anchor='start'>~100 ns</text><text x='600' y='294' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>to fetch</text><text x='690' y='276' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start'>walk to the library and back</text><line x1='24' y1='322' x2='856' y2='322' stroke='#d0d7de' stroke-width='1' /><text x='24' y='346' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='start'>Our particle data, compared with the caches</text><rect x='24' y='360' width='56.25' height='26' fill='none' stroke='#1a7f37' stroke-width='2' rx='4' stroke-dasharray='5 4'/><rect x='24' y='360' width='28.8' height='26' fill='#dafbe1' stroke='none' stroke-width='1' rx='4' /><text x='90.25' y='378' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='start'>Test scene: 20,000 × 32 B = 640 KB</text><text x='24' y='404' font-size='12' fill='#1a7f37' font-weight='normal' text-anchor='start'>Fits inside L2 (1.25 MB, dashed). Jumping around is cheap.</text><rect x='24' y='412' width='360' height='26' fill='none' stroke='#4e79a7' stroke-width='2' rx='4' stroke-dasharray='5 4'/><rect x='24' y='412' width='560' height='26' fill='#e5534b' stroke='none' stroke-width='1' rx='4' /><text x='594' y='430' font-size='13' fill='#1f2328' font-weight='bold' text-anchor='start'></text><text x='24' y='456' font-size='12' fill='#cf222e' font-weight='normal' text-anchor='start'>Level: 500,000 × 32 B = 16 MB. Twice the L3 (8 MB, dashed). Shuffled reads go to RAM.</text><text x='378' y='430' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='end'>L3 = 8 MB</text><text x='578' y='430' font-size='13' fill='#ffffff' font-weight='bold' text-anchor='end'>16 MB</text></svg>