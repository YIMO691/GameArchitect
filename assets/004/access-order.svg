<svg xmlns='http://www.w3.org/2000/svg' width='880' height='420' viewBox='0 0 880 420' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Reading memory in order versus shuffled</title><rect x='0.5' y='0.5' width='879' height='419' fill='#ffffff' stroke='#d0d7de' stroke-width='1' rx='14' /><text x='24' y='36' font-size='20' fill='#1f2328' font-weight='bold' text-anchor='start'>Same particles, two reading orders</text><text x='24' y='58' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>Each box is one 64-byte cache line holding 2 particles (32 bytes each). Number = when the loop reads it (K = thousand).</text><text x='24' y='98' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='start'>Fresh level: the loop reads slot 0, 1, 2, 3 … (free list not yet scrambled)</text><rect x='24' y='110' width='96' height='40' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' rx='4' /><line x1='72' y1='110' x2='72' y2='150' stroke='#d0d7de' stroke-width='1' /><rect x='126' y='110' width='96' height='40' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' rx='4' /><line x1='174' y1='110' x2='174' y2='150' stroke='#d0d7de' stroke-width='1' /><rect x='228' y='110' width='96' height='40' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' rx='4' /><line x1='276' y1='110' x2='276' y2='150' stroke='#d0d7de' stroke-width='1' /><rect x='330' y='110' width='96' height='40' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' rx='4' /><line x1='378' y1='110' x2='378' y2='150' stroke='#d0d7de' stroke-width='1' /><rect x='432' y='110' width='96' height='40' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' rx='4' /><line x1='480' y1='110' x2='480' y2='150' stroke='#d0d7de' stroke-width='1' /><rect x='534' y='110' width='96' height='40' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' rx='4' /><line x1='582' y1='110' x2='582' y2='150' stroke='#d0d7de' stroke-width='1' /><rect x='636' y='110' width='96' height='40' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' rx='4' /><line x1='684' y1='110' x2='684' y2='150' stroke='#d0d7de' stroke-width='1' /><rect x='738' y='110' width='96' height='40' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' rx='4' /><line x1='786' y1='110' x2='786' y2='150' stroke='#d0d7de' stroke-width='1' /><text x='48.0' y='136' font-size='14' fill='#1a7f37' font-weight='bold' text-anchor='middle'>1</text><text x='96.0' y='136' font-size='14' fill='#1a7f37' font-weight='bold' text-anchor='middle'>2</text><text x='150.0' y='136' font-size='14' fill='#1a7f37' font-weight='bold' text-anchor='middle'>3</text><text x='198.0' y='136' font-size='14' fill='#1a7f37' font-weight='bold' text-anchor='middle'>4</text><text x='252.0' y='136' font-size='14' fill='#1a7f37' font-weight='bold' text-anchor='middle'>5</text><text x='300.0' y='136' font-size='14' fill='#1a7f37' font-weight='bold' text-anchor='middle'>6</text><text x='354.0' y='136' font-size='14' fill='#1a7f37' font-weight='bold' text-anchor='middle'>7</text><text x='402.0' y='136' font-size='14' fill='#1a7f37' font-weight='bold' text-anchor='middle'>8</text><text x='456.0' y='136' font-size='14' fill='#1a7f37' font-weight='bold' text-anchor='middle'>9</text><text x='504.0' y='136' font-size='14' fill='#1a7f37' font-weight='bold' text-anchor='middle'>10</text><text x='558.0' y='136' font-size='14' fill='#1a7f37' font-weight='bold' text-anchor='middle'>11</text><text x='606.0' y='136' font-size='14' fill='#1a7f37' font-weight='bold' text-anchor='middle'>12</text><text x='660.0' y='136' font-size='14' fill='#1a7f37' font-weight='bold' text-anchor='middle'>13</text><text x='708.0' y='136' font-size='14' fill='#1a7f37' font-weight='bold' text-anchor='middle'>14</text><text x='762.0' y='136' font-size='14' fill='#1a7f37' font-weight='bold' text-anchor='middle'>15</text><text x='810.0' y='136' font-size='14' fill='#1a7f37' font-weight='bold' text-anchor='middle'>16</text><text x='24' y='174' font-size='13' fill='#1a7f37' font-weight='normal' text-anchor='start'>1 trip to memory brings 2 particles, and the prefetcher fetches the next lines early. ≈ 3.2 ns per particle.</text><text x='24' y='238' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='start'>After 3 seconds: the reads come in a scrambled order</text><rect x='24' y='250' width='96' height='40' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' rx='4' /><line x1='72' y1='250' x2='72' y2='290' stroke='#d0d7de' stroke-width='1' /><rect x='126' y='250' width='96' height='40' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' rx='4' /><line x1='174' y1='250' x2='174' y2='290' stroke='#d0d7de' stroke-width='1' /><rect x='228' y='250' width='96' height='40' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' rx='4' /><line x1='276' y1='250' x2='276' y2='290' stroke='#d0d7de' stroke-width='1' /><rect x='330' y='250' width='96' height='40' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' rx='4' /><line x1='378' y1='250' x2='378' y2='290' stroke='#d0d7de' stroke-width='1' /><rect x='432' y='250' width='96' height='40' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' rx='4' /><line x1='480' y1='250' x2='480' y2='290' stroke='#d0d7de' stroke-width='1' /><rect x='534' y='250' width='96' height='40' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' rx='4' /><line x1='582' y1='250' x2='582' y2='290' stroke='#d0d7de' stroke-width='1' /><rect x='636' y='250' width='96' height='40' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' rx='4' /><line x1='684' y1='250' x2='684' y2='290' stroke='#d0d7de' stroke-width='1' /><rect x='738' y='250' width='96' height='40' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1' rx='4' /><line x1='786' y1='250' x2='786' y2='290' stroke='#d0d7de' stroke-width='1' /><text x='48.0' y='276' font-size='14' fill='#cf222e' font-weight='bold' text-anchor='middle'>212K</text><text x='96.0' y='276' font-size='14' fill='#cf222e' font-weight='bold' text-anchor='middle'>88K</text><text x='150.0' y='276' font-size='14' fill='#cf222e' font-weight='bold' text-anchor='middle'>402K</text><text x='198.0' y='276' font-size='14' fill='#cf222e' font-weight='bold' text-anchor='middle'>7K</text><text x='252.0' y='276' font-size='14' fill='#cf222e' font-weight='bold' text-anchor='middle'>356K</text><text x='300.0' y='276' font-size='14' fill='#cf222e' font-weight='bold' text-anchor='middle'>140K</text><text x='354.0' y='276' font-size='14' fill='#cf222e' font-weight='bold' text-anchor='middle'>25K</text><text x='402.0' y='276' font-size='14' fill='#cf222e' font-weight='bold' text-anchor='middle'>470K</text><text x='456.0' y='276' font-size='14' fill='#cf222e' font-weight='bold' text-anchor='middle'>302K</text><text x='504.0' y='276' font-size='14' fill='#cf222e' font-weight='bold' text-anchor='middle'>12K</text><text x='558.0' y='276' font-size='14' fill='#cf222e' font-weight='bold' text-anchor='middle'>198K</text><text x='606.0' y='276' font-size='14' fill='#cf222e' font-weight='bold' text-anchor='middle'>445K</text><text x='660.0' y='276' font-size='14' fill='#cf222e' font-weight='bold' text-anchor='middle'>63K</text><text x='708.0' y='276' font-size='14' fill='#cf222e' font-weight='bold' text-anchor='middle'>282K</text><text x='762.0' y='276' font-size='14' fill='#cf222e' font-weight='bold' text-anchor='middle'>4K</text><text x='810.0' y='276' font-size='14' fill='#cf222e' font-weight='bold' text-anchor='middle'>377K</text><text x='24' y='314' font-size='13' fill='#cf222e' font-weight='normal' text-anchor='start'>Neighbours are read hundreds of thousands of reads apart. Each read jumps about 5 MB on average.</text><text x='24' y='378' font-size='13' fill='#1f2328' font-weight='normal' text-anchor='start'>Almost every read is a trip to RAM (~100 ns). The CPU can wait for about 5 at once:</text><text x='24' y='400' font-size='13' fill='#cf222e' font-weight='bold' text-anchor='start'>500,000 reads × 100 ns ÷ 5 ≈ 10 ms per frame, instead of 1.6 ms. Same work, 6× the time.</text></svg>