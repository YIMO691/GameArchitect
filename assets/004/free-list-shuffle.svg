<svg xmlns='http://www.w3.org/2000/svg' width='880' height='440' viewBox='0 0 880 440' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Free list scrambling the alive order</title><rect x='0.5' y='0.5' width='879' height='439' fill='#ffffff' stroke='#d0d7de' stroke-width='1' rx='14' /><text x='24' y='36' font-size='20' fill='#1f2328' font-weight='bold' text-anchor='start'>How a free list scrambles the order, one death at a time</text><text x='24' y='58' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>8 slots instead of 500,000. The alive list is the order the update loop reads. Like a cinema where people</text><text x='24' y='76' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>leave and new people take the empty seat, but join the END of the queue for popcorn.</text><text x='24' y='124' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start'>Level loads</text><rect x='230' y='100' width='40' height='36' fill='#dafbe1' stroke='#1a7f37' stroke-width='1' rx='5' /><text x='250' y='124' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='middle'>0</text><rect x='276' y='100' width='40' height='36' fill='#dafbe1' stroke='#1a7f37' stroke-width='1' rx='5' /><text x='296' y='124' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='middle'>1</text><rect x='322' y='100' width='40' height='36' fill='#dafbe1' stroke='#1a7f37' stroke-width='1' rx='5' /><text x='342' y='124' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='middle'>2</text><rect x='368' y='100' width='40' height='36' fill='#dafbe1' stroke='#1a7f37' stroke-width='1' rx='5' /><text x='388' y='124' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='middle'>3</text><rect x='414' y='100' width='40' height='36' fill='#dafbe1' stroke='#1a7f37' stroke-width='1' rx='5' /><text x='434' y='124' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='middle'>4</text><rect x='460' y='100' width='40' height='36' fill='#dafbe1' stroke='#1a7f37' stroke-width='1' rx='5' /><text x='480' y='124' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='middle'>5</text><rect x='506' y='100' width='40' height='36' fill='#dafbe1' stroke='#1a7f37' stroke-width='1' rx='5' /><text x='526' y='124' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='middle'>6</text><rect x='552' y='100' width='40' height='36' fill='#dafbe1' stroke='#1a7f37' stroke-width='1' rx='5' /><text x='572' y='124' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='middle'>7</text><text x='620' y='124' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>In order: 0 1 2 3 4 5 6 7</text><text x='24' y='186' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start'>Slot 2 dies</text><rect x='230' y='162' width='40' height='36' fill='#dafbe1' stroke='#1a7f37' stroke-width='1' rx='5' /><text x='250' y='186' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='middle'>0</text><rect x='276' y='162' width='40' height='36' fill='#dafbe1' stroke='#1a7f37' stroke-width='1' rx='5' /><text x='296' y='186' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='middle'>1</text><rect x='322' y='162' width='40' height='36' fill='#ffebe9' stroke='#e5534b' stroke-width='1' rx='5' /><text x='342' y='186' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='middle'>7</text><rect x='368' y='162' width='40' height='36' fill='#dafbe1' stroke='#1a7f37' stroke-width='1' rx='5' /><text x='388' y='186' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='middle'>3</text><rect x='414' y='162' width='40' height='36' fill='#dafbe1' stroke='#1a7f37' stroke-width='1' rx='5' /><text x='434' y='186' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='middle'>4</text><rect x='460' y='162' width='40' height='36' fill='#dafbe1' stroke='#1a7f37' stroke-width='1' rx='5' /><text x='480' y='186' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='middle'>5</text><rect x='506' y='162' width='40' height='36' fill='#dafbe1' stroke='#1a7f37' stroke-width='1' rx='5' /><text x='526' y='186' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='middle'>6</text><text x='620' y='186' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>Last entry fills the hole</text><text x='24' y='248' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start'>New particle → slot 2</text><rect x='230' y='224' width='40' height='36' fill='#dafbe1' stroke='#1a7f37' stroke-width='1' rx='5' /><text x='250' y='248' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='middle'>0</text><rect x='276' y='224' width='40' height='36' fill='#dafbe1' stroke='#1a7f37' stroke-width='1' rx='5' /><text x='296' y='248' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='middle'>1</text><rect x='322' y='224' width='40' height='36' fill='#ffebe9' stroke='#e5534b' stroke-width='1' rx='5' /><text x='342' y='248' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='middle'>7</text><rect x='368' y='224' width='40' height='36' fill='#dafbe1' stroke='#1a7f37' stroke-width='1' rx='5' /><text x='388' y='248' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='middle'>3</text><rect x='414' y='224' width='40' height='36' fill='#dafbe1' stroke='#1a7f37' stroke-width='1' rx='5' /><text x='434' y='248' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='middle'>4</text><rect x='460' y='224' width='40' height='36' fill='#dafbe1' stroke='#1a7f37' stroke-width='1' rx='5' /><text x='480' y='248' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='middle'>5</text><rect x='506' y='224' width='40' height='36' fill='#dafbe1' stroke='#1a7f37' stroke-width='1' rx='5' /><text x='526' y='248' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='middle'>6</text><rect x='552' y='224' width='40' height='36' fill='#ffebe9' stroke='#e5534b' stroke-width='1' rx='5' /><text x='572' y='248' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='middle'>2</text><text x='620' y='248' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>Reused slot goes to the END</text><text x='24' y='310' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start'>Slot 5 dies, reborn</text><rect x='230' y='286' width='40' height='36' fill='#dafbe1' stroke='#1a7f37' stroke-width='1' rx='5' /><text x='250' y='310' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='middle'>0</text><rect x='276' y='286' width='40' height='36' fill='#dafbe1' stroke='#1a7f37' stroke-width='1' rx='5' /><text x='296' y='310' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='middle'>1</text><rect x='322' y='286' width='40' height='36' fill='#ffebe9' stroke='#e5534b' stroke-width='1' rx='5' /><text x='342' y='310' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='middle'>7</text><rect x='368' y='286' width='40' height='36' fill='#dafbe1' stroke='#1a7f37' stroke-width='1' rx='5' /><text x='388' y='310' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='middle'>3</text><rect x='414' y='286' width='40' height='36' fill='#dafbe1' stroke='#1a7f37' stroke-width='1' rx='5' /><text x='434' y='310' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='middle'>4</text><rect x='460' y='286' width='40' height='36' fill='#ffebe9' stroke='#e5534b' stroke-width='1' rx='5' /><text x='480' y='310' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='middle'>2</text><rect x='506' y='286' width='40' height='36' fill='#dafbe1' stroke='#1a7f37' stroke-width='1' rx='5' /><text x='526' y='310' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='middle'>6</text><rect x='552' y='286' width='40' height='36' fill='#ffebe9' stroke='#e5534b' stroke-width='1' rx='5' /><text x='572' y='310' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='middle'>5</text><text x='620' y='310' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>Order: 0 1 7 3 4 2 6 5</text><text x='24' y='372' font-size='14' fill='#1f2328' font-weight='bold' text-anchor='start'>3 seconds later</text><rect x='230' y='348' width='40' height='36' fill='#ffebe9' stroke='#e5534b' stroke-width='1' rx='5' /><text x='250' y='372' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='middle'>6</text><rect x='276' y='348' width='40' height='36' fill='#ffebe9' stroke='#e5534b' stroke-width='1' rx='5' /><text x='296' y='372' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='middle'>0</text><rect x='322' y='348' width='40' height='36' fill='#ffebe9' stroke='#e5534b' stroke-width='1' rx='5' /><text x='342' y='372' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='middle'>4</text><rect x='368' y='348' width='40' height='36' fill='#ffebe9' stroke='#e5534b' stroke-width='1' rx='5' /><text x='388' y='372' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='middle'>2</text><rect x='414' y='348' width='40' height='36' fill='#ffebe9' stroke='#e5534b' stroke-width='1' rx='5' /><text x='434' y='372' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='middle'>7</text><rect x='460' y='348' width='40' height='36' fill='#ffebe9' stroke='#e5534b' stroke-width='1' rx='5' /><text x='480' y='372' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='middle'>1</text><rect x='506' y='348' width='40' height='36' fill='#ffebe9' stroke='#e5534b' stroke-width='1' rx='5' /><text x='526' y='372' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='middle'>5</text><rect x='552' y='348' width='40' height='36' fill='#ffebe9' stroke='#e5534b' stroke-width='1' rx='5' /><text x='572' y='372' font-size='15' fill='#1f2328' font-weight='bold' text-anchor='middle'>3</text><text x='620' y='372' font-size='13' fill='#57606a' font-weight='normal' text-anchor='start'>Every particle has died at least once</text><text x='230' y='414' font-size='12' fill='#57606a' font-weight='normal' text-anchor='start'>green = slot matches its place in the loop (next-door read)   ·   red = the loop must jump</text></svg>