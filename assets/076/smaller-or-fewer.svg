<svg xmlns='http://www.w3.org/2000/svg' width='820' height='346' viewBox='0 0 820 346' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Smaller pieces, or fewer of them?</title><rect x='0.5' y='0.5' width='819' height='345' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>Smaller pieces, or fewer of them?</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Handheld memory for the game: 3.5 GB. Making each island smaller isn’t enough; loading fewer islands is.</text><text x='24' y='109' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>All 12 islands</text><rect x='230.0' y='95.0' width='63.4' height='20.0' rx='3' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><rect x='294.4' y='95.0' width='164.6' height='20.0' rx='3' fill='#59a14f' stroke='none' stroke-width='1' opacity='1'/><rect x='460.0' y='95.0' width='275.0' height='20.0' rx='3' fill='#f28e2b' stroke='none' stroke-width='1' opacity='1'/><text x='744.0' y='110' font-size='13' fill='#cf222e' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>11.0 GB</text><text x='24' y='147' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>All 12 + mip streaming</text><rect x='230.0' y='133.0' width='63.4' height='20.0' rx='3' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><rect x='294.4' y='133.0' width='164.6' height='20.0' rx='3' fill='#59a14f' stroke='none' stroke-width='1' opacity='1'/><rect x='460.0' y='133.0' width='109.4' height='20.0' rx='3' fill='#f28e2b' stroke='none' stroke-width='1' opacity='1'/><text x='578.4' y='148' font-size='13' fill='#cf222e' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>7.4 GB</text><text x='24' y='185' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>Stream 3 islands</text><rect x='230.0' y='171.0' width='63.4' height='20.0' rx='3' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><rect x='294.4' y='171.0' width='40.4' height='20.0' rx='3' fill='#59a14f' stroke='none' stroke-width='1' opacity='1'/><rect x='335.8' y='171.0' width='68.0' height='20.0' rx='3' fill='#f28e2b' stroke='none' stroke-width='1' opacity='1'/><text x='412.79999999999995' y='186' font-size='13' fill='#cf222e' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>3.8 GB</text><text x='24' y='223' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>Stream 3 + mip streaming</text><rect x='230.0' y='209.0' width='63.4' height='20.0' rx='3' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><rect x='294.4' y='209.0' width='40.4' height='20.0' rx='3' fill='#59a14f' stroke='none' stroke-width='1' opacity='1'/><rect x='335.8' y='209.0' width='26.6' height='20.0' rx='3' fill='#f28e2b' stroke='none' stroke-width='1' opacity='1'/><text x='399.0' y='224' font-size='13' fill='#1a7f37' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>2.9 GB</text><text x='24' y='261' font-size='13' fill='#1f2328' font-weight='600' text-anchor='start'>+ HLOD for the other 9</text><rect x='230.0' y='247.0' width='63.4' height='20.0' rx='3' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><rect x='294.4' y='247.0' width='40.4' height='20.0' rx='3' fill='#59a14f' stroke='none' stroke-width='1' opacity='1'/><rect x='335.8' y='247.0' width='26.6' height='20.0' rx='3' fill='#f28e2b' stroke='none' stroke-width='1' opacity='1'/><rect x='363.4' y='247.0' width='8.2' height='20.0' rx='3' fill='#d4a72c' stroke='none' stroke-width='1' opacity='1'/><text x='399.0' y='262' font-size='13' fill='#1a7f37' font-weight='700' text-anchor='start' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>3.1 GB</text><line x1='391.0' y1='84' x2='391.0' y2='282' stroke='#cf222e' stroke-width='2' stroke-dasharray='5 4'/><text x='391.0' y='296' font-size='11.5' fill='#cf222e' font-weight='700' text-anchor='middle' style='paint-order:stroke;stroke:#ffffff;stroke-width:4px'>budget 3.5 GB</text><rect x='24.0' y='312.0' width='12.0' height='12.0' rx='2' fill='#4e79a7' stroke='none' stroke-width='1' opacity='1'/><text x='42' y='323' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>engine, code, audio, UI</text><rect x='217.8' y='312.0' width='12.0' height='12.0' rx='2' fill='#59a14f' stroke='none' stroke-width='1' opacity='1'/><text x='235.79999999999998' y='323' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>geometry 0.3 / island</text><rect x='398.4' y='312.0' width='12.0' height='12.0' rx='2' fill='#f28e2b' stroke='none' stroke-width='1' opacity='1'/><text x='416.4' y='323' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>textures 0.5 or 0.2 / island</text><rect x='625.2' y='312.0' width='12.0' height='12.0' rx='2' fill='#d4a72c' stroke='none' stroke-width='1' opacity='1'/><text x='643.1999999999999' y='323' font-size='12' fill='#57606a' font-weight='400' text-anchor='start'>HLOD proxies</text></svg>