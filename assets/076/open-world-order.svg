<svg xmlns='http://www.w3.org/2000/svg' width='820' height='436' viewBox='0 0 820 436' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>The order of an open-world pass</title><rect x='0.5' y='0.5' width='819' height='435' rx='14' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='38' font-size='20' font-weight='700' fill='#1f2328'>The order of an open-world pass</text><text x='24' y='62' font-size='13' fill='#57606a' font-weight='400' text-anchor='start'>Each step fixes one thing, in the order where the next one can be measured honestly.</text><rect x='24.0' y='84.0' width='772.0' height='58.0' rx='10' fill='#ffffff' stroke='#4e79a7' stroke-width='1.6' opacity='1'/><circle cx='54' cy='113' r='16' fill='#4e79a7'/><text x='54' y='118' font-size='15' fill='#ffffff' font-weight='700' text-anchor='middle'>1</text><text x='84' y='108' font-size='14' fill='#1f2328' font-weight='700' text-anchor='start'>What is loaded?</text><text x='84' y='128' font-size='12.5' fill='#57606a' font-weight='400' text-anchor='start'>Stream cells within 1 km + mip streaming</text><text x='780' y='108' font-size='13' fill='#4e79a7' font-weight='700' text-anchor='end'>11.0 → 2.9 GB, load 95 → 12 s</text><text x='780' y='128' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='end'>Lessons 029, 043, 057</text><rect x='24.0' y='152.0' width='772.0' height='58.0' rx='10' fill='#ffffff' stroke='#59a14f' stroke-width='1.6' opacity='1'/><circle cx='54' cy='181' r='16' fill='#59a14f'/><text x='54' y='186' font-size='15' fill='#ffffff' font-weight='700' text-anchor='middle'>2</text><text x='84' y='176' font-size='14' fill='#1f2328' font-weight='700' text-anchor='start'>How does it load?</text><text x='84' y='196' font-size='12.5' fill='#57606a' font-weight='400' text-anchor='start'>Async loading, activate a little per frame</text><text x='780' y='176' font-size='13' fill='#59a14f' font-weight='700' text-anchor='end'>worst frame 240 → 48 ms</text><text x='780' y='196' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='end'>Lessons 043, 059</text><rect x='24.0' y='220.0' width='772.0' height='58.0' rx='10' fill='#ffffff' stroke='#d4a72c' stroke-width='1.6' opacity='1'/><circle cx='54' cy='249' r='16' fill='#d4a72c'/><text x='54' y='254' font-size='15' fill='#ffffff' font-weight='700' text-anchor='middle'>3</text><text x='84' y='244' font-size='14' fill='#1f2328' font-weight='700' text-anchor='start'>What stands in far away?</text><text x='84' y='264' font-size='12.5' fill='#57606a' font-weight='400' text-anchor='start'>One HLOD proxy per distant island</text><text x='780' y='244' font-size='13' fill='#9a7400' font-weight='700' text-anchor='end'>9 islands back for 0.2 GB</text><text x='780' y='264' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='end'>Lessons 027, 028</text><rect x='24.0' y='288.0' width='772.0' height='58.0' rx='10' fill='#ffffff' stroke='#b07aa1' stroke-width='1.6' opacity='1'/><circle cx='54' cy='317' r='16' fill='#b07aa1'/><text x='54' y='322' font-size='15' fill='#ffffff' font-weight='700' text-anchor='middle'>4</text><text x='84' y='312' font-size='14' fill='#1f2328' font-weight='700' text-anchor='start'>How far does the world think?</text><text x='84' y='332' font-size='12.5' fill='#57606a' font-weight='400' text-anchor='start'>Full simulation within 300 m, coarse beyond</text><text x='780' y='312' font-size='13' fill='#b07aa1' font-weight='700' text-anchor='end'>game thread 44 → 18 ms</text><text x='780' y='332' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='end'>Lessons 053, 075</text><rect x='24.0' y='356.0' width='772.0' height='58.0' rx='10' fill='#ffffff' stroke='#f28e2b' stroke-width='1.6' opacity='1'/><circle cx='54' cy='385' r='16' fill='#f28e2b'/><text x='54' y='390' font-size='15' fill='#ffffff' font-weight='700' text-anchor='middle'>5</text><text x='84' y='380' font-size='14' fill='#1f2328' font-weight='700' text-anchor='start'>Measure on the device</text><text x='84' y='400' font-size='12.5' fill='#57606a' font-weight='400' text-anchor='start'>Fly the worst route, every build</text><text x='780' y='380' font-size='13' fill='#f28e2b' font-weight='700' text-anchor='end'>26 ms frame, 30 ms worst, 3.1 GB</text><text x='780' y='400' font-size='11.5' fill='#57606a' font-weight='400' text-anchor='end'>Lessons 063, 062</text></svg>